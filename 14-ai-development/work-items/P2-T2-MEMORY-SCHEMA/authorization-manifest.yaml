  source: GitHub refs (origin/main at GO time)

scope:
  manifest_path: 14-ai-development/work-items/P2-T2-MEMORY-SCHEMA/authorization-manifest.yaml
  allowed_write_paths:
    - 14-ai-development/work-items/P2-T2-MEMORY-SCHEMA/authorization-manifest.yaml
    - 14-ai-development/work-items/P2-T2-MEMORY-SCHEMA/design-proposal.md
    - 14-ai-development/work-items/P2-T2-MEMORY-SCHEMA/DEC-P2-T2-Q1-001.md
  authorization_basis:
    - "GO-2026-P2-DESIGN-001: P2-T2 design proposal required before P2-T1 implementation authorization."
    - "Design-only scope: no code, no schema execution, no migration, no test claims."
    - "Development-baseline convergence path per Issue #264 comment 7000428916."
  all_other_paths: OUT_OF_SCOPE

  implementation_authorization: NOT_GRANTED
  implementation_note: >
    This manifest authorizes a design document only. It does not authorize creating
    memory/schema.sql, memory/dao.py, memory/vector_store.py, any Rust crate change,
    any migration script, or any test file. Those require a separate GO decision
    after the design is reviewed and frozen.
  appending_prompt_source_forbidden: true
  appending_prompt_source_note: >
    The prompt DDL is attached inside design-proposal.md as Appendix A because adding a
    separate prompt-source file would be a third write path outside this manifest's
    allowed set. Attaching evidence inside an already-authorized path is not a scope
    expansion.

  schema_execution: DISCLOSED_SCOPE_DEVIATION
  schema_execution_note: >
    The design's own DDL was executed against an ephemeral in-memory SQLite database to
    check internal coherence — no file written, no migration applied, no repository path
    touched. authorization_basis records "no schema execution" as a design-only bound.
    An earlier revision recorded this as DISCLOSED_INTERPRETATION on the reading that the
    bound covers persistent stores and repository paths. R2 declined to accept that reading
    as established by the authorization text, and stated that an engineering reviewer
    cannot grant retrospective authorization. That ruling is accepted. The event is recorded
    as a disclosed scope deviation, the authority question is NOT claimed resolved, and it
    is carried as Q12 requiring the authority that issued the bound. acceptance_authority
    is NOT_ASSIGNED; no session can supply it.
    The check found a real defect (accepted_events.event_id does not exist; the primary key
    is event_row) which was corrected before R2 review. The R3 DDL was NOT executed; the
    prior probe result is evidence about the R2 DDL only.

review:
  required: true
  rounds:
    - R1
    - R2
    - R3
    - R4
    - R5
  independence: REQUIRED
  blocking_question: >
    Q1 is no longer an open blocking question. The architecture choice was DECIDED as
    OPTION_C, disposition ACCEPT-WITH-CONDITIONS, recorded in DEC-P2-T2-Q1-001.md against
    baseline 049906a9. Its disposition is carried by that record and by
    architecture_decision below, not by this field. The absence of an accountable human
    authority is a limit on the decision's capacity, recorded in
    architecture_decision.capacity_excludes; it is NOT equivalent to Q1 remaining
    undecided.

    Five of the six remaining questions received dispositions in design-proposal.md
    section 2i. Their scope differs and the manifest does not flatten them:

      Q13 (completed tool call requires a result) -- DECIDED: table-level CHECK,
          DDL amended. Separate from NF-R3-02, whose closure this is not.
      Q11 (authorisation to extend a Phase 1 table's schema) -- PARTLY DECIDED.
          Technical admissibility is settled: the index is data-neutral with respect
          to versions' admissible rows and is necessary for the composite foreign key
          to be expressible. The authorisation half is NOT decided and remains with
          the Phase 1 contract's owner, who is NOT_ASSIGNED. No rule exempts a
          data-neutral modification from Phase 1 approval, and this manifest claims
          none. The index stays declared as a Layer 1 modification.
      Q12 (schema-execution authority) -- prospective interpretation issued; the
          R2 event is NOT reclassified and later probes are not covered by it
          retrospectively.
      Q15 (INDEX.md authority conflict) -- only this work item's write scope is
          decided (no write). The AI-STD-001 conflict itself is untouched.
      Q9 (impact_level) -- DECIDED: retained untyped, neither typed nor dropped.

    Two were HELD, deliberately: Q8 (transcript retention classes) and Q14 (recompute
    single input). Both ask for facts about the world that no reading of this repository
    supplies, and deciding them would be invention rather than decision.

    Q11 being PARTLY DECIDED is not a rounding of a completed ruling. It is the
    difference between a technical finding and a governance exemption, and the manifest
    records the two separately so a later reader cannot read the first as the second.

    Capacity: dev-baseline convergence path (Issue #264 comment 7000428916),
    session-held. human_signature NOT_CLAIMED; acceptance_authority remains
    NOT_ASSIGNED; implementation_authorization remains NOT_GRANTED. These rulings settle
    design questions the document itself poses. They do not accept the design.

    The earlier R1-Q14 ruling request (section 2f) returned PARTIAL and closed nothing;
    that record is preserved. Section 2i supersedes its dispositions for Q13, Q11, Q12,
    Q9 and Q15 and leaves Q8 and Q14 as 2f left them.
    Implementation and verification obligations are separately unresolved:
    DDL NOT APPROVED, executability UNVERIFIED (the section 2i probes exercised the
    design's own DDL in memory and found it applies; that is not a migration test and not
    an approval), 21 section 13 tests NOT WRITTEN OR RUN, P2-T1 NOT AUTHORIZED.

status: BLOCKED
status_reason: >
  Q1 is decided: OPTION_C adopted under the dev-baseline Architecture Owner role,
  ACCEPT-WITH-CONDITIONS, recorded in DEC-P2-T2-Q1-001.md. That closes one item and closes
  nothing else. Q13, Q11, Q12, Q15 and Q9 were DECIDED in design-proposal.md section 2i;
  Q8 and Q14 remain OPEN and each carries a named dependency in section 14 rather than an
  unexplained OPEN. Those five rulings are design decisions, not acceptance: they change
  what this document specifies and change no governance state. The DDL
  remains NOT APPROVED;
  DDL executability and regression behavior remain UNVERIFIED; none of the 21 section 13
  tests exist; implementation_authorization remains NOT_GRANTED. P2-T1 remains blocked for
  implementation authorization by the seven gates recorded in DEC-P2-T2-Q1-001.md section 8,
  not by the absence of an architecture choice.
status_supported_by: "architecture decision DEC-P2-T2-Q1-001; review records R1-R5 — PR #307 comments 7023231264, 7023510140, 7023884586, 7024484706, 7024485207"

