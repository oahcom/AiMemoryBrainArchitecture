  conditions:
    C1: "SATISFIED — OPTION_C recorded against the exact baseline"
    C2: "SATISFIED — Phase 1 authority preserved; A and B recorded as not adopted"
    C3: "SATISFIED — unresolved questions and restrictions preserved with unchanged status"
  closes_only: "Q1"
  does_not_close: [Q8, Q9, Q11, Q12, Q13, Q14]
  note_on_later_rulings: >
    Q9, Q11, Q12, Q13 and Q15 were subsequently decided in design-proposal.md section 2i
    under the same dev-baseline capacity form recorded above, with the same exclusions.
    That does not retroactively widen this decision record: DEC-P2-T2-Q1-001 closes Q1 and
    only Q1, and the 2i rulings are carried by section 2i, not by this record.
  adopted_direction_not_approved_artefact: >
    Adopting a direction is not approving the DDL. The merged proposal remains a proposal
    with an adopted architectural direction. Its unresolved implementation and
    verification obligations keep their own statuses.
  p2_t1_gate: >
    P2-T1 remains BLOCKED for implementation authorization. Option C gives P2-T1 a target,
    not an executable contract. Seven gates are recorded in DEC-P2-T2-Q1-001.md section 8:
    canonical persistence boundary; transcript capture contract; derived projection
    semantics; resolution of Q11-Q14; implementation acceptance criteria and tests; a
    separate P2-T1 implementation authorization; and the normal convergence chain.
  weakest_part_recorded: >
    Separating transcript capture from canonical memory is judged to produce a cleaner
    architecture, but that is an architectural judgment, not an empirically demonstrated
    result. Cross-layer consistency, deletion and retention propagation, projection
    rebuild after source changes, ordering and provenance across ingestion failures, and
    duplicate representations of the same fact remain unresolved risks.

