conflicts_disclosed:
  - id: P2T2-C-01
    subject: "prompt schema vs frozen Phase 1 domain model"
    detail: >
      prompts-fix/P2-T2-memory-schema.md specifies sessions/messages/decisions/
      file_changes/context_injections/value_score_history. Phase 1 already DECIDED and
      merged a different object model (Memory/MemoryVersion/Claim/Event/Provenance) with
      implemented SQLite tables memories/versions/idempotency/commit_log and
      accepted_events/event_payloads/compile_outbox. The proposal does not adopt the
      prompt schema as the canonical store. The conflict is escalated, not silently
      resolved.
    r1_ruling: "the three original 'contradictions' were ruled OVERSTATED; they are recorded as tensions, not necessary incompatibilities"
    r2_state: "recorded as design tensions in §5; resolution is an ownership decision, stated as such"
  - id: P2T2-C-02
    subject: "mutable value_score/decay_weight on a content row"
    detail: >
      Incompatible with the immutable-version invariant only if the row is the canonical
      content row for a MemoryVersion. Under the recommended architecture it is not.
    r1_ruling: "OVERSTATED as a canonical-immutability violation"
    r2_state: >
      scoring is relocated to a rebuildable projection because it is derived, not because
      mutability is per se forbidden. Reason restated in §5 and §8.3.
  - id: P2T2-C-03
    subject: "ON DELETE CASCADE from sessions"
    detail: >
      Conflicts with retention_class / forget_operation_id governance only if canonical
      memory is reachable through the session root. Under the recommended architecture it
      is not.
    r1_ruling: "OVERSTATED as a retention violation"
    r2_state: >
      a transcript_session is a real table in Layer 2, but owns no canonical row; the
      single edge that could reach canonical provenance is ON DELETE RESTRICT, so the
      destructive case fails loudly instead of cascading (§7.4).
  - id: P2T2-C-04
    subject: "prompt capabilities not preserved as-is"
    detail: >
      impact_level enum typing, decision_type as a CHECK-constrained column, and the two
      prompt views as schema objects are not reproduced. Named in the §9 gap table rather
      than described as 'nothing lost'.
    r2_state: OPEN for review

