work_item: P2-T2
title: "Memory Storage Schema design proposal"
repository: oahcom/AiMemoryBrainArchitecture
branch: design/P2-T2-memory-schema

decision:
  id: GO-2026-P2-DESIGN-001
  date: "2026-11-19"
  authority: "development-baseline convergence path (Issue #264 comment 7000428916)"
  form: "GO decision + manifest(allowed_write_paths, authorization_basis)"
  sequence_ruling: "Phase 2 order T2 -> T1 -> T3 -> T4; design before implementation"
  implementation_ruling: >
    P2-T1 implementation write authorization is withheld pending a reviewed and frozen
    P2-T2 design. A separate GO decision is required before any P2-T1 code is written.
  dev_baseline_note: >
    Human main-merge approval is OUT-OF-SCOPE(dev-baseline) per item 3 of 7000428916.
    No human approval is represented as obtained. acceptance_authority remains NOT_ASSIGNED.

