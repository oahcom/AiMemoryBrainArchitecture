scope:
  manifest_path: 14-ai-development/work-items/P2-T2-MEMORY-SCHEMA/authorization-manifest.yaml
  allowed_write_paths:
    - 14-ai-development/work-items/P2-T2-MEMORY-SCHEMA/authorization-manifest.yaml
    - 14-ai-development/work-items/P2-T2-MEMORY-SCHEMA/design-proposal.md
  authorization_basis:
    - "GO-2026-P2-DESIGN-001: P2-T2 design proposal required before P2-T1 implementation authorization."
    - "Design-only scope: no code, no schema execution, no migration, no test claims."
    - "Development-baseline convergence path per Issue #264 comment 7000428916."
  all_other_paths: OUT_OF_SCOPE

  implementation_authorization: NOT_GRANTED
  implementation_note: >
    This manifest authorizes a design document only. It does not authorize creating
    memory/schema.sql, memory/dao.py, memory/vector_store.py, any Rust crate change,
    any migration script, or any test file. Those require a separate GO decision
    after the design is reviewed and frozen.
  appending_prompt_source_forbidden: true
  appending_prompt_source_note: >
    The prompt DDL is attached inside design-proposal.md as Appendix A because adding a
    separate prompt-source file would be a third write path outside this manifest's
    allowed set. Attaching evidence inside an already-authorized path is not a scope
    expansion.

  schema_execution: DISCLOSED_SCOPE_DEVIATION
  schema_execution_note: >
    The design's own DDL was executed against an ephemeral in-memory SQLite database to
    check internal coherence — no file written, no migration applied, no repository path
    touched. authorization_basis records "no schema execution" as a design-only bound.
    An earlier revision recorded this as DISCLOSED_INTERPRETATION on the reading that the
    bound covers persistent stores and repository paths. R2 declined to accept that reading
    as established by the authorization text, and stated that an engineering reviewer
    cannot grant retrospective authorization. That ruling is accepted. The event is recorded
    as a disclosed scope deviation, the authority question is NOT claimed resolved, and it
    is carried as Q12 requiring the authority that issued the bound. acceptance_authority
    is NOT_ASSIGNED; no session can supply it.
    The check found a real defect (accepted_events.event_id does not exist; the primary key
    is event_row) which was corrected before R2 review. The R3 DDL was NOT executed; the
    prior probe result is evidence about the R2 DDL only.

