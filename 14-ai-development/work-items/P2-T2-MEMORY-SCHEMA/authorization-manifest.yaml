  rounds:
    - R1
    - R2
    - R3
  independence: REQUIRED
  blocking_question: >
    Q1 in the proposal — the architecture choice. R3 states three options (A: Phase 1 as
    store with Event-only transcript ingress; B: supersede Phase 1; C: three layers with a
    separate transcript-capture layer). Q1 remains OPEN. A review recommendation is
    PROPOSED, not a ruling.

