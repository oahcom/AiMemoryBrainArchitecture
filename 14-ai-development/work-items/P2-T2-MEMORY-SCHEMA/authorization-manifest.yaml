  capacity_excludes:
    human_signature: NOT_CLAIMED
    acceptance_authority_appointment: NOT_CLAIMED
    independent_human_expert_review: NOT_CLAIMED
    production_approval: NOT_GRANTED
  decision_reply: "chatgpt-ops/replies/reply-6aff8813-073819.md (deciding session; not committed to this repository)"
  option_a: NOT_ADOPTED
  option_b: NOT_ADOPTED
  option_b_note: >
    No supersession decision exists and DEC-P2-T2-Q1-001 creates none. Phase 1 remains
    authoritative for canonical memory. phase-1-sqlite-adapter-contract.md stays DECIDED
    and is not re-opened; phase-1-storage-trait-contract.md stays CANDIDATE and is not
