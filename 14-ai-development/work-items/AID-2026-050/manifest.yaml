findings:
  - id: AID-2026-050-F1
    severity: P1
    feedback_destination: "Delivery PR conversation. GAP-31 §4 recorded 19 unparsed message types at fb37a44b. At 021f5a3f the count of types with no Rust recognition is 0, because parse_dispatch landed via 6007782b, which is an ancestor of main but not an ancestor of fb37a44b. Any session that trusts the stale figure will re-implement merged work. GAP-32 exists to prevent that recurrence."
  - id: AID-2026-050-F2
    severity: P2
    feedback_destination: "Delivery PR conversation. OWNER-DECISION-BMCP-MCP-DISPATCH-001 §3.2 specified {\"valid\":true,\"message_type\":...} for the success envelope before DispatchValidationState existed in its current three-state form. Applied literally, that envelope lets a RootDiscriminatorOnly message be reported as valid without qualification. GAP-32 §7 criterion 3 and this prompt both require validation_state on every success, which preserves the ruling's intent while refusing to let the tool claim more than the arm established."
  - id: AID-2026-050-F3
    severity: P2
    feedback_destination: "Delivery PR conversation. The obvious way to satisfy criterion 4 is a loop over the 20 type strings. A loop is acceptable only if it is driven from a list that is itself checked against parse_dispatch's match arms, otherwise the test and the implementation can drift together and still pass. Prefer an explicit case per type, or a list plus a test that asserts the list length equals the arm count."

