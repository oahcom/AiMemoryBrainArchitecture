work_item_id: AID-2026-050
title: Add the validate_bmcp_message tool and report the validation state each arm actually reached

class: PROTOCOL/CODE/TEST
risk: R1
risk_rationale: "One additive MCP tool in bmcp-server plus tests. No new dependency, no schema engine, no change to the two existing tools, no transport work, no persistence, no architecture decision (the binding was already ruled in OWNER-DECISION-BMCP-MCP-DISPATCH-001). The only public surface it adds is one tool name and one required response field."

security_scope: "Message validation only. The tool returns a validity verdict and the type it was given; it returns no payload fields, no digests and no cross-message linkage. It must not become a way to read a message body back out through the tool surface."

