deliverables:
  - "A third MCP tool, validate_bmcp_message, arguments {\"message\": <object>}, dispatching on the message_type string carried inside that object. Wired to bmcp_protocol::parse_dispatch."
  - "Every success response carries validation_state, read from DispatchValidationState rather than inferred: semantically_validated, structurally_parsed, or root_discriminator_only. The third value must not be omitted or rounded up to a bare true."
  - "All 20 RootDiscriminatorOnly types return {\"valid\":true,\"validation_state\":\"root_discriminator_only\"} for a strictly-parsing instance, and each of the 20 is covered by a named test case rather than by a loop that silently covers 19."
  - "No case returns -32601. Absent, non-string and unknown message_type are message problems, reported as isError:true with valid:false."
  - "validate_applied_delivery_evidence and digest_applied_delivery_evidence are unchanged, proven by a test that compares against their 6212ec75 behaviour."
  - "No jsonschema dependency is added. The 20 arms stay unvalidated by schema, because the schemas are the text that is not frozen."

