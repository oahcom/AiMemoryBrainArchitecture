implementation:
  status: IMPLEMENTED
  implementation_commit_sha: "cc4b4ca6126ad49a9080e49f9692684a0c67aca2"
  summary: >-
    Enforces the document-management self-check aggregate at 377 cases using
    the current runner-based main() structure: 376 executed cases plus 1
    registered skipped case. Executed cases and skipped cases are counted
    separately; skips contribute to the aggregate but not to the passed count.
    The finalization rejects zero executed cases, unregistered skips, aggregate
    mismatch, and any executed case that did not pass. The #1438
    symlink-unavailability regression case is outside this baseline and will
    require raising the aggregate to 378 when that case is added.
  files_changed:
    - scripts/test_check_document_management.py
  tests:
    - "Current main-branch baseline: 376 executed, 1 registered skipped, aggregate 377; expected exit 0 and 376/376 passed."
    - "Aggregate mismatch: in a temporary copy, set EXPECTED_AGGREGATE to 376; expected exit 1 and diagnostic: FAIL: expected 376 executed and skipped cases, got 377 (376 executed, 1 skipped)."
    - "Zero-execution guard: in a temporary copy, clear the execution and skip ledgers before finalization; expected exit 1 and diagnostic: FAIL: no cases executed."
    - "Verify record(), skip(), ALLOWED_SKIPS, and the runner exception handling remain unchanged by the count-contract change."
