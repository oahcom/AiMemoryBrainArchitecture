work_item_id: AID-2026-329
title: "Enforce the document-management test count contract at 377 cases"
class: GATE/TEST
risk: R1
risk_rationale: >-
  Without an explicit aggregate guard, accidental test removal or unregistered
  skips can go undetected while the self-check still exits successfully.
  The current main-branch baseline is 376 executed cases plus 1 registered
  skipped case, for an aggregate of 377. The guard must count skips in the
  aggregate without treating them as passes. The separate #1438 regression
  case is not included; when added, the expected aggregate must be raised to
  378.
