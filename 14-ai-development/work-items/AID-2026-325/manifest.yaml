acceptance_criteria:
  - id: AC1
    description: >-
      The two discriminating independent-review behavioral tests pass:
      one account with two sessions is independent, and two accounts
      sharing one session are not independent.
    measurement: >-
      cd scripts/governance/status_migration && python -m unittest test_status_migration
    expected_result: "31 tests pass; includes both discriminating tests."
  - id: AC2
    description: >-
      The status gate checker has no remaining identity-comparison verdict
      failure in the measured 130-manifest corpus.
    measurement: "python scripts/governance/status_migration/check_status_gates.py"
    expected_result: >-
      130 total, 2 PASS / 128 FAIL; zero failures report
      REVIEWED reviewer and implementer must be different identities.
  - id: AC3
    description: >-
      The checker remains unwired to GitHub Actions workflows at the
      measured base commit.
    measurement: "git grep -l check_status_gates -- .github/workflows"
    expected_result: "No output."
  - id: AC4
    description: >-
      The current corpus contains no independent_review gate with PASS
      disposition.
    measurement: "python scripts/governance/status_migration/check_status_gates.py"
    expected_result: "0 of 130 manifests carry independent_review status PASS."
  - id: AC5
    description: >-
      The repository's measured direct collaborator permissions identify
      exactly one account with push permission.
    measurement: >-
      GET /repos/oahcom/AiMemoryBrainArchitecture/collaborators?affiliation=direct&per_page=100
    expected_result: "One entry, login oahcom, with push permission."
  - id: AC6
    description: >-
      The measured recent merged pull request sample has matching author
      and merger identities.
    measurement: >-
      GET /repos/oahcom/AiMemoryBrainArchitecture/pulls/{number}
      for each of the ten PR numbers listed in evidence.md
    expected_result: "10 of 10 author=oahcom and merged_by=oahcom."
  - id: AC7
    description: >-
      The decision record identifies the implementation limitations and
      explicitly excludes both residual fixes from this carrier.
    measurement: >-
      Review 14-ai-development/work-items/AID-2026-325/decision.md
      sections Carrier boundary and Residuals.
    expected_result: >-
      Both residuals are individually named, neither is claimed fixed,
      and each requires its own carrier.

