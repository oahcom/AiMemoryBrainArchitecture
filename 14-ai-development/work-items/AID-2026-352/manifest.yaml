scope:
  objective: >-
    Make Issue #266's AC4 and AC6 judgeable instead of PARTIAL-by-narrative. AC4
    already has a normative carrier and a checker; what it lacked was data, so
    the 35 manifests without a documentation block get one from an explicit
    per-work-item mapping, and AID-2026-284's six free-text relationships are
    mapped back into the closed enum. AC6 already validates the forward
    supersedes edge; what it lacked was the reverse artifact the policy declares
    CI-derived, so DM-16 generates and checks a deterministic reverse index.
  issue: "#266"
  decisions:
    - "AC4 needs no schema change: the five acceptance predicates are already implemented and enforced."
    - "No rule requires a reference outside the work-item directory; 'relevant documents' is not 'external documents'."
    - "AC6 takes option C: archival_reference is not re-interpreted as a supersession back-reference and is not backfilled."
    - "superseded_by stays forbidden in source; the reverse relation lives only in the generated artifact."
