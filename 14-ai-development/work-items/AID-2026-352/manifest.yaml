title: "Close the AC4 data gap and the AC6 reverse-index gap for Issue #266"
class: GATE/TEST
risk: R2
risk_rationale: >-
  Touches 36 work-item manifests, adds one generator with a committed artifact,
  and adds one rule inside an existing gate. It rewrites no schema rule, adds no
  workflow, deletes no check, and edits no ratchet baseline; the manifest schema
  checker's legacy ratchet stays at zero new regressions.
