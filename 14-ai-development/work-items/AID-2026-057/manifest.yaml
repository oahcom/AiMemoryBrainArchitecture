# ---------------------------------------------------------------------------
# The Owner's round-22 ruling. Restated with its constraints, not as options.
# ---------------------------------------------------------------------------

owner_decisions:

  - id: R1
    question: "Should the 113 refused paths justify a blanket allowlist expansion?"
    ruling: "No. No global suffix additions. No blanket admission of .json, .yaml, .toml, .txt, or the remaining eight extensions. Preserve the fixed allowlist and reject-by-default behavior."
    constraints:
      - "The 113-file count is a candidate inventory, not a list of 113 files to admit."
      - "A file existing in the base tree does not prove that a new file of the same extension or category should be admitted."
      - "Classify each candidate by its intended repository role and the exact future path shape it should permit."

  - id: R2
    question: "What evidence must each proposed admission rule carry?"
    ruling: "Every proposed admission rule must include at least one positive and one negative test through the real tree-diff path."
    constraints:
      - "Calling is_allowed_new_path() in isolation is not the real tree-diff path."
      - "The negative case must be a near-miss of the same shape, not an unrelated path."
      - "The 13 pre-existing rejection tests are the fence around the AID-* rule and must all still pass."

  - id: R3
    question: "How should the five remaining YAML paths be handled?"
    ruling: "Assess each individually as an exact governance / registry / inventory / legacy work-item path. Do not widen the AID rule to cover them."
    constraints:
      - "00-governance/architecture-document-metadata.schema.yaml -> exact governance-schema path."
      - "00-governance/document-scope-registry.yaml -> exact governance-registry path."
      - "14-ai-development/remote-worker-inventory.yaml -> exact inventory path."
      - "The two work-items/FIX-2026-P1-T3/ YAML files -> legacy FIX work-item paths, assessed separately."

  - id: R4
    question: "May this work be folded into #893 or AID-2026-055?"
    ruling: "No. This must be a separate work item."
    constraints:
      - "Do not mix it into #893 or AID-2026-055."

