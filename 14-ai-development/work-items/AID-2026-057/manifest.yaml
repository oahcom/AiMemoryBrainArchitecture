work_item_id: AID-2026-057
title: Classify the 113 paths the admission gate would refuse, and admit none of them by extension

class: GATE/POLICY
risk: R2
risk_rationale: "Changes which new files can enter the repository. The gate is the only control that distinguishes an intentional new file from a stray artefact, and it works by refusing everything not positively named. A rule written one level too wide does not fail loudly: it admits a class of file nobody examined, and the gate keeps reporting PASS with a version string that no longer describes the policy actually enforced. The failure is silent by construction. This is why AC8 measures the newly-admitted set against the inventory rather than merely checking that the intended paths pass, and why AC9 requires the buckets to reconcile to the refused total: a dropped path and an over-wide rule are both invisible to a test that only checks the paths the author thought of."

security_scope: "None. No Rust, no transport, no authorization path, no storage. The change is the positive allowlist in scripts/ci/check_repository_hygiene.py plus its tests."

status: DISPATCHED

sponsor: USER-PRINCIPAL-DELEGATED
accountable_owner: USER-PRINCIPAL-DELEGATED
