# ---------------------------------------------------------------------------
# Acceptance criteria. AC8 and AC9 are the two that catch the silent failures.
# ---------------------------------------------------------------------------

acceptance_criteria:

  - id: AC1
    criterion: "Every A and B shape has a rule and is admitted."
    measurement: "Positive test per shape, real git tree, exit 0."
  - id: AC2
    criterion: "Every admitted shape has a near-miss negative test."
    measurement: "Negative test per shape, real git tree, exit 1 with the exact no-allowlist-rule diagnostic."
  - id: AC3
    criterion: "The 13 pre-existing rejection tests still pass."
    measurement: "python -m unittest scripts.test_check_repository_hygiene, full suite green."
  - id: AC4
    criterion: "No extension-only rule exists."
    measurement: "Read the diff: every added pattern constrains a directory or exact path."
  - id: AC5
    criterion: "Category C stays refused."
    measurement: "A table listing each C path with the gate's refusal on it."
  - id: AC6
    criterion: "Category D is stated, not decided."
    measurement: "One subsection per D group with the question and both candidate answers."
  - id: AC7
    criterion: "CHECK_VERSION differs from 2026-11-24.1 and prints."
    measurement: "Grep the workflow log for the new version string."
  - id: AC8
    criterion: "The rule set is not wider than the inventory."
    measurement: "Re-run the classifier: newly-admitted set equals A union B (78 paths), and no more."
  - id: AC9
    criterion: "The inventory closes."
    measurement: "Re-run the bucketing classifier and confirm A+B+C+D equals the refused total."

