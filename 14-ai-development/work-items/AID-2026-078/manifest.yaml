acceptance_criteria:
  - id: AC1
    criterion: >-
      A check in scripts/ci parses every committed work-item manifest and prints how many it
      found.
    measurement: >-
      A run over the real tree exits 0, and the printed count equals
      `git ls-files '14-ai-development/work-items/*/manifest.yaml' | wc -l`. Counted by file and
      not by directory: `ls -d 14-ai-development/work-items/AID-*/ | wc -l` undercounts by
      exactly one, because 14-ai-development/work-items/FIX-2026-P1-T1/manifest.yaml is
      committed and carries no AID id. Excluding it by directory name would be a D3 admission
      rule, which the R7 owner ruling at
      14-ai-development/work-items/AID-2026-057/manifest.yaml:115 forbids writing.
  - id: AC2
    criterion: >-
      A duplicate key fails even where the default loader would accept the document, so that
      a record which silently loses a field cannot pass.
    measurement: >-
      A fixture declaring the same key twice is accepted by yaml.safe_load and rejected by the
      check, which exits non-zero. Both halves are asserted.
  - id: AC3
    criterion: A syntax error in a manifest fails the check and names the offending path.
    measurement: >-
      A fixture with an unquoted scalar containing `": "` makes the check exit non-zero, and
      that fixture's path appears in the output.
  - id: AC4
    criterion: The check runs on every pull request, rather than only when invoked by hand.
    measurement: >-
      The check is named in a workflow step with no `paths:` filter that excludes manifests,
      and it appears in a pull request job log.
  - id: AC5
    criterion: >-
      A passing run states what it did not verify, so green is not read as "the manifests are
      semantically correct".
    measurement: >-
      The sentence is present in the stdout of a passing run, and a test asserts its presence
      so that it cannot be deleted silently.
  - id: AC6
    criterion: >-
      The four manifests repaired by b34c8e37 - AID-2026-023, -029, -040 and -055 - are
      parse-checked at the landing commit of this work item.
    measurement: >-
      The check exits 0 over the real tree, and the four ids are named here so that a
      reintroduction of the defect is a visible regression of this work item.

findings:
  - id: F1
    severity: MEDIUM
    statement: >-
      The repository has one strict-parse job and it covers one manifest. Its trigger names
      `14-ai-development/work-items/AID-2026-001/manifest.yaml` and the job body hard-codes the
      same path, so the other 49 are parsed by nothing in CI.
    evidence: >-
      Measured at 68591920: 50 manifest files on disk, 50 parse under a duplicate-key-rejecting
      loader, 1 is named in the workflow's `paths:` filter and in the job body.
  - id: F2
    severity: MEDIUM
    statement: >-
      The manifest rule in check_repository_hygiene.py reads text, not YAML, so a manifest that
      cannot be loaded reports clean. Its `manifests=50 violations=0` line is evidence about a
      regular expression.
    evidence: >-
      The file contains no `import yaml` and no `safe_load`; it extracts scalars with
      `_top_level_manifest_scalar`, a per-line pattern over unindented lines.
  - id: F3
    severity: HIGH
    statement: >-
      The defect class is silent, not loud, which is what makes a strict loader necessary rather
      than sufficient. AID-2026-029 declared related_prs twice; the default loader returned a
      document with `related_prs: []` and discarded PR 356 without error.
    evidence: >-
      Recorded in b34c8e37: line 8 said `[356]` (added by d8fdf54, the closeout commit) and
      line 9 said `[]` (added earlier by 84b1255). The project's line parser read the first and
      PyYAML read the last.
  - id: F4
    severity: MEDIUM
    statement: >-
      This is the second time the class has been registered and the first time it has been
      registered with a gate as its deliverable. FIX-2026-P1-MANIFEST-YAML-001 repaired four
      manifests on 2026-11-19 without wiring a check, and its own audit record says so under
      Limits.
    evidence: >-
      FIX-2026-P1-MANIFEST-YAML-001/audit-record.md section 4 records "No workflow wiring; the
      evidence-tiering checker and the bilingual tiering script still run only when someone
      runs them." b34c8e37 is the second such repair.
  - id: F5
    severity: LOW
    statement: >-
      The ordering is not clean and is recorded as it happened: the corpus was repaired by a
      commit that deferred the gate, and the gate is a separate later work item. Two independent
      sessions repaired the same four files before either knew of the other.
    evidence: >-
      b34c8e37 (repairs, on main at 68591920) and an unmerged, independently prepared repair in
      this session that was dropped as redundant once origin/main was fetched. The prompt states
      this rather than presenting the work as a single act.

