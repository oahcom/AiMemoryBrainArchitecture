work_item_id: AID-2026-078
title: Parse every work-item manifest, not one of them
class: GATE/TEST
risk: R2
risk_rationale: >-
  One read-only checker, its tests, and one workflow step. It parses committed manifests and
  writes nothing. The risk it addresses is false assurance rather than damage: the repository's
  only strict-parse job names a single hard-coded manifest, and the manifest rule inside
  check_repository_hygiene.py is a regular expression over text that cannot fail on a document
  no parser can load. Its own summary line, `manifests=50 violations=0`, has already been read
  as parseability evidence once. A green run of the new check must not be able to be read the
  same way, which is why the "does not verify" statement is an acceptance criterion and not a
  comment.
status: DISPATCHED

