notes:
  - >-
    The checker uses the unique merge-base to determine which work-item
    directories were introduced by the candidate. It then compares those
    introduced identifiers with the current target tree. This distinction
    permits modifications beneath directories already present at the
    candidate's merge-base while rejecting a candidate that independently
    introduces an identifier occupied by a newer target.
  - >-
    The workflow-wide concurrency group is repository-wide for this workflow,
    unlike the repository's existing per-head-SHA concurrency convention.
    cancel-in-progress is false to avoid cancellation of an active decision.
    GitHub Actions concurrency is not a FIFO queue: pending runs can be
    replaced. A required platform status check and strict protection or merge
    queue are therefore still necessary for an unconditional merge guarantee.
  - >-
    The main-push audit enumerates open PRs and checks their exact current
    heads. A PR head that changes during enumeration is treated as incomplete,
    not silently accepted. This audit is supplementary and does not itself
    establish a required PR status context.
