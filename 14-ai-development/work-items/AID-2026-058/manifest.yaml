owner_decisions:

  - id: OD-23
    question: "#899 merged the traceability checker but not the two files it reads. Commit them, make the failure path refuse to print a verdict, or both?"
    ruling: "(c) Both. Neither substitutes for the other."
    constraints:
      - "Committing the inputs fixes a normal repository run; refusing to print a verdict fixes the next time an input goes missing, or a path is wrong, or the environment is incomplete."
      - "A degraded run may say why it could not check. It may not say what it checked. 'INCOMPLETE TRACEABILITY: 0 requirements / 0 work items / 0 errors' is a verdict over unread inputs and must not be printed."
      - "The change must be carried by a registered work item. OD-23 authorises the decision, not the commit: '不能仅凭本轮裁定直接修改仓库'."
      - "Do not refresh the baseline to make the four errors disappear. They are the check working."

