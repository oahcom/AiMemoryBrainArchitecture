  - id: F2
    statement: "The four errors the checker reports on a clean tree are AID-2026-023, AID-2026-024, AID-2026-025 and AID-2026-026, all 'not in INDEX.md'. This is the check working, not a defect in it. AC1 asserts these four by path, and section 5 forbids refreshing the baseline to hide them."
    measured_at: "1259f1af"
    severity: informational
  - id: F3
    statement: "#926's commit message says 'It is a repository defect ... so it is now an error: exit 1, one error, and the summary word and count agree.' Measured on the merged tree, a missing registry still produces 'INCOMPLETE TRACEABILITY: 0 requirements / 0 work items / 0 errors / 1 warnings' with exit 2. The message describes the intent of the diff, not its behaviour: reporter.error() is reached only when (root / REGISTRY_PATH).is_file() is false, and in the measured empty directory it is false, yet the unknown() branch is what runs. Either the guard does not fire as written or the message was written before the final shape. Recorded because a reader who trusts the commit message would conclude this work item is already done."
    measured_at: "1259f1af"
    severity: material
  - id: F4
    statement: "This work item was first written as AID-2026-057 and renumbered after a concurrent session claimed that ID for an unrelated work item. The number was taken within minutes of this session choosing it. Two manifests under one ID is the hazard; renumbering is the fix."
    measured_at: "b3a65e54"
