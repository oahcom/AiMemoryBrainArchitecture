findings:
  - id: F1
    statement: "00-governance/requirements-registry.yaml has a .yaml extension but JSON content, and scripts/check_traceability.py parses it with json.loads. The mismatch is pre-existing and harmless while both sides agree. Recorded so that an implementer does not 'fix' the extension or rewrite the file as YAML, either of which would break the parser."
    measured_at: "1259f1af"
    severity: informational
  - id: F2
    statement: "RETRACTED at 8e489ec1, kept as record. At b3a65e54 the checker reported AID-2026-023/024/025/026 as not in INDEX.md. All four were subsequently added to INDEX.md (lines 82-85) and the checker now reports 0 errors, exit 0. The original statement continued: 'This is the check working, not a defect in it. AC1 asserts these four by path, and section 5 forbids refreshing the baseline to hide them.' That reasoning made AC1 depend on four defects remaining unfixed, so that fixing them turns the acceptance criterion into a failure. AC1 has been restated (see acceptance criteria) to assert the involution instead: the checker must reach 0 errors and must not regress to reporting them."
    measured_at: "b3a65e54, re-measured 8e489ec1"
    severity: material
  - id: F3
    statement: "RETRACTED at 8e489ec1 — this finding was wrong. It claimed #926's commit message described intent rather than behaviour, citing 'INCOMPLETE TRACEABILITY: 0 requirements / 0 work items / 0 errors / 1 warnings' with exit 2. Independent review (REVIEW-01 finding B3) could not reproduce it and neither could I. Running the script blob at 1259f1af in a directory with no registry prints 'ERROR required registry unavailable: ...' and 'FAIL TRACEABILITY: 0 requirements / 0 work items / 1 errors / 0 warnings', exit 1 — which is what #926's message says. The INCOMPLETE/0-errors/exit-2 output belongs to a23e6cc0 (#899), the parent commit. The measurement was taken on the wrong revision and the conclusion drawn from it does not hold. The work item's premise survives independently: the verdict-shaped line '0 requirements / 0 work items' is still printed over inputs that were never read, and that is what change (B) removes."
    measured_at: "1259f1af, re-measured 8e489ec1"
    severity: material
  - id: F4
    statement: "This work item was first written as AID-2026-057 and renumbered after a concurrent session claimed that ID for an unrelated work item. The number was taken within minutes of this session choosing it. Two manifests under one ID is the hazard; renumbering is the fix."
    measured_at: "b3a65e54"
