  gate_behaviour_change: "DECIDED by OD-23, PARTIALLY IMPLEMENTED by #926 - change (B) removes the remaining verdict line"
  baseline_content_change: "GRANTED-FOR-SHRINK-ONLY - the four entries the baseline currently holds stopped failing (measured: baseline=4 current=0 fixed=4), and a stale baseline fails gate_ratchet by design. AC4 therefore authorises emptying it, removal-only, in the same commit that lands the two inputs. Additions remain NOT_GRANTED: a refreshed baseline that matches a changed result would hide exactly what this checker exists to report. Was NOT_GRANTED while AC4 still asserted the baseline stayed byte-identical; that version of AC4 could not coexist with AC3."
