work_item_id: AID-2026-058
title: Commit the traceability checker's two input files, and stop it printing a verdict over inputs it never read

class: GATE/CODE/TEST
risk: R1
risk_rationale: "One script's failure path plus two data files it already reads. No Rust, no transport, no authorization, no storage. The risk is not damage but silence: the current failure path prints '0 requirements / 0 work items / 0 errors' over unreadable inputs, so a wrong implementation looks identical to a correct one that found nothing. AC2 asserts the absence of a verdict-shaped line rather than the presence of an error, because the presence of an error is already true today; the check is whether the counts stop being printed over inputs that were never read."

security_scope: "None. A JSON registry index, a four-line path baseline, and the branch in check_traceability.py that decides what to print when REGISTRY_PATH cannot be read."

status: DISPATCHED

sponsor: USER-PRINCIPAL-DELEGATED
accountable_owner: USER-PRINCIPAL-DELEGATED
implementing_ai_session: NOT_ASSIGNED

repository: oahcom/AiMemoryBrainArchitecture
