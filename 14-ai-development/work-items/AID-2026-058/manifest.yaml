# This block did not exist in the first version: the criteria lived only in
# prompt-v1.md, which is FROZEN and cannot be edited without breaking its hash.
# Independent review (REVIEW-01) found AC1 and AC3 unsatisfiable, so the
# superseding text is recorded here and the prompt is left as the historical
# statement. Where they differ, this block governs.

acceptance_criteria:
  - id: AC1
    text: "On a clean checkout of the merged result, `python scripts/check_traceability.py` exits 0 with 0 errors, and `grep -cE '^\\| \\[AID-2026-02[3456]\\]' 14-ai-development/work-items/INDEX.md` returns 1 for each of the four. The anchor is required: an unanchored `grep -c 'AID-2026-023'` returns 2, because AID-2026-026's title cites AID-2026-023, and satisfying that count would mean deleting a cross-reference from another work item's title — the same damage B1 was about, one level down. The criterion is the involution of the original: the four paths were fixed after this work item was written, so asserting that they still fail would require un-fixing them. What is asserted instead is that the fix stays fixed and the checker does not regress to reporting them. (Original text, superseded: 'exits 1 with 4 errors and the four errors are exactly AID-2026-023/024/025/026 not appearing in INDEX.md'. Review REVIEW-01 finding B1.)"
  - id: AC2
    text: "With REGISTRY_PATH temporarily renamed, the process exits non-zero and its combined stdout+stderr contains no line matching `TRACEABILITY:` at all, anywhere in the line, case-sensitive. The token is the verdict-shaped prefix; forbidding it outright covers the three word forms and any fourth one added later, and is stricter than enumerating PASS/FAIL/INCOMPLETE. Measured against the first review's counterexample: the earlier anchored form `^(PASS|FAIL|INCOMPLETE) TRACEABILITY:` did not match `TRACEABILITY: cannot read registry` and did not match a line with leading whitespace, so a verdict-shaped summary could still be printed in those two shapes. The literal list 'PASS / FAIL / INCOMPLETE / 0 requirements / 0 work items / 0 errors' from the original is not used: as substrings they match legitimate diagnostic text such as 'FAILED TO READ', and they do not cover a line of the form 'TRACEABILITY: cannot read registry'. (Review REVIEW-01 finding M1.)"
  - id: AC3
    text: "`gate_ratchet.py --baseline scripts/ci/baselines/traceability.txt --format paths --command 'python scripts/check_traceability.py'` exits 0 with regressions=0, **and** a deliberately injected failure is caught: with one path temporarily removed from INDEX.md, the same command must exit non-zero with regressions=1, and the path restored afterwards. fixed=0 is NOT required. The injection is required because AC4 empties the baseline, and an empty baseline makes `regressions=0` true for a correct checker, a broken checker and a checker that was never built — measured: empty baseline plus a command exiting 9 gives regressions=0 fixed=0 PASS. Without the injection AC3 would pass on a checker that does nothing, which is the defect 056's AC7 documents one level up. (Original required fixed=0. Measured at 8e489ec1: baseline=4 current=0 regressions=0 fixed=4, exit 1, 'FAIL - lower the baseline by 4 fixed item(s)'. The four baseline entries stopped failing, and a shrink-only ratchet reports that as stale by design. Requiring fixed=0 together with AC4's byte-unchanged baseline made the criterion unsatisfiable: at the time this criterion was written the only ways to reach fixed=0 were to empty the baseline, which baseline_content_change then forbade, or to make the four paths fail again, which AC1 forbids. baseline_content_change has since been narrowed to GRANTED-FOR-SHRINK-ONLY so that emptying a stale baseline is authorised, and fixed=0 stopped being required. Review REVIEW-01 finding B2.)"
  - id: AC4
    text: "The baseline is brought to 0 entries, as a removal-only edit, in the same commit that lands the two inputs. This is authorised here and by nothing else: `baseline_content_change` moves from NOT_GRANTED to GRANTED-FOR-SHRINK-ONLY for this criterion, because the four entries it currently holds are no longer failing and a stale baseline fails the ratchet. The original text asserted the baseline stayed byte-identical, which contradicted AC3. (Review REVIEW-01 finding B2.)"
  - id: AC5
    text: "The existing suite in scripts/test_check_traceability.py passes, EXCEPT test_missing_registry_is_fail_not_zero_error_incomplete (definition at line 499, assertion at 513), whose assertion AC2 necessarily changes: it currently requires the output to contain 'FAIL TRACEABILITY: 0 requirements / 0 work items / 1 errors', which AC2 forbids. That one assertion is updated, not deleted, so the error-vs-indeterminate split #926 introduced stays covered. (Original said 'unmodified'; review REVIEW-01 finding B4.)"
  - id: AC6
    text: "The exit code is in {1, 2}, not 0, in the AC2 condition. Either is acceptable; the choice must be stated in the PR body rather than left to be inferred. Measured at 8e489ec1: exit 1. Unchanged."
  - id: AC7
    text: "Both baseline and registry are tracked by git after the change: `git ls-files` returns both paths. This is the work item's actual reason to exist and is not covered by any criterion above. Measured at 8e489ec1: both are untracked (`git cat-file -e origin/main:<path>` returns 128)."

