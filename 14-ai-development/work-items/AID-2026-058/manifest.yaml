owner_decisions:

  - id: OD-23
    question: "#899 merged the traceability checker but not the two files it reads. Commit them, make the failure path refuse to print a verdict, or both?"
    ruling: "(c) Both. Neither substitutes for the other."
    constraints:
      - "Committing the inputs fixes a normal repository run; refusing to print a verdict fixes the next time an input goes missing, or a path is wrong, or the environment is incomplete."
      - "A degraded run may say why it could not check. It may not say what it checked. 'INCOMPLETE TRACEABILITY: 0 requirements / 0 work items / 0 errors' is a verdict over unread inputs and must not be printed."
      - "The change must be carried by a registered work item. OD-23 authorises the decision, not the commit: '不能仅凭本轮裁定直接修改仓库'."
      - "Do not refresh the baseline to make the four errors disappear. They are the check working."

authorization:
  implementation_write: "NOT_GRANTED - this manifest registers the work; no file has been committed by the registering session"
  gate_behaviour_change: "DECIDED by OD-23, PARTIALLY IMPLEMENTED by #926 - change (B) removes the remaining verdict line"
  baseline_content_change: "GRANTED-FOR-SHRINK-ONLY - the four entries the baseline currently holds stopped failing (measured: baseline=4 current=0 fixed=4), and a stale baseline fails gate_ratchet by design. AC4 therefore authorises emptying it, removal-only, in the same commit that lands the two inputs. Additions remain NOT_GRANTED: a refreshed baseline that matches a changed result would hide exactly what this checker exists to report. Was NOT_GRANTED while AC4 still asserted the baseline stayed byte-identical; that version of AC4 could not coexist with AC3."
  allowlist_change: "NOT_APPLICABLE"
  root_membership_change: "NOT_APPLICABLE"

