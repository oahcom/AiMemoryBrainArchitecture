findings:
  - id: AID-2026-051-F1
    severity: P1
    feedback_destination: "Delivery PR conversation. Both defects in GOV-NC-2026-11-22-ENUM-BOUNDARY-021 are already fixed at 063113f0: current_bilingual_gaps() enumerates via `git ls-files` and write_baseline() refuses on a dirty tree. But the register still carries status OPEN, and closing condition 5 requires seven new tests of which zero exist. A reader who sees OPEN and the words 'Awaiting implementation' will implement the fix a second time. The correct state is 'implementation complete, tests outstanding', and this AID records that."
  - id: AID-2026-051-F2
    severity: P2
    feedback_destination: "Delivery PR conversation. The register asks for 'seven new tests' in closing condition 5 while §6 specifies nine (T01-T09). Seven and nine cannot both be the requirement. This prompt asks for nine, because §6 is the specification and the closing condition is a summary of it; the discrepancy is recorded here rather than resolved silently in either direction."
  - id: AID-2026-051-F3
    severity: P1
    feedback_destination: "Delivery PR conversation. Closing condition 16 requires independent acceptance evidence. A session that writes the tests cannot supply independence for its own work. Writing the nine tests therefore advances the register without closing it, and the register must stay OPEN after merge. Marking it closed on the strength of this delivery alone would be the exact self-authorization the repository's rulings prohibit."

