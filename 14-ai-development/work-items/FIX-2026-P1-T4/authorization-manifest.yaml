  - "Documentation changes that alter normative semantics MUST be escalated, not treated as ordinary text edits."
  - "Every level retains a full 40-hex SHA and a change summary."
  - "UNKNOWN is always BLOCKED."
  - "All v3 binding and authenticity checks are preserved."
  - "AI-STD-001 keeps the single-file EN/ZH alternating structure; no docs/en copy is created."
  - "AI-EXEC-002 v1.2 MUST NOT be used as an effective normative basis."
