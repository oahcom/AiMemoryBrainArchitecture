    severity: material
    raised_by: owner ruling OD-26
    measured_at: "b80e5a40"
    statement: "The defect is larger than the empty baseline. Under --format paths the ratchet compares path sets only and discards the command's exit code, so 'the check was never run' and 'the check ran and found nothing' produce the same empty current-set. The empty baseline is the case where this is most visible, not the whole condition."
    resolution: "AC2 and the second deliverable key the fix on the exit code, not only on baseline emptiness. A fix that special-cases empty files would leave the general condition in place."
