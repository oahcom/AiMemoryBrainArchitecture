  reason: "prompt_status is FROZEN; editing the prompt would invalidate prompt_sha256 and the provenance note that records what was measured when it was written. The prompt was written at b80e5a40 and orders three things the repository cannot accept: rejecting empty baselines, failing on any non-zero command exit, and requiring a non-empty baseline for PASS. Round 1 of independent review showed each of the three collides with a live caller or with AID-2026-058, and that the rejection is the special case findings[F1] warns against."
  superseded:
    - prompt_item: "prompt-v1.md section 4.1 (an empty baseline is rejected, exit non-zero naming the path) and AC1 (empty baseline plus a command exiting 0 must exit non-zero)"
      replaced_by: "AC4, which requires an empty baseline with exit 0 and an empty set to PASS; withdrawn_acceptance_criteria[AC1-ORIGINAL] records the withdrawal"
      why: "AID-2026-058's AC4 brings scripts/ci/baselines/traceability.txt to zero entries in the same commit that lands its inputs, and its AC3 requires this script over that baseline to exit 0. OD-26 lands 060 first, so the literal prompt makes 058 unimplementable. The hole the rejection aimed at is closed by AC1-AC3, which key the guard on exit-code and set agreement instead of on baseline emptiness."
    - prompt_item: "prompt-v1.md section 4.2 (a non-zero exit from the command fails the ratchet, independently of the baseline's content) and deliverable 2 as first written"
      replaced_by: "AC1, AC2 and AC5, which distinguish a status outside {0,1}, a status that contradicts an empty set, and the live caller that exits 1 by design"
