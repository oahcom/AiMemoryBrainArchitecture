# ---------------------------------------------------------------------------
# Deliverables. Each is a claim a reader can check without trusting this file.
# ---------------------------------------------------------------------------

deliverables:
  - "gate_ratchet.py reads the command's exit status and fails when that status disagrees with the parsed failure set: a status outside {0, 1}; a non-zero status with an empty set; a zero status with a non-empty set. It does not reject an empty baseline, because an empty baseline whose status and set agree is a legitimate no-op and AID-2026-058 requires exactly that. At 767f2eaa the first two shapes are implemented (gate_ratchet.py:117 and :122, added by c6602739 / #1031); the third is not, and is the whole of the remaining work."
  - "An empty baseline plus a command exiting non-zero fails. This was the defect at b80e5a40, where the same case gave regressions=0 fixed=0 PASS exit 0; at 767f2eaa it gives FAIL exit 1, so the deliverable is now a regression guard rather than a repair."
  - "PASS is emitted only when the baseline is readable, the exit-status and parsed-set pair agrees, and the diff obeys the shrink-only rule. Baseline emptiness is not a PASS condition."
  - "The comment at the top of gate_ratchet.py is rewritten to state what the tests enforce, including what remains outside the guarantee. The comment as it stood at b80e5a40 claimed 'a crash yields zero items and is caught below as a stale baseline (fail-closed), never as a pass', which held only while the baseline was non-empty. At 767f2eaa the module docstring lists the two diff cases and one of the two exit-status conditions — its 'Exit codes' line already names 'a wrapped command that exited non-zero without reporting an item' (AC2's shape) but says nothing about a status outside {0, 1} (AC1's shape), so a reader of the docstring alone would not know that a wrapped command exiting 2 is rejected. That gap is why this deliverable remains open, and it is the only part of it that is."
  - "Tests cover AC1-AC5 at scripts/ci/test_gate_ratchet.py, and each is mutation-verified by the reviewer, not self-certified: the reviewer removes the guard, re-runs, and records which test fails. The manifest does not assert this about itself. The file exists at 767f2eaa with six cases added by c6602739; AC3 has no test, because the guard it would test does not exist yet."

acceptance_criteria:
  - id: AC1
    text: "A command exit status outside {0, 1} fails the ratchet, whatever the parsed set and whatever the baseline contains: non-zero exit, no PASS, and the observed status named in the message. Tested with both an empty and a non-empty baseline. Satisfied at 767f2eaa by c6602739 (#1031), which added the guard at gate_ratchet.py:117; measured there: empty baseline plus a command exiting 9 gives regressions=0 fixed=0 and then FAIL exit 1. It was NOT satisfied at b80e5a40, the commit this work item was dispatched against, where the same case gave PASS exit 0. The criterion is therefore a regression guard for a guard that now exists, not a description of work still to do; the reviewer verifies it by deleting gate_ratchet.py:117-120 and re-running the suite."
  - id: AC2
    text: "A non-zero status with an empty parsed set fails: the command reported failure and listed nothing, so there is no set to compare and the baseline cannot be ratcheted. Satisfied at 767f2eaa by c6602739 (#1031), which added the guard at gate_ratchet.py:122; measured there: a command exiting 1 with no output gives FAIL exit 1 with 'without printing any item; a crash is not a clean run', and a command exiting 9 with no output is caught earlier by gate_ratchet.py:117 as a status outside {0, 1}, so this guard is the one that carries the status-1 case. At b80e5a40 the same case was caught only incidentally, and only when the baseline was non-empty, where every entry became 'fixed' and the failure read as a stale baseline rather than as an untrustworthy run. The difference matters for the empty baseline, where there was no incidental catch at all."
  - id: AC3
    text: "A zero status with a non-empty parsed set fails: the command reported success while listing failures. This is the one criterion of AC1-AC5 that #1031 did NOT implement, and it is the whole of the remaining work. Measured at 767f2eaa: a command that prints three items and exits 0 gives regressions=0 fixed=0 PASS exit 0, so a checker that always exits 0 and always prints the same items ratchets itself into permanence. gate_ratchet.py:117 rejects a status outside {0,1} and :122 rejects a non-zero status with no items, but nothing compares a zero status against a non-empty set, so this shape reaches the PASS line."
  - id: AC4
    text: "An empty baseline with a zero status and an empty parsed set exits 0 and prints PASS. This is required, not tolerated: AID-2026-058's AC4 brings scripts/ci/baselines/traceability.txt to zero entries in the same commit that lands its inputs, and its AC3 requires this script over that baseline to exit 0. Rejecting empty baselines makes 058 unimplementable, which is why the guard is keyed on status and set agreement rather than on baseline emptiness."
  - id: AC5
    text: "A non-empty baseline with status 1 and a parsed set equal to the baseline exits 0 and prints PASS. This is the live caller: gates.yml:165-168 wraps scripts/check_bilingual_docs_full.py, which exits 1 with 77 violations as its normal result. A rule reading 'any non-zero status fails' turns the required check Bilingual docs coverage (ratchet) permanently red, so this criterion exists to make that outcome a test failure rather than a CI discovery."
  - id: AC6
    text: "Tests exist at scripts/ci/test_gate_ratchet.py for AC1-AC5, and each is mutation-verified by the reviewer: the guard under test is deleted, the suite is re-run, and the failing test is recorded. A test that passes with its guard removed is not evidence and does not satisfy this criterion. The author does not certify this about their own suite. The file exists at 767f2eaa, added by c6602739 (#1031) with six cases; the reviewer's job is therefore to establish which of AC1-AC5 those six actually pin and which are unpinned, not to accept the count as coverage. Measured at 767f2eaa: AC1, AC2, AC4 and AC5 are pinned by named tests; AC3 has no test, because the guard it would test does not exist yet. Deleted-guard results measured in this session: removing gate_ratchet.py:117-120 fails test_exit_status_outside_zero_one_is_not_comparable; removing :122-125 fails test_empty_baseline_with_nonzero_exit_and_no_output_fails; rejecting empty baselines outright fails test_empty_baseline_with_clean_exit_and_no_output_passes and the preceding test; turning :117 into 'any non-zero status fails' fails test_exact_match_with_nonzero_exit_still_passes among others. AC1-AC2 and AC4-AC5 are therefore pinned; AC3 is the sole gap."
  - id: AC7
    text: "The comment inside gate_ratchet.py no longer claims a guarantee the code does not provide. It states the PASS conditions as implemented, and it names the input class that remains undetectable, if any survives the change. One class does survive, and AC7 names it rather than leaving risk_rationale's 'never ran versus ran and found nothing' sentence reading as discharged: status 0 with an empty parsed set over an empty baseline is indistinguishable from a command that does nothing, and AC4 accepts it deliberately because AID-2026-058 requires it. Measured at 767f2eaa, this residual is real and exactly as described: an empty baseline with a command that prints nothing and exits 0 produces byte-identical output to the same baseline with a command that exits 0 immediately, both PASS exit 0. AC1-AC3 close every other shape of that indistinguishability, but not this one, and a reader who tests the work item against its own rationale will find it short unless the residual is written down. The docstring at 767f2eaa still reads 'a wrapped command that exited non-zero without reporting an item', which describes the pre-#1031 behaviour and omits the status-outside-{0,1} guard added at line 117; correcting it is part of this criterion, not already done."
  - id: AC8
    text: "Both callers are named and still pass: (a) scripts/ci/baselines/bilingual-docs.txt, 77 entries, command status 1, parsed set equal to the baseline; (b) scripts/ci/baselines/traceability.txt, 0 entries, command status 0, empty set, once AID-2026-058 lands. Neither baseline changes shape as a side effect of this work item, and no workflow file is edited to make either pass."

withdrawn_acceptance_criteria:
  - id: AC1-ORIGINAL
    text: "WITHDRAWN, not deferred. The id is suffixed so that it cannot be confused with AC1 in acceptance_criteria, which replaces it and asserts a different thing. Original: 'Empty baseline, command exits 0: non-zero exit, message names the baseline path, no PASS on stdout.' Two independent reviews found it unimplementable in this repository. First, it is the special case findings[F1] warns against: a fix that rejects empty files leaves the general condition - an exit status nobody reads - exactly where it was. Second, AID-2026-058's AC4 empties scripts/ci/baselines/traceability.txt and its AC3 requires this script over that baseline to exit 0, so the two work items cannot both be satisfied; OD-26 orders 060 first, which would strand 058. AC1-AC3 here close the hole the original aimed at by keying on status and set agreement. See findings[F4] and findings[F5]."

