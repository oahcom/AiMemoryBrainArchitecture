# ---------------------------------------------------------------------------
# Deliverables. Each is a claim a reader can check without trusting this file.
# ---------------------------------------------------------------------------

deliverables:
  - "gate_ratchet.py reads the command's exit status and fails when that status disagrees with the parsed failure set: a status outside {0, 1}; a non-zero status with an empty set; a zero status with a non-empty set. It does not reject an empty baseline, because an empty baseline whose status and set agree is a legitimate no-op and AID-2026-058 requires exactly that."
  - "An empty baseline plus a command exiting non-zero fails. Measured at b80e5a40: regressions=0 fixed=0 PASS exit 0."
  - "PASS is emitted only when the baseline is readable, the exit-status and parsed-set pair agrees, and the diff obeys the shrink-only rule. Baseline emptiness is not a PASS condition."
  - "The comment at the top of gate_ratchet.py is rewritten to state what the tests enforce, including what remains outside the guarantee. The current comment claims 'a crash yields zero items and is caught below as a stale baseline (fail-closed), never as a pass', which holds only while the baseline is non-empty."
  - "Tests cover AC1-AC5 at scripts/ci/test_gate_ratchet.py, and each is mutation-verified by the reviewer, not self-certified: the reviewer removes the guard, re-runs, and records which test fails. The manifest does not assert this about itself."

acceptance_criteria:
  - id: AC1
    text: "A command exit status outside {0, 1} fails the ratchet, whatever the parsed set and whatever the baseline contains: non-zero exit, no PASS, and the observed status named in the message. Tested with both an empty and a non-empty baseline. Measured at b80e5a40: empty baseline plus a command exiting 9 gives regressions=0 fixed=0 PASS exit 0, so this criterion fails today."
  - id: AC2
    text: "A non-zero status with an empty parsed set fails: the command reported failure and listed nothing, so there is no set to compare and the baseline cannot be ratcheted. Today this is caught only incidentally, and only when the baseline is non-empty, where every entry becomes 'fixed' and the failure reads as a stale baseline rather than as an untrustworthy run."
  - id: AC3
    text: "A zero status with a non-empty parsed set fails: the command reported success while listing failures. Today that comparison passes whenever the set equals the baseline, which is how a checker that always exits 0 and always prints the same items would ratchet itself into permanence."
  - id: AC4
    text: "An empty baseline with a zero status and an empty parsed set exits 0 and prints PASS. This is required, not tolerated: AID-2026-058's AC4 brings scripts/ci/baselines/traceability.txt to zero entries in the same commit that lands its inputs, and its AC3 requires this script over that baseline to exit 0. Rejecting empty baselines makes 058 unimplementable, which is why the guard is keyed on status and set agreement rather than on baseline emptiness."
  - id: AC5
    text: "A non-empty baseline with status 1 and a parsed set equal to the baseline exits 0 and prints PASS. This is the live caller: gates.yml:161-164 wraps scripts/check_bilingual_docs_full.py, which exits 1 with 77 violations as its normal result. A rule reading 'any non-zero status fails' turns the required check Bilingual docs coverage (ratchet) permanently red, so this criterion exists to make that outcome a test failure rather than a CI discovery."
  - id: AC6
    text: "Tests exist at scripts/ci/test_gate_ratchet.py for AC1-AC5, and each is mutation-verified by the reviewer: the guard under test is deleted, the suite is re-run, and the failing test is recorded. A test that passes with its guard removed is not evidence and does not satisfy this criterion. The author does not certify this about their own suite."
  - id: AC7
    text: "The comment inside gate_ratchet.py no longer claims a guarantee the code does not provide. It states the PASS conditions as implemented, and it names the input class that remains undetectable, if any survives the change. One class does survive, and AC7 names it rather than leaving risk_rationale's 'never ran versus ran and found nothing' sentence reading as discharged: status 0 with an empty parsed set over an empty baseline is indistinguishable from a command that does nothing, and AC4 accepts it deliberately because AID-2026-058 requires it. AC1-AC3 close every other shape of that indistinguishability, but not this one, and a reader who tests the work item against its own rationale will find it short unless the residual is written down."
  - id: AC8
    text: "Both callers are named and still pass: (a) scripts/ci/baselines/bilingual-docs.txt, 77 entries, command status 1, parsed set equal to the baseline; (b) scripts/ci/baselines/traceability.txt, 0 entries, command status 0, empty set, once AID-2026-058 lands. Neither baseline changes shape as a side effect of this work item, and no workflow file is edited to make either pass."

withdrawn_acceptance_criteria:
  - id: AC1-ORIGINAL
    text: "WITHDRAWN, not deferred. The id is suffixed so that it cannot be confused with AC1 in acceptance_criteria, which replaces it and asserts a different thing. Original: 'Empty baseline, command exits 0: non-zero exit, message names the baseline path, no PASS on stdout.' Two independent reviews found it unimplementable in this repository. First, it is the special case findings[F1] warns against: a fix that rejects empty files leaves the general condition - an exit status nobody reads - exactly where it was. Second, AID-2026-058's AC4 empties scripts/ci/baselines/traceability.txt and its AC3 requires this script over that baseline to exit 0, so the two work items cannot both be satisfied; OD-26 orders 060 first, which would strand 058. AC1-AC3 here close the hole the original aimed at by keying on status and set agreement. See findings[F4] and findings[F5]."

