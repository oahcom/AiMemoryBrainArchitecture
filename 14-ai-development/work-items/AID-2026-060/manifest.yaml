# It orders the empty-baseline rejection that AC1 below withdraws, so it is
# superseded here rather than rewritten there.

prompt_supersession:
  governing_block: "acceptance_criteria and deliverables in this file"
  reason: "prompt_status is FROZEN; editing the prompt would invalidate prompt_sha256 and the provenance note that records what was measured when it was written. The prompt was written at b80e5a40 and orders three things the repository cannot accept: rejecting empty baselines, failing on any non-zero command exit, and requiring a non-empty baseline for PASS. Round 1 of independent review showed each of the three collides with a live caller or with AID-2026-058, and that the rejection is the special case findings[F1] warns against."
  superseded:
    - prompt_item: "prompt-v1.md section 4.1 (an empty baseline is rejected, exit non-zero naming the path) and AC1 (empty baseline plus a command exiting 0 must exit non-zero)"
      replaced_by: "AC4, which requires an empty baseline with exit 0 and an empty set to PASS; withdrawn_acceptance_criteria[AC1-ORIGINAL] records the withdrawal"
      why: "AID-2026-058's AC4 brings scripts/ci/baselines/traceability.txt to zero entries in the same commit that lands its inputs, and its AC3 requires this script over that baseline to exit 0. OD-26 lands 060 first, so the literal prompt makes 058 unimplementable. The hole the rejection aimed at is closed by AC1-AC3, which key the guard on exit-code and set agreement instead of on baseline emptiness."
    - prompt_item: "prompt-v1.md section 4.2 (a non-zero exit from the command fails the ratchet, independently of the baseline's content) and deliverable 2 as first written"
      replaced_by: "AC1, AC2 and AC5, which distinguish a status outside {0,1}, a status that contradicts an empty set, and the live caller that exits 1 by design"
      why: "The only caller in the repository is gates.yml:161-164 wrapping scripts/check_bilingual_docs_full.py, which exits 1 with 77 violations as its normal result and is ratcheted against a 77-entry baseline. Failing on any non-zero exit turns the required check Bilingual docs coverage (ratchet) permanently red."
    - prompt_item: "prompt-v1.md section 4.3 (PASS requires the command to have exited 0, the baseline to be read and non-empty, the set to be computed, and the diff to obey the rule)"
      replaced_by: "AC4 and AC5 (PASS requires a readable baseline and an agreeing exit-status/set pair; baseline emptiness is not a PASS condition)"
      why: "The non-empty clause is the same rejection in a second place. An empty baseline with an agreeing pair is a legitimate no-op, which is exactly what 058 needs."
    - prompt_item: "prompt-v1.md AC3 (non-empty baseline plus a command exiting 9 must exit non-zero), described there as already true and asserted only so it does not regress"
      replaced_by: "AC1 (any status outside {0,1} fails, for every baseline)"
      why: "It is not already true. Measured: a 77-entry baseline whose command prints exactly the baseline set and then exits 9 gives regressions=0 fixed=0 PASS exit 0, because proc.returncode is never read. The criterion was a miscategorised new requirement rather than a regression guard."
    - prompt_item: "prompt-v1.md AC7 (every existing caller still passes; neither baseline may become empty) read together with section 4.1"
      replaced_by: "AC8 (both callers named with their exit status and baseline shape, including the one that exits 1 by design)"
      why: "The original AC7 names the callers but not their exit statuses, so it promises an outcome its own section 4.1 forbids. Naming them with their statuses is what makes it checkable."
  not_superseded: "prompt section 5's prohibitions, AC2 (empty baseline plus a command exiting 9 must fail), AC4 (the happy path survives), AC5 (mutation-verified tests), AC6 (the comment must match the code) and the OD-26 ruling stand as written in the prompt. AC2 and AC4 are re-stated here only where the rule behind them changed."

