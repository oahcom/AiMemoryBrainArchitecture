# ---------------------------------------------------------------------------
# Deliverables. Each is a claim a reader can check without trusting this file.
# ---------------------------------------------------------------------------

deliverables:
  - "gate_ratchet.py rejects a baseline file that exists but contains zero entries, naming the path and exiting non-zero, instead of treating it as a valid zero-item baseline."
  - "gate_ratchet.py fails when the command it runs exits non-zero, regardless of the baseline's content. Today that exit code is discarded under --format paths."
  - "PASS is emitted only when all four hold: command exit 0, baseline read and non-empty, current set computed, diff obeys the ratchet rule."
  - "The comment at the top of gate_ratchet.py is rewritten to state what the tests enforce, including what remains outside the guarantee. The current comment claims 'never as a pass', which is false for an empty baseline."
  - "Tests cover the four cases in AC1-AC4, and each test is mutation-verified: the manifest states which guard removal makes which test fail."

acceptance_criteria:
  - id: AC1
    text: "Empty baseline, command exits 0: non-zero exit, message names the baseline path, no PASS on stdout. Measured today: PASS, exit 0. The empty case is treated as a valid zero-item baseline."
  - id: AC2
    text: "Empty baseline, command exits 9: non-zero exit, no PASS. Measured today: regressions=0 fixed=0 PASS exit 0 — the exact case this work item exists for."
  - id: AC3
    text: "Non-empty baseline, command exits 9: non-zero exit, no PASS. Already true today (fixed=77 FAIL exit 1); asserted so the change does not regress a property that currently holds."
  - id: AC4
    text: "Non-empty baseline, command exits 0, output set matches the baseline exactly: PASS, exit 0. The happy path must survive the guard, or the guard will be removed by whoever it blocks."
  - id: AC5
    text: "Tests exist for AC1-AC4, and each is mutation-verified rather than counted. For every test, the manifest names the specific guard whose removal makes that test fail; a test that passes with the guard removed is not evidence and does not satisfy this criterion."
  - id: AC6
    text: "The comment inside gate_ratchet.py no longer claims a guarantee the code does not provide. It states the four PASS conditions and names the input classes that remain undetectable, if any."
  - id: AC7
    text: "Both existing callers still pass: the bilingual-docs ratchet (77 entries) and, once AID-2026-058 lands, the traceability ratchet. Neither baseline becomes empty as a side effect. If a caller currently relies on the pass-through behaviour this work item removes, that caller is named in the manifest rather than silently adjusted."

