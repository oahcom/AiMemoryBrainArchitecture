      replaced_by: "AC8 (both callers named with their exit status and baseline shape, including the one that exits 1 by design)"
      why: "The original AC7 names the callers but not their exit statuses, so it promises an outcome its own section 4.1 forbids. Naming them with their statuses is what makes it checkable."
  not_superseded: "prompt section 5's prohibitions, AC2 (empty baseline plus a command exiting 9 must fail), AC4 (the happy path survives), AC5 (mutation-verified tests), AC6 (the comment must match the code) and the OD-26 ruling stand as written in the prompt. AC2 and AC4 are re-stated here only where the rule behind them changed."

