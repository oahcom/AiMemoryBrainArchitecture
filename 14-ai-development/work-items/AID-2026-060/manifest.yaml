work_item_id: AID-2026-060
title: Make gate_ratchet.py fail when the command's exit status and its parsed failure set disagree

class: GATE/CODE/TEST
risk: R2
risk_rationale: "One standard-library script and its tests. No Rust, no transport, no authorization, no storage. The risk is not damage but false assurance: the ratchet is the mechanism that keeps ~20 shrink-only baselines honest, and it currently reports PASS over an empty baseline even when the command it ran exited non-zero. Measured at b80e5a40. A gate that cannot tell 'never ran' from 'ran and found nothing' converts every baseline it guards into a decoration. R2 rather than R1 because changing the failure path of a gate used across the repository can turn currently-green checks red if any caller depends on the pass-through behaviour."

security_scope: "None. No credentials, no network, no subprocess beyond the command it already invokes, no file writes outside its own output."

# Machine-readable authorisation. Added because independent review (REVIEW-01
# finding B3) found the write boundary existed only as prose inside
# security_scope and prompt section 6, neither of which anything can read.

authorization:
  implementation_write: "NOT_GRANTED - this manifest registers the work; no file has been committed by the registering session"
  gate_behaviour_change: "GRANTED by OD-26 - the failure path of scripts/ci/gate_ratchet.py is the subject of this work item"
  baseline_content_change: "NOT_APPLICABLE - no baseline file is edited. AC4 requires that an empty baseline stay usable, not that any baseline be changed"
  allowlist_change: "NOT_APPLICABLE"
  workflow_change: "NOT_GRANTED - gates.yml invokes this script. If the invariant cannot be implemented without editing the workflow, that is a finding to raise, not an authorised edit"
  root_membership_change: "NOT_APPLICABLE"

scope:
  files_to_create:
    - scripts/ci/test_gate_ratchet.py
  files_to_modify:
    - scripts/ci/gate_ratchet.py
  files_not_to_touch:
    - .github/workflows/gates.yml
    - scripts/ci/baselines/bilingual-docs.txt
    - scripts/ci/baselines/traceability.txt
    - scripts/check_bilingual_docs_full.py
    - scripts/check_traceability.py

