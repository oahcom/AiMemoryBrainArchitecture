work_item_id: AID-2026-060
title: Make gate_ratchet.py fail when the command's exit status and its parsed failure set disagree

class: GATE/CODE/TEST
risk: R2
risk_rationale: "One standard-library script and its tests. No Rust, no transport, no authorization, no storage. The risk is not damage but false assurance: the ratchet is the mechanism that keeps ~20 shrink-only baselines honest, and at b80e5a40 it reported PASS over an empty baseline even when the command it ran exited non-zero. A gate that cannot tell 'never ran' from 'ran and found nothing' converts every baseline it guards into a decoration. R2 rather than R1 because changing the failure path of a gate used across the repository can turn currently-green checks red if any caller depends on the pass-through behaviour. Two of the three shapes are now closed by c6602739 (#1031); the third — a zero status over a non-empty set — is open at 767f2eaa, and the residual indistinguishability AC4 accepts is named in AC7 rather than left implied."

security_scope: "None. No credentials, no network, no subprocess beyond the command it already invokes, no file writes outside its own output."

# Machine-readable authorisation. Added because independent review (REVIEW-01
# finding B3) found the write boundary existed only as prose inside
# security_scope and prompt section 6, neither of which anything can read.

