findings:
  - id: F1
    severity: material
    raised_by: owner ruling OD-26
    measured_at: "b80e5a40"
    statement: "The defect is larger than the empty baseline, and its cause is not the one first written here. As measured at b80e5a40, proc.returncode was never read, in any format: the only reference to the completed process was current = normalize(proc.stdout.splitlines(), args.format) at line 105. The first version of this finding said the exit code is discarded 'under --format paths'; the default schema format discarded it identically (measured: empty baseline plus a command exiting 9 gave PASS exit 0 with no --format argument at all). A fix written to that diagnosis would have guarded one branch and passed every criterion in the first version of this manifest. Corrected at REVIEW-03: c6602739 (#1031) has since landed two guards (gate_ratchet.py:117 for a status outside {0,1}, :122 for a non-zero status with no items), so the present-tense form of the first sentence is false at 767f2eaa. Three of the four shapes are closed; the fourth — a zero status with a non-empty parsed set — is what AC3 still requires and is the only one left."
    resolution: "AC1, AC2 and AC3 key the fix on the status itself, not on the format, and they cover the three ways the status and the parsed set can disagree. The empty baseline remains visible as the case where the disagreement is cheapest to reach, but it is no longer the only case named."
  - id: F2
    severity: informational
    raised_by: review of AID-2026-056 (REVIEW-01 finding M4)
    measured_at: "8e489ec1"
    statement: "This is the same shape as the defect AID-2026-058 exists to fix: a checker reporting a clean result over inputs it never read. Under #926 the traceability checker now prints FAIL with 1 error in that situation, so the word agrees with the exit code, but the verdict-shaped line is still printed over an empty read."
    resolution: "Recorded as context, not as scope. This work item does not fix check_traceability.py."
  - id: F3
    severity: informational
    raised_by: this session
    measured_at: "b80e5a40"
    statement: "Numbered 060, not 059. AID-2026-059 exists as an untracked work item in a concurrent session's working tree, implementing the AI session evidence gate for Issue #799. It was not in origin/main when this ID was chosen, so a check against main alone would have collided."
    resolution: "Renumbered rather than contested. Two manifests under one ID is the hazard; the working tree, not the index, is where the collision would have happened."
  - id: F4
    severity: blocking
    raised_by: independent review round 1 (REVIEW-01 finding B2), confirmed independently by the round-3 review of AID-2026-058
    measured_at: "ba293506"
    statement: "The withdrawn AC1 required gate_ratchet.py to reject an empty baseline. AID-2026-058's AC4 brings scripts/ci/baselines/traceability.txt to zero entries in the same commit that lands its inputs, and its AC3 requires this script over that baseline to exit 0, regressions=0. Both cannot hold. OD-26 orders this work item to land first, so the literal AC1 would have stranded a work item that was already DISPATCHED. Neither manifest mentioned that the conflict existed."
    resolution: "AC1 withdrawn rather than given an exemption marker. An 'intentionally empty' marker would have needed a change to AID-2026-058 as well, and would have made baseline emptiness a declared property instead of a computed one. AC4 now requires the empty baseline to pass, and findings[F1]'s general condition is closed by AC1-AC3, which do not depend on baseline content."
  - id: F5
    severity: blocking
    raised_by: independent review round 1 (REVIEW-01 finding B1)
    measured_at: "ba293506"
    statement: "The second deliverable and prompt section 4.2 required any non-zero command exit to fail the ratchet, 'regardless of the baseline's content'. The only caller in the repository is gates.yml:165-168, wrapping scripts/check_bilingual_docs_full.py, which exits 1 with 77 violations as its normal result and is ratcheted against a 77-entry baseline. Measured at ba293506: 77 violations, EXIT=1, and the ratchet correctly reports baseline=77 current=77 regressions=0 PASS exit 0. Implementing the deliverable literally turns the required check Bilingual docs coverage (ratchet) red on every run and keeps it red."
    resolution: "Deliverables[1] now requires agreement between status and set rather than a zero status. AC5 pins the bilingual caller as a test so that a future simplification in the other direction fails in the suite instead of in CI."
  - id: F6
    severity: blocking
    raised_by: independent review round 1 (REVIEW-01 finding B3)
    measured_at: "ba293506"
    statement: "The manifest had no authorization, scope, files_to_modify or implementation_write field. The write boundary existed only as prose in prompt section 6 and in security_scope, neither of which anything reads. This is the same defect AID-2026-056's round 1 raised as B5, and the same one AID-2026-058 had already fixed."
    resolution: "authorization and scope added. workflow_change is NOT_GRANTED rather than NOT_APPLICABLE, because gates.yml invokes this script and a fix that reaches into the workflow would be a scope change, not an implementation detail."
  - id: F7
    severity: blocking
    raised_by: independent review round 1 (REVIEW-01 finding B4)
    measured_at: "ba293506"
    statement: "No criterion failed if only the empty-baseline case were special-cased. Measured: a 77-entry baseline, a command printing exactly the baseline set, and an exit status of 9 gives regressions=0 fixed=0 PASS exit 0. A one-line rejection of empty baselines satisfies the first version of AC1 through AC4 and leaves the status unread, which is the outcome findings[F1] explicitly says must not count as a fix."
    resolution: "AC1 fails on any status outside {0,1} regardless of baseline content, so the special case cannot pass. Pinned by AC1's non-empty-baseline case, which requires a status of 9 with a full baseline to fail; AC5 pins the opposite direction (status 1 must pass). Corrected at REVIEW-02 finding N1: this sentence used to attribute the status-9 pin to AC5, which asserts status 1, so a reader would have written a test that does not exist."
  - id: F8
    severity: material
    raised_by: independent review round 1 (REVIEW-01 finding M4)
    measured_at: "ba293506"
    statement: "No test module path appeared anywhere in the manifest or the prompt, so AC5 was not checkable. The repository convention for a script under scripts/ci/ is a sibling scripts/ci/test_*.py, of which there are three."
    resolution: "scripts/ci/test_gate_ratchet.py is named in AC6. It was named in scope.files_to_create when this finding was written; c6602739 (#1031) has since created it, so it is now named in scope.files_to_modify instead."
