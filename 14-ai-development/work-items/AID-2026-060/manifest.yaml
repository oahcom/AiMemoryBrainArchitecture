    - prompt_item: "prompt-v1.md section 4.3 (PASS requires the command to have exited 0, the baseline to be read and non-empty, the set to be computed, and the diff to obey the rule)"
      replaced_by: "AC4 and AC5 (PASS requires a readable baseline and an agreeing exit-status/set pair; baseline emptiness is not a PASS condition)"
