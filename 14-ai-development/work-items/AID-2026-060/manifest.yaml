    - prompt_item: "prompt-v1.md AC3 (non-empty baseline plus a command exiting 9 must exit non-zero), described there as already true and asserted only so it does not regress"
      replaced_by: "AC1 (any status outside {0,1} fails, for every baseline)"
      why: "It is not already true at b80e5a40, the commit this work item was dispatched against. Measured there: a 77-entry baseline whose command prints exactly the baseline set and then exits 9 gives regressions=0 fixed=0 PASS exit 0, because proc.returncode is never read. c6602739 (#1031) has since added that guard, so at 767f2eaa the case fails correctly; the criterion is now a regression guard over a guard that exists, which is what prompt AC3 said it was. The measurement that justified superseding it remains true of the commit it was taken at."
