work_item_id: AID-2026-269
title: >-
  Establish a reusable, independently executable Exact-Head Independent Review
  Protocol and apply it once to #1278 (AID-2026-092): lock the candidate commit,
  recompute the declared prompt digest and byte count from committed Git objects,
  enumerate the reachable history for the declared value, and grade the findings —
  without repairing the reviewed work item
class: DOC/GOVERNANCE + GATE/PROTOCOL
risk: R1
risk_rationale: >-
  Additions only: one reusable protocol document, one review case, one evidence
  record, one session-evidence record, one prompt snapshot and one appended INDEX
  row. No production gate, workflow, required context, branch protection, schema,
  checker, baseline or normative root is changed, and no existing manifest or INDEX
  row is edited. The residual risk is evidentiary, not operational: a review record
  that reads as a repair of #1278, or a verdict that is silently attributed to this
  work item instead of to the reviewed declaration, would recreate the very defect
  class the protocol exists to catch. The manifest therefore states the three
  statuses separately — review execution, reviewed declaration, remediation — and
  records them as different things.
