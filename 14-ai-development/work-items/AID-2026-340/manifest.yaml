acceptance_criteria:
  - id: AC1
    description: >-
      All five canonical documents disclose that the referenced Phase 3.5/3.6
      normative material is historical and unrestored, rather than presenting
      those references without restoration-status qualification.
    measurement: >-
      Run:
      git grep -nEi 'Phase 3[.]5|Phase 3[.]6' -- 05-memory-runtime/runtime-overview.md 09-security-governance/principal-actor-and-authorization-contract.md 09-security-governance/security-and-identity-overview.md 09-security-governance/global-forget-target-inventory-and-completion-evidence.md 09-security-governance/forget-retention-backup-and-erasure-policy.md
      and inspect the resulting reference sentences together with:
      git diff --unified=5 cc5d22b9126e00e3f93ffe71282554309908bc89..655ae3a7e098bac991a9d3e2084cb6f55a015670 -- 05-memory-runtime/runtime-overview.md 09-security-governance/
    expected_result: "Every in-scope normative reference is explicitly qualified as historical and unrestored."

  - id: AC2
    description: >-
      The five canonical documents and their docs/en/ and docs/zh-CN/
      counterparts contain synchronized corresponding sentence changes.
    measurement: >-
      Run:
      git diff --unified=3 cc5d22b9126e00e3f93ffe71282554309908bc89..655ae3a7e098bac991a9d3e2084cb6f55a015670 -- 05-memory-runtime/runtime-overview.md 09-security-governance/ docs/en/ docs/zh-CN/
      and compare each canonical document with its two corresponding mirrors.
    expected_result: "All fifteen documents contain the intended corresponding disclosure changes without an omitted or contradictory mirror."

  - id: AC3
    description: >-
      All six mirror documents designated for steward metadata contain the
      required steward field with the delegated operator attribution.
    measurement: >-
      Run:
      git grep -n -F 'steward: "user-authorized operator (delegated by account owner)"' -- docs/en/ docs/zh-CN/
      and inspect the six changed mirror files using:
      git diff --unified=3 cc5d22b9126e00e3f93ffe71282554309908bc89..655ae3a7e098bac991a9d3e2084cb6f55a015670 -- docs/en/ docs/zh-CN/
    expected_result: "Each of the six designated mirror files contains the exact required steward field."

  - id: AC4
    description: >-
      Any Markdown link targets affected by the documentation changes continue
      to resolve to existing repository paths; no nonexistent normative file
      is represented as restored or available.
    measurement: >-
      Run:
      git diff --unified=0 cc5d22b9126e00e3f93ffe71282554309908bc89..655ae3a7e098bac991a9d3e2084cb6f55a015670 -- '*.md'
      and inspect changed Markdown link destinations against the checkout
      using:
      git ls-tree -r --name-only 655ae3a7e098bac991a9d3e2084cb6f55a015670
    expected_result: "All affected link destinations are valid repository paths or are explicitly disclosed as unrestored historical references rather than presented as existing normative files."

  - id: AC5
    description: >-
      The change introduces no new normative requirements, security rules,
      runtime behavior, or executable implementation.
    measurement: >-
      Run:
      git diff --stat cc5d22b9126e00e3f93ffe71282554309908bc89..655ae3a7e098bac991a9d3e2084cb6f55a015670
      and:
      git diff --name-status cc5d22b9126e00e3f93ffe71282554309908bc89..655ae3a7e098bac991a9d3e2084cb6f55a015670
      and:
      git diff --unified=5 cc5d22b9126e00e3f93ffe71282554309908bc89..655ae3a7e098bac991a9d3e2084cb6f55a015670
    expected_result: "The diff contains only the fifteen declared existing Markdown files, sentence replacements, and six steward metadata additions; no new normative content or code changes are present."

