work_item_id: AID-2026-074
title: Make an unparseable work-item manifest fail a gate instead of a text scan
class: GATE/TEST
risk: R2
risk_rationale: >-
  The change is one read-only checker plus its tests and one workflow step. It reads
  committed manifests and parses them; it writes nothing, blocks nothing at runtime and
  changes no product code. The risk it addresses is not damage but false assurance: the
  repository's only manifest check is a regex over text, so a manifest that cannot be
  loaded reports clean. Four manifests are in that state at the commit this was written
  at, and one of them loses a provenance field silently rather than failing loudly.
