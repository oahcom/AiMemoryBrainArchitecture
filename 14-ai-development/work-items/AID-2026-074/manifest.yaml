acceptance_criteria:
  - id: AC1
    criterion: >-
      A check in scripts/ci parses every committed work-item manifest with a loader that
      rejects duplicate keys, and exits non-zero naming the path and the parser message on
      any failure.
    measurement: >-
      Run it against a tree holding one intentionally broken manifest; exit is 1 and the
      broken path appears in stderr.
  - id: AC2
    criterion: >-
      A duplicate key fails even where the default loader would accept the document.
    measurement: >-
      A fixture with related_prs twice: yaml.safe_load returns a document, the check exits 1.
  - id: AC3
    criterion: The check runs on every pull request, not only when invoked by hand.
    measurement: >-
      The workflow names the check in a run step and the check appears in that job's log.
  - id: AC4
    criterion: The four manifests the prompt names parse under the new check at the landing commit.
    measurement: The check exits 0 over the real tree.
  - id: AC5
    criterion: >-
      The check states what it does not verify, so a green result is not read as "the
      manifests are semantically correct".
    measurement: >-
      The module docstring names the excluded concerns; a reader can quote the limit without
      reading the code.

findings:
  - id: AID-2026-074-F1
    severity: P1
    statement: >-
      This is the second occurrence of the class, not the first. FIX-2026-P1-MANIFEST-YAML-001
      repaired four instances on 2026-11-19 and its own audit record states that no workflow
      wiring was added. The repair was correct and incomplete: nothing stopped the next four.
    feedback_destination: Delivery PR conversation.

  - id: AID-2026-074-F2
    severity: P1
    statement: >-
      The dangerous shape is the silent one. AID-2026-029 parses successfully under the default
      loader and drops related_prs: [356], the only record of the PR that carried its
      implementation. A checker built on yaml.safe_load alone would have declared that file
      correct.
    feedback_destination: Delivery PR conversation.

  - id: AID-2026-074-F3
    severity: P2
    statement: >-
      check_repository_hygiene.py reports manifests=49 violations=0 while four of those 49 do
      not load. The number is accurate about what it does; it is not evidence of parseability,
      and it is read as if it were.
    feedback_destination: Delivery PR conversation.

  - id: AID-2026-074-F4
    severity: P2
    statement: >-
      The four repairs were applied in the session that also registered this work item, before
      the check existed. That order is recorded here rather than presented as a clean sequence.
    feedback_destination: Delivery PR conversation.

