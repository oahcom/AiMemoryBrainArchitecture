  C2: "Flow-form `types:` without `edited` is a violation. Settled by a throwaway tree built from the fixture with `edited` removed, asserting exit 1, a message naming `edited`, and the `types:` line number."
  C3: "Flow-form `types:` with `edited` passes. Settled by the fixture itself, asserted exit 0 and no `::error::`."
  C4: "Block-form `types:` with `edited` passes. Settled by rewriting the fixture's `types:` key into a `- item` list and asserting exit 0. This is the anti-regression test for #1045's bug class: a guard that accepts only the flow form would reject a correct file."
  C5: "A missing `types:` key is a violation that names the key and `edited`. Settled by deleting the key from the fixture and asserting exit 1 with both strings in the message."
  C6: "Each new test fails with `AssertionError`, not a traceback and not an `ImportError`, when its rule is reverted. Settled by three reverts applied in isolation, run, captured and restored."
  C7: "The 12 tests already in the file are not weakened, renamed or deleted, and all pass unmodified. Settled by the suite running 16 tests with the same names plus four."
  C8: "`python scripts/check_session_evidence_workflow_shape.py` exits 0 on the unmutated repository. Settled by running it with no path argument."

