# ---------------------------------------------------------------------------
# Issue #1074. `Session Evidence` is a required context and its verdict is
# computed from `pr.body`, fetched live. The workflow declared `on:
# pull_request:` with no `types:`, so `edited` was not a trigger, so a body edit
# after a green run scheduled nothing and the green tick outlived the text it
# judged. Measured by the Issue on #1054 (run completed 05:36:07Z, edit
# 05:36:20Z, merged 05:37:29Z) and re-measured in its comments across 4 of 75
# merges.
#
# The guard checked the job graph only. It contained zero references to `on:`,
# `pull_request`, `types` or `trigger`, so one line added to the workflow was
# revertible in silence -- the same failure mode #1045 and #1058 report one
# layer down.
#
# What this does NOT close is stated in the prompt and the evidence: an edit
# that lands after the last run and before the merge still races the merge.
# ---------------------------------------------------------------------------

