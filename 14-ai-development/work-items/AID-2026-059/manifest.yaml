findings:
  - id: F1
    statement: "An earlier revision of this delivery was written against pytest and reported 74 passed. It could not land: the repository has no pytest (55 of 58 test files use unittest, none import pytest, and no pyproject.toml/pytest.ini/setup.cfg/tox.ini exists), and scripts/ci/check_test_reachability.py fails a test_*.py that no workflow executes. The suite was migrated to unittest and the workflow gained a self-test step. The 74-vs-57 difference is parametrize expansion, not lost tests: an AST comparison confirmed the 52 function names and their order are identical."
    measured_at: "176244a6"
    severity: informational
  - id: F2
    statement: "The pytest revision passed all 74 tests while two of them never executed the branch they named. test_prompt_sha256_mismatch_fails and test_prompt_byte_count_mismatch_fails set world['blob_text'] to a lambda returning the manifest for every path, so the validator failed at the evidence-section check before reaching check_11. Both asserted only 'exit != 0', so any failure counted. Disabling the SHA-256 comparison with 'if False:' left the suite green. This was not introduced by the unittest migration; the pytest revision survives the same mutation."
    measured_at: "176244a6"
    severity: material
  - id: F3
    statement: "Combination mutation exposed three pieces of dead code that single-function mutation does not find. check_04 and check_05 had identical bodies differing only in a location string and were called consecutively over the same path list, so the second could never fire. check_08's mode guard was unreachable because _validate_regular_file raises first. _validate_reference_scopes carried a 'canonical not in ctx.tree_by_path' guard already covered by the checks that run before it. All three were deleted and the suite stayed green."
    measured_at: "176244a6"
    severity: informational
  - id: F4
    statement: "Mutation sweep, re-measured rather than carried forward: 16 of 16 mutants killed, no survivor (compare truncation, 300-file limit, git-tree truncation, provenance enum, path-not-in-tree, absolute path, SHA-256 comparison, byte count, blob type, git mode, empty size, backslash, percent encoding, URL scheme, absent AI-assisted work value, non-YES/NO AI-assisted work value). The last two were previously unrecorded and are now covered: the absent-field mutant is killed by test_missing_pr_declaration_is_reported and the enum mutant by test_invalid_pr_declaration_value_is_reported. The earlier '14 of 14' figure was not reproducible as written."
    measured_at: "4d6a8255"
    severity: informational
  - id: F5
    statement: "The previously reported surviving mutant, the second PR-level 'YES requires evidence references' clause in check_02_pr_declaration_and_references, was not a test gap but unreachable code. check_01_pr_fields_and_issue_references raises the same condition first and, in this revision, the two copies carried different messages ('PR: YES requires evidence references' versus 'PR: YES requires at least one evidence path'). Because check_01 always raised first, deleting check_02's copy left the suite green and no test could have distinguished the two. The duplicate was deleted so the PR-level policy has one owner; a mutant at that location no longer exists to survive. test_yes_requires_refs was rewritten to a world whose only defect is the missing PR evidence — with check_01's guard removed the validator reports PRESENT — and it asserts the exact message rather than a nonzero exit."
    measured_at: "4d6a8255"
    severity: informational
  - id: F6
    statement: "The frozen contract requires every session_evidence entry to carry non-empty issue_refs, and check_09 requires every Issue named in issue_refs to map to a PR row whose status is YES. An Issue created before the policy effective time cannot map to YES: check_03 forces LEGACY_UNDECLARED with N/A. Together those two rules make a canonical entry impossible for any work item whose tracking Issue predates 2026-12-01T00:00:00Z, which is every work item that exists today. The validator already permits the resolution -- OD-A3 keeps PR-level evidence in its own scope and allows issue_refs to be empty -- and this manifest uses it: the entry below attributes its evidence at PR scope, and the Issue row stays LEGACY_UNDECLARED. Recorded rather than silently resolved because it is a gap between the frozen contract and the shipped validator, not a choice this work item is authorised to make."
    measured_at: "ebadbe84"
    severity: material
  - id: F7
    statement: "The first real pull request run returned 'MISSING: Cannot decode blob bytes: 14-ai-development/work-items/AID-2026-059/manifest.yaml'. gh_blob_bytes passed the API payload straight to base64.b64decode(..., validate=True), but the REST API wraps its base64 at 60 characters, so the content arrives containing newlines and validate=True rejects them. Consequence: every file larger than one line failed to decode, so the gate could never report PRESENT on any real pull request. The 59-test suite could not see it because support.make_blob encodes short fixtures with no wrapping -- the fixture never had the payload shape the API sends. Fixed by stripping whitespace before decoding, plus one test that wraps the payload at 60 characters, taken from the API response observed in the failing run. Reverting the fix fails that test and leaves the other 59 green, so the behaviour is pinned rather than incidentally covered. Found by the first real run, not by review: this is the calibration Issue #799 requires before required-context status is even proposed."
    measured_at: a5482776
    severity: material

  - id: F8
    statement: "The decode fix in F7 only takes effect from the base revision, because the workflow runs the validator it checks out from base, not the one in the pull request. #1001 carried the fix and still failed Session Evidence: its run at 00:37:53Z checked out the base revision e26262fb, which predates the fix, and produced the same 'Cannot decode blob bytes'. Merging #1001 as 0d0a2dd6 is what put the fix on main. That ordering is not a defect in the gate -- reading base is the security property -- but it means a validator fix can never certify the pull request that carries it, and the calibration evidence Issue #799 asks for has to come from a later pull request. Recorded here so the sequence is legible: first real run MISSING (base without the fix), merge, then the next run reads the fixed validator."
    measured_at: "0d0a2dd6"
    severity: informational

