work_item_id: AID-2026-059
title: Implement the AI session evidence gate specified by Issue #799, without adding it to required contexts

class: GATE/CI/TEST
risk: R1
risk_rationale: "One workflow file, one standard-library Python validator, and its unittest suite. No Rust, no transport, no storage, no credentials beyond the read-only GITHUB_TOKEN the runner already carries. The risk is not damage but false confidence: a gate that reports PRESENT over evidence it never actually read is indistinguishable from a gate that works, which is why the acceptance criteria are stated as mutation results rather than test counts."

security_scope: "None beyond a read-only repository token. The workflow declares contents/pull-requests/issues read, runs no untrusted PR code (it checks out the base revision), and reads the policy effective time from one workflow-file constant rather than from any file a reviewed PR can modify."

