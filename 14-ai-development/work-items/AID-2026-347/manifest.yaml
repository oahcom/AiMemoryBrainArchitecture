acceptance_criteria:
  - id: AC1
    description: >-
      An AID link that appears only inside an HTML comment or a fenced code
      block in INDEX.md is not counted as a registration by
      check_traceability.py.
    measurement: >-
      Run:
      python scripts/check_traceability.py --index-only
      after wrapping the AID-2026-340 row of
      14-ai-development/work-items/INDEX.md in an HTML comment.
    expected_result: "FAIL with ERROR T-04 for AID-2026-340/manifest.yaml (previously PASS)."

  - id: AC2
    description: >-
      Sanitisation preserves line count so that any later line-numbered
      diagnostic still points at the same line.
    measurement: >-
      Run:
      python scripts/test_check_traceability_sanitize.py
    expected_result: "6 tests pass, including test_line_count_is_preserved and test_sanitization_is_idempotent."

  - id: AC3
    description: >-
      A newly added Markdown file outside NORMATIVE_ROOTS fails
      check_bilingual_docs.py with the offending path named.
    measurement: >-
      Add reviews/fixture-new-normative.md on top of origin/main and run:
      BASE_SHA=origin/main HEAD_SHA=HEAD PR_BODY="BILINGUAL-MANIFEST: COMPLETE" python scripts/check_bilingual_docs.py
    expected_result: "exit 1 with ::error::reviews/fixture-new-normative.md: new Markdown file is outside NORMATIVE_ROOTS ..."

  - id: AC4
    description: >-
      Modified and deleted Markdown files outside NORMATIVE_ROOTS keep the
      previous NOTE-only behaviour.
    measurement: >-
      Modify an already committed reviews/ Markdown file and run the same
      command with BASE_SHA set to the commit that introduced it.
    expected_result: "exit 0, one NOTE line, gate PASS."

  - id: AC5
    description: >-
      No existing test regresses and no third-party dependency is added.
    measurement: >-
      Run:
      python scripts/test_check_traceability.py
      python scripts/test_check_bilingual_docs.py
      python scripts/test_check_bilingual_docs_outside_root.py
    expected_result: "41 + 27 + 7 tests pass; both scripts import only the standard library."

