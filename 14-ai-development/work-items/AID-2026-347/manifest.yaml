work_item_id: AID-2026-347
title: "Strip comments before INDEX.md AID-link matching and reject newly added Markdown outside governed roots"
class: GATE/TEST
risk: R2
risk_rationale: >-
  This change alters two enforcement gate scripts. check_traceability.py stops
  counting AID links that are inside HTML comments or fenced code, which turns a
  previously silent false registration into a blocking error. check_bilingual_docs.py
  turns a NOTE for newly added Markdown outside NORMATIVE_ROOTS into a blocking
  error, while modified and deleted files keep the existing NOTE. Both changes
  can only add failures, never remove one, and neither relaxes an existing check.
  No runtime, wire schema, product behaviour or normative requirement changes.
status: DISPATCHED
id_status: PROVISIONAL
sponsor: USER-PRINCIPAL-DELEGATED
accountable_owner: USER-PRINCIPAL-DELEGATED
acceptance_authority: NOT_ASSIGNED
attribution: "user-authorized operator (delegated by account owner)"
date: "2026-11-28"
repository: oahcom/AiMemoryBrainArchitecture
base_branch: main
base_commit_sha: "f0843a8f38a420883921cfda96b515204967f885"
tracking_issue: "#1540"

scope:
  summary: >-
    Close two gate-blindness defects. First, check_traceability.py matched AID
    links against the raw INDEX.md text, so an HTML-commented row still counted
    as a registration while check_repository_hygiene.py treated the same row as
    absent. A single module-level pure function now blanks HTML comments and
    fenced code without moving line numbers, and every consumer of the INDEX
    text uses it. Second, check_bilingual_docs.py downgraded every changed
    Markdown file outside NORMATIVE_ROOTS to a NOTE, so a newly added normative
    document could land in an excluded root and get both gates green. New files
    are now errors; modified and deleted files keep the NOTE.
  in_scope:
    - "scripts/check_traceability.py: add module-level sanitize_index_text() and route both index_text consumers through it."
    - "scripts/check_bilingual_docs.py: add module-level outside_root_markdown_paths() and outside_root_additions(); report newly added Markdown outside NORMATIVE_ROOTS as an error."
    - "scripts/test_check_traceability_sanitize.py: six regression tests for comment and fence stripping and for line-count preservation."
    - "scripts/test_check_bilingual_docs_outside_root.py: seven regression tests for the added/modified/deleted classification."
    - "Register the work item and its INDEX.md row."
  files_out_of_scope:
    - "scripts/ci/check_repository_hygiene.py and its comment handling."
    - "scripts/check_document_management.py."
    - "The contents of NORMATIVE_ROOTS, any baseline file, and any exemption list."
    - "Any new environment-variable switch."
    - "Crates, runtime behaviour, wire schemas and product semantics."
  change_boundary: >-
    Two gate scripts gain one sanitisation helper and one status-aware
    classifier, plus two new unittest files. No existing check is weakened; the
    only behaviour change is that inputs which previously passed silently now
    fail with a named path.

evidence:
  - "Issue #1540: Gate scripts accept commented-out INDEX registrations and skip newly added Markdown outside governed roots."
  - "Measured on origin/main f0843a8f3: commenting out the AID-2026-340 INDEX row makes check_traceability.py --index-only PASS before the fix and FAIL T-04 after it."
  - "Measured on origin/main f0843a8f3: a newly added reviews/fixture-new-normative.md makes check_bilingual_docs.py PASS before the fix and FAIL with the named path after it."
  - "Measured on the same base: a modified reviews/ file still produces only the NOTE and exit 0 after the fix."
  - "All four test files pass locally: 6 + 7 new tests, 41 existing traceability tests, 27 existing bilingual tests."

