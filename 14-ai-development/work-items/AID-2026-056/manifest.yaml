# Deliverables. Each is a claim a reader can check without trusting this file.
# ---------------------------------------------------------------------------

deliverables:
  - "counterpart() identifies a path that is itself a language mirror before entering the NORMATIVE_ROOTS branch, and resolves it to its sibling rather than to docs/<lang>/<path>."
  - "An embedded-bilingual predicate recognising cjk >= 100 and latin >= 1000 in one file, identical to the floor AID-2026-054 adopts. No second floor value is invented."
  - "Side-by-side pairing reuses side_by_side_partner() from scripts/check_bilingual_docs.py rather than a second pairing implementation."
  - "The baseline regenerated from 77 to the number the new predicate actually produces, as removals only and 0 additions, in the same commit. It starts at 77, not 81: measured, scripts/ci/baselines/bilingual-docs.txt has 77 entries, because #910 already removed the four that took it from 81. A deliverable reading 81 minus 66 leaves 15, which is neither the baseline nor the target."
  - "The gates.yml comment replaced with what the check now measures, instead of '81 normative paths lack an en/zh-CN counterpart'."
  - "At least one test per clause: mirror-not-asked-for-mirror, embedded floor inclusive at both boundaries, side-by-side recognised, and the eleven still reported. Eleven, not nine: AC1 requires set equality against eleven paths, so a test asserting nine would contradict the criterion it is supposed to support."

acceptance_criteria:
  - id: AC1
    text: "python3 scripts/check_bilingual_docs_full.py reports exactly 11 violations, and the reported set equals these eleven paths, listed in full because a criterion that points at a list it does not contain is not a criterion: 00-governance/reports/gov-doc-001-full-scan-2026-11-20.md; 06-memory-context/context-architecture.md; 06-memory-context/context-budget-and-sufficiency.md; 06-memory-context/context-edit-operations.md; 06-memory-context/context-manager.md; 06-memory-context/context-reconciliation.md; 06-memory-context/context-versioning.md; 06-memory-context/phase-3.8.6-g-review-storage-serialization-anchor.md; 08-bmcp-protocol/phase-3.8.25-h-applied-delivery-evidence-hardening-addendum.md; 08-bmcp-protocol/phase-3.8.26-h-applied-delivery-evidence-csubmitoutcome-join-addendum.md; 13-engineering-decisions/technology-architecture-blueprint.md. Set equality, not an approximate count. Measured at ebadbe84 by diffing the scan's 77 reported paths against the embedded-bilingual predicate (cjk >= 100 and latin >= 1000): 66 embedded, these 11 real, 66 + 11 = 77. (Restated by ERRATUM-01, then by independent review REVIEW-01 finding B2: the prompt's 9 was measured at d40d4e09 before #910 taught the scan to see 08-bmcp-protocol, which added two paths. Corrected again at REVIEW-03 finding D3: this criterion previously anchored on 'the eleven paths enumerated in ERRATUM-01.md section 2', and ERRATUM-01 section 2 enumerates two of them, so the set equality was uncheckable as written.)"
  - id: AC2
    text: "The baseline diff is 66 removals and 0 additions, and the removed set is exactly the 66 embedded-bilingual entries. An addition, or a removal outside that class, fails this criterion. (Was '72 removals = 6 side-by-side + 66 embedded'. Review REVIEW-01 finding B2: none of the six side-by-side paths is in the baseline at 8e489ec1, so they cannot be removed from it; 77-72=5 matches neither the old 9 nor the corrected 11. ERRATUM-01 AC2' says 66; that is the only figure consistent with AC1.)"
  - id: AC3
    text: "The three mirror paths 02-domain-model/phase-2-domain-extension.zh-CN.md, 06-memory-context/context-implementation-coverage.zh-CN.md and 07-agent-integration/adapter-capability-tiers.zh-CN.md are no longer violations, and a .zh-CN.md mirror created in a test fixture is not asked for a mirror of itself. (Already true at 8e489ec1 — #910 made all 64 mirrors outside 14-ai-development pair. This criterion is a regression guard, not a task; it cannot distinguish 'done' from 'never needed doing'.)"
  - id: AC4
    text: "13-engineering-decisions/technology-architecture-blueprint.md (0 CJK, 49758 bytes as a git blob at 8e489ec1, LF line endings) is still reported as a violation. A predicate that resolves it is a predicate that accepts anything. (Byte count corrected twice. 49666 from the prompt matches no version in git history; 50488, which the first review substituted, is the same blob checked out with CRLF — 49758 + 730 line terminators. A byte count that changes with a checkout setting is not a reproducible anchor, so the criterion now names the blob size and the line-ending convention it was measured with.)"
  - id: AC5
    text: "Four assertions, not two. Negative side: a file with cjk = 99 and latin = 5000 is still a violation, and a file with cjk = 100 and latin = 999 is still a violation. Positive side: a file with cjk = 100 and latin = 1000 exactly is resolved, and a file with cjk = 101 and latin = 1001 is resolved. All four asserted in tests, because an inclusive floor fails silently on either side. (Review REVIEW-01 finding B3: the original listed only the two negative cases while claiming both sides, so a predicate that resolves nothing passed it in full. The predicate does not exist at 8e489ec1 — grep for 1000 in either script returns nothing — which is why the positive side could be omitted without any test failing.)"
  - id: AC6a
    text: "This work item does not modify NORMATIVE_ROOTS. The derived-root guard introduced by #910 still exits 0."
  - id: AC6b
    text: "Withdrawing AC6 grants no authority to change NORMATIVE_ROOTS. The pre-#910 value is not restored, and nothing here widens this work item's file scope. If the roots need changing, that is a different work item with its own authorisation."
  - id: AC7
    text: "scripts/ci/gate_ratchet.py with this baseline and this command exits 0 and prints baseline=11 current=11 regressions=0 fixed=0. A green ratchet over a stale baseline does not satisfy AC1. NOTE the floor this criterion does not cover, from review REVIEW-01 finding M4: gate_ratchet.py treats an empty baseline as a pass even when the command crashes (measured: empty baseline + a command that exits 9 -> regressions=0 fixed=0 PASS exit 0). Since this work item regenerates that baseline, an empty output would leave the required check permanently green. The implementer must assert the regenerated baseline is non-empty and has exactly 11 lines."
  - id: AC8
    text: "python3 -m unittest tests.test_check_bilingual_docs_full passes and gains at least one test per deliverable clause, covering the eleven AC1 paths including the two 08-bmcp-protocol records. (Module path corrected by REVIEW-01 finding B4: the original said scripts.test_check_bilingual_docs_full, which does not exist — the file is tests/test_check_bilingual_docs_full.py and the command raised ModuleNotFoundError. Also: the pre-existing tests mention neither NORMATIVE_ROOTS nor .zh-CN.md siblings, which is why the defects survived.)"
  - id: AC9
