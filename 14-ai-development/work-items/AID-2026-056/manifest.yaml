work_item_id: AID-2026-056
title: Make the full bilingual scan agree with the ruling that already governs its contents

class: GATE/CODE/TEST
risk: R2
risk_rationale: "Changes the predicate a required repository-wide gate uses to decide whether a document has a counterpart, and shrinks its frozen baseline from 77 to 11. The baseline is a shrink-only ratchet, so a wrong predicate does not fail loudly: it either freezes entries that should be enforced, or resolves entries that are not bilingual and removes them from enforcement permanently. Acceptance criteria AC5 and AC2 exist so the floor is asserted from both sides and a predicate that resolves everything cannot pass. The predicted 11 is falsifiable on purpose. Restated at 8e489ec1: the 77-entry baseline splits into 66 embedded (cjk>=100 and latin>=1000) and 11 real, so AC1 and AC2 are complementary rather than two independent guesses."

security_scope: "None. No Rust, no transport, no authorization path, no storage. One pairing predicate and one embedded-bilingual predicate in scripts/check_bilingual_docs_full.py, the baseline that follows from them, one workflow comment, and the tests for the two predicates."

# security_scope answers "what can be attacked". It does not answer "does this
# need independent review". Reviewer finding (M3): the two were being conflated.
# This work item's risk is check silence, not compromise -- its own
# risk_rationale says "a wrong predicate does not fail loudly", which is a
# statement about a required gate shrinking without a signal, not about an
# attacker. security_scope: None is therefore correct and is not a reason to
# skip independent review; the reason review was required is R2 plus the
# shrink-only ratchet, and independent_reviewer below records that it happened.


# Machine-readable authorisation. Added because independent review (REVIEW-01
# finding B5) found the write boundary existed only as prose inside
# security_scope, which describes attack surface and cannot be checked.

authorization:
  implementation_write: "NOT_GRANTED - this manifest registers the work; no file has been committed by the registering session"
  gate_behaviour_change: "GRANTED by OD-18 - the pairing predicate and the embedded-bilingual predicate in scripts/check_bilingual_docs_full.py are the subject of this work item"
  baseline_content_change: "GRANTED-FOR-SHRINK-ONLY - AC2 authorises exactly 66 removals and 0 additions. A regenerated baseline with an addition, or with a removal outside the embedded-bilingual class, fails AC2."
  allowlist_change: "NOT_APPLICABLE"
  root_membership_change: "NOT_GRANTED - AC6a asserts NORMATIVE_ROOTS is not modified; AC6b states that withdrawing AC6 grants no authority to change it. GAP-26 is a different work item."
  workflow_comment_change: "GRANTED - deliverable 5 replaces the gates.yml comment that still says 81 normative paths lack a counterpart. The comment is prose for readers, not a gate input; if it ever becomes one, this permission does not cover that."

scope:
  files_to_create: []
  files_to_modify:
    - scripts/check_bilingual_docs_full.py
    - scripts/ci/baselines/bilingual-docs.txt
    - tests/test_check_bilingual_docs_full.py
    - .github/workflows/gates.yml
  files_not_to_touch:
    - scripts/check_bilingual_docs.py
    - scripts/bilingual-baseline.txt

