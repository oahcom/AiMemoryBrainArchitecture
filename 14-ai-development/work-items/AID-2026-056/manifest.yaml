work_item_id: AID-2026-056
title: Make the full bilingual scan agree with the ruling that already governs its contents

class: GATE/CODE/TEST
risk: R2
risk_rationale: "Changes the predicate a required repository-wide gate uses to decide whether a document has a counterpart, and shrinks its frozen baseline from 81 to 9. The baseline is a shrink-only ratchet, so a wrong predicate does not fail loudly: it either freezes entries that should be enforced, or resolves entries that are not bilingual and removes them from enforcement permanently. Acceptance criteria AC5 and AC2 exist so the floor is asserted from both sides and a predicate that resolves everything cannot pass. The predicted 9 is falsifiable on purpose."

security_scope: "None. No Rust, no transport, no authorization path, no storage. One pairing predicate and one embedded-bilingual predicate in scripts/check_bilingual_docs_full.py, the baseline that follows from them, one workflow comment, and the tests for the two predicates."

status: DISPATCHED

