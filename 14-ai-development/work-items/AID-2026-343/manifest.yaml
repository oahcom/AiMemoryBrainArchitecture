work_item_id: AID-2026-343
title: "Extend DM-12 for additional mirrors and source-less bilingual groups"
class: GATE/TEST + DOC/GOVERNANCE
risk: R1
risk_rationale: >-
  The work extends a repository-wide governance gate and its published
  metadata contract. Incorrect closure logic could accept an undeclared
  mirror or incorrectly reject a valid source-less group. The change must
  preserve fail-closed behavior and is covered by positive and negative
  fixtures, schema/gate agreement, and the existing document-management
  test suite.
status: IN_PROGRESS
id_status: PROVISIONAL
sponsor: USER-PRINCIPAL-DELEGATED
accountable_owner: USER-PRINCIPAL-DELEGATED
acceptance_authority: "Owner acceptance not recorded"
attribution: "user-authorized operator (delegated by account owner)"
date: "2026-11-28"
repository: oahcom/AiMemoryBrainArchitecture
base_branch: main
base_commit_sha: "b51da8c0d4a58727c5a0d407ee76675f71648797"

scope:
  objective: >-
    Extend DM-12 to support additional classified mirrors beyond the en and
    zh-CN slots, and explicit closed mirror groups that genuinely have no
    authoritative source, without relaxing existing group-closure,
    classification, language-root, metadata-parity, or canonical-authority
    checks.
  accepted_shapes:
    - "bilingual_counterpart.mirrors: sequence of additional mirror paths"
    - "source: NO_AUTHORITATIVE_SOURCE plus non-empty source_absence_reason"
  constraints:
    - Every additional mirror must exist and carry document_metadata.
    - Every additional mirror must declare the same authoritative source.
    - The source must list every mirror that names it.
    - listed_by_source must merge en, zh-CN, and mirrors.
    - An undeclared third mirror remains an error.
    - Every source-less group member must declare the sentinel and the same non-empty reason.
    - Every source-less group member must list every other member.
    - A source-less group must contain at least two members.
    - Inconsistent domain, role, or authority.normative_status remains an error.
    - An isolated mirror remains an error.
    - An unclassified document remains an error.
    - Preserve the existing source-is-a-mirror rejection.
    - Preserve the existing single-Canonical-per-group rule.
    - No change to the four AID-2026-320 documents.
    - No new workflow, job, required context, or branch-protection change.
    - No third-party dependencies.

