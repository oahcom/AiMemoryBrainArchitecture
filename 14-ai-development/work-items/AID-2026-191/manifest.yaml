scope:
  objective: >-
    Close the defect where check_repository_hygiene.py skipped new-file admission without a
    --base/--head pair and still printed the same "passed" line a full run prints, while CI ran
    that same script twice, once with the range and once without.
  changes:
    - path: "scripts/ci/check_repository_hygiene.py"
      detail: >-
        An unqualified invocation now prints "Repository new-file admission SKIPPED (new-file
        admission requires --base and --head).", emits the existing INCOMPLETE error annotation
        and exits 2 before any repository work. The head-tree half (prohibited paths, INDEX
        membership, manifest consistency) stays reachable but must be requested by name with the
        new --head-tree-only flag, whose summary says "New-file admission SKIPPED" instead of
        claiming a pass. --head-tree-only combined with --base/--head is refused. CHECK_VERSION
        moves 2026-11-24.8 -> 2026-11-27.1 with a comment recording that this is a contract change
        rather than an allowlist change, so a reader can tell an old silent-skip PASS from a new
        one.
    - path: "scripts/test_check_repository_hygiene.py"
      detail: >-
        Four tests added: unqualified run exits 2 with the SKIPPED line and never prints the old
        pass line; --head-tree-only exits 0 and reports the skipped half; --head-tree-only still
        rejects a prohibited path with exit 1; --head-tree-only plus a range exits 2. The 27
        existing head-tree-only call sites now name the mode explicitly instead of relying on the
        removed default, and the three manifest-consistency assertions carry the new version.
    - path: ".github/workflows/repository-hygiene.yml"
      detail: >-
        The duplicated invocation pair collapses to one step, "Check committed repository hygiene
        and new-file admission", which supplies --base/--head from the same expressions the old
        admission step used. Job id and job display name unchanged; steps 18 -> 17.
    - path: "14-ai-development/work-items/AID-2026-191"
      detail: >-
        This registration set: manifest, evidence, prompt snapshot and session evidence.
    - path: "14-ai-development/work-items/INDEX.md"
      detail: "One appended row."
  untouched:
    - "is_allowed_new_path, the allowlist, ROOT_SCRATCH_PREFIXES and every admission rule"
    - "check_new_paths and the decision logic taken when --base and --head are both present"
    - "check_prohibited_head_paths, check_index_membership, check_work_item_manifest_consistency"
    - "every job id, job display name and the sixteen declared required contexts"
    - "scripts/ci/check_test_reachability.py and every other checker"
decision:
  question: >-
    Refuse the unqualified run in the script, or leave the script alone and only pass --base/--head
    in CI?
  chosen: refuse in the script
  reason: >-
    Supplying the range in CI fixes the one caller that exists today and leaves the script able to
    print a pass for admission it did not run for every other caller: the 27 self-tests, a local
    operator running the gate before a push, and any step added later by a copy of the old line.
    The defect is the script's output contract, not the workflow's env block. Refusing at the
    source is also the smaller change in behaviour terms: the only invocation that changes result
    is the one that was lying.
  cost_accepted: >-
    The head-tree-only mode gains a flag, and the 27 tests that used the implicit default name it.
    Exit 2 without a range means a bare local invocation no longer validates the denylist alone;
    --head-tree-only is the replacement and is covered by tests, so the capability is kept rather
    than deleted.
