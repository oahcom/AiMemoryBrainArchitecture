work_item_id: AID-2026-191
title: >-
  Stop the repository-hygiene gate reporting a pass for new-file admission it did not run, by
  refusing an unqualified invocation (exit 2, SKIPPED) and making the CI job supply --base/--head
  in its one remaining invocation
class: GATE/TEST
risk: R1
risk_rationale: >-
  One checker's command-line contract and one required job's step list. The admission rules, the
  allowlist, the denylist, the INDEX-membership rule and the manifest-consistency rule are not
  touched, no job is added, renamed or removed, no required context name changes, and the change
  makes a gate stricter rather than weaker: the only path that used to print a pass without
  performing admission now exits 2. The blast radius is a caller that omitted the range, and there
  is exactly one such caller in the tree (the step this change rewrites).
