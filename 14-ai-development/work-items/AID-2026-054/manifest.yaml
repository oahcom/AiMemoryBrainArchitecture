work_item_id: AID-2026-054
title: Make Shape 3 root-agnostic, and give both bilingual predicates a floor

class: GATE/CODE/TEST
risk: R2
risk_rationale: "Changes the predicate a repository-wide gate uses to decide whether a document is bilingual, and regenerates the frozen baseline from 77 to 11. The baseline is a shrink-only ratchet, so a wrong predicate does not fail loudly - it either freezes entries that should be enforced, or resolves entries that are not actually bilingual and removes them from enforcement forever. The risk is not in the edit; it is in the predicate being subtly one-sided. Acceptance criteria 3 through 7 exist so that each one-sided case is asserted against rather than merely not observed."

security_scope: "None. No authorization path, no Forget path, no storage engine, no transport, no Rust. The change is two predicates and one guard condition in scripts/check_bilingual_docs.py, plus the baseline that follows from them."

