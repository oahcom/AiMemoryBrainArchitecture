findings:
  - id: AID-2026-054-F1
    severity: P1
    feedback_destination: "Delivery PR conversation. Register 015's M5 mutation deleted the root-name guard alone and measured 77 -> 77, from which it concluded the guard has no payload. The conclusion was wrong in a way that is easy to reproduce and easy to miss: the 58 files fail the english.is_file() precondition, not the root name, so the guarded branch is never reached. A guard that is never reached measures zero whether it is present or absent. The prompt states both variants so the implementer does not repeat the inference."
  - id: AID-2026-054-F2
    severity: P1
    feedback_destination: "Delivery PR conversation. Variant B and variant C both measure 11, so the tree cannot distinguish them today. They are not equivalent: B accepts a file with 100 CJK characters and no English as bilingual, which is the same one-sided-predicate defect as register 013 §3.1 applied to the embedded shape. Only C survives a Chinese-only document being committed tomorrow. The identical measurement is recorded as identical rather than presented as agreement, because 'two predicates score the same on today's data' is a statement about the data."
  - id: AID-2026-054-F3
    severity: P1
    feedback_destination: "Delivery PR conversation. The baseline shrink is irreversible in practice. After 66 entries leave scripts/bilingual-baseline.txt, nothing records that they were once considered gaps, and re-adding any of them is an error under the ratchet. A predicate that is wrong in the permissive direction would permanently stop enforcing 66 documents, and the ratchet would read that as success. Acceptance criterion 2 (technology-architecture-blueprint.md must remain a gap) and criterion 8 (all 86 pairs still accepted) are the two edge controls that make a wrong predicate visible."
  - id: AID-2026-054-F4
    severity: P2
    feedback_destination: "Delivery PR conversation. Whether 13-engineering-decisions belongs in NORMATIVE_ROOTS at all is not decided by this work order. The ruling keeps it there and makes the gate recognise its files; if the root is later moved out of scope, those 57 entries become irrelevant rather than resolved, and the baseline shrink recorded here would look like an improvement that never happened. The membership question is the document owner's, per the ruling's §6."
  - id: AID-2026-054-F5
    severity: P2
    feedback_destination: "Delivery PR conversation. test_gate_normative_roots.py fails 3 tests and errors on 21 at main, before this change. They are Windows temp-path assertion mismatches and are unrelated, but they mean the gate's own regression suite is not green, so a new failure in that suite would be hard to attribute. Hard constraint 5 forbids touching them and requires reporting any change in the count. The bilingual gate therefore has no trustworthy end-to-end regression net today; that gap is real and is not created by this work order."

notes:
  - "The floor of 100 CJK / 1000 Latin is calibrated, not preferred. All 86 accepted pairs clear it by a factor of at least four, and a Chinese-only or English-only document fails it. The number matters less than the fact that it is two-sided."
  - "13-engineering-decisions/technology-architecture-blueprint.md is 0 CJK in 49666 bytes. It is the only file in its root that is genuinely single-language, and it is the control that proves the predicate is not simply accepting everything."

