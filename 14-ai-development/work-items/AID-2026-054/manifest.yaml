deliverables:
  - "Shape 3 no longer scoped to 14-ai-development, and no longer gated on docs/en existing - embedded bilingual is a single-file shape and has no mirror by definition."
  - "A predicate that requires both scripts in quantity in one file: cjk >= 100 and latin >= 1000, counted as ASCII alphabetic characters only. _carries_chinese() is kept, because the mirror shape still uses it."
  - "The side-by-side predicate gets the same floor: neither file empty, the pair not the same file twice, and cjk >= 100 and latin >= 1000 across the pair rather than in each file."
  - "side_by_side_partner() made symmetric, with the three-file case resolved deterministically and the choice written down in the source."
  - "The baseline regenerated from 77 to 11 entries in the same commit, as 66 removals and 0 additions. 13-engineering-decisions/technology-architecture-blueprint.md stays in it."
  - "One test per one-sided case: CJK-only file rejected, Latin-only file rejected, zero-byte partner rejected, pair of two English files each carrying one CJK character rejected, partner() symmetry asserted including the three-file case."
  - "The count of 86 accepted pairs asserted rather than sampled, so a floor set too high fails loudly instead of quietly dropping real pairs."
  - "python -m unittest scripts.test_check_bilingual_docs only. The 3 failures and 21 errors already present in test_gate_normative_roots.py at main must neither grow nor be fixed - they are Windows temp-path assertions, unrelated, and out of scope."

