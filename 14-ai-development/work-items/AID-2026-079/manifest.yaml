work_item_id: AID-2026-079
title: Pin the gate's own error paths with four controlled fault-injection cases
class: GATE/TEST
risk: R2
risk_rationale: >-
  Tests only: one test module gains one function, and no production file is touched. The risk it
  addresses is false assurance. The four cases drive scripts/check_document_management.py's own
  failure paths by patching one seam each, and a fault-injection test that patches too much
  produces the expected diagnostic while proving nothing; the positive assertions in each case
  exist to refuse that shape. The residual risk is the second-order one: a case that passes but
  no longer bites is indistinguishable from one that does, which is why the counterfactual in
  AC1 is an acceptance criterion and not a note.
