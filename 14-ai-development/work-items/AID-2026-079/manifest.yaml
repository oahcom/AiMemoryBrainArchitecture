acceptance_criteria:
  - id: AC1
    criterion: >-
      A git spawn failure inside the incremental changed-path selection is refused by the caller
      with its own diagnostic, not raised as a traceback, and the case fails when that refusal is
      removed.
    measurement: >-
      Baseline measurement on commit 229c0a6b51f4c761ed969337f6ddf7d0bbbb7d0c, dated 2026-11-27,
      with the same test and gate blobs on both platforms. Windows 11 / Python 3.12: command
      `python scripts/test_check_document_management.py`, exit 0, 371/371 passed and one
      registered T68c skip (`1 skipped, 1 registered of 5 allowed`). Ubuntu latest / required
      context `GOV-DOC-002 metadata checks`: command
      `python3 scripts/test_check_document_management.py`, exit 0, 372/372 passed, where T68c
      executes and the suite emits no skip summary. The counterfactual is measured on Windows on
      the same tree: neutralising `except OSError` in `git()` to `except ZeroDivisionError` and
      restoring the file afterwards makes the command exit 1 with 370/371 passed and exactly
      `[FAIL] T92a git() spawn failure is refused by the caller, not raised`. The corresponding
      Ubuntu counterfactual, 371/372, is arithmetic only and not a measurement: one successful
      T92a case is removed while the denominator remains 372. These are commit- and
      platform-scoped observations, not timeless suite totals.
  - id: AC2
    criterion: >-
      A governed path that cannot be resolved while the target set is built leaves a DM-01
      problem AND stays out of the target list.
    measurement: >-
      Both halves asserted in the same case, because either alone is satisfiable by a wrong
      implementation.
  - id: AC3
    criterion: >-
      A governed document that cannot be read while the verdict is decided is reported against its
      path rather than raised.
    measurement: >-
      The case asserts the refusal names the path and that no traceback reaches the output.
  - id: AC4
    criterion: >-
      A Path.is_file failure during collection does not stop the walk, does not change
      collect_governed()'s result, and does not stop other paths from reaching the real
      implementation.
    measurement: >-
      Four assertions in the case: the walk survives, the collected set is unchanged before and
      after, one untargeted path is seen by the real is_file, and Path.is_file is the original
      attribute afterwards.
  - id: AC5
    criterion: >-
      Every case restores its patch in a finally, and the suite is green on the rebased tree with
      main's restored guards present and the registered skip set unchanged.
    measurement: >-
      Operator-supplied baseline measurements dated 2026-11-27 on commit
      229c0a6b51f4c761ed969337f6ddf7d0bbbb7d0c. Windows 11 / Python 3.12, command
      `python scripts/test_check_document_management.py`: exit 0, 371/371 passed, and
      `1 skipped, 1 registered of 5 allowed`, namely T68c. Ubuntu latest / required context
      `GOV-DOC-002 metadata checks`, command `python3 scripts/test_check_document_management.py`:
      exit 0, 372/372 passed, where T68c executes and no suite-level skip summary is emitted.
      T93a-T93h run in the same invocation on both platforms. The permitted skip remains T68c and
      the one-case total difference is caused by the existing geteuid/root conditional. The
      command and the commit are part of the measurement: totals must be remeasured when the
      tested tree changes.

findings:
  - id: F1
    severity: MEDIUM
    statement: >-
      The gate's own failure paths were untested. The suite exercised the gate's verdicts over
      documents, not what the gate does when its own inputs fail, so a change from "refuse with a
      diagnostic" to "raise a traceback" would have been silent.
    evidence: >-
      Before this branch the file contained no case patching subprocess.run, Path.resolve or
      Path.is_file; the four cases are the first.
  - id: F2
    severity: MEDIUM
    statement: >-
      A fault-injection case can be written so that it proves nothing: patching a seam that
      swallows every call yields the expected diagnostic without exercising the branch under test.
    evidence: >-
      Each case therefore asserts that the inputs it did not target still reached the real
      implementation, e.g. T92a asserts `git log -1 --format=%H` returns a 40-character SHA while
      the seam is patched.
  - id: F3
    severity: LOW
    statement: >-
      The branch was authored against 29eea143 and 575cf3f4 rewrote the same file afterwards, so
      the pull request was unmergeable on a textual conflict that is not a semantic one.
    evidence: >-
      One conflict region: main's run_restored_guards() against this branch's
      run_fault_injection(). Resolved by keeping both; the diff is +282 on one file.
  - id: F4
    severity: LOW
    statement: >-
      An earlier revision of the pull request body argued that no Work Item ID could be supplied.
      That argument was false.
    evidence: >-
      PR #1070 merged at c7e87f8f with the validator accepting `Work Item ID | NONE` only when
      `AI-assisted work | NO`. This pull request is AI-assisted, so the field is required and
      AID-2026-079 is registered here; the body now says so instead of repeating the argument.

