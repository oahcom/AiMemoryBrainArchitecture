work_item_id: AID-2026-081
title: Make the GOV-DOC-001 ratchet comment's count match its baseline, and check it
class: GATE/TEST
risk: R2
risk_rationale: >-
  One corrected comment and one added test in an already-executed test module. No gate
  behaviour changes: the ratchet keeps the same baseline, and it stays allowed to be red on
  main by design. The risk addressed is false assurance rather than damage. The workflow
  comment stated 81 while the baseline handed to the ratchet held 77, and nothing compared
  the two, so the number could rot unobserved (issue #1081). The added test compares two
  counts and never runs the wrapped gate, so it cannot inherit the ratchet's red state.
status: DISPATCHED

