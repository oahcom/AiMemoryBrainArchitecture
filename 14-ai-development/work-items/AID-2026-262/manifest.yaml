work_item_id: AID-2026-262
title: >-
  Extend the required document-management gate to enforce serialized,
  merge-time uniqueness across work-item directory, manifest and INDEX identities
class: GATE/TEST
risk: R1
risk_rationale: >-
  Extends the already-required GOV-DOC-002 metadata-check job and its landed
  uniqueness checker. The change expands identity detection, fixes the test
  harness interpreter selection, refreshes main immediately before the
  uniqueness decision, and serializes executions of the required job.
  It does not add a second independent workflow or change branch protection.
  The shared Actions concurrency group prevents simultaneous executions of
  this job, while strict up-to-date protection requires a stale PR branch to
  update before merge. GitHub concurrency is not FIFO and is not an atomic
  merge transaction; the required check must succeed on the current PR head.
