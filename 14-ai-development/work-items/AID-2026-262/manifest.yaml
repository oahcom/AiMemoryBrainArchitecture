notes:
  - >-
    Issue #1341 was previously claimed at:
    https://github.com/oahcom/AiMemoryBrainArchitecture/issues/1341#issuecomment-7209107958
  - >-
    AID-2026-242 was initially reserved for #1341 but became occupied on main
    through unrelated PR #1297. The aid-ledger correction at 79c622cc
    invalidated that reservation and assigned AID-2026-262.
  - >-
    AID-2026-279 is the competing implementation that landed through PR #1372.
    Its record and evidence remain historical and unchanged. This work item
    extends the landed scripts/ci checker and required document-management job.
  - >-
    The supplied test result for the landed harness is five failures with
    return code 9009 because its subprocess launcher hardcodes python3.
    The proposed correction uses sys.executable.
  - >-
    The earlier branch's 13/13 result and real-tree PASS apply only to its
    separate checker and are not evidence that the landed checker extension
    or the corrected landed harness passes.
  - >-
    The uniqueness decision is placed inside the existing required
    GOV-DOC-002 metadata-check context. No new branch-protection context
    is requested.
  - >-
    A static job-level concurrency group serializes executions of this
    required job across PRs. GitHub concurrency is not FIFO; a superseded
    pending run has no success and cannot be counted as a passing result.
  - >-
    Strict up-to-date protection is measured true. A PR whose branch is
    behind main must update before merge; the uniqueness job then refreshes
    origin/main and checks the exact current PR head.
  - >-
    No GitHub Actions run, independent review, merge or natural-person
    Owner acceptance is claimed. The checker tests passed locally (13/13),
    and repository hygiene, traceability, test reachability and line-ending
    checks passed locally at c805544a21ba530ef8304bb3eacd8657ad83eb73.
