scope:
  objective: "Put the work-item uniqueness decision at the merge boundary: serialise broker runs, re-enumerate ready pull requests, judge each candidate against the main it will land on, and merge only the exact head that was judged."
  deviation: >-
    The dispatching instruction asked for a new judgement script. main already
    carries scripts/ci/check_work_item_uniqueness.py (AID-2026-279, PR #1372)
    with that contract, wired into the required GOV-DOC-002 job. A second
    checker would reproduce the duplicate-identity defect this issue reports and
    overwriting the merged file would break the wired caller, so the broker calls
    the merged checker and adds the missing serialization half instead.
  files_changed:
    - ".github/workflows/work-item-merge-broker.yml"
    - "scripts/ci/test_work_item_merge_broker.py"
    - "14-ai-development/work-items/AID-2026-262/manifest.yaml"
