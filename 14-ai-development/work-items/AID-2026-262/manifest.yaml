work_item_id: AID-2026-262
title: "Serialized merge broker for work-item uniqueness at the merge boundary"
class: GATE/TEST
risk: R1
risk_rationale: "Adds one GitHub Actions workflow and one test file. It reuses the already-merged uniqueness checker instead of adding a second copy, adds no required context, changes no branch-protection setting, and merges nothing by itself until a pull request carries the merge-ready label. The residual risk is the one the evidence records rather than hides: the broker cannot make itself the only path into main, so the serialization row stays NOT ACQUIRED and the workflow, the work-item evidence and the pull-request body all say BROKER_SERIALIZATION_UNPROVEN."
