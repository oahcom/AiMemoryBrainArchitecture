    feedback_destination: "Delivery PR conversation. The dispatched spec asked for a test rejecting a retry whose predecessor belongs to a different delivery, but DeliveryAttempt::retry takes only the predecessor, so the callee cannot observe a second delivery. The delivered test forks the chain from one predecessor and asserts the fork is rejected with ContextMismatch. Recorded rather than silently narrowed."
