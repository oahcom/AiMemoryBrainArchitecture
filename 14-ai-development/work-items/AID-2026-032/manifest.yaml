scope:
  objective: >-
    Replace snapshot-baseline attribution in the CI admission path with a
    Git-verified comparison of session-identity violations in the current
    checkout against the specified target-base tree. Existing base debt is
    absorbed; only findings introduced by the candidate block.
  changes:
    - path: "scripts/ci/check_session_identity.py"
      detail: >-
        Add --diff-base REF. Resolve and verify REF as a commit in a non-shallow
        Git worktree, require its tree and merge base, archive only the
        work-items subtree, and compare current violation identities against
        base violation identities. The mode never reads, writes, or requires
        the snapshot baseline. New findings print one NEW: line each and exit
        1; empty increment exits 0; unverifiable refs and Git state exit 2.
        Current SESSION_YAML_INVALID always fails; base YAML errors are
        disclosed as existing debt and are not counted as increments.
        --diff-base is mutually exclusive with baseline mutation modes.
    - path: "scripts/ci/test_check_session_identity.py"
      detail: >-
        Add 13 test_diff_* cases for empty and nonempty increments, invalid
        refs, shallow and non-Git roots, base-only debt, repairs, current and
        base YAML errors, missing baseline independence, argument exclusion,
        and M1/M2 mutation detection. Preserve existing snapshot-mode tests.
    - path: ".github/workflows/repository-hygiene.yml"
      detail: >-
        Add diff-mode self-tests and a pull_request-only session identity step
        inside the existing Repository hygiene (hard gate) job. Keep the
        required job id and name unchanged; do not declare a new required
        context. The step uses github.event.pull_request.base.sha.
    - path: ".github/workflows/session-identity-ratchet.yml"
      detail: >-
        Delete the independent non-required workflow. Its checker execution is
        replaced by a step inside the existing required job, not by a new
        required context.
    - path: "14-ai-development/design/session-identity-ratchet.md"
      detail: "Append the Chinese decision and migration rationale as §12."
    - path: "14-ai-development/design/session-identity-ratchet.en.md"
      detail: "Append the English decision and migration rationale as §12."
    - path: "14-ai-development/design/session-identity-ratchet.zh-CN.md"
      detail: "Append the Chinese counterpart of §12."
    - path: "14-ai-development/PR-GOVERNANCE-001.md"
      detail: >-
        Clarify below the unchanged required-context declaration that Session
        identity ratchet is not required and enforcement is a step inside
        Repository hygiene (hard gate).
    - path: "14-ai-development/work-items/AID-2026-032/"
      detail: "Register this decision, implementation, evidence and session provenance."
    - path: "14-ai-development/work-items/INDEX.md"
      detail: "Append the AID-2026-032 registration row."
