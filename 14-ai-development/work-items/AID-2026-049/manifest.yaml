findings:
  - id: AID-2026-049-F1
    severity: P1
    feedback_destination: "Delivery PR conversation. The first revision declared its own BudgetVector while main had just merged budget::BudgetVector (limits) and budget::BudgetUsage (measurements). The explicit re-export shadowed main's glob re-export at the crate root, making budget::BudgetVector, BudgetUsage, violations, check and entries_in unreachable; clippy -D warnings failed with four errors on a crate whose only mistake was importing the module. Fixed by deleting the local type and consuming main's, which is also what the coverage-row text already described."
  - id: AID-2026-049-F2
    severity: P2
    feedback_destination: "Delivery PR conversation. The module also declared IndexWatermark while CanonicalWatermark already carried source/partition/revision. Deleted; the only genuinely new information was the per-partition gap verdict, now PartitionState wrapping CanonicalWatermark. CompletenessOutcome was renamed rather than aliased, since two names for one concept is the same defect in a different costume."
  - id: AID-2026-049-F3
    severity: P1
    feedback_destination: "Coverage table. Row 67 was recorded as IMPLEMENTED by a direct-to-main commit (79a1f8b1) that cited observability.rs. Four of the seven §9.4 fields are absent from that file: canonical commit/fence refs with PermissionEpoch, the budget vector, compacted sources with validation/digest profiles, and blocked/deferred refs. The single grep hit for those names is a comment quoting §9.4. Row downgraded to PARTIAL in both languages."
  - id: AID-2026-049-F4
    severity: P3
    feedback_destination: "Delivery PR conversation. A python3 -c one-liner used to append the lib.rs re-export silently rewrote 4458 lines because the shell quoting corrupted the replacement text. Caught by checking git diff --numstat before committing (4458/4451 instead of 6/0) and reverted. The append was redone from a script file and re-verified at 6 insertions, 0 deletions."
