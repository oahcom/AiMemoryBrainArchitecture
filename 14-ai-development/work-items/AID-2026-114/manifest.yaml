acceptance_criteria:
  - id: AC1
    criterion: >-
      A pull request body that carries neither declaration field fails.
    measurement: >-
      test_pre_effective_undeclared_pr_fails and
      test_pr_opened_before_the_effective_time_without_a_declaration_fails assert exit 1 and the
      message `PR: missing AI-assisted work declaration`.
  - id: AC2
    criterion: >-
      A declared NO with N/A references still passes.
    measurement: >-
      test_declared_no_with_na_references_passes asserts exit 0.
  - id: AC3
    criterion: >-
      A declared YES still requires a reference that exists in the head tree.
    measurement: >-
      test_declared_yes_with_a_real_path_passes asserts exit 0;
      test_pre_effective_pr_volunteered_yes_with_missing_evidence_fails still asserts exit 1.
  - id: AC4
    criterion: >-
      No other check changes and no existing refusal is relaxed.
    measurement: >-
      `python -m unittest discover -s tests/session_evidence -p "test_*.py"` reports `Ran 100 tests`
      and `OK`; the only expectations that changed are the two that pinned the removed exemption.

findings:
  - id: F1
    severity: HIGH
    statement: >-
      A body with neither declaration field returned NOT_APPLICABLE with exit 0, so silence passed the
      gate while an honest YES with an unusable reference failed. The fail-open was the early return at
      validate.py:2195-2203, not _parse_status, which already raised on None.
    evidence: >-
      #1275, #1266 and #1220 passed with no declaration field; #1251 and #1249 failed with YES and a
      reference that did not resolve. Both were read from the run logs, not from the brief.

