authorization:
  implementation_write: >-
    GRANTED for scripts/governance/status_migration/check_status_gates.py,
    scripts/governance/status_migration/test_status_migration.py, this work item's own
    directory, and one INDEX.md row. NOT_GRANTED for any other path.
  gate_behaviour_change: >-
    GRANTED for the independent_review arm of check_status_gates.py only - the criterion it
    applies and the evidence it requires. NOT_GRANTED for any other arm, for its status
    vocabulary, for its subject_head binding, or for its fail-closed sidecar check.
  schema_change: >-
    GRANTED for two required evidence fields inside lifecycle.gates.independent_review.evidence
    (reviewer_session, implementer_session). NOT_GRANTED for any top-level manifest field, any
    session_evidence field, or manifest-schema-registry.yaml, which does not describe this
    block.
  platform_state_change: >-
    NOT_GRANTED - no required status context is added and no branch-protection payload is
    modified. The checker stays unwired, deliberately: see scope.files_out_of_scope.
  architecture_spec_change: >-
    NOT_GRANTED - no ADR, no BMCP specification, and no clause of PR-GOVERNANCE-001.md is
    modified. Section 5 is correct as written; the executable is what disagrees with it.

scope:
  files_to_create:
    - 14-ai-development/work-items/AID-2026-241/manifest.yaml
    - 14-ai-development/work-items/AID-2026-241/prompt-v1.md
    - 14-ai-development/work-items/AID-2026-241/session-evidence-1247.md
  files_to_modify:
    - scripts/governance/status_migration/check_status_gates.py
    - scripts/governance/status_migration/test_status_migration.py
    - 14-ai-development/work-items/INDEX.md
  files_out_of_scope: >-
    Every other path. In particular: .github/workflows/, because wiring a checker that fails
    55 of 57 manifests into a required context would block every merge and wiring it as
    non-required would produce a permanently red job that teaches readers to skip it - that is
    a decision with its own blast radius and its own work item. #1154's corpus migration,
    because 53 of the 55 failures are status vocabulary and lifecycle blocks, not independence.
    scripts/governance/session_evidence/validate.py, which decides a different question and is
    correct. PR-GOVERNANCE-001.md, whose section 5 already says what this work item makes the
    code say. And every existing manifest: none carries a
    lifecycle.gates.independent_review record (measured 0 of 57), so the new required fields
    break nothing that exists.

acceptance_criteria:
  - id: C1
    criterion: >-
      The gate decides independence by session, and the same-account case that section 5
      declares lawful passes.
    measurement: >-
      A REVIEWED manifest whose independent_review evidence carries one identity string for
      reviewer and implementer but two distinct session values exits 0 with
      `"result": "PASS"`. At the base commit the same manifest exits 1 with
      `REVIEWED reviewer and implementer must be different identities`.
  - id: C2
    criterion: >-
      The gate fails the case section 5 forbids, and the failure names the session fields
      rather than the identity fields.
    measurement: >-
      A manifest whose two session values normalize to the same token exits 1, and the error
      string contains the name of a session field.
  - id: C3
    criterion: The two new evidence fields are required, and their absence is reported by name.
    measurement: >-
      Removing reviewer_session from an otherwise passing manifest exits 1 and the error names
      reviewer_session.
  - id: C4
    criterion: >-
      The identity comparison survives as a diagnostic and cannot change the verdict for a
      same-account pair.
    measurement: >-
      `_identity`, `reviewer`, `implementer` and `review_identity_aliases` are still present and
      reachable, and C1's same-account manifest passes with them present.
  - id: C5
    criterion: >-
      The code states the limit of what a session string proves, at the point where the
      comparison is made.
    measurement: >-
      A comment adjacent to the session comparison says the check verifies that the manifest
      declares two sessions and does not verify that two sessions existed. The reviewer reads it
      and says whether it overclaims.
  - id: C6
    criterion: No other gate arm, no status vocabulary and no subject_head binding changes.
    measurement: >-
      `git diff` against the base touches only the four named paths, and the existing
      test_status_migration suite passes unchanged except for the four added cases.
  - id: C7
    criterion: The checker remains unwired and the corpus failure count is unchanged.
    measurement: >-
      `grep -rn check_status_gates .github/workflows/ scripts/ci/` still returns nothing, and
      running the checker over all 57 manifests still reports the same 2 pass / 55 fail.

findings:
  - id: F1
    severity: HIGH
    statement: >-
      The independent_review gate compares GitHub identity strings, while PR-GOVERNANCE-001
      section 5 defines independence as a session property and explicitly permits two sessions
      to share one identity. The gate therefore fails the lawful case and passes the forbidden
      one.
    evidence: >-
      check_status_gates.py:275-277 compares _identity(reviewer) with _identity(implementer).
      Measured at 9ee89b32 with two manifests differing only in those two values and otherwise
      identical, all six gate records present, evidence bound to real committed blobs: the
      two-sessions-one-identity manifest returned
      `{"result": "FAIL", "error": "REVIEWED reviewer and implementer must be different identities"}`,
      and the one-session-two-identities manifest returned `{"result": "PASS", ...}`.
  - id: F2
    severity: HIGH
    statement: >-
      The clause was amended and the executable was not, in the same repository, with the
      register recording the amendment as applied.
    evidence: >-
      GOV-REV-2026-11-24-INDEPENDENCE-IS-SESSION-LEVEL-036 records six clause sites changed on
      2026-11-24 and quotes the retired wording verbatim, including "even if the session adopts
      a different role". PR-GOVERNANCE-001.md:136-138 now reads "Independence is a property of
      the reviewing session, not of the GitHub account that carries it." The checker's
      comparison is the retired wording, expressed as code.
  - id: F3
    severity: MEDIUM
    statement: >-
      Nothing could have caught the disagreement, because the checker is referenced by no
      workflow and no other script, so its behaviour is exercised only when a session chooses
      to run it.
    evidence: >-
      `grep -rn check_status_gates .github/workflows/ scripts/ci/` returns no match at 9ee89b32.
      The only other reference is its own test module.
  - id: F4
    severity: MEDIUM
    statement: >-
      The defect is currently latent rather than active, and the measurement should say so: no
      manifest on main carries a lifecycle.gates.independent_review record, so no merged review
      has been judged by the wrong criterion.
    evidence: >-
      Measured over all 57 manifests at 9ee89b32: `lifecycle.gates.independent_review` present
      in 0. The corpus-wide checker run reports 2 pass / 55 fail, and every failure is a status
      or lifecycle defect, so no manifest reaches the independent_review arm at all.
  - id: F5
    severity: MEDIUM
    statement: >-
      A session string cannot prove that two contexts existed, and any fix that reads as if it
      could would replace one false assurance with another.
    evidence: >-
      implementing_ai_session is a writer-chosen string; the session_evidence contract already
      labels its provenance NOT_VERIFIED and its reference status RECORDED, and no in-repo
      mechanism relates a session string to a process. The corrected check must therefore be
      described as verifying a declaration.

