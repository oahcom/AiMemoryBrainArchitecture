work_item_id: AID-2026-241
title: Make the independent-review gate test the session, not the GitHub account
class: GATE/POLICY
risk: R2
risk_rationale: >-
  One criterion inside one arm of one checker, plus two required evidence fields and four
  tests. No workflow, no required context, no branch protection, no schema registry, no
  clause change. The risk is not damage but asymmetry that has been silent since 2026-11-24:
  PR-GOVERNANCE-001 section 5 was amended to say independence is a session property, and the
  executable that decides it still compares account strings. Measured at 9ee89b32, the gate
  fails the case section 5 declares lawful and passes the case section 5 forbids. Nothing
  caught it because the checker is referenced by no workflow and by no other script. The risk
  that matters is that a fix makes the string look like proof: a session value is written by
  whoever writes the manifest, so the corrected check must be described as verifying a
  declaration, not an event, and the code comment is part of the deliverable rather than
  commentary on it.
status: DISPATCHED

