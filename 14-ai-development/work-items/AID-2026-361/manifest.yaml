acceptance:
  required:
    - The original ledger repin commit is independently resolved and its first-parent and tree pin values are verified.
    - A non-ancestor repin is accepted only when a unique target first-parent squash transition proves the same previous pin and new pin.
    - The squash transition manifest Git blob exactly matches the manifest Git blob in the original repin commit tree.
    - A squash transition with a different manifest Git blob is rejected.
    - A forged ledger new_pin that differs from the original repin commit tree is rejected.
    - Unledgered-history verification uses the resolved actual transition location.
    - Existing manifest blob-pin checker tests pass.
    - Manifest pin ledger regression tests pass.
    - Immutable negative-gate tests pass.
    - The existing ratchet reports no added or removed baseline failures.
