work_item_id: AID-2026-361
title: Preserve manifest blob-pin ledger verification across squash merges
class: GATE/CI/TEST
risk: R2
risk_rationale: >-
  Corrects manifest blob-pin ledger verification when a recorded repin commit
  has been squash-merged and is therefore not an ancestor of the target.
  The checker retains proof against the original repin commit and requires a
  unique equivalent transition in target first-parent history, including
  matching previous and new pin values and an identical manifest Git blob.
  Adds isolated regression tests for accepted squash equivalence, rejected
  manifest-blob divergence, and forged new-pin declarations. No workflow,
  branch-protection, baseline, or unrelated manifest changes are in scope.
