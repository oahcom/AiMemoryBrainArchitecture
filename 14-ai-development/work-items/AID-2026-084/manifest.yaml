work_item_id: AID-2026-084
title: Make INDEX membership require a registry row, not any link
class: GATE/TEST
risk: R2
risk_rationale: >-
  One predicate narrowed and three tests added in an already-executed module. The gate can
  turn red on a tree that keeps work-item directories without registry rows, which is the
  point, and the current tree is measured to keep all of its rows, so landing it does not
  redden the registry. No new dependency, no schema field, no workflow step. The risk
  addressed is false assurance: the check reported membership it had not established,
  because a row deleted from the table could still be "linked" by a link in prose or in a
  comment (issue #944).
status: DISPATCHED

