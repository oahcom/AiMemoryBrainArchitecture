acceptance_criteria:
  - id: AC1
    criterion: >-
      A directory whose only repository-relative link sits inside an HTML comment is
      reported as unregistered.
    measurement: >-
      With the only link wrapped in `<!-- ... -->`, the checker exits 1 and stderr carries
      `index membership violation: directory present, no index entry:
      14-ai-development/work-items/AID-2026-002`.
  - id: AC2
    criterion: A directory whose only link is in a prose line is reported as unregistered.
    measurement: >-
      Same assertion, with the link in a sentence below the table instead of in a comment.
  - id: AC3
    criterion: >-
      A directory whose only link is inside a fenced code block is reported as
      unregistered.
    measurement: >-
      Same assertion, with the link inside a ``` fence.
  - id: AC4
    criterion: >-
      A real table row still registers, and the current tree still passes with every
      directory linked.
    measurement: >-
      `python3 scripts/ci/check_repository_hygiene.py` on this branch prints
      `directories=79 linked=79` and exits 0, where 79 is 78 pre-existing directories plus
      this work item's own; no directory lost its entry, which is the constraint the change
      had to meet.
  - id: AC5
    criterion: >-
      Reverting only the production change turns the new tests red, and the failure names
      the expectation rather than surfacing a traceback or an unrelated non-zero exit.
    measurement: >-
      With the whole-file regex restored, the three tests fail with `AssertionError` naming
      `::error::index membership violation: directory present, no index entry:
      14-ai-development/work-items/AID-2026-002` as not found.

findings:
  - id: F1
    severity: HIGH
    statement: >-
      Membership accepted a link anywhere in INDEX.md, so a registry row could be removed
      from the visible table and the gate that exists to notice that stayed green.
    evidence: >-
      At origin/main dc826e4e the checker printed `directories=68 linked=68` and exited 0.
      Wrapping the `AID-2026-081` row in `<!-- ... -->` left the same output and exit 0,
      while `grep -c '^| \[AID-2026-081\]'` returned 0.
  - id: F2
    severity: MEDIUM
    statement: >-
      The index carries many links that are not registry rows, so the two sets coincided on
      this tree by luck rather than by construction: 207 links, 81 of them into work-item
      directories, all 81 inside table rows today.
    evidence: >-
      Measured on dc826e4e: 132 lines start with `|`; 68 of them link a work-item
      directory; 0 non-row lines link one, which is why the tree passes both before and
      after the change.
  - id: F3
    severity: LOW
    statement: >-
      A link inside a fenced code block would have registered a directory even though no
      markdown renderer shows it as a table, and the index carries fenced examples
      elsewhere in the governance docs.
    evidence: >-
      INDEX.md has no fence today (0 occurrences of ``` and 0 of `<!--`), so the three new
      cases are constructed in the test fixtures rather than found in the tree.

