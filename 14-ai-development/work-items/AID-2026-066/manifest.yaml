# WO-04 of the REQ-01 repair queue, registered against Issue #262 AC7. AC7 is
# unmeasurable for F7 because this work has no accountable item; this manifest
# creates one and changes no code.
#
# Risk is R3 rather than R2 for one reason: the surface is a serialized
# compatibility contract, not only a behaviour. `ContextSnapshot`,
# `ContextEntry` and `ContextTombstone` are `serde` types, and the `--out` file
# `crates/brain-cli/src/main.rs` writes is that same representation on disk. A
# change here can break a reader that was never in this repository, and no test
# in this repository can prove it did not. That is a different risk class from
# "a function returns the wrong value", which is what R2 covers.
#
# The R29 closeout authorised a bounded schema change for this work item. That
# Owner authorisation is not the authorisation of this branch: registration and
# implementation are separate grants, and this branch holds only the first.
# ---------------------------------------------------------------------------

