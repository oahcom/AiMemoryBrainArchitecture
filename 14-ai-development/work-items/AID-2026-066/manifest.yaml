acceptance:
  C1: "ContextEntry carries memory_lifecycle and it is populated from the authority. Settled by a test in crates/memory-context asserting that two entries built from identical content but different authoritative lifecycle differ in that field; `grep -c 'memory_lifecycle' crates/memory-context/src/lib.rs` at the acceptance head is greater than at a1533c67."
  C2: "ContextSnapshot carries a non-empty authoritative_state_fingerprint on the production path, and a pre-change serialized fixture still deserializes. Settled by two assertions in one test, because an old file reading successfully does not show that a new file has a fingerprint."
  C3: "A1 and A2: fixed authoritative state rebuilt twice yields an identical fingerprint; changed Claim content yields a different one. Settled by two assertions in the fingerprint test."
  C4: "A3: a forgotten Active memory yields a successor snapshot with a tombstone, no entry for that memory, and a different fingerprint, through the real SQLite path. Settled by `cargo test -p memory-context --test forget_excludes_from_context`. A run that fails with `read_current returned no revision` does not satisfy this."
  C5: "A4 and A5: a forget fence recorded in storage with no caller input change alters what the successor snapshot shows, and the old fingerprint is not reused. Settled by assertions that hold caller input fixed and vary only persisted state."
  C6: "A6 and A7: Active to Consolidated and Consolidated to Active are each observable, in both directions. Settled by a pair of assertions, not one direction plus an implication."
  C7: "Tombstone construction is not hardcoded. Settled by `grep -n 'tombstones: Vec::new()' crates/memory-context/src/lib.rs` returning no production match, with any test-module match reported explicitly rather than silently subtracted, plus C4 passing."
  C8: "context_version no longer comes from a literal. Settled by `grep -n -A2 'build_context(' crates/brain-cli/src/main.rs` showing a computed argument, and by a test asserting that unchanged persisted state repeats the version while changed state advances it."
  C9: "The serialized surface is enumerated, not assumed: the added fields on ContextSnapshot, ContextEntry and ContextTombstone and their effect on the `--out` file are listed, unknown-field and missing-field behaviour is stated, and `#[serde(default)]` covers every added field."

