work_item_id: AID-2026-349
title: "Enforce fail-closed validation for bilingual document groups in CI"
class: GOV/CI
risk: R2
risk_rationale: >-
  The change adds fail-closed validation for registered bilingual document
  groups and makes both relevant CI checks require that validation. The
  checker API retains compatibility for existing content-only fixtures by
  making group closure opt-in at the check() call boundary; CI explicitly
  opts in. The change is bounded to the shared validation helper, two
  checkers, their CI invocations, tests, and this work-item record.
