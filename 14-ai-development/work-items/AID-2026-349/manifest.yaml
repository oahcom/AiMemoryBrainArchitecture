    measurement: >-
      Run:
      BASE_SHA=origin/main HEAD_SHA=HEAD PR_BODY="BILINGUAL-MANIFEST: COMPLETE" python scripts/check_bilingual_docs.py
      python scripts/check_document_management.py --require-changed origin/main
    expected_result: "Both PASS."

