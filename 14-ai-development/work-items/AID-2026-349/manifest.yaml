    description: >-
      No constraint, requirement or conformance case in either document changes.
    measurement: >-
      Run:
      git diff --unified=0 origin/main..HEAD -- 05-memory-runtime docs/
    expected_result: "Only the two reference sentences and the six steward lines differ."

