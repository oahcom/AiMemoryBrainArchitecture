scope:
  objective: >-
    Add reusable fail-closed validation for registered bilingual document
    groups by reusing the document-management metadata and DM-12 relationship
    checks; connect it to the owner-namespace and governance-operation
    traceability checkers through an explicit require_group_closure option;
    and require that option in both bilingual-docs CI checker invocations.
    Preserve compatibility for existing body-only unit fixtures while
    ensuring CI cannot omit group-closure validation.
  files_changed:
    - ".github/workflows/bilingual-docs.yml"
    - "scripts/gov_doc_fail_closed.py"
    - "scripts/check_owner_namespace_references.py"
    - "scripts/check_governance_operation_traceability.py"
    - "tests/test_ac3_fail_closed_fixtures.py"
    - "14-ai-development/work-items/AID-2026-349/manifest.yaml"
    - "14-ai-development/work-items/AID-2026-349/prompt-v1.md"
    - "14-ai-development/work-items/AID-2026-349/session-evidence.md"
    - "14-ai-development/work-items/AID-2026-349/evidence.md"
  in_scope:
    - "Add scripts/gov_doc_fail_closed.py with validate_group(root, registered_files) -> list[str] and report_group() using the existing check_document_management metadata and relationship validation functions."
    - "Fail closed for missing registered members, unreadable members, unclassified or invalid metadata, and invalid source/mirror mutual closure."
    - "Reject symlinks and non-regular files; do not run the relationship graph when the registered group is incomplete."
    - "Only elevate DM-12 relationship diagnostics from check_scope_and_relations() into FAIL_CLOSED diagnostics."
    - "Add require_group_closure: bool = False as a keyword-only check() parameter in both checkers and add the --require-group-closure CLI flag."
    - "When require_group_closure is true, extend checker errors with validate_group(root, FILES); otherwise preserve the legacy content-only fixture behavior."
    - "Make both checker invocations in .github/workflows/bilingual-docs.yml pass --require-group-closure."
    - "Add eight fixture tests covering complete groups, missing members, unclassified members, unreadable members, and source/mirror mismatch."
    - "Keep the existing tests/test_check_owner_namespace_references.py and tests/test_check_governance_operation_traceability.py unchanged."
  out_of_scope:
    - "Change canonical authority or canonical_status of existing governance documents."
    - "Change the registered document groups or their source/mirror ownership."
    - "Replace or duplicate the existing document-management metadata parser or DM-12 relationship implementation."
    - "Change unrelated CI workflows, checkers, or governance policies."
    - "Modify existing body-only fixtures solely to add front matter."

