      Run:
      git grep -n -F 'phase-3.5-forget-suppression-and-cursor-consumption.md' -- 05-memory-runtime docs/en/05-memory-runtime docs/zh-CN/05-memory-runtime
    expected_result: "Zero hits."

  - id: AC2
    description: >-
      Every in-scope document states that the contract is unsubmitted and not
      restored.
    measurement: >-
      Run:
      git grep -n -F 'unsubmitted and not restored' -- 05-memory-runtime docs/en/05-memory-runtime
      git grep -n -F '未提交、未恢复' -- docs/zh-CN/05-memory-runtime
    expected_result: "The canonical and English copies hit twice each; the Chinese copies hit twice each."

  - id: AC3
