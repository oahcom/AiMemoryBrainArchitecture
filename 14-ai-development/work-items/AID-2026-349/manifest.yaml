    both named "Phase 3.5 Runtime Forget Suppression and Typed Cursor Consumer
    Contract" as the detailed contract and linked it as if it existed. The file
    does not exist anywhere in the tree. runtime-overview.md was already
    corrected to disclose this in AID-2026-340; the two siblings were not. This
    change applies the same disclosure to both canonical documents and adds the
    corresponding disclosure sentence to their four mirrors.
  in_scope:
    - "05-memory-runtime/retrieval-engine.md: retarget the title link and state that the contract is unsubmitted and not restored."
    - "05-memory-runtime/working-set-and-cache.md: the same."
    - "docs/en/05-memory-runtime/retrieval-engine.md and docs/en/05-memory-runtime/working-set-and-cache.md: add the disclosure sentence."
    - "docs/zh-CN/05-memory-runtime/retrieval-engine.md and docs/zh-CN/05-memory-runtime/working-set-and-cache.md: add the disclosure sentence."
    - "Add the mandated DM-15 steward field to the six changed documents."
    - "Register the work item and its INDEX.md row."
  files_out_of_scope:
    - "Restoring the Phase 3.5 contract file."
    - "Changing any constraint, requirement or conformance case in the two documents."
    - "Gate scripts, baselines, workflows."
    - "Any other document that references the same file."
  change_boundary: >-
    Six sentences and six metadata lines across six existing files. The
    normative content of both documents is unchanged: the same contract name,
    the same supersession sentence, and the same subject matter. Only the link
    destination and the disclosure clause differ.

