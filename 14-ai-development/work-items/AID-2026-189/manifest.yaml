title: >-
  Remove the Rust cache from the fmt gate that can never hit, add head-SHA concurrency to the
  two topic workflows AID-2026-115 missed, and record the two remaining CI dispatch defects
class: CI/GOVERNANCE
risk: R1
risk_rationale: >-
  Two workflow edits plus one registration set. The fmt job loses two steps that cannot do
  useful work because the job never compiles; the two added concurrency blocks only cancel
  superseded runs of workflows that already existed. No job is added, renamed, merged or
  removed, no required context is deleted, no checker semantics change, and the two defects
  that would need such a change are recorded as DEFERRED_TO_OWNER instead of repaired.
