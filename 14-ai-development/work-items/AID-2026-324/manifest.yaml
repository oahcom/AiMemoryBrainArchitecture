work_item_id: AID-2026-324
title: "Make symlink-unavailable skips fail closed across boundary tests"
class: GATE/TEST
risk: R1
risk_rationale: >-
  This change narrows test-only symlink skip eligibility to recognized
  platform capability or policy errors, makes skip reasons exact, and
  strengthens negative and forced-unavailability verification. Production
  checker behavior is unchanged.
status: IMPLEMENTED
id_status: PROVISIONAL
