title: Bind the gate's reachable unbound error emissions with tests
class: GATE/TEST
risk: R2
risk_rationale: >-
  Tests only: scripts/test_check_document_management.py gains one function and no production
  file changes. The risk it addresses is false assurance. Issue #827 asks, for each error
  message the gate can emit, whether any test turns red when that emission is deleted. At
  origin/main 31385bc1 a mechanical audit of all 99 distinct message templates found 38 that
  nothing binds. The residual risk is the one the issue names: a message whose only test
  proves it can be emitted by an input the gate cannot actually receive, or a test that goes
  green because a neighbouring check happens to speak. Each case asserts on the message text
  specifically, and each was verified by deleting the emission and watching that case -- and
  not a different one -- fail with an AssertionError naming the message.
