acceptance_criteria:
  - id: AC1
    criterion: >-
      The audit is reproducible from the gate's own source, with no hand-picked message list,
      and reports its total, BOUND, UNBOUND and baseline pass count.
    measurement: >-
      An AST driver over scripts/check_document_management.py collects every
      errors.append/problems.append/errors.extend site whose first argument is a literal
      containing DM-, renders each as a template, and reports 99 distinct templates, 61 BOUND,
      38 UNBOUND, baseline 318/318 at 31385bc1.
  - id: AC2
    criterion: >-
      Every reachable UNBOUND prefix has a test that asserts on that message and fails when
      the emission is deleted.
    measurement: >-
      37 of the 38 are bound by T93-T127 in run_unbound_emissions(). For each, deleting the
      emission statement from an isolated tree makes that test fail with an AssertionError
      naming the message, and no other test fails for that reason.
  - id: AC3
    criterion: >-
      The one unreachable prefix is named with its reason, is not tested, and is not deleted.
    measurement: >-
      `DM-01 outside the repository root` is documented in section 4 of prompt-v1.md and in
      the section comment of run_unbound_emissions(); the emission remains at
      scripts/check_document_management.py:2281.
  - id: AC4
    criterion: The suite is green at the end, with no existing case weakened.
    measurement: >-
      python3 scripts/test_check_document_management.py reports 363/363 passed at the head
