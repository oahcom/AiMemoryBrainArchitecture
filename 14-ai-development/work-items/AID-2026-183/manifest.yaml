findings:
  - id: F1
    severity: MEDIUM
    statement: >-
      At origin/main 31385bc1, 38 of the 99 distinct error-message templates the gate can emit
      are bound by no test: deleting the emission leaves the suite green at 318/318.
    evidence: >-
      AST extraction of every errors.append/problems.append/errors.extend site, one isolated
      tree per template, full suite run per template. 99 templates, 61 BOUND, 38 UNBOUND.
  - id: F2
    severity: MEDIUM
    statement: >-
      The issue's figure of ten is from an older tree (main a9f7c9b849, baseline 239) and is
      not comparable to this head. The count grew because the gate grew and because this audit
      is mechanical rather than hand-picked.
    evidence: >-
      Issue #827 lists ten prefixes; this audit found 99 templates at 31385bc1, of which 38
      are unbound. The suite is 318/318, not 239.
  - id: F3
    severity: LOW
    statement: >-
      One UNBOUND template is genuinely unreachable, not merely untested: every path reaching
      `path.relative_to(root)` is built as `root / rel` from a resolved root, and symlinks are
      reported rather than followed, so the ValueError branch cannot fire.
    evidence: >-
      collect_governed() yields `root / rel` for GOVERNED_FILES and paths under NORMATIVE_ROOTS
      / backlog roots; main() does `root = Path(args.root).resolve()` before scanning;
      scan_root() appends a DM-14 diagnostic for a symlinked file and does not follow it. A
      probe that monkeypatched collect_governed to append an out-of-tree path did emit the
      message, which shows the branch works when reached -- and that nothing in the gate reaches
      it.

