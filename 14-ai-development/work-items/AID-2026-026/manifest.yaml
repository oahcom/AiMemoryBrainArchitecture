scope:
  - Map the existing normative domain model and inspected Rust domain types before proposing changes.
  - Resolve the Inference/Hypothesis semantic boundary and its identity rule, without restating Fact/Claim semantics owned by AID-2026-014.
  - Specify what must be invalidated in Inference/Hypothesis when supporting Claim or Evidence is forgotten, and what may survive.
  - Define the interface contract this Work Item consumes from AID-2026-023 Forget boundary (identifiers, invalidation signals, completion acknowledgement).
  - Define contradiction and supersession behaviour for Inference/Hypothesis only, where AID-2026-014 has not ruled.
  - Cite AID-2026-014 by ADR identifier for every Fact/Claim rule that this Work Item depends on; do not re-derive it.
  - Produce executable domain-test specifications for the above, and identify decisions requiring accountable domain/Owner governance.

out_of_scope:
  - Fact/Claim basic semantics, Claim Identity, Claim Revision, Evidence binding, historical immutability, Fact Attestation authorization, Storage atomicity — all owned by AID-2026-014.
  - Determining whether Fact is an independently persistent entity — owned by AID-2026-014.
  - Creating a duplicate or superseding ADR for any matter AID-2026-014 has already decided.
  - Production schema, DDL, database, or persistent-storage changes.
  - Production API or runtime implementation changes.
  - Repository writes, branch creation, commits, pull requests, merges, or INDEX maintenance by this session.
  - CI execution or claims of test execution/pass.
  - Appointment of Sponsor, accountable Owner, Acceptance Authority, security authority, or other governance role.
  - Adoption of the proposed ADR as a standard or closure of MQ-01 by design completion.
  - Re-design of the entire knowledge architecture or duplication of AID-2026-023 Forget design.
  - Treating documentation or Rust type declarations as proof of production/runtime enforcement.

prerequisites:
  - Formal AID-2026-026 allocation and Work Item directory/manifest registration evidence.
  - Sponsor and accountable Owner explicitly recorded by an authorized governance actor; otherwise remain NOT_ASSIGNED and governance gate remains open.
  - Coordination read-back of the merged registration PR URL, exact merge SHA, and Blob SHAs for manifest.yaml and prompt-v1.md before substantive R2 ADR execution.
  - Reconfirm exact repository baseline and read-back evidence at the registered merge commit before R2 continuation.
  - AID-2026-023 Forget boundary reference/read-back sufficient to define the interface without duplicating its design.
  - Independent review status remains INDEPENDENCE_UNVERIFIABLE unless qualifying independence evidence is supplied.
  - CI availability remains constrained by the #352 quota condition; no CI or test pass may be claimed without actual execution evidence.

