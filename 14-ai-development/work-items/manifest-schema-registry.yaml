schema_registry_version: "1"

# Records that live at a work-item manifest path but are not work-item
# manifests. The manifest-consistency gate reads lifecycle fields from a
# top-level `status` and from direct children of a top-level `implementation`
# mapping. A record that declares a different record_type and carries its
# status-like fields inside other business mappings does not implement that
# contract, so the gate must not read it and must not call it malformed.
#
# Exclusion is per exact (path, record_type) pair. A record_type on its own
# excludes nothing: otherwise any future file could opt out of the gate by
# declaring a type. Wildcards, directory-level exemptions and filename
# prefixes are not supported, and an entry naming a path this commit does not
# contain makes the gate fail rather than quietly exclude nothing.
#
# An entry here is a classification decision, not a permanent waiver. A new
# record_type does not inherit these entries; it is reported as unrecognized
# until it gets its own decision.

excluded_records:
  - path: "14-ai-development/work-items/AID-2026-024/manifest.yaml"
    record_type: "STAGE_0_WORK_ITEM_REGISTRATION"
    disposition: "EXCLUDED_FROM_MANIFEST_CONSISTENCY_GATE"
    rationale: "Stage 0 registration record. Its status-like fields sit under scope, governance, next_task and final_registration_disposition; none of them is the lifecycle contract checked by R20-01 and R20-02."

  - path: "14-ai-development/work-items/AID-2026-025/manifest.yaml"
    record_type: "STAGE_0_WORK_ITEM_REGISTRATION"
    disposition: "EXCLUDED_FROM_MANIFEST_CONSISTENCY_GATE"
    rationale: "Stage 0 registration record. Its closest field, evidence_policy.implementation_status, is a disclaimer that this record asserts no implementation, not an implementation progress field."

  - path: "14-ai-development/work-items/AID-2026-093/manifest.yaml"
    record_type: "STAGE_0_WORK_ITEM_REGISTRATION"
    disposition: "EXCLUDED_FROM_MANIFEST_CONSISTENCY_GATE"
    rationale: "Stage 0 registration record. Its status-like fields describe registration, evidence and acceptance gates rather than the normal Work Item implementation lifecycle contract."
  - path: "14-ai-development/work-items/AID-2026-095/manifest.yaml"
    record_type: "STAGE_0_WORK_ITEM_REGISTRATION"
    disposition: "EXCLUDED_FROM_MANIFEST_CONSISTENCY_GATE"
    rationale: "Stage 0 registration record; status-like fields describe registration, evidence and review gates rather than the normal Work Item implementation lifecycle contract."

  - path: "14-ai-development/work-items/AID-2026-100/manifest.yaml"
    record_type: "STAGE_0_WORK_ITEM_REGISTRATION"
    disposition: "EXCLUDED_FROM_MANIFEST_CONSISTENCY_GATE"
    rationale: "Stage 0 source-restoration registration with an Owner-assigned numeric identifier. Its status-like fields describe registration, source provenance, reconstruction and acceptance gates, not the normal Work Item implementation lifecycle contract."
