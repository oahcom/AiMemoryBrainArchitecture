acceptance:
  C1: "The block-form test fails with AssertionError, not a traceback and not an ImportError, when NEEDS_KEY_RE is reverted to `^    needs:\\s*\\S`. Settled by the revert being made in isolation and the single test being run against it."
  C2: "The block-form test asserts exit 1, the `needs:` key, and the line number of the `needs:` line. Settled by the assertion naming the computed line of the `needs:` line and by a companion negative assertion that the job id's line is not the one quoted, so a message that named the job instead cannot satisfy it."
  C3: "The ref test fails with AssertionError, not a traceback and not an ImportError, when _checkout_refs is reverted to quoting the `uses:` line. Settled the same way, against the pre-fix body of that function."
  C4: "The ref test asserts the message contains the `ref:` text and does not contain the `uses:` text. Settled by the negative assertion being present: the bare token `ref:` appears in the message's prose, so the positive assertion alone held under the defect."
  C5: "The ref test also fails against a partial fix that quotes the right line without the line number, because the fix carries `first_line` and the number is what locates the offending key. Settled by that revert being run as a third case."
  C6: "The ten tests already in the file are not weakened, renamed or deleted, and all pass unmodified. Settled by the suite running twelve tests with the same names plus two."
  C7: "scripts/check_session_evidence_workflow_shape.py is byte-identical to a316ff69 at the head of this branch. Settled by `git diff` against that commit showing no change to that path."

