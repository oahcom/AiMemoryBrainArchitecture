# ---------------------------------------------------------------------------
# Tests for the two behavioural fixes in a316ff69, which is the commit that
# carries them and says in its own message that "the tests and the work-item
# registration are NOT yet written".
#
# Both defects are the same failure mode: the guard printed PASS over a shape it
# forbids, or named a line that was already correct. A gate that is wrong in
# either direction is worse than no gate, because the PASS is read as evidence.
#
# Neither defect was reachable by the suite as it stood. `test_validate_needs_is_
# a_violation` used the flow form only, and no test asserted which line the
# `ref:` message quotes. The fix is therefore untested until this work item
# lands, and a revert of it would be silent.
# ---------------------------------------------------------------------------

