work_item_id: AID-2026-013
title: "Prevent document-management concurrency from silently dropping required context"
class: GATE/CI
risk: R1
risk_rationale: >-
  The change is limited to the concurrency group and its explanatory comments
  in one workflow. It does not modify triggers, jobs, steps, job names,
  permissions, or the required-context-producing implementation. The change
  separates pull-request concurrency groups to prevent pending runs from
  replacing one another while retaining cancel-in-progress: false.
status: DISPATCHED
id_status: PROVISIONAL

sponsor: Repository maintainers
accountable_owner: Repository maintainers
acceptance_authority: Repository owner
attribution: AI-assisted implementation; human-directed

date: "2026-11-28"
repository: oahcom/AiMemoryBrainArchitecture
base_branch: main
base_commit_sha: "3d9b32bef6775974117ea0ab925179acf43c6ecb"
tracking_issue: "#1484"

scope:
  summary: >-
    Give each pull request its own document-management workflow concurrency
    group so that a later pull request cannot replace another pull request's
    pending workflow run and silently eliminate its required GOV-DOC-002
    metadata checks context.
  in_scope:
    - >-
      Change the document-management workflow concurrency group to include
      github.workflow, github.event_name, and the pull-request number or
      fallback ref name.
    - Preserve cancel-in-progress: false.
    - Replace the existing concurrency comments with an accurate explanation
      of the concurrency trade-off and freshness mechanism.
    - Preserve the document-management job name and every job and step.
    - Record the implementation evidence and session evidence.
    - Register AID-2026-013 in the work-item index.
  files_out_of_scope:
    - .github/workflows/document-management.yml job definitions other than concurrency
    - .github/workflows/document-management.yml steps and step names
    - .github/workflows/document-management.yml job name
    - .github/workflows/document-management.yml on triggers
    - Branch protection configuration
    - Required status-check configuration
    - Other workflow files
    - CI checker implementations
  change_boundary: >-
    The workflow change is restricted to the existing concurrency comment
    block and the group expression. cancel-in-progress remains false.
    No trigger, job, step, name, permission, or required-context definition
    is changed. Four work-item documentation files and one INDEX row are
    added as registration materials. prompt-v1.md is copied verbatim by the
    coordinator from the delivered prompt.

evidence:
  baseline:
    repository: oahcom/AiMemoryBrainArchitecture
    base_branch: main
    base_commit_sha: "3d9b32bef6775974117ea0ab925179acf43c6ecb"
    date: "2026-11-28"
  defect:
    total_cancelled_runs: 281
    document_management_cancelled_runs: 9
    affected_pull_request: 1443
    affected_pull_request_head: "938e160f"
    affected_run_id: "45963399555"
    missing_required_context: GOV-DOC-002 metadata checks
    competing_pull_request: 1448
    competing_run_result: success
    competing_run_timing: Same second, same concurrency group
    open_pull_requests_examined: 19
    remote_branches_examined: 1155
    conflicting_changes_found: false
  concurrency_decision:
    old_group: >-
      ${{ github.workflow }}-${{ github.event.pull_request.base.ref || github.ref_name }}
    new_group: >-
      ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
    cancel_in_progress: false
    abandoned_property: >-
      Global serialization of decisions across all pull requests targeting
      the same branch. This serialization never actually held because the
      concurrency group had only one pending slot and a later run could
      replace an earlier pending run.
    retained_property: >-
      A new run for the same pull request does not cancel an already running
      decision. Different pull requests have independent concurrency groups.
  freshness:
    required_context: Branch freshness vs base
    behavior: >-
      The freshness check rejects a head that does not contain the current
      target base. The pull request must synchronize with the target base.
      The resulting synchronize event reruns this workflow and its required
      contexts.
    strict_branch_protection: false
    strict_used_as_rationale: false
  job:
    name: GOV-DOC-002 metadata checks
    permissions: "contents: read"
    read_only: true
    step_target_base_fetch: >-
      Enforce work-item uniqueness against the current target base
    target_base_evaluation: >-
      Fetches the current target branch using git fetch and evaluates the
      generated merge candidate rather than relying on a stale pull-request
      event base SHA.
  required_contexts:
    - GOV-DOC-001 structural checks
    - Branch freshness vs base
    - audit
    - GOV-DOC-002 metadata checks
    - BMCP protocol index (hard gate)
    - BMCP conformance suite (hard gate)
    - Schema non-empty audit (hard gate)
    - Bilingual docs coverage (ratchet)
    - Rust clippy (hard gate)
    - Repository hygiene (hard gate)
    - Rust format (hard gate)
    - Rust doctests (hard gate)
    - Session Evidence
    - Session Evidence self-test (base)
    - Session Evidence self-test (head)
    - rust-workspace-test
  local_gates:
    - 'python -c "import yaml;d=yaml.safe_load(open(''.github/workflows/document-management.yml'',encoding=''utf-8''));print(d[''jobs''][''document-management''][''name'']);print(d[''concurrency''])"'
    - python scripts/ci/check_manifest_parse.py
    - python scripts/check_traceability.py --index-only
    - python scripts/check_document_management.py --require-changed origin/main
    - python scripts/ci/check_work_item_uniqueness.py --base origin/main --head HEAD
    - python scripts/check_declared_check_contexts.py

