work_item_id: AID-2026-080
title: Make section 5 item (2) satisfiable by removing the manifest field location requirement it should never have carried
class: GATE/POLICY
risk: R2
risk_rationale: >-
  One normative paragraph, in both languages, in one document. No executable file, no required
  context, no branch protection, no schema. The risk is not damage but silent contradiction: the
  clause as written mandates a manifest shape the Session Evidence gate rejects, so the standard
  and the gate disagree and the standard is the newer of the two. Every session that reads only
  the standard writes a manifest the gate refuses; every session that reads only the gate writes
  one the standard calls non-compliant. 0 of 54 manifests on main satisfy both, which is what an
  unsatisfiable rule looks like when nobody has counted. The correction is a deletion of five
  words per language plus the invariant that replaces them; the risk that matters is that the
  replacement is written loosely enough to permit two homes for one field, which is exactly what
  the gate forbids and therefore what C3 has to demonstrate rather than assert.
status: DISPATCHED

sponsor: USER-PRINCIPAL-DELEGATED
accountable_owner: USER-PRINCIPAL-DELEGATED
acceptance_authority: NOT_ASSIGNED

repository: oahcom/AiMemoryBrainArchitecture
