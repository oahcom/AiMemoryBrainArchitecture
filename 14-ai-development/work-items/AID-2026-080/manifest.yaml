      point: an exact-Head review of a branch that is then updated before merge cannot satisfy the
      requirement, and no amount of after-the-fact inspection changes what happened at the time.
      This is recorded as a deviation, not as compliance, and not as a request to relax section 9.
      What would remove it is a merge performed at the reviewed Head or a review performed at the
      Head that merges; neither happened here.
    non_blocking_checked:
      - "F3 (`modification_status` on two edited drafts): checked, not silently left. Round 5 corrected this note's first version, which said `DM-10` is the only rule constraining the field and that the policy constrains it nowhere else; that was wrong. The normative requirement is Rule L1 (stale approval, policy :160 EN / :162 ZH): when content inside `approval_scope` changes after `approved_version`, `modification_status` MUST become `Pending-Reapproval` and `approval_applicability` MUST become `Not-Applicable-To-Current-Version`. `DM-10` (`scripts/check_document_management.py`) is the machine check for that rule, not the rule's source. The conclusion is unchanged because L1's trigger is not met: both files are `decision_status: Draft` with `approved_version.value: null`, so there is no approved version to go stale, and L1 says nothing about a draft edited after its last saved state. The policy also does not state anywhere that a body edit alone forces `Modified`; the schema only enumerates the four values and the template ships `Unchanged`. The repository-wide counts first written here (294 documents carrying the field, 149 `Draft` saying `Unchanged`, 112 saying `Modified`) were measured against a `main` that has since moved, were not independently reproduced by round 5, and are therefore not relied on. Re-measured at `6c5f0230` for the record: 339 documents carry the field, of which 169 `Draft` say `Unchanged` and 136 say `Modified` — both remain live conventions, and the number drifts as `main` advances, which is why it carries no weight in the conclusion. `Unchanged` is kept, and the reason is that L1 does not fire, rather than a field flip asserting a meaning no rule defines."
