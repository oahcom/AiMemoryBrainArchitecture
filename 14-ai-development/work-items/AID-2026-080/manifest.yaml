findings:
  - id: F1
    severity: HIGH
    statement: >-
      Section 5 item (2) required `implementing_ai_session` as a top-level field while the
      Session Evidence gate rejects every top-level `MANIFEST_FIELDS` key when a
      `session_evidence` block is present. The two rules cannot both be satisfied, and the clause
      was merged after the gate.
    evidence: >-
      Measured at 1f5ba824 by importing `parse_manifest_session_entries` from
      scripts/governance/session_evidence/validate.py and running it over all 54 manifests: 27
      satisfy the clause and are rejected, 20 are accepted and violate the clause, 0 satisfy
      both. Reproduced independently by a second session with the same counts and the same two
      error strings. Reported as Issue #1201.
  - id: F2
    severity: MEDIUM
    statement: >-
      The requirement is not in the source the clause cites. It was introduced by this session
      when composing section 5 in PR #1091, in the same sentence as a correction that was itself
      correct.
    evidence: >-
      Issue #262 comment 7153428650: `sponsor` 1 occurrence, `accountable_owner` 1,
      `implementing_ai_session` 1, `top-level` 0, `顶层` 0, `assessor` 0, `assessed_version` 0,
      `evidence_baseline` 0. The one sentence carrying the three names says the registrations
      "carry" them and says nothing about where.
  - id: F3
    severity: HIGH
    statement: >-
      AID-2026-075 criterion C2 inherited the defect as an instruction. It directs the observer
      to read top-level fields and to report a nested-only `implementing_ai_session` as
      non-compliant, which would have reported 20 of 54 conformant manifests as violations on the
      authority of an unsatisfiable clause.
    evidence: >-
      AID-2026-075/manifest.yaml C2: "The check reads the top-level sponsor, accountable_owner and
      implementing_ai_session fields from each in-scope manifest. A nested-only
      implementing_ai_session does not satisfy the top-level field requirement."
  - id: F4
    severity: MEDIUM
    statement: >-
      Three records disclose the deviation without naming it a defect in the clause, so the
      deviation reads as each record's own shortfall rather than as an unsatisfiable rule.
      AID-2026-071 and AID-2026-075 both say "Known deviation, stated rather than repaired", and
      the INDEX row says the manifest does not satisfy the clause; none says the clause cannot be
      satisfied.
    evidence: >-
      AID-2026-071/manifest.yaml comment block above `authorization:`; the equivalent block in
      AID-2026-075/manifest.yaml; the AID-2026-071 row of 14-ai-development/work-items/INDEX.md.
  - id: F5
    severity: LOW
    statement: >-
      Ordering, recorded as it happened: the correction merged first (PR #1091), the
      unsatisfiability was measured afterwards in the same session while checking something else,
      and the report preceded this work item. The clause was live and wrong for zero further
      merges only because the next registration (AID-2026-078) happened to use the gate's shape.
    evidence: >-
      PR #1091 merge commit dd3b7662; Issue #262 comment 7170740216 reporting the measurement;
      AID-2026-078 registered at 1f5ba824 with `implementing_ai_session` inside
      `session_evidence[0]` only.

