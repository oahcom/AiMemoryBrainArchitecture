# ---------------------------------------------------------------------------
# ID reassignment, 2026-11-26. This work item was registered as AID-2026-079 and
# has been renumbered to AID-2026-080. The reason is a collision: PR #1078
# (T92 fault injection) merged into main with a directory
# `work-items/AID-2026-079/` of its own, and one work-item ID cannot name two
# work items. AID-2026-077 added a gate that is supposed to catch exactly this
# before merge; it did not fire here because the two registrations arrived on
# different branches, which is the branch-parallel form of the same defect.
#
# The executed prompt snapshot keeps the old number in its title line, because
# `prompt_sha256` pins the bytes that were executed and a renumbering is not a
# reason to break that pin. The mapping is stated here instead: a reader who
# finds `# AID-2026-079` inside `prompt-v1.md` is reading this work item, not
# the T92 fault-injection one. Everything else -- the manifest id, the INDEX
# row, the review records, the supersession annotations on 071 and 075 -- uses
# AID-2026-080.
# ---------------------------------------------------------------------------

