acceptance_criteria:
  - id: C1
    criterion: >-
      The location requirement is absent from both languages, and the invariant that replaces it
      is stated in both.
    measurement: >-
      `git diff -U0` on PR-GOVERNANCE-001.md shows exactly one changed line per language, and
      both changed lines state that each of the three fields appears in exactly one place.
  - id: C2
    criterion: No other sentence of section 5 changes, and the paragraph's non-exemption sentence is byte-identical.
    measurement: >-
      The diff is two changed lines and zero added or deleted lines; the closing sentence
      beginning "Exceptions follow the closing sentence of §5" and its Chinese counterpart are
      compared before and after with `cmp` on the extracted text.
  - id: C3
    criterion: >-
      The corrected clause is satisfiable, demonstrated by a manifest that satisfies the clause
      and is accepted by the gate.
    measurement: >-
      `parse_manifest_session_entries` accepts 22 of 56 manifests at `364ef4ad` (21 of 55 at
      `8d84c16e`, 20 of 54 at `1f5ba824`), and each of them carries the three names without
      declaring any of them in both places: `sponsor` and `accountable_owner` at top level, `implementing_ai_session` inside
      a `session_evidence` entry. The count is reported with the command that produced it, not
      asserted. Round 1 of the review required the wording to say this about *locations* rather
      than about a particular entry, because AID-2026-055 carries three.
  - id: C4
    criterion: The corrected clause is not vacuous.
    measurement: >-
      The same measurement reports the 7 manifests that name fewer than three principals - five
      carrying `accountable_owner` only (005, 006, 008, 009, 029) and two carrying none (024,
      025) - and names them, so a future count of 56/56 conformant is a visible change rather
      than an improvement. Under the amended wording 49 of 56 satisfy the clause at `364ef4ad`.
      The population is counted from `git ls-tree -r --name-only <ref>` filtered to
      `work-items/AID-*/manifest.yaml`, not carried over from an earlier Head: round 3 found the
      denominator stated as 55 when the tree held 56, because AID-2026-079 and AID-2026-080 both
      exist at this Head.
  - id: C5
    criterion: Nothing executable changes.
    measurement: >-
      `git diff --name-only` against the base contains no path under scripts/, .github/, tests/
      or crates/.
  - id: C6
    criterion: >-
      Every statement the correction retires is annotated rather than deleted, and each
      annotation names this work item.
    measurement: >-
      AID-2026-071/manifest.yaml, AID-2026-075/manifest.yaml and the AID-2026-071 row of INDEX.md
      each carry a dated superseded clause naming AID-2026-080; AID-2026-075/prompt-v1.md is
      unmodified, and its manifest carries a `prompt_supersession` entry naming the superseded
      passage and the digest pin that no longer matches it.
  - id: C8
    criterion: >-
      The executed-prompt snapshot is byte-identical to the snapshot the execution evidence names,
      and no review amendment changes it.
    measurement: >-
      Compare the blob, not the diff. `git rev-parse
      489b6048:14-ai-development/work-items/AID-2026-080/prompt-v1.md` and
      `git rev-parse a538dbf2:14-ai-development/work-items/AID-2026-079/prompt-v1.md` return the
      same blob SHA, `84342823a31a47fdad048e931314b0f0d8e6ca92`; the bytes hash to
      08f5e42efdef2c3380056fd8528cf057d6d2a7b25c366566a8599e2aff4df19a at 9932 bytes, equal to
      `session_evidence[0].executed_prompt_sha256` and `executed_prompt_bytes`, and equal to the
      values the manifest recorded at `a538dbf2` before any amendment existed. The diff test is
      NOT the measurement and must not be: the renumbering makes the file a path addition against
      the base, so `git diff --name-only` lists it even though its bytes never changed. Round 3
      found that defect in the first form of this criterion.
      Scope limit, stated so the criterion is not read as more than it is: this proves byte
      integrity against the recorded pin. It does not prove the file was the input the session
      actually read - `executed_prompt_provenance` is `NOT_VERIFIED` here and was at `a538dbf2`,
      because the session identity is `NOT_RECORDED` and no independent record of the executed
      input exists. Byte equality to a pin is not execution provenance, and C8 does not claim it.
      The amendment lives in REVIEW-AMENDMENT.md, which is not the executed prompt and says so in
      its first limit.
  - id: C7
    criterion: The review is at the exact Head and at the session level.
    measurement: >-
      The review names the Head SHA it read and the session that performed it, and claims no
      account-level approval. Section 9 requires an exact-Head governance review for changes to
      this standard; section 5's closing sentence says this paragraph is exemptible only by an
      exception record that names it, and none exists.

findings:
  - id: F1
    severity: HIGH
    statement: >-
      Section 5 item (2) required `implementing_ai_session` as a top-level field while the
      Session Evidence gate rejects every top-level `MANIFEST_FIELDS` key when a
      `session_evidence` block is present. The two rules cannot both be satisfied, and the clause
      was merged after the gate.
    evidence: >-
      Measured at 1f5ba824 by importing `parse_manifest_session_entries` from
      scripts/governance/session_evidence/validate.py and running it over all 54 manifests: 27
      satisfy the clause and are rejected, 20 are accepted and violate the clause, 0 satisfy
      both. Reproduced independently by a second session with the same counts and the same two
      error strings. Reported as Issue #1201.
  - id: F2
    severity: MEDIUM
    statement: >-
      The requirement is not in the source the clause cites. It was introduced by this session
      when composing section 5 in PR #1091, in the same sentence as a correction that was itself
      correct.
    evidence: >-
      Issue #262 comment 7153428650: `sponsor` 1 occurrence, `accountable_owner` 1,
      `implementing_ai_session` 1, `top-level` 0, `顶层` 0, `assessor` 0, `assessed_version` 0,
      `evidence_baseline` 0. The one sentence carrying the three names says the registrations
      "carry" them and says nothing about where.
  - id: F3
    severity: HIGH
    statement: >-
      AID-2026-075 criterion C2 inherited the defect as an instruction. It directs the observer
      to read top-level fields and to report a nested-only `implementing_ai_session` as
      non-compliant, which would have reported 20 of 54 conformant manifests as violations on the
      authority of an unsatisfiable clause.
    evidence: >-
      AID-2026-075/manifest.yaml C2: "The check reads the top-level sponsor, accountable_owner and
      implementing_ai_session fields from each in-scope manifest. A nested-only
      implementing_ai_session does not satisfy the top-level field requirement."
  - id: F4
    severity: MEDIUM
    statement: >-
      Three records disclose the deviation without naming it a defect in the clause, so the
      deviation reads as each record's own shortfall rather than as an unsatisfiable rule.
      AID-2026-071 and AID-2026-075 both say "Known deviation, stated rather than repaired", and
      the INDEX row says the manifest does not satisfy the clause; none says the clause cannot be
      satisfied.
    evidence: >-
      AID-2026-071/manifest.yaml comment block above `authorization:`; the equivalent block in
      AID-2026-075/manifest.yaml; the AID-2026-071 row of 14-ai-development/work-items/INDEX.md.
  - id: F5
    severity: LOW
    statement: >-
      Ordering, recorded as it happened: the correction merged first (PR #1091), the
      unsatisfiability was measured afterwards in the same session while checking something else,
      and the report preceded this work item. The clause was live and wrong for zero further
      merges only because the next registration (AID-2026-078) happened to use the gate's shape.
    evidence: >-
      PR #1091 merge commit dd3b7662; Issue #262 comment 7170740216 reporting the measurement;
      AID-2026-078 registered at 1f5ba824 with `implementing_ai_session` inside
      `session_evidence[0]` only.

