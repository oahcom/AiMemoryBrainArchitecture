acceptance_criteria:
  AC1: >-
    The three attributions name AID-2026-101 and keep AID-2026-090 visible as abandoned. Settled
    by reading the three fields and by grep returning no `by AID-2026-090` outside the historical
    review documents under AID-2026-080/.
  AC2: >-
    AID-2026-101's identifier_history names #1241 as the merge of AID-2026-090 and records that
    #1255 closed unmerged. Settled against GET /pulls/1241 and GET /pulls/1255.
  AC3: >-
    Every measured value in the five edited fields is byte-identical to its prior value except the
    three identifiers and the one digest that were wrong. Settled by a diff whose only changed
    tokens are AID-2026-090 -> AID-2026-101, PR #1255 -> PR #1241, and 2ac71e56 -> 89ac65f2.
  AC4: >-
    check_traceability.py --index-only and check_repository_hygiene.py both pass on the branch, the
    manifest digest audit reports zero mismatches, and the new INDEX-cell digest sweep reports zero
    disagreements -- including this work item's own row and pin.
  AC5: >-
    The INDEX-cell digest sweep is described in the evidence with the command that runs it, so the
    next session can re-run the check that found F3 rather than only reading that it was found.
  AC6: >-
    All 32 repinned manifests and AID-2026-106 hash to the committed bytes of the prompt they pin,
    and all 33 INDEX cells that restate a digest or byte count agree with them. Settled by the two
    sweeps reporting 0 mismatches and 0 disagreements, and by the old/new table in the evidence.
  AC7: >-
    No prompt file is restored and no superseded digest is deleted. Settled by the diff touching no
    prompt-v1.md under any repinned work item, and by every prior value appearing in the evidence
    table or in the corrections block.

