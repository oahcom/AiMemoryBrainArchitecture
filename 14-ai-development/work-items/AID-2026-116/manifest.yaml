# ---------------------------------------------------------------------------
# The three references below were written while the correction branch still held
# the identifier AID-2026-090, before a fourth collision forced it to 101. The
# number then went to the ContextVersion immutability work item, which is what
# makes these references dangerous rather than merely stale: the target exists,
# so nothing about the reference looks broken, and the reader who follows it finds
# a real manifest that has never heard of the correction.
#
# AID-2026-101's own identifier_history already declares 090 abandoned. The three
# sentences contradict the record that performed the correction.
# ---------------------------------------------------------------------------

findings:
  - id: F1
    severity: MEDIUM
    statement: >-
      AID-2026-047, AID-2026-072 and AID-2026-076 each end a field by crediting AID-2026-090 with
      the correction. AID-2026-090 is the ContextVersion immutability work item, merged by PR #1241
      at 2026-11-26T06:57:20Z, and its manifest never mentions any of the three.
    evidence: >-
      `grep -n "Corrected by AID-2026-090\|Refreshed by AID-2026-090"` returns exactly three lines,
      at AID-2026-047:31, AID-2026-072:67 and AID-2026-076:72. `grep -c "AID-2026-047\|AID-2026-072\|
      AID-2026-075\|AID-2026-076\|AID-2026-080\|AID-2026-101" AID-2026-090/manifest.yaml` returns 0.
      The correction those three sentences describe is itemised in AID-2026-101's `corrections:`
      block, which names all three paths as targets.
    cause: >-
      Timing, not substance. The correction branch held AID-2026-080, then 081, then 090, then 101.
      Each collision surfaced only on rebase, because the INDEX half merges cleanly under
      `merge=union` and the work-item directory is the only half that conflicts. The sentences were
      written under 090 and were not revisited when the number was lost.
    fix: >-
      Name AID-2026-101 as the correcting record and keep AID-2026-090 visible as the abandoned
      number, so a reader who already followed the wrong pointer learns why it was wrong rather
      than being silently redirected.

  - id: F2
    severity: MEDIUM
    statement: >-
      AID-2026-101's identifier_history says AID-2026-090 was "taken by the ContextVersion
      immutability work item, PR #1255". PR #1255 closed without merging. The pull request that
      merged that work item is #1241.
    evidence: >-
      GET /pulls/1255 returns `state: closed`, `merged: false`, title "docs(context): correct merged
      ContextVersion Work Item to pending AID". GET /pulls/1241 returns `merged: true`,
      `merge_commit_sha: 72c9e68a158a5a0a00936fc7fc0adfc1fa024b5c`, `merged_at:
      2026-11-26T06:57:20Z`, title "docs(context): define immutable ContextVersion boundary
      (AID-2026-090)". Every other file in the tree cites #1241 for this merge -- AID-2026-090's own
      manifest at line 51, AID-2026-085:176, AID-2026-091:100, AID-2026-093:227 -- so 101 is the
      single outlier.
    why_it_matters: >-
      Closed-unmerged and merged are the substitution INDEX.md forbids by name. The work item that
      wrote the rule about preserving prior values is the one that confused the two, in the field
      whose only job is to record what happened to an identifier.
    fix: >-
      Correct the pull request number and record that #1255 closed unmerged, so the sentence says
      which outcome occurred rather than only which pull request was involved.

  - id: F3
    severity: MEDIUM
    statement: >-
      The AID-2026-101 INDEX row's Prompt cell states SHA-256 2ac71e56…9b4f, which is neither the
      manifest's prompt_sha256 (89ac65f2…94c1) nor the digest of the file it names. It is the
      digest of the same prompt before the final renumbering, so it describes text that was never
      executed under the number the row registers.
    evidence: >-
      sha256(AID-2026-101/prompt-v1.md) = 89ac65f2d58e187451b7c0a98648d0dd4352e3dac79f521b8029b0432f7e94c1
      at 4470 bytes; manifest line 33 agrees. Substituting AID-2026-090 for AID-2026-101 in the
      committed file reproduces 2ac71e563b9c5f01aa217ee8846446cc9bc216a83f3d2f1952ae47b0edde9b4f
      exactly, at the same 4470 bytes. A repo-wide scan of all 43296 reachable objects finds exactly
      one blob with that digest, dcaaf0b20a2b7a34e5cf30ec934ce765c8a89e19, and `git rev-list
      --objects --all` attributes it to AID-2026-090/prompt-v1.md -- the path this prompt occupied
      under its third identifier. `git rev-list --all -- AID-2026-101/prompt-v1.md` returns a single
      blob, 5dd48bf7, whose content is the current 4470-byte text, so no 2ac71e56 version was ever
      committed at the 101 path.
    why_it_matters: >-
      The same shape as AID-2026-047, and the third instance of it. The digest is of the right file
      with the wrong identifier in it, and because the identifier has the same length the byte count
      is unchanged, so the size check cannot see it. Here it is worse than in 047: this row is the
      one that registers the correction whose subject is recording prior values accurately, and its
      own prompt pin was stale from the moment it was written.
    fix: >-
      Correct the cell to the digest of the committed bytes and record the superseded value, the
      substitution that reproduces it, and the blob it belongs to, so the next reader can tell a
      renumbering artifact from a fabricated measurement.
    how_it_was_missed: >-
      Every digest audit run in the preceding sessions compared a manifest's prompt_sha256 against
      the file it pins. None read the INDEX table, so a cell could drift from the manifest it
      summarises with nothing to notice. The sweep that found this one was written for this work
      item; it parses SHA-256 `<hex>` out of each Prompt cell and compares it both to the manifest
      and to the file bytes, and it reports this as the only disagreement among 52 rows that state a
      digest.

  - id: F4
    severity: HIGH
    statement: >-
      Thirty-two manifests pin a prompt digest that no longer describes any committed byte. PR #1281
      removed approval_scope's two permanently-empty keys from 36 prompt snapshots and repinned only
      its own work item's manifest, so every other manifest that pins one of those snapshots now
      declares the digest of text that exists nowhere.
    evidence: >-
      Commit 44b57170 (PR #1281, merged 2026-11-26T11:18:08Z) changes 278 files, of which 36 are
      prompt-v1.md and each loses exactly two lines: `included_sections: []` and
      `included_assets: []`. `git show 44b57170 | grep -c "^+prompt_sha256"` returns 2 -- its own
      manifest and AID-2026-103's. Running the digest audit at origin/main a7e7c64b reports 30
      matching and 33 mismatching, where the same audit on ba5b26b3 reported 54 matching and 0.
    why_it_matters: >-
      This is the failure the gate cannot see. `scripts/governance/session_evidence/validate.py`
      compares the digest in the session_evidence entry, and the INDEX cell is prose, so a wrong
      top-level prompt_sha256 survives indefinitely -- the same blind spot recorded as F2 of
      AID-2026-102. It also silently converts a correct record into a false one: a reader checking
      "does this manifest describe its prompt" now gets "no" for 32 work items that were correct
      this morning, and cannot tell those from the two genuine defects AID-2026-101 and -102 fixed.
    how_found: >-
      Incidentally. The sweep was re-run on the new base before opening this pull request, purely to
      confirm the base had not moved under the work. It had moved, and this came out.
    fix: >-
      Repin all 32 to the committed bytes, repin the 33 INDEX cells that restate them, and record
      every superseded value. No prompt file is restored: the frontmatter removal is correct, it was
      ordered by ruling 76 and it is what DM-02 now enforces, so the snapshots should lose those
      keys. The defect is that only one of the 37 pins moved with them.

  - id: F5
    severity: MEDIUM
    statement: >-
      AID-2026-106 is the same defect with the byte count unchanged, so the size check that would
      otherwise hint at the cause is silent.
    evidence: >-
      Its prompt-v1.md was also stripped of the two keys by commit 2fbb53d8, and it is 2998 bytes
      before and after. Declared 0ef83057...1daffd36, actual ed3345b0...86fa2ba0.
    why_it_matters: >-
      A repin that only guarded size would pass this one. It is listed separately so that a future
      reader does not conclude from the 58-byte uniformity of the other 32 that size is a usable
      proxy for correctness.

