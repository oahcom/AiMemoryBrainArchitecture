work_item_id: AID-2026-116
title: Repoint three attributions that name the work item a renumbering abandoned, and repin the 33 prompt digests a frontmatter removal invalidated
class: DOC/GOVERNANCE
risk: R1
risk_rationale: >-
  Documentation only. Thirty-three manifest digests, thirty-three INDEX cells, four prose
  attributions and one new work item are edited; no code, no checker, no workflow, no policy
  status. Two distinct defects are corrected. The first is misdirection: a reference to a work
  item that exists and is about something else reads as confirmation to anyone who follows it.
  The second is measurement: thirty-three manifests pinned a digest that no longer described any
  committed byte, because PR #1281 removed two frontmatter keys from their prompt snapshots and
  repinned only its own. Both are corrected by recomputation from the committed bytes, with every
  superseded value recorded rather than overwritten.
