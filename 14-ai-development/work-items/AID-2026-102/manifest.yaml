title: Give six DM-14 fixtures a directory they own, and bind the six emitters no case observed

class: TEST
risk: R2
risk_rationale: >-
  Tests only: one test module gains six cases and loses six shared-temp paths, and no production
  file, schema, workflow or gate behaviour is touched. The risk is false assurance in both
  directions. A fixture that writes to a shared path makes a case red for a reason unrelated to what
  it asserts, so a mutation run reports phantom positives and a binding count inflates; and a case
  added to bind an emitter can pass while observing a neighbouring emitter that fires on the same
  document. Both were measured rather than argued: the concurrency differential is 4 of 6 red before
  the change and 0 of 6 after, on one commit with only the fixture lines altered, and each of the
  six new cases was verified by deleting the emitter it names and requiring exactly that case to go
  red.

