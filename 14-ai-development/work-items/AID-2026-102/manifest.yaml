identifier_history: >-
  AID-2026-093 (first allocation, 2026-11-26) -> AID-2026-102 (current). The first allocation was
  made against a tree 45 commits behind main and collided: main had already registered AID-2026-093
  for DECISION-ACCEPTANCE-03, and that manifest records its own history of the same kind
  (081 -> 086 -> 092 -> 093), so the number was live rather than free. The collision surfaced as an
  add/add conflict on manifest.yaml during rebase, not as a validator error, because both sides
  created the path. Renumbering rather than reusing 093 is the only option that leaves both work
  items with one identity each; the alternative -- two manifests claiming one ID -- is what the
  INDEX uniqueness check exists to refuse.
