acceptance_criteria:
  - id: AC1
    criterion: >-
      No fixture in the file builds its target outside the directory the test owns.
    measurement: >-
      `grep -c 'Path(tmp).parent' scripts/test_check_document_management.py` is 0. Six sites
      existed before the change and the count is now zero.
  - id: AC2
    criterion: >-
      The file runs correctly with several processes sharing one system temp root, which is the
      arrangement that fails before the change.
    measurement: >-
      Six concurrent runs with one shared TMPDIR: 324/324 six times, rc 0 six times, and no
      `outside-*` entry left in that directory afterwards. The pre-change baseline on the same
      commit is 4 of 6 red, all with `exit 0` from the gate, which is why "it passed" alone is not
      the measurement.
  - id: AC3
    criterion: >-
      The bilingual-mirror symlink branch is observed by a case that fails when the branch is
      removed and when only its reason is reworded.
    measurement: >-
      Replacing the branch body with `pass` gives 323/324 with exactly T51b red; changing `real` to
      `genuine` gives the same. The first version of the case asserted only the verdict and stayed
      green under the wording mutation, which is why the reason is bound separately.
  - id: AC4
    criterion: >-
      Each of the five emitters this work item binds is observed by a case that fails when that
      emitter alone is removed, with no other case failing.
    measurement: >-
      Five deletions, each `323/324`, each with exactly its own case red and no collateral. The
      sites are the DM-01 non-string path, the DM-12 mirror source, the DM-13 string supersedes,
      and the two DM-14 registry-shape emissions.
  - id: AC5
    criterion: >-
      A case whose name advertises a rule it does not test is corrected rather than supplemented.
    measurement: >-
      T63's `enum on a boolean kind` row asserts `duplicate key 'enum'`, which the YAML parser
      produces before the schema check runs; it is renamed to `a second enum key`. The
      enum-on-kind branch it advertised is bound by the neighbouring `neither kind nor fields` case,
      measured by replacing that branch with `pass` and watching that case go red.

findings:
  - id: F1
    severity: HIGH
    statement: >-
      Six fixtures built their "outside the repository" target at a fixed name in the shared system
      temp root, so two runs of the file raced on one path and the loser reported a DM-14 assertion
      against a gate that had done nothing wrong.
    evidence: >-
      4 of 6 concurrent runs red on 8d84c16e with no mutation applied; 0 of 6 after nesting the
      repository one level. #989 comment 7184097261.
  - id: F2
    severity: MEDIUM
    statement: >-
      The bilingual mirror symlink branch had no case; deleting it left the suite green.
    evidence: >-
      318/318 with the branch body replaced by `pass`, before T51b. #988 comment 7184110940.
  - id: F3
    severity: MEDIUM
    statement: >-
      Five emitters were unobserved. Each was confirmed by deletion and then bound by a case that
      names its own diagnostic.
    evidence: >-
      Five deletions, suite green each time before the cases were added; five `BOUND-EXACT`
      results afterwards. #827 comment 7184611981.
  - id: F4
    severity: LOW
    statement: >-
      The claim in #988 that the enum-on-kind branch is unobserved is false. It is bound by a
      neighbouring case, and the row that made it look unobserved was misnamed.
    evidence: >-
      Replacing that branch with `pass` turns `T63 a node with no kind and no fields reports its
      own problem` red at 318/319.

