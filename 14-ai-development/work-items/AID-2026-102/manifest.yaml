work_item_id: AID-2026-102
title: Correct the AID-2026-092 prompt digest, which matched no version of its own file
class: DOC/GOVERNANCE
risk: R1
risk_rationale: >-
  Documentation only. Two fields of one manifest and one INDEX cell are edited; no code, no
  checker, no workflow and no policy status changes. The defect being corrected is that a
  registry field asserts a measurement nobody took, so the risk of the correction is a second
  wrong value, and the mitigation is that the new value is computed from the committed bytes
  by a command quoted in the record, and the old one is kept rather than deleted.
status: MERGED

