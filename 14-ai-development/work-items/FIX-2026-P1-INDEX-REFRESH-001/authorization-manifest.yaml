findings: |
  ## 5. Findings this correction closes

  ### FD-1 — FIX-2026-P1-T1 row contradicted the work item's own committed manifest

  The row asserted, at `b848138c`:

      Status:       REMEDIATION IN_PROGRESS — ... follow-up PR #270 OPEN/DRAFT
      Review:       Fresh independent exact-head R1 review PENDING
      Acceptance:   Owner A acceptance PENDING; no adoption/merge authorized for remediation

  Measured:

  | Claim | Measured | Source |
  |---|---|---|
  | PR #270 OPEN/DRAFT | `state=closed`, `merged=true`, `merged_at=2026-11-19T06:00:14Z` | `GET /pulls/270` |
  | review PENDING | manifest `review.status: PASS`, `blocking_findings: []`; terminal re-review comment `7002449698` | committed manifest + `GET /issues/comments/7002449698` |
  | acceptance PENDING | manifest `acceptance.status: ACCEPTED_WITH_CONDITIONS`, authority `A`, 5/5 conditions PASS | committed manifest |
  | merge not authorized | manifest `constraints`: "No merge or normative adoption is authorized by this work item." | committed manifest |

  The merge commit `c3bf7e47b5121c89277d3df55b12a7a95dcc9706` has exactly one
  parent (`9b67fb1b`), so PR #270 was squash- or rebase-merged, not merged with a
  merge commit. This is recorded because "merge commit only" is a standing
  requirement in several manifests and a single-parent commit cannot satisfy it.

  Whether the Owner-role acceptance at `7001139728` constituted separate merge
  authorization is NOT adjudicated here. The correction records both the
  constraint text and the acceptance record and leaves the judgement to a
  reviewer. Asserting either way from this evidence would be a verdict without a
  standard.

  #### FD-1 terminal disposition (adjudicated 2026-11-20)

  FD-1 was adjudicated `AUTHORIZED-UNDER-DEV-BASELINE` by ruling session
  `6aff5866-6a9c-83ec-910e-2e462517be4b` (S-axis separate session, same
  `oahcom` GitHub identity; platform-axis independence NOT MET). Ruling
  registration: Issue #264 comment `7021012962`. The standard the correction
  lacked is the user-ruled dev-baseline convergence path registered at Issue
  #264 comment `7000428916` (2026-11-19T05:14:48Z): development-chain carriers
  proceed through "code chain + Owner acceptance + PR/merge + registration"
  without waiting for quota unfreeze. Under that standard the merge
  authorization source for PR #270 is the convergence ruling itself; the
  Owner-role acceptance at `7001139728` is a link in that chain, not a separate
  merge authorization; and the work item constraint ("No merge or normative
  adoption is authorized by this work item") is not violated, because the
  authorization was never claimed from this work item. The single-parent commit
  `c3bf7e47` is registered separately as format deviation
  `F-FD1-FMT-01` (squash/rebase vs standing "merge commit only"); it does not
  reopen the authorization question. Ruling reply sha256
  `fe7168a6d3ec2b0e441598b3586c15bd2f6512e6639f9e024306c48baf041867`.

  ### FD-2 — FIX-2026-P1-T4-FU1 row frozen at pre-merge state

  Row asserted `OPEN — documentation-only remediation; PR pending this row` and
  `Review: PENDING`. Measured: PR #291 `merged=true`, `merged_at=2026-11-19T18:35:38Z`,
  merge `cd9c5cd037ba89f7f20bf333b50af9726c791159`; review chain R1 (`bb857ff`)
  PASS + 2xP2 + 1xP3, R2 (`6151d3e`) PASS, records in comment `7018368565`.

  ### FD-3 — FIX-2026-P1-T4-FU2 row frozen at pre-merge state

  Row asserted `OPEN — documentation-only; PR pending this row` and
  `Review: PENDING`. Measured: PR #293 `merged=true`, `merged_at=2026-11-19T18:43:59Z`,
  merge `b848138c97a7af9d636f3a762a84bae8bd6c53f4`; review chain R1 (`b412bb7`)
  PASS + 2xP2, R2 (`1e43d06`) PASS, records in comment `7018562862`.

  ### FD-4 — the rule gap that produced FD-1..FD-3

  `INDEX.md` mixed two kinds of content with different lifetimes and had no rule
  distinguishing them: binding facts (head SHA, merge SHA, run ID, comment ID,
  blob digest) are snapshots of a past observation and stay true; activity
  assertions ("PR pending", "review PENDING") are claims about the present and
  become false the moment the carrier merges. Because the table had no such rule,
  every Status cell was stale by construction at merge time, and the staleness was
  indistinguishable from a governance failure.

  Closed by adding a maintenance rule above the table. The same distinction is
  already normative for the remediation report (record boundary and snapshot
  policy); this extends it to the index.

