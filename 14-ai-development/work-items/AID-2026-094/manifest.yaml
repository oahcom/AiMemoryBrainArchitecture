scope:
  files_to_create:
    - 14-ai-development/work-items/AID-2026-094/manifest.yaml
    - 14-ai-development/work-items/AID-2026-094/prompt-v1.md
    - 14-ai-development/work-items/AID-2026-094/session-evidence-752.md
  files_to_modify:
    - crates/memory-domain/src/authorization.rs
    - 14-ai-development/work-items/INDEX.md
  files_out_of_scope: >-
    Every other path. In particular crates/memory-compiler/src/admission.rs, which was inspected
    and found to need no change: its single construction site is a struct literal passed
    immediately to `AttestorRef::from_issued_data`, so it never decodes an `AttestorData` and the
    new `Deserialize` does not reach it. Also out of scope: `AuthorizationDecisionData`, which has
    the same derived-`Deserialize` shape but no issue asking for it and no hand-written
    `Deserialize` on its ref to mirror.

findings:
  - id: F1
    severity: HIGH
    statement: >-
      `AttestorData`'s derived `Deserialize` bypassed `validate_attestor_data` entirely, so a
      value decoded from bytes could carry any issuer `IssuerId::new` accepts — including
      `someone-else` and the decision issuer — with nothing marking it unvalidated.
    evidence: >-
      Measured at `3a859ac0`, and unchanged on the `ba5b26b3` base this branch was rebased
      onto because neither commit touches `authorization.rs`: `serde_json::from_str::<AttestorData>`
      on a payload with
      `issuer: "someone-else"` returned `Ok(AttestorData { issuer: IssuerId(OpaqueId("someone-else")), .. })`.
      `AttestorRef` already routed through `from_issued_data`; the bare struct did not.
  - id: F2
    severity: MEDIUM
    statement: >-
      Option 1 was chosen over option 2 because it needs no parallel unvalidated constructor. The
      measurement is that nothing in the workspace decodes an `AttestorData`, so no internal
      caller needs an unchecked decode path.
    evidence: >-
      `grep -rn "from_str::<AttestorData|from_slice::<AttestorData|from_value::<AttestorData" crates/`
      returns no matches. The only non-test construction site is `admission.rs::issue_attestation`,
      which builds the struct by literal and passes it to `from_issued_data`.
  - id: F3
    severity: LOW
    statement: >-
      The existing test that smuggles an empty id past `OpaqueId`'s derived `Deserialize` remains
      reachable and was left unchanged; it decodes an `OpaqueId`, not an `AttestorData`.
    evidence: >-
      `authorization.rs` `attestor_data_rejects_empty_attestation_id` does
      `data.attestation_id = serde_json::from_str("\"\"").unwrap();` — an `OpaqueId` decode, which
      the change does not touch. The suite still runs it and it still passes.

implementation:
