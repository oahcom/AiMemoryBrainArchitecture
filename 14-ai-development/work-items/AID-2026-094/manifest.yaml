work_item_id: AID-2026-094
title: Close the unvalidated AttestorData deserialization boundary
class: DOMAIN/CODE/TEST
risk: R3
risk_rationale: >-
  A public domain type gains a hand-written `Deserialize` that calls the existing validator, and
  the derived one is removed. The blast radius is any consumer that decoded an `AttestorData`
  from bytes: it now fails on values the validator refuses. The measurement that bounds it is
  that no consumer decodes an `AttestorData` at all — the only non-test construction site is a
  struct literal in `memory-compiler`, already validated through `from_issued_data` — so the
  change is fail-closed on a path nothing currently takes. The risk of NOT making it is the one
  the issue reports: a caller obtains an `AttestorData` with an unsupported issuer and treats it
  as validated. R3 rather than R1 because the type is public API and the failure mode is silent
  acceptance of bad authority data.
status: DISPATCHED

