# ---------------------------------------------------------------------------
# The four decisions the Owner issued in round 20. These are rulings, not
# options for the implementer to re-litigate. Each is restated with the
# constraint the Owner attached to it.
# ---------------------------------------------------------------------------

owner_decisions:

  - id: D1
    question: "Is formal review required?"
    ruling: "Yes. At least one review from a non-authoring reviewing session. Independence is a property of the reviewing session, not of the GitHub account (#935): this repository has one collaborator who authored every PR, and GitHub forbids an account from approving its own PR, so an account-based definition is unsatisfiable by construction rather than unmet."
    current_status: "REQUIRED BUT UNSATISFIABLE BY CONSTRUCTION"
    current_status_components:
      - "Required: a formal Approved review from a non-author human."
      - "Current satisfaction: NOT SATISFIED."
      - "Unsatisfiable by construction, not enforcement failure. GET /collaborators returns [\"oahcom\"] -- one collaborator. GET /pulls?state=closed, every page, returns 795 closed PRs and user.login is oahcom for all 795. GitHub does not permit an account to approve a PR it authored, so the number of APPROVED review objects this repository can contain is not some-currently-zero: it is necessarily zero, for every PR, regardless of conduct. Reporting it as a governance measurement is reporting that a coin landed heads when the coin has one side."
      - "The finding that does carry information: of 662 merged PRs at 2026-11-24T18:47Z, 556 carry no review object at all -- the review-submission path was never walked, and a COMMENTED object was available throughout. 106 carry 170 objects, all COMMENTED, all by the authoring account. Review existed in form 106 times; in 556 merges it did not exist in any form."
      - "Third endpoint (issues/{n}/comments, POST-DENIAL-UNAUTHORISED-MERGE-001 section 7.2, issue #966), read at 2026-11-25T00:36Z over 681 merged of 795 closed: 4577 comments, all by oahcom, none by any other account; 406 merged PRs with a conversation comment, 317 of them before the merge, 232 after. Review activity is real and is not missing -- what is missing is any reviewer other than the author, in any channel."
      - "Zero-review merges since the freeze point (#875, 2026-11-24T04:54:07Z): 65 of the 70 that have merged. One of them, #946, merged after an explicit refusal naming that PR (POST-DENIAL-UNAUTHORISED-MERGE-001)."
      - "Waiver: NOT AUTHORISED."
      - "Remediation: restate D1 as a required status check produced by a check run that asserts a non-authoring reviewing session (#935). Do NOT add required_pull_request_reviews: it requires an object this account topology cannot produce and would make every PR unmergeable, including the PR that would fix the deadlock."
    current_status_wording: "D1 is a mandatory policy requirement, and as currently written it cannot be satisfied by construction: it requires approval from an account other than the author, this repository has one collaborator who authored every PR, and GitHub forbids self-approval. That is a specification defect, not a conduct defect. The requirement is not waived, not optional, and not evidence that review is unnecessary; it must be restated in a form this repository can express, namely a required status check asserting a non-authoring reviewing session."
    current_status_wording_zh: "D1 是强制政策要求，但按当前措辞它在构造上就不可满足：它要求来自非作者的账号批准，而本仓库只有一名 collaborator 且全部 PR 都由该账号提交，GitHub 又禁止自我批准。这是规格缺陷，不是行为缺陷。该项要求未被豁免、不是可选建议、也不表示审查没有必要；它必须改写成本仓库能够表达的形式，即一个断言存在非作者审查会话的 required status check。"
    status_history:
      - status: "REQUIRED BUT CURRENTLY UNSATISFIABLE"
        superseded_by: "REQUIRED, UNSATISFIED; ENFORCEMENT FAILURE"
        reason: "Accurate as a description of the approval gap, but insufficient once zero-review merges had accumulated. A requirement that cannot prevent its own violation is a different condition from one that merely cannot yet be met, and conflating the two understated the control failure. The full census later showed the stronger fact: no merged PR in the repository's history has ever carried an APPROVED review, so this is not a regression from a working state."
        evidence: "POST-DENIAL-UNAUTHORISED-MERGE-001; GOV-NC-2026-11-24-MERGE-FORM-DEVIATION-031 section 3.6; full-history census in POST-DENIAL-UNAUTHORISED-MERGE-001 section 7.1"
    constraints:
      - status: "REQUIRED, UNSATISFIED; ENFORCEMENT FAILURE"
        superseded_by: "REQUIRED BUT UNSATISFIABLE BY CONSTRUCTION"
        reason: "The enforcement wording named a conduct defect and implied a fix in behaviour. The measured topology shows that status was never reachable: one collaborator, who authored all 795 closed PRs, on a platform that forbids self-approval, makes APPROVED necessarily zero. The 556-of-662 zero-review-object figure is retained as the finding that carries information; APPROVED = 0 is arithmetic under this topology and is no longer the headline."
        evidence: "GET /collaborators -> [oahcom]; GET /pulls?state=closed all pages -> 795 closed, 795 authored by oahcom; POST-DENIAL-UNAUTHORISED-MERGE-001 sections 7.1 and 7.2; issue #982 comment 3 (Owner ruling, 2026-11-24T21:11:01Z); issue #966"
      - "The PR author's own review does not count as an independent approval."
      - "A formal review means a record in GET /pulls/{n}/reviews. It does not mean a comment, and it does not mean review_comments > 0. The two are different resources and must never be reported as one."
      - "The only legitimate path out of this state is formally designating another real human accountable person and recording their identity, duties, approval authority and the mapping to their GitHub account. Until then D1 must not be marked executable, and no second identity may be created in order to make a PR pass."
      - "A ChatGPT session's review, a GitHub Actions identity, or any automated actor is not a second accountable human and cannot satisfy D1."
      - "No evidence in this repository establishes a second appointed maintainer, independent reviewer or integration reviewer. This records that no second accountable person is established for the governance system to rely on; it does not assert that no such person exists anywhere."
      - "Recovery requires all four: a second human reviewer formally designated; independent approval actually executable; merge protection verified effective by a refused-merge test; and audit evidence that the control holds. Until then no PR depending on D1 may be authorised for merge."
      - "Do not manufacture a second approver by promoting a read-only account to write. Whether such an account is a distinct accountable human is a fact the repository cannot establish, and creating the appearance of independence is exactly what D1 forbids."

  - id: D2
    question: "Is Code Owner review required?"
    ruling: "Yes, but scoped to paths covered by CODEOWNERS. When a PR touches a governed path, at least one corresponding Code Owner must approve."
    constraints:
      - "Verify that Code Owner approval is actually required, not merely that a CODEOWNERS file exists. A file with no matching rule protects nothing."
      - "If CODEOWNERS is absent, its creation is in scope only if needed to make D2 testable. Which paths must have owners is the document owner's decision and is NOT granted here."

  - id: D3
    question: "May administrators bypass?"
    ruling: "No. Administrators must satisfy the review requirement and the required checks like any other actor."
    constraints:
      - "enforce_admins.enabled must be true after the change, and must be verified by API read, not assumed from the write succeeding."
      - "This decision does not address direct pushes to main. That is a separate vector and stays OPEN."

  - id: D4
    question: "How is the change verified?"
    ruling: "Read the protection rule back from the API, and perform a zero-review negative test confirming GitHub refuses the merge. Do not actually merge a non-compliant PR in order to test."
    constraints:
      - "The negative test records: the API request, the response status, the response body, the PR head SHA, and the required-check state at the time of the request."
      - "The negative test must not produce a merge. If it would, the test design is wrong, not the gate."

# ---------------------------------------------------------------------------
# Deliverables. Each one is a claim that must be checkable by a reader who
# does not trust this manifest.
# ---------------------------------------------------------------------------

deliverables:
  - "Branch protection on main updated so required_pull_request_reviews is present, with required_approving_review_count >= 1 and require_code_owner_reviews = true if D2 is testable."
  - "dismiss_stale_reviews = true, so a new commit invalidates an existing approval rather than letting it stand against code it never saw."
  - "enforce_admins.enabled = true, confirmed by API read after the write."
  - "A CODEOWNERS file covering the governed roots, or a recorded finding that D2 is NOT testable because no ownership mapping is authorized by this work item."
  - "A negative-test record containing the five fields D4 requires, showing a non-compliant merge was refused and nothing was merged."
  - "A before/after table of the full protection object, field by field, so a reader can see exactly which fields changed and which were already correct."
  - "The post-freeze zero-review instance line for PR #875, added to MERGE-FORM-DEVIATION-031 if not already present, without touching the frozen count in §13.7 of MERGE-AFTER-RULING-003."

acceptance_criteria:
  - id: AC1
    text: "GET /branches/main/protection returns required_pull_request_reviews with required_approving_review_count >= 1. Recorded with the raw response body, not a summary."
  - id: AC2
    text: "The same response shows dismiss_stale_reviews = true and enforce_admins.enabled = true. If the platform does not expose one of these, that fact is recorded rather than the field being reported as passing."
  - id: AC3
    text: "The required-check context list is unchanged from its pre-change value of 11 contexts, and strict remains true. This work item must not weaken any existing check in order to add review."
  - id: AC4
    text: "If CODEOWNERS exists and covers a governed path, a PR touching that path is refused when the Code Owner has not approved. If CODEOWNERS is not authorized, a finding records D2 as NOT_VERIFIABLE with the reason, and D2 is not reported as satisfied."
  - id: AC5
    text: "The negative test shows a refused merge with the response body recorded verbatim. A test that merges, or that relies on a client-side pre-check instead of the platform refusal, does not satisfy this criterion."
  - id: AC6
    text: "No formal review is fabricated anywhere in the record. The negative test uses an account that legitimately cannot self-approve, and the record states which account and why."
  - id: AC7
    text: "The frozen zero-review count in MERGE-AFTER-RULING-003 §13.7 is unchanged by this work item. Verified by diffing that file against the base commit."

