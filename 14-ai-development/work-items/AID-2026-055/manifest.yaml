work_item_id: AID-2026-055
title: Require formal review on main, and prove the requirement by being refused

class: GATE/CONFIG/TEST
risk: R2
risk_rationale: "Changes the branch protection state of main, which is the mechanism every other gate depends on. A misconfiguration does not fail loudly: it either leaves the repository exactly as unprotected as before while appearing to be fixed, or it locks main so that no change can land at all. Both outcomes are invisible to the check suite, because the check suite does not read branch protection. The verification is therefore not 'the setting was written' but 'a non-compliant merge was refused and the refusal body recorded'. Criterion 6 is a negative test for exactly that reason: the only acceptable evidence of a review requirement is a merge that the platform would not perform."

security_scope: "None. No Rust, no transport, no authorization path, no storage. The change is branch protection configuration on oahcom/AiMemoryBrainArchitecture, one CODEOWNERS file if absent, and one negative-test record."

status: DISPATCHED

sponsor: USER-PRINCIPAL-DELEGATED
