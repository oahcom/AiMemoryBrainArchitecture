findings:
  - id: AID-2026-055-F1
    severity: P1
    feedback_destination: "Delivery PR conversation. required_pull_request_reviews is absent from main's protection today, which is why both #707 and #875 merged with zero formal reviews. The absence is the whole defect: the required-check list is 11 contexts and every one of them was green on #875, so check coverage cannot substitute for review coverage. A repository can be fully check-gated and still merge unreviewed code indefinitely."
  - id: AID-2026-055-F2
    severity: P1
    feedback_destination: "Delivery PR conversation. enforce_admins is already true, and it does NOT prevent a direct push to main. Conflating the two is the mistake this work item must avoid in its own write-up: the branch protection API controls merges through the PR path, while a direct push is a different vector that stays OPEN after this change."
  - id: AID-2026-055-F3
    severity: P1
    feedback_destination: "Delivery PR conversation. There is no second established accountable person. Every action in this repository is attributed to one account, and no record appoints a second maintainer, independent reviewer or integration reviewer. D1 therefore requires an approver who does not exist, and the work item must record D1 as REQUIRED, UNSATISFIED; ENFORCEMENT FAILURE rather than resolving it by counting the author's own review, minting a second identity, or softening the requirement. This is a finding about what the governance record establishes, not a claim about the world."
  - id: AID-2026-055-F4
    severity: P1
    feedback_destination: "Delivery PR conversation. The fixed new-file allowlist has no rule for any YAML path, so before PR #893 every new work item was unregistrable: a work item is `work-items/AID-<id>/manifest.yaml`, and admission refused it with `no allowlist rule`. PR #893 fixes that one shape by anchored regex. This manifest could not exist without it, which is why the gate fix is its own PR and this registration follows it."
  - id: AID-2026-055-F5
    severity: P2
    feedback_destination: "Delivery PR conversation. Turning on required review without a second approver available would deadlock main: every PR would be unmergeable, including the PR that fixes the deadlock. The change order matters. The negative test should be run in a way that can be reverted, and the manifest should state the revert path before the setting is written, not after."
  - id: AID-2026-055-F6
    severity: P2
    feedback_destination: "Delivery PR conversation. The required-check list must not be disturbed. A protection PUT that omits required_status_checks replaces the whole object, and would silently drop all 11 contexts. The write must send the complete object, and AC3 exists to catch a write that quietly reduced check coverage while appearing to add review."

notes:
  - "The four decisions D1-D4 are the Owner's, issued in round 20. The implementer may not soften D1 to 'review recommended' or D3 to 'admins may bypass with justification'. If a decision proves unimplementable, that is a finding, not a renegotiation."
  - "This work item does not close the risk. Risk 2 closes only when the protection rule is configured, the API state is verified, and the zero-review negative test is refused. Until all three hold, the risk stays OPEN regardless of how much of this manifest is complete."
  - "F3 is the load-bearing finding. Everything else in this work item is configuration; F3 is the question of whether the requirement can be satisfied at all by the actors who exist."
