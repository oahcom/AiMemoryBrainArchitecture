# ---------------------------------------------------------------------------
# The four decisions the Owner issued in round 20. These are rulings, not
# options for the implementer to re-litigate. Each is restated with the
# constraint the Owner attached to it.
# ---------------------------------------------------------------------------

owner_decisions:

  - id: D1
    question: "Is formal review required?"
    ruling: "Yes. At least one review from a non-authoring reviewing session. Independence is a property of the reviewing session, not of the GitHub account (#935): this repository has one collaborator who authored every PR, and GitHub forbids an account from approving its own PR, so an account-based definition is unsatisfiable by construction rather than unmet."
    # 2026-11-25: the value below is kept verbatim and annotated in place,
    # because it is this record's own claim and a record that edits its own
    # claims is not a record. Read it as scoped to the account layer.
    current_status: "REQUIRED BUT UNSATISFIABLE BY CONSTRUCTION〔2026-11-25 附注：「按构造不可满足」只对**账号层**的形式成立——GitHub 按用户计数并禁止自我批准，故 `collaborators = 1` 下不可能产生 `APPROVED` 对象。对本条 D1 自己写下的要求它不成立：2026-11-24 修订（#935）把独立性放在**会话**层，同一身份下的另一会话即可满足。合格会话尚未运行，所以状态仍不是 SATISFIED；「未运行」与「无法运行」是两件不同的事，D1 不得凭后者被标为可执行〕"
    current_status_parts:
      - id: D1-a
        status: "SATISFIABLE, NOT SATISFIED"
        text: "The requirement: a review from a non-authoring reviewing session. A separate session can produce that record, so the requirement is satisfiable; no such record exists, so it is not satisfied. This is the part that governs whether D1 has been met."
      - id: D1-b
        status: "NECESSARILY ZERO, AND NOT THE REQUIREMENT"
        text: "The account-level formulation that D1-a replaced: a formal `Approved` object from an account other than the author. One collaborator authored all 795 closed PRs and GitHub forbids self-approval, so the zero is arithmetic, not conduct. Because it is no longer the requirement, that zero is not a control failure and must not be read as one."
    current_status_components:
      - "D1-a -- the requirement, and it is satisfiable. Required: a review from a non-authoring reviewing session. Independence is a property of the reviewing session, not of the GitHub account (#935). The account-level form (a formal Approved object from an account other than the author) is what the paragraph below measures as necessarily zero; it is recorded there as the reason the account-level form cannot be the requirement, not as the requirement."
      - "D1-a current satisfaction: NOT SATISFIED. D1-b is not a requirement, so it can be neither satisfied nor violated; it is a platform arithmetic fact about one retired formulation."
      - "D1-b -- the retired account-level formulation. Unsatisfiable by construction, not enforcement failure. GET /collaborators returns [\"oahcom\"] -- one collaborator. GET /pulls?state=closed, every page, returns 795 closed PRs and user.login is oahcom for all 795. GitHub does not permit an account to approve a PR it authored, so the number of APPROVED review objects this repository can contain is not some-currently-zero: it is necessarily zero, for every PR, regardless of conduct. Reporting it as a governance measurement is reporting that a coin landed heads when the coin has one side."
      - "The finding that does carry information: of 662 merged PRs at 2026-11-24T18:47Z, 556 carry no review object at all -- the review-submission path was never walked, and a COMMENTED object was available throughout. 106 carry 170 objects, all COMMENTED, all by the authoring account. Review existed in form 106 times; in 556 merges it did not exist in any form."
      - "Third endpoint (issues/{n}/comments, POST-DENIAL-UNAUTHORISED-MERGE-001 section 7.2, issue #966), read at 2026-11-25T00:36Z over 681 merged of 795 closed: 4577 comments, all by oahcom, none by any other account; 406 merged PRs with a conversation comment, 317 of them before the merge, 232 after. Review activity is real and is not missing -- what is missing is any reviewer other than the author, in any channel."
      - "Zero-review merges since the freeze point (#875, 2026-11-24T04:54:07Z): 65 of the 70 that have merged. One of them, #946, merged after an explicit refusal naming that PR (POST-DENIAL-UNAUTHORISED-MERGE-001)."
      - "Mechanism check, 2026-11-25T02:52Z: `GET /branches/main/protection` now lists 16 required contexts. Three are `Session Evidence`, `Session Evidence self-test (base)` and `Session Evidence self-test (head)`; a fourth, `rust-workspace-test`, was added only after #1027 removed its workflow's `pull_request.paths` filter, because a required context that is never scheduled is permanently absent rather than pending. The gap D1 named is therefore narrower than when this record was written: a session-attested required status check exists and is enforced. It does not yet satisfy D1, because what it attests is the *implementing* session -- `MANIFEST_FIELDS` in scripts/governance/session_evidence/validate.py begins with `implementing_ai_session`, `role` is free text, and no code path requires a `REVIEWER` role or a session distinct from the authoring one. A PR that declares only `role: IMPLEMENTER` passes. So D1-a remains what `current_status_parts` says it is -- satisfiable and not satisfied -- and what has changed is only that a carrier now exists which does not yet assert review."
      - "Waiver: NOT AUTHORISED."
      - "Remediation: restate D1 as a required status check produced by a check run that asserts a non-authoring reviewing session (#935). Do NOT add required_pull_request_reviews: it requires an object this account topology cannot produce and would make every PR unmergeable, including the PR that would fix the deadlock."
    current_status_wording: "D1 has two parts and they are not the same kind of claim. **D1-a** is the requirement: a review from a non-authoring reviewing session. It is satisfiable -- a separate session can produce that record -- and it is not satisfied. **D1-b** is the account-level formulation that D1-a replaced: a formal `Approved` object from an account other than the author. Under this topology it is necessarily zero, and because it is no longer the requirement, that number is arithmetic about a retired form rather than a control failure. The two are recorded separately in `current_status_parts`. `current_status` is left verbatim, with #1059's annotation scoping it to the account layer, because a record that edits its own claim is not a record; what a reader needs in order not to conclude that independence itself is impossible here is the two-part reading, and that is what `current_status_parts` carries. `current_status_components` records the measurements and the supporting arithmetic behind those two parts."
    current_status_wording_zh: "D1 分为两半，而它们不是同一类断言。**D1-a** 才是要求：由未撰写该变更的审查会话作出审查。它可满足——另一个会话可以产出该记录——且尚未满足。**D1-b** 是被 D1-a 取代的账号级口径：来自非作者账号的正式 `Approved` 对象。在本拓扑下它必然为零，而由于它已不再是要求，那个零是关于一个已退役形式的算术，不是控制失效。两者分别记录在 `current_status_parts`。`current_status` 保持原样，并以 #1059 的附注将其限定在账号层——因为一份改写自己断言的记录就不再是记录；读者需要的、足以不推出「独立性本身在这里不可能」的，是这两半的读法，而那正是 `current_status_parts` 承载的内容。"
    status_history:
      - status: "REQUIRED, UNSATISFIED; ENFORCEMENT FAILURE"
        superseded_by: "REQUIRED BUT UNSATISFIABLE BY CONSTRUCTION"
        superseded_by_note: "The last link terminates at `current_status`, which is this string plus the annotation #1059 appended. The comparison is a prefix comparison, not string equality; the annotation refines the claim, it does not replace it."
        reason: "The status that named the gap as a conduct defect, retired because the enforcement wording implied a fix in behaviour while the measured topology shows the conduct reading was never available. It is recorded here rather than in `constraints` because it is a retired status, not a live constraint; keeping it in `constraints` put a historical record at index 0 of a list of live obligations, and left the preceding `status_history` entry pointing at a status that resolved outside the chain."
        evidence: "POST-DENIAL-UNAUTHORISED-MERGE-001 sections 7.1 and 7.2; GOV-NC-2026-11-24-MERGE-FORM-DEVIATION-031 section 3.6"
      - status: "REQUIRED BUT CURRENTLY UNSATISFIABLE"
        superseded_by: "REQUIRED, UNSATISFIED; ENFORCEMENT FAILURE"
        reason: "Accurate as a description of the approval gap, but insufficient once zero-review merges had accumulated. A requirement that cannot prevent its own violation is a different condition from one that merely cannot yet be met, and conflating the two understated the control failure. The full census later showed the stronger fact: no merged PR in the repository's history has ever carried an APPROVED review, so this is not a regression from a working state."
        evidence: "POST-DENIAL-UNAUTHORISED-MERGE-001; GOV-NC-2026-11-24-MERGE-FORM-DEVIATION-031 section 3.6; full-history census in POST-DENIAL-UNAUTHORISED-MERGE-001 section 7.1"
    constraints:
      - "D1 is not waived and is not satisfiable by the author's own review: the requirement is a review from a session other than the authoring one, recorded so that it can be inspected. Every retired formulation of D1, with its reason, is in `status_history`; none of them is a live obligation."
      - "The PR author's own review does not count as an independent approval."
      - "A formal review means a record in GET /pulls/{n}/reviews. It does not mean a comment, and it does not mean review_comments > 0. The two are different resources and must never be reported as one."
      - "The only legitimate path out of this state is establishing a reviewing session that is not the authoring session, and recording its identity, its scope of review, and the evidence that the review happened. Until then D1 must not be marked executable, and no second GitHub identity may be created in order to make a PR pass."
      - "A reviewing session is not required to be a human being, and is not required to be a separate GitHub account; it is required to be a session other than the one that authored the change, whose review is recorded and can be shown to have preceded the merge. An automated actor may therefore satisfy D1 only by producing that record. What it may never do is produce the record for its own change: a session reviewing its own work is the authoring session, whatever account it runs under."
      - "No evidence in this repository establishes a second appointed maintainer, independent reviewer or integration reviewer. This records that no second accountable person is established for the governance system to rely on; it does not assert that no such person exists anywhere."
      - "Recovery requires all four: a non-authoring reviewing session formally designated; that review actually executable as a required status check; merge protection verified effective by a refused-merge test; and audit evidence that the control holds. Until then no PR depending on D1 may be authorised for merge."
      - "Do not manufacture a second approver by promoting a read-only account to write. Whether such an account is a distinct accountable human is a fact the repository cannot establish, and creating the appearance of independence is exactly what D1 forbids."
    prompt_supersession: |
      `prompt_file` names the executed-input snapshot, and that snapshot was never re-edited after the
      D1 was restated in two parts. The passages that state the older single-formulation view are enumerated below
      rather than quietly amended, because the file is evidence of what the sessions were given:

      - line 68, the §2 table row: "at least one `Approved` review from an account that is not the PR
        author. **Current status: REQUIRED, UNSATISFIED; ENFORCEMENT FAILURE**". The account-level
        form is D1-b, which is necessarily zero and is no longer the requirement; the live
        requirement is D1-a, recorded in `current_status_parts`. The status string is scoped to the
        account layer by #1059's annotation and is left verbatim.
      - line 77, the §3 blockquote: "D1 is a mandatory policy requirement, but is currently
        unsatisfiable because no second accountable human approver has been established." This is
        the sentence the split exists to retire. It is true of D1-b and false of D1-a.
      - lines 95 and 97, §3: the prohibition on treating "a ChatGPT review, a GitHub Actions identity,
        or any automated actor as the second human", and "**The only legitimate path out of this
        state** is formally designating another real human accountable person". These are superseded
        by `constraints`: a reviewing session need not be a human being and need not be a separate
        GitHub account, and an automated actor may satisfy D1 by producing a recorded review.
      - lines 102-104, §3: "Until then, AC1 can be configured and AC5 can be satisfied by a refusal",
        and "AC4 cannot be satisfied by a real approver". Under this work item AC1 is the required
        status check whose check run asserts a non-authoring reviewing session, not the
        `required_pull_request_reviews` object; AC4's second branch is the operative one and its
        trigger is "no ownership mapping is authorized", not "CODEOWNERS is not authorized".
      - lines 118-128, the §5 acceptance table: AC1 requires `required_pull_request_reviews.required_approving_review_count >= 1`,
        AC2 requires `dismiss_stale_reviews = true`, and AC3 requires that the contexts "still number 11".
        All three are superseded by this work item's AC1, AC2 and AC3, which forbid adding the
        `required_pull_request_reviews` object at all and state 16 contexts. The line just above the table,
        on `required_status_checks` replacing the object "and silently drops all 11 contexts", is
        superseded by AC3 in the same way.
      Operative text is `current_status_parts` -- which states which part is the requirement -- together
      with `current_status_components`, `constraints` and this work item's AC1-AC7. `current_status` is the
      record's verbatim claim about the account layer, with #1059's annotation, and is not by itself a
