      appear to have executed text they never saw — would make the pin true and the record false.


  - id: D2
    question: "Is Code Owner review required?"
    ruling: "Yes, but scoped to paths covered by CODEOWNERS. When a PR touches a governed path, at least one corresponding Code Owner must approve."
    constraints:
      - "Verify that Code Owner approval is actually required, not merely that a CODEOWNERS file exists. A file with no matching rule protects nothing."
      - "If CODEOWNERS is absent, its creation is in scope only if needed to make D2 testable. Which paths must have owners is the document owner's decision and is NOT granted here."

  - id: D3
    question: "May administrators bypass?"
    ruling: "No. Administrators must satisfy the review requirement and the required checks like any other actor."
    constraints:
      - "enforce_admins.enabled must be true after the change, and must be verified by API read, not assumed from the write succeeding."
      - "This decision does not address direct pushes to main. That is a separate vector and stays OPEN."

  - id: D4
    question: "How is the change verified?"
    ruling: "Read the protection rule back from the API, and perform a zero-review negative test confirming GitHub refuses the merge. Do not actually merge a non-compliant PR in order to test."
    constraints:
      - "The negative test records: the API request, the response status, the response body, the PR head SHA, and the required-check state at the time of the request."
      - "The negative test must not produce a merge. If it would, the test design is wrong, not the gate."

# ---------------------------------------------------------------------------
# Deliverables. Each one is a claim that must be checkable by a reader who
# does not trust this manifest.
# ---------------------------------------------------------------------------

deliverables:
  - "A required status check on main whose check run asserts that a non-authoring reviewing session reviewed the exact head, and which is listed in required_status_checks.contexts so that a missing or failing assertion blocks the merge. (Superseded deliverable, withdrawn 2026-11-25: "Branch protection on main updated so required_pull_request_reviews is present, with required_approving_review_count >= 1". It is withdrawn because D1's remediation forbids that write and because the object it requires is necessarily zero under this topology; keeping it as a deliverable made this manifest simultaneously forbid and certify the same write. The withdrawal is recorded here rather than deleted so the correction is auditable.)"
  - "dismiss_stale_reviews = true, so a new commit invalidates an existing approval rather than letting it stand against code it never saw. (Superseded deliverable, withdrawn 2026-11-25: `dismiss_stale_reviews` is a subfield of `required_pull_request_reviews`, which this work item's remediation forbids adding and which is absent from the payload, so this deliverable required a value that cannot exist. It is withdrawn for the same reason deliverable 1's branch-protection form was, and the staleness it guarded against does not arise here: with no approval object there is no stale approval to dismiss.)"
  - "enforce_admins.enabled = true, confirmed by API read after the write."
  - "A CODEOWNERS file covering the governed roots, or a recorded finding that D2 is NOT testable because no ownership mapping is authorized by this work item."
  - "A negative-test record containing the five fields D4 requires, showing a non-compliant merge was refused and nothing was merged."
  - "A before/after table of the full protection object, field by field, so a reader can see exactly which fields changed and which were already correct."
  - "The post-freeze zero-review instance line for PR #875, added to MERGE-FORM-DEVIATION-031 if not already present, without touching the frozen count in §13.7 of MERGE-AFTER-RULING-003."

acceptance_criteria:
  - id: AC1
    text: "GET /branches/main/protection lists the session-attestation check in required_status_checks.contexts, and a pull request whose head carries no passing attestation is refused. Recorded with the raw response body, not a summary. required_pull_request_reviews is NOT part of this criterion: it is necessarily unsatisfiable here and must not be added."
  - id: AC2
    text: "The same response shows enforce_admins.enabled = true. `dismiss_stale_reviews` is NOT part of this criterion: it is a subfield of `required_pull_request_reviews`, which is absent from the payload and must not be added, so requiring it would make this criterion unsatisfiable by the same construction that made AC1's original form unsatisfiable. If the platform does not expose `enforce_admins.enabled`, that fact is recorded rather than the field being reported as passing."
  - id: AC3
    text: "No existing required check is removed or weakened by this work item, and strict remains true. The list read 11 contexts when this work item was registered, 12 at 2026-11-24, and 16 at 2026-11-25T02:52Z. The four additions are `Session Evidence`, `Session Evidence self-test (base)`, `Session Evidence self-test (head)` and `rust-workspace-test`; the criterion is that the set only grows, never shrinks."
  - id: AC4
    text: "If CODEOWNERS exists and covers a governed path, a PR touching that path is refused when the Code Owner has not approved. The first branch is not executable within this work item: refusing a PR for want of a Code Owner approval requires `required_pull_request_reviews.require_code_owner_reviews`, which `branch_protection_write` does not authorise. So the operative branch is the second: if no ownership mapping is authorized -- CODEOWNERS creation itself is authorised, the mapping is not -- a finding records D2 as NOT_VERIFIABLE with the reason, and D2 is not reported as satisfied."
  - id: AC5
    text: "The negative test shows a refused merge with the response body recorded verbatim. A test that merges, or that relies on a client-side pre-check instead of the platform refusal, does not satisfy this criterion."
  - id: AC6
    text: "No formal review is fabricated anywhere in the record. The negative test uses an account that legitimately cannot self-approve, and the record states which account and why."
  - id: AC7
    text: "The frozen zero-review count in MERGE-AFTER-RULING-003 §13.7 is unchanged by this work item. Verified by diffing that file against the base commit."

