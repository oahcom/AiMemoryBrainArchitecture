dependencies:
  - item: PR #249
    status: CLOSED_MERGED
    merge_commit: b663c8fde45dd5db3b02c434c47def34a6d1fefe
    dependency_role: >-
      Post-merge verification of Scope validation, nested Claim filtering,
      Scope identity equality and caller authorization boundaries.
  - item: PR #251
    status: CLOSED_MERGED
    merge_commit: ed842fa7ce9dd9df7b808495abd5cd1071850547
    dependency_role: >-
      Upstream RFC-IDE-001 proposal for ProducerIdentity, Scope,
      IdempotencyKey and Receipt replay semantics. RFC adoption and
      unresolved Owner decisions remain separate gates.

deliverables:
  - >-
    Architecture decision proposal comparing Scope identity and
    authorization-boundary alternatives.
  - >-
    Post-merge source-level verification of relevant #249 implementation
    against the exact current main commit.
  - >-
    Contract alignment and unresolved-decision register for RFC-IDE-001
    from #251.
  - >-
    Reproducible negative-test and evidence plan for Scope isolation,
    unauthorized request Scope, identity collisions and Receipt replay.
  - >-
    Owner decision requests and independent review handoff materials.
  - 14-ai-development/work-items/INDEX.md registration row
  - Issue #264 Work Item association record

scope:
  - >-
    Reconcile REQ-03 requirements with the actual merged state of PR #249
    and PR #251; do not treat historical pre-merge findings as current
    implementation facts without re-verification.
  - >-
    Verify caller authorization responsibility separately from storage
    Scope intersection and data filtering.
  - >-
    Verify whether Scope identity uses scope_id alone or a complete
    authoritative identity including scope_kind and namespace_key.
  - >-
    Verify nested Claim filtering and prevent cross-Scope metadata or
    content disclosure.
  - >-
    Reconcile ProducerIdentity composition, IdempotencyKey namespace,
    RequestDigest canonicalization and Receipt replay authorization.
  - >-
    Record unresolved Owner decisions and independent R3 review needs.
  - >-
    Preserve exact commit, test and review evidence for each conclusion.

non_goals:
  - No new Issue, PR or branch creation without separate authorization.
  - No modification, reopening or retargeting of PR #249 or PR #251.
  - No inference that RFC-IDE-001 is ADOPTED merely because PR #251 merged.
  - No inference that historical findings are closed merely because PR #249 merged.
  - No production-readiness or security-acceptance claim without required evidence.
  - No quota-unfreeze declaration or coordinator action.
  - No use of Desktop Commander.
  - No local WSL project-file editing.

acceptance:
  - >-
    Manifest is valid YAML and contains the required Work Item identity,
    title, owning Issue, Owner role, status, source provenance and
    acceptance criteria.
  - >-
    AID-2026-009 manifest exists at the exact required path on remote 43.
  - >-
    INDEX.md contains the matching AID-2026-009 entry.
  - >-
    Issue #264 contains the Work Item association record.
  - >-
    L0 returns remote read-back, SHA-256, file list and git status.
  - >-
    Post-merge conclusions identify the exact tested main commit and
    distinguish verified facts from unresolved assumptions.
  - >-
    R3 independent security/domain expert review and reproducible
    evidence are completed before acceptance.
  - >-
    Relevant Owner decisions are explicitly recorded; no self-acceptance.
  - >-
    REQ-03 overall acceptance is decided by its authorized authority,
    not inferred from Work Item registration.

