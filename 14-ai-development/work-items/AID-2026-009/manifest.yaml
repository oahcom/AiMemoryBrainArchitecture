risk_rationale: >-
  The planned architecture work concerns Scope authorization boundaries,
  typed identity, idempotency, Receipt disclosure and persistent storage
  isolation. These are security- and integrity-relevant boundaries.
  R3 independent security/domain expert review and reproducible evidence
  are required before acceptance.
