scope:
  objective: >-
    Implement check 12 in the Session Evidence Gate. Every declared blob
    identity must resolve to a regular committed blob and match the original
    bytes in the merge candidate tree. Explicit historical source pins may
    resolve only through an exact, independently retrievable source commit.
  in_scope:
    - "Add the standard-library-only blob_pins.py module."
    - "Add check_12_blob_pin_integrity to validate.py."
    - "Bind digest keys to exact sibling path keys."
    - "Verify Git blob SHA-1 against both the tree entry and recomputed bytes."
    - "Verify SHA-256 declarations against original committed bytes."
    - "Support the explicitly declared d_source_blobs historical source form."
    - "Add offline adversarial tests."
    - "Record implementation and mutation evidence."
  out_of_scope:
    - "Rewrite or normalize existing historical manifests."
    - "Require historical source blobs to exist in the current main tree."
    - "Change checks 01, 02, 03, 04, 06, 09 or 11."
    - "Introduce third-party YAML dependencies."
    - "Silently skip unresolved pins."
    - "Close Issue #1349 or Issue #1350."
    - "Deployment or production authorization."

