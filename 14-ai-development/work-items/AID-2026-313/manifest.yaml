implementation:
  status: IMPLEMENTED
  summary: >-
    _embedded_ipv4 decodes the carried address through ipaddress' own
    ipv4_mapped / sixtofour / teredo properties; _is_public_destination applies
    the previous predicate to the envelope and then to the embedded address.
    Reproduced at the base commit (both 6to4 forms accepted), fixed at head.
    Full suite: 1255 tests, 2 failures, both pre-existing CJK-console cases in
    tests/test_cdp_import_order.py that fail identically at the base commit.
