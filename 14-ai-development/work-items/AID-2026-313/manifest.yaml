scope:
  objective: >-
    Close the IPv6 transition-form SSRF bypass: assert_safe_url judged only the
    outer address, so 2002::1 (6to4 carrying 0.0.0.0) and 2002:c0a8:101::1
    (6to4 carrying 192.168.1.1) were accepted.
  included:
    - "Decode the IPv4 address carried by 6to4 (2002::/16), Teredo (2001::/32) and IPv4-mapped (::ffff:0:0/96)."
    - "Apply the existing rejection set to the embedded address, one level deep."
    - "Negative tests for six non-public embedded forms, positive tests for two public ones."
    - "Keep every other SSRF policy decision, error code and check order unchanged."
  excluded:
    - "NAT64 64:ff9b::/96 unwrapping (not authorized by the ruling)."
    - "Any change to deployment, credentials, MCP transport or the account registry."
    - "Any Issue state change, renumbering, or correction of existing aid-ledger rows."

