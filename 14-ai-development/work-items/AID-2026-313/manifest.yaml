work_item_id: AID-2026-313
title: "Unwrap IPv6 6to4, Teredo and IPv4-mapped before the MCP connector SSRF decision"
class: SECURITY/FIX
risk: R2
risk_rationale: >-
  The change is confined to one predicate in scripts/mcp_connector.py in
  oahcom/chatgpt-session-ops and tightens it: addresses that previously passed
  now fail. It removes an SSRF bypass and adds no new reachability. No schema,
  protocol, credential or deployment surface changes.
