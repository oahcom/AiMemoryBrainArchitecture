repository: oahcom/AiMemoryBrainArchitecture
base_branch: main
base_commit_sha: "f0843a8f38a420883921cfda96b515204967f885"
tracking_issue: "#1541"

scope:
  summary: >-
    GOV-NC-2026-11-21-GATE-DEADLOCK-006 records the status RESOLVED_ON_MAIN at
    its header, but its English mirror still said ACCEPTED at the same line and
    all three copies still said ACCEPTED plus "empty diff on main is permanently
    EXIT=2" at the end of section 11. Section 12 of the same document, and the
    section 1 table, record EXIT=0 from 81dd9a72d2. This change sets the status
    to RESOLVED_ON_MAIN in all three copies and describes the empty diff as
    resolved, keeping the section 2.1 boundary sentence, the direct-push
    provenance sentence and the F-2/F-1 execution note unchanged.
  in_scope:
    - "14-ai-development/governance-register/GOV-NC-2026-11-21-GATE-DEADLOCK-006.md: header status line and the section 11 register-status line."
    - "docs/en/14-ai-development/governance-register/GOV-NC-2026-11-21-GATE-DEADLOCK-006.md: the same two lines."
    - "docs/zh-CN/14-ai-development/governance-register/GOV-NC-2026-11-21-GATE-DEADLOCK-006.md: the same two lines."
    - "Add the mandated DM-15 steward field to the document_metadata of the three changed documents."
    - "Register the work item and its INDEX.md row."
  files_out_of_scope:
    - "Sections 12, 13 and 14 of the same register."
    - "Any other governance register."
    - "Gate scripts, baselines, workflows and normative requirements."
  change_boundary: >-
    Four status sentences and three metadata lines across three existing files.
    No claim, number or conclusion is added; two claims that the document itself
    refutes are removed and one mirror is brought level with the canonical copy.

evidence:
  - "Issue #1541: GOV-NC-2026-11-21-GATE-DEADLOCK-006 records ACCEPTED and a permanent EXIT=2 that its own section 12 refutes."
  - "Canonical :47 and docs/zh-CN :47 already read RESOLVED_ON_MAIN at origin/main f0843a8f; docs/en :47 read ACCEPTED."
  - "All three copies read ACCEPTED at the end of section 11 (canonical :281, docs/zh-CN :281, docs/en :279)."
  - "Section 12 heading and the section 1 table in the same document record EXIT=0 from 81dd9a72d2."
  - "check_bilingual_docs.py fails on an en-only change: 'requires all counterparts changed in this PR'. All three copies are therefore changed here."

