acceptance_criteria:
  - id: AC1
    description: >-
      No copy of the register asserts ACCEPTED as its status.
    measurement: >-
      Run:
      git grep -n -F '`ACCEPTED`' -- 14-ai-development/governance-register/GOV-NC-2026-11-21-GATE-DEADLOCK-006.md docs/en/14-ai-development/governance-register/GOV-NC-2026-11-21-GATE-DEADLOCK-006.md docs/zh-CN/14-ai-development/governance-register/GOV-NC-2026-11-21-GATE-DEADLOCK-006.md
    expected_result: "Zero hits."

  - id: AC2
    description: >-
      No copy asserts that the empty diff is permanently EXIT=2 on main.
    measurement: >-
      Run:
      git grep -n -i -e 'permanently `EXIT=2`' -e '恒为 `EXIT=2`' -- 14-ai-development/governance-register/GOV-NC-2026-11-21-GATE-DEADLOCK-006.md docs/
    expected_result: "Zero hits in the three in-scope files."

  - id: AC3
    description: >-
      The three copies remain bilingual-paired and pass the structural gate.
    measurement: >-
      Run:
      BASE_SHA=origin/main HEAD_SHA=HEAD PR_BODY="BILINGUAL-MANIFEST: COMPLETE" python scripts/check_bilingual_docs.py
    expected_result: "PASS with three changed paths inspected."

  - id: AC4
    description: >-
      Section 2.1's boundary sentence, the direct-push provenance sentence and
      the F-2 approved / F-1 executed note survive unchanged in meaning.
    measurement: >-
      Run:
      git diff --unified=0 origin/main..HEAD -- 14-ai-development/governance-register/ docs/en/14-ai-development/governance-register/ docs/zh-CN/14-ai-development/governance-register/
    expected_result: "Only the status value and the empty-diff clause change; the boundary, provenance and F-2/F-1 clauses are retained."

