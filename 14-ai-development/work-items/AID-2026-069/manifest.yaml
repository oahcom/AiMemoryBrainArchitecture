# ---------------------------------------------------------------------------
# WO-02 of the REQ-01 repair queue, registered against Issue #262 AC7.
#
# F8 is the identity-level defect: a caller that is refused a write has exactly
# one value to branch on. `crates/memory-storage-sqlite/src/lib.rs:317` reports
# a primary-key conflict through `InvalidReference`, and the string
# `AlreadyExists` occurs 0 times anywhere under `crates/`, so "the same memory
# is already stored" and "this reference is wrong" arrive as the same value.
#
# Order: F8 (this work item) before E2 (AID-2026-070). Without the distinction,
# E2 can only be implemented by matching on a message string.
# ---------------------------------------------------------------------------

