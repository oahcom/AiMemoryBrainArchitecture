acceptance:
  C1: "The contract gains a variant that means 'this identity already exists', and InvalidReference keeps meaning 'the reference does not resolve'. Settled by both names existing in the enum at crates/memory-storage/src/lib.rs:7-21, and by neither being inferred from a message string."
  C2: "The three fold sites stop discarding the SQLite cause. Settled by no `.map_err(|_| StorageError::InvalidReference)` remaining at crates/memory-storage-sqlite/src/lib.rs:317, :555 and :793, with a primary-key violation classified as the new variant and anything else keeping a classified mapping."
  C3: "Both implementations agree. Settled by the SQLite adapter and the in-memory implementation at crates/memory-store/src/lib.rs:279 returning the same variant for the same duplicate-creation input."
  C4: "Both directions are asserted in cross_crate_contract.rs. Settled by duplicate creation yielding the new variant and a memory_id mismatch yielding InvalidReference. The measure is set equality over the variants that file asserts, not a count of tests; the assertion at :269 pins today's conflation and must become two assertions, not one assertion plus a deletion."
  C5: "No caller turns a real reference error into a success. Settled by crates/brain-cli still exiting non-zero and naming InvalidReference for a memory_id mismatch, and by it not naming the new variant for that input."
  C6: "No DDL change, no migration, no new table. Settled by the `CREATE TABLE IF NOT EXISTS` set in crates/memory-storage-sqlite/src/lib.rs:82-136 being unchanged and by no `.sql` file being added to the tree."

