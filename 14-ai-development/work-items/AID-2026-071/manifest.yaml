# ---------------------------------------------------------------------------
# WO-AC2, registered against Issue #262 AC2.
#
# AC2 was PARTIAL for two reasons: the assessment had no responsible session
# named, and no text in the standard said an assessment must be signed at all.
# The second is fixed here; the first by the record that cites this change.
#
# The clause is derived from the five requirements gaps Owner accepted in
# Issue #262 comment 7153428650; that comment specified the missing requirements,
# not the wording of the clause itself. The four-part clause recorded here was
# subsequently drafted to express those accepted requirements and the boundary
# decision concerning the exception instrument. It is derived from the accepted
# requirements, not reproduced verbatim.
#
# Known deviation, stated rather than repaired: this manifest does not satisfy
# the top-level field requirement the corrected clause adds. `sponsor` and
# `accountable_owner` are top-level; `implementing_ai_session` exists only at
# session_evidence[0].implementing_ai_session, below. Adding a top-level copy
# would establish a string, and the clause states that a textual difference does
# not establish that accountable_owner and implementing_ai_session are different
# principals. The deviation is disclosed in the pull request and is not claimed
# as compliance.
# ---------------------------------------------------------------------------
# Superseded 2026-11-25 by AID-2026-079 / Issue #1201. The paragraph above is
# kept because it records what was believed when it was written; the belief was
# wrong in a way worth keeping visible. There was no top-level field requirement
# to fail: section 5 item (2) required `implementing_ai_session` at top level
# while the Session Evidence gate rejects every top-level `MANIFEST_FIELDS` key
# when a `session_evidence` block exists, so 0 of 54 manifests could satisfy
# both. The clause now requires each of the three names in exactly one place.
# This manifest satisfies it: `sponsor` and `accountable_owner` are top level,
# `implementing_ai_session` is inside `session_evidence[0]`, and no name appears
# twice. Read `review.status` below as unchanged by this annotation.
# ---------------------------------------------------------------------------

