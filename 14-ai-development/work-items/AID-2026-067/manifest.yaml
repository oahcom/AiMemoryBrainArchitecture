acceptance:
  C1: "A refused publication leaves no memory behind. Settled by a test whose authority refuses and then reads `SELECT COUNT(*) FROM memories` from the same SQLite file and gets 0. Asserting the returned disposition does not settle it; the database does."
  C2: "A refused publication performs no delivery. Settled by the same test showing no delivery record and no snapshot output file for that run. Asserting an eprintln line does not settle it."
  C3: "The refusal path is executable rather than a hardcoded false. Settled by no production `publication_participant_admitted: false` literal remaining at crates/memory-compiler/src/publication_authority.rs:138 (the value present at a1533c67), plus a test that builds a refusing authority explicitly."
  C4: "A lawful publication still succeeds. Settled by a companion case where the authority admits, the disposition is Published, the row exists and delivery happened. A change that refuses everything fails this criterion."
  C5: "Blocked, Suppressed and Failed remain distinguishable. Settled by three inputs producing three dispositions, with the existing assertions at crates/memory-compiler/src/lib.rs:1189, 1202 and 1215 still green — those three are the measured `Blocked` cases at a1533c67."
  C6: "The two crates pass and the guard is load-bearing. Settled by `cargo test -p memory-compiler` and `cargo test -p brain-cli` at the acceptance head, plus one recorded mutation: moving the write back before the gate makes C1 fail."

