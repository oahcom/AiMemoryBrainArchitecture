implementation:
  status: IN_PROGRESS
  summary: >-
    The gate now enumerates canonical work-item manifests, reads each identity
    from content across the supported legacy shapes, and rejects duplicate
    declarations, missing or mismatched identities, and newly introduced ids
    blocked by another pull request's target-tree claim. Shared-id modifications
    and deletions pass. The workflow evaluates the merge-group candidate against
    the merge-group base and no longer reads a stale pull_request base SHA.
  files_changed:
    - "scripts/ci/check_work_item_uniqueness.py"
    - "scripts/ci/test_work_item_uniqueness.py"
    - "scripts/ci/fixtures/legacy_shared_id_rule_1413.py"
    - ".github/workflows/document-management.yml"
    - "14-ai-development/work-items/AID-2026-341/manifest.yaml"
    - "14-ai-development/work-items/AID-2026-341/evidence.md"
    - "14-ai-development/work-items/AID-2026-341/prompt-v1.md"
    - "14-ai-development/work-items/AID-2026-341/session-evidence.md"
    - "14-ai-development/work-items/INDEX.md"
  tests:
    - "Duplicate: two work-item directories declaring one id must VIOLATION."
    - "Duplicate: a merge candidate holding the base record and a second path must VIOLATION."
    - "Identity: a record with no supported identity field must VIOLATION."
    - "Identity: a record whose id disagrees with its directory must VIOLATION."
    - "Ledger: another pull request's CLAIMED entry must VIOLATION; ABANDONED must not."
    - "Ledger: a candidate-supplied ledger must be INCOMPLETE, never authoritative."
    - "Ledger: --pull-request without --repository must be INCOMPLETE."
    - "Shared id: same-path modification and deletion must PASS."
    - "Regression: the pinned eight-commit window must keep the two measured old-rule rejections and pass all eight under the new rule."
