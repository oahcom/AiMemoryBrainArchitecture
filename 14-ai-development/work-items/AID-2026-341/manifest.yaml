scope:
  objective: >-
    Replace the tree-only work-item uniqueness verdict with a manifest-identity
    rule: a violation is a duplicate declaration of one work-item id at distinct
    record paths, an identity conflict between a record's path and its content,
    or a newly introduced id already claimed by another pull request. Modifying
    or deleting a record at the same path, and adding auxiliary files inside an
    existing work-item directory, are not uniqueness violations.
  changes:
    - path: "scripts/ci/check_work_item_uniqueness.py"
      detail: >-
        Enumerate canonical work-item manifests, read each id from content
        across the supported legacy shapes, reject duplicate declarations and
        identity conflicts, and keep the claim ledger authoritative on the
        target tree only. Replaces the tree-only directory-diff verdict merged
        by PR #1477: deleting a record path or adding an auxiliary file inside
        an existing work-item directory is no longer a uniqueness failure.
    - path: "scripts/ci/test_work_item_uniqueness.py"
      detail: >-
        Cover canonical and legacy record discovery, duplicate declarations,
        identity conflicts, claim-ledger trust boundaries, same-path
        modifications, deletions, race replay, merge-candidate evaluation,
        workflow contracts, and the pinned first-parent regression window.
    - path: "scripts/ci/fixtures/legacy_shared_id_rule_1413.py"
      detail: >-
        Verbatim copy of the #1413 rule as the regression oracle. Historical
        evidence only; not production code.
    - path: ".github/workflows/document-management.yml"
      detail: >-
        Add the missing merge_group trigger, use merge_group.head_sha and
        merge_group.base_sha, serialize on merge_group.base_ref, and fail
        closed on unrecognized events.
    - path: "14-ai-development/work-items/AID-2026-341/"
      detail: "Record the implementation contract, evidence, prompt snapshot and session evidence."
    - path: "14-ai-development/work-items/INDEX.md"
      detail: "Register AID-2026-341."
