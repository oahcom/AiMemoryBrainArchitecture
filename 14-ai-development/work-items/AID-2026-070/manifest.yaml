# ---------------------------------------------------------------------------
# WO-03 of the REQ-01 repair queue, registered against Issue #262 AC7.
#
# E2 is the reachability defect: `crates/brain-cli/src/main.rs:694-696` creates
# the memory unconditionally on every run, and `memories.memory_id` is a primary
# key, so the second compile of the same event dies at the first write and never
# reaches `build_context` (:747) or `deliver_snapshot` (:795).
#
# `crates/brain-cli/tests/compile_persists_store.rs:271-334` currently asserts
# that the second run fails, so "the second run succeeds" cannot be shown
# without editing that test. Editing it is the work, not a side effect of it.
#
# Order: AID-2026-069 (F8) before this. Without a variant that means "already
# exists", this work order can only be implemented by matching a message string.
# ---------------------------------------------------------------------------

