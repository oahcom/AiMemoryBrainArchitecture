acceptance:
  C1: "The second compile against the same --store exits 0, and the other two tests in compile_persists_store.rs (:144, :212) still exit 0. Settled by the three tests, not by a manual run."
  C2: "The second run is shown to arrive at Context construction and Delivery, not merely to survive the first write. Settled by its stderr carrying all three stage lines printed at crates/brain-cli/src/main.rs:824, :825-827 and :830, and by the --out file it names existing and being non-empty."
  C3: "The read-back or reuse semantics for an existing memory is written down as one named rule and asserted by a test that would fail under a different rule. Settled by the rule having a name in the tree and by that test existing; a rule implicit in the code path does not settle it."
  C4: "The store does not accumulate duplicate memory rows. Settled by the set of memory_id values in memories being exactly the one identity after two compiles of the same event, read through the test's own helper rather than through the implementation's return value."
  C5: "A genuine storage failure still fails. Settled by :275-299 unchanged (an unreadable input exits non-zero and creates no --store file) and by the post-condition at :319-333 still holding."
  C6: "The existing assertion is inverted, not deleted. Settled by the string 're-compiling the same memory into the same store must fail' and the `create_memory failed` expectation at :308-317 being replaced by the asserted success, because a passing test that pins the defect is the failure mode the Round 25 principle names."
  C7: "No schema migration, and no change to crates/memory-storage-sqlite/src/lib.rs:82-136. Settled by that range being byte-identical at the acceptance head and by no `.sql` file being added."
  C8: "Nothing here claims that a version was advanced. Settled by crates/brain-cli/src/main.rs:749 still passing the literal `1`, and by no acceptance criterion above asserting a version number."

