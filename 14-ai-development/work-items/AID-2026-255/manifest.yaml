risk: R1
risk_rationale: The change adds a read-only CI integrity checker and regression tests for a closed set of 12 manifest field identities. It does not modify production runtime behavior, rewrite manifests, or change the existing 12-entry baseline. The principal risk is an incorrect integrity verdict or an unintended expansion of checker scope, bounded by the exact authorization-set test and regression coverage.
