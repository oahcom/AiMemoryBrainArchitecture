# Work-item manifest schema (AID-2026-251)
# Normative structure for newly authored and migrated Work Item manifests.
# Legacy findings are ratcheted against a pinned baseline tree.
schema_version: "2"
required_top_level_keys:
  - work_item_id
  - title
  - class
  - risk
  - risk_rationale
  - status
  - id_status
  - sponsor
  - accountable_owner
  - acceptance_authority
  - attribution
  - date
  - repository
  - base_branch
  - base_commit_sha
  - scope
  - evidence
  - documentation
  - session_evidence
  - implementation
fields:
  documentation:
    kind: sequence
    required: true
    min_items: 1
    item_required_keys:
      - path
      - relationship
    path_kind: repository-relative-path
    path_must_exist_in_git_tree: true
    relationship_enum:
      - normative
      - design
      - implementation
      - evidence
      - reference
      - code
      - schema
  session_evidence:
    kind: sequence
    required: true
    item_required_keys:
      - role
      - issue_refs
      - implementing_ai_session
      - session_evidence_ref
    session_evidence_ref_pattern: "session-evidence*.md"
    session_evidence_ref_exact_allowlist:
      - "ac4-repair-evidence.md"
  implementation:
    kind: mapping
    required: true
    required_keys:
      - status
      - summary
      - files_changed
      - tests
    status_enum:
      - NOT_STARTED
      - IN_PROGRESS
      - IMPLEMENTED
      - BLOCKED
      - NOT_APPLICABLE
    files_changed_kind: sequence
    tests_kind: sequence
