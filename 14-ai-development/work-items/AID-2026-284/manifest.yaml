scope:
  objective: >-
    Make the manifest blob-pin negative sample fail the workflow when the
    checker incorrectly accepts it, and resolve the base commit from the
    event context so pull-request scans use the merge candidate's first
    parent rather than a potentially stale event-time base.
  issues:
    - "#1349"
    - "#1350"
  constraints:
    - Preserve the existing repository-hygiene job ID and job name.
    - Do not add a new job, required status context, or dependency.
    - Do not change branch protection.
    - Do not modify scripts/ci/baselines/manifest-blob-pins.txt.
    - For pull_request events, validate the merge-candidate ref and SHA, require a two-parent merge candidate, and select its first parent.
    - For push events, use the validated event before SHA supplied to the resolver.
    - Unsupported events and invalid or unavailable inputs must fail closed.
    - Tie the candidate scan and ratchet invocation to GITHUB_SHA.
    - Keep this work item's manifest free of blob, digest, and byte-count pin fields.

