implementation:
  status: IMPLEMENTED
  summary: >-
    The fix adds event-aware, fail-closed base resolution and an assertion
    that verifies the immutable negative fixture is rejected with the
    expected evidence. The workflow measurement step uses the resolved base,
    scans the candidate at GITHUB_SHA, and fails if the negative fixture is
    not rejected. The ratchet invocation is also bound to GITHUB_SHA.
    Local resolver, negative assertion, and existing checker test suites
    passed. Offline workflow-step and base-selection proofs passed. The
    baseline was verified unchanged. The local gate_ratchet wrapper was not
    reproduced successfully on Windows; CI execution, pull-request review,
    and Owner acceptance remain pending.
