work_item_id: AID-2026-284
title: "Make manifest blob-pin negative assertion and base binding fail-closed"
class: GATE/TEST
risk: R1
risk_rationale: >-
  The change makes the manifest blob-pin workflow reject a negative fixture
  that is incorrectly accepted and binds the base scan to the appropriate
  event commit. It preserves the existing required job and does not modify
  the baseline or branch protection.
