work_item_id: AID-2026-261
title: >-
  Implement serialized merge-time work-item directory uniqueness against the
  latest target branch, while allowing incremental files in existing work items
  (Issue #1341, defect #1331)
class: GATE/TEST
risk: R1
risk_rationale: >-
  This change introduces a standard-library Python checker, isolated Git
  repository unit tests, and a GitHub Actions workflow. The checker is
  read-only and compares Git commit trees rather than relying on mutable
  working-tree contents. It does not duplicate the existing traceability
  checks for INDEX parsing, manifest existence, directory identity, or
  intra-tree duplicate INDEX entries. The merge-base identifies candidate
  additions, while the latest target tree determines occupancy. Existing
  work-item directories remain eligible for incremental file additions.
  Workflow-level serialization reduces simultaneous stale-target decisions,
  and main-push rechecks detect target advancement. A platform-side required
  status check and strict up-to-date protection or merge queue are still
  necessary to eliminate the final check-to-merge race. Those platform
  settings have not been verified or enabled by this implementation.
