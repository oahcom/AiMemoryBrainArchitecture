acceptance_criteria:
  - id: AC1
    criterion: The gate refuses the shape the corpus no longer uses.
    measurement: >-
      `SCOPE_KEYS == {"type"}`. A synthetic approved document carrying `included_sections: []`
      produces `DM-02 approval_scope.included_sections: unknown key (allowed: type)`.
  - id: AC2
    criterion: No governed document still carries either key.
    measurement: >-
      Re-running the same frontmatter scan reports 0 documents with `included_*` in
      frontmatter, down from 269, and `grep -rc 'included_sections' --include=*.md` is 0 in
      frontmatter position across all roots.
  - id: AC3
    criterion: No approval is invalidated by the corpus edit.
    measurement: >-
      On 14-ai-development/adr/OWNER-DECISION-AUTHORIZATION-TYPE-STATE-001.md (`content-hash`,
      pin 3375f59e...2ddc0), `body_hash()` equals the pin before and after the deletion.
  - id: AC4
    criterion: The removal is bound by a test that fails if the keys return.
    measurement: >-
      With `SCOPE_KEYS` edited back to three members, `scripts/test_check_document_management.py`
      exits 1 and records four `[FAIL]` lines whose detail is an `AssertionError`, not a
      traceback. Restored, the suite is 326/326.
  - id: AC5
    criterion: The change moves no document out of the unclassified backlog as a side effect.
    measurement: >-
      The whole-tree run is INCOMPLETE before and after, exit 2 both times; the classified
      count rises 362 -> 364 only because this work item adds two classified documents, and
      the unclassified backlog stays at 466. The incremental run over the change is exit 0.
      `check_traceability.py --index-only` is exit 2 at the base as well (0 errors, 84
      warnings); it becomes 0 errors / 85 warnings, the extra one being T-05 on this work
      item's own free-text `tracking_issue`.

findings:
  - id: F1
    severity: HIGH
    statement: >-
      The schema admitted one scope value and still declared two keys for values it no longer
      admitted. With `Selected-sections`/`Selected-assets` gone, the two lists could only ever
      be empty, so the requirement was a shape with no content.
    evidence: >-
      At eb94cab1 `SCOPE_TYPES` is `{"Full-document"}` while `SCOPE_KEYS` is
      `{"type", "included_sections", "included_assets"}`; measured on the tree, 269 of 269
      documents carry both keys and 0 carry a non-empty one.
  - id: F2
    severity: MEDIUM
    statement: >-
      The issue text's premise (99 documents) is stale. The measured count at eb94cab1 is 269,
      and the delta is not only growth: `docs/` now mirrors 77 of them.
    evidence: >-
      Frontmatter scan over the working tree: 269 documents with `approval_scope`, 269 with
      `included_sections: []`, per root 00-governance 8 / 01-system-architecture 1 /
      06-memory-context 1 / 07-agent-integration 6 / 08-bmcp-protocol 1 /
      10-storage-consistency 1 / 14-ai-development 168 / docs 83.
  - id: F3
    severity: HIGH
    statement: >-
      Approval neutrality is a property of the hash, not a hope. `body_text()` returns the
      document with its frontmatter removed, and `body_hash()` hashes that, so a frontmatter
      deletion cannot move a pin.
    evidence: >-
      On the live `content-hash` document named in AC3, the pin 3375f59e...2ddc0 equals
      `body_hash()` before the edit and after removing the two lines; the file shrank
      16883 -> 16825 bytes.
  - id: F4
    severity: LOW
    statement: >-
      Two policy change-log rows (1.11 and 1.21) describe the keys as existing. They are records
      of a decision taken at their own date, not current claims, and are left unedited.
    evidence: >-
      §11 rows dated 2026-11-21 and 2026-11-24; row 1.21 records the ruling this change
      implements, so editing it would rewrite the history of the ruling rather than the rule.

