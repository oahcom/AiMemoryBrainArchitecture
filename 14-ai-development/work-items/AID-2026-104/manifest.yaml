work_item_id: AID-2026-104
title: Remove approval_scope's two permanently-empty keys from the schema and the corpus
class: GATE/SCHEMA
risk: R3
risk_rationale: >-
  The change touches the metadata gate and 269 governed documents at once. What makes it R3
  rather than R2 is breadth, not semantics: a frontmatter edit applied by a script to every
  root could silently corrupt a document if the rewrite were wrong, and the gate is red between
  the two halves of the change. The semantics are narrow: `SCOPE_KEYS` loses two members, so
  the gate's accepted language shrinks and nothing it used to accept on merit stops being
  accepted. Approval neutrality is structural, not asserted — `body_hash()` hashes
  `body_text()`, which strips frontmatter, so no `approved_version` pin can move; verified on a
  live `content-hash` document rather than argued (see findings F3).
status: DISPATCHED

