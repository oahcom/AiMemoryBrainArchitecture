# The digest above was recomputed after the work item was renumbered from
# AID-2026-074 to AID-2026-077. The number appears twice inside
# `prompt-v1.md` itself, so the rename changed the snapshot bytes: the
# pre-rename digest was 639355d3...fc941 at the same 5621 bytes, which is
# how a rename can move a digest without changing a byte count. The
# snapshot is the input that was executed and is not rewritten to fit its
# own digest; the recorded value is the measured value.

# ---------------------------------------------------------------------------
# One change, because either half alone is worse than both (#1064, #1069).
#
# #1069 asks for `merge=union` on the INDEX table. A union driver keeps both
# sides' appended rows, which removes the false conflict — and also removes the
# last accidental duplicate-ID detector, because today a duplicate ID produces
# an add/add conflict on the work-item directory. So the driver must ship with
# an assertion that refuses the duplicate, or the next collision merges cleanly
# as two rows claiming one number.
#
# #1064 asks for a gate that fails a duplicate AID. The assertion already
# exists: `check_traceability.py:730` T-04. It has never run, because
# `run_check` parses `00-governance/requirements-registry.yaml` first inside the
# same try and that file does not exist, so the manifest half is dead code
# (#1071). The fix is therefore not a new detector but a caller for the one
# that exists — which is what the Owner ruling on #1064 says, and what the
# disposition on #1071 prescribes ("prefer the split").
#
# Deliberately not built, per #1064's "explicitly rejected shortcut": no ID
# reservation service, no allocator, no registry of taken-but-unmerged IDs, no
# `next_id` cell. All of those need coordination this repository does not have,
# and a `next_id` cell would turn an append conflict into a same-cell conflict,
# raising the conflict rate.
# ---------------------------------------------------------------------------

