acceptance:
  C1: "`python3 scripts/check_traceability.py --index-only` exits 0 on the unmodified tree and prints a PASS line with a non-zero work-item count. Settled by running it, not by reading the code. A check that reports PASS while having enumerated nothing is the defect it exists to catch, so the count is asserted."
  C2: "The default invocation is unchanged: `python3 scripts/check_traceability.py` with no registry still exits 1 with `ERROR required registry unavailable:`. Settled by running both forms on the same tree. `--index-only` narrows which half runs; it does not make the registry optional."
  C3: "A duplicate `AID` row makes `--index-only` exit 1 naming `T-04 duplicate INDEX entry {aid}`, and reverting the duplicate makes it exit 0. Settled on the real tree, with the added row and its removal both shown."
  C4: "`merge=union` resolves two concurrent registrations with no conflict and keeps both rows. Settled by the scenario run against this file's own 47-row table: two branches insert a different row at the same anchor, `git merge` exits 0 with no markers, and both rows are present."
  C5: "The three shapes union does not resolve each end as one `AID` on two lines, so C3's assertion refuses them. Settled by running each shape: same ID appended twice; one row edited on both sides; a row deleted on one side while its neighbour is edited on the other. The third is the one a resolver will not look for, because the symptom is a row that came back."
  C6: "The `.gitattributes` rule is path-scoped and does not widen. Settled by `git check-attr merge` returning `union` for `INDEX.md`, `unspecified` for another `.md`, and `scripts/ci/check_line_endings.py` still exiting 0 with the same file count — it asks Git via `check-attr --stdin` and never parses `.gitattributes` text."
  C7: "The driver's contract is written in `INDEX.md` next to the table, not only in `.gitattributes`, and it states all three unresolved shapes and that the failure message cannot distinguish them. Settled by reading the paragraph; a reader who hits `T-04 duplicate INDEX entry` must be able to tell from the file that they are looking at a hand-resolution, not two registrations."
  C8: "`scripts/test_check_traceability.py` fails if either half of the change is reverted. Settled by mutation: removing the `T-04 duplicate` call fails 2 tests; making `--index-only` a no-op fails 4. Both mutants restored, suite green."
  C9: "No existing work item is renumbered, and `crates/` is untouched. Settled by `git diff --stat origin/main` showing no path under `crates/` and no `AID-*` directory renamed."

