  accountable_owner: NOT_ASSIGNED
  acceptance_authority: NOT_ASSIGNED
  implementing_owner: coordinator session (operational, not a governance role)
  role_note: >-
    NOT_ASSIGNED is a true governance state. It must not be substituted by the
    implementing party, by a ChatGPT session, or by the fact that this work
