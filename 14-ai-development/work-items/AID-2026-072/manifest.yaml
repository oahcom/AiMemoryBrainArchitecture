acceptance:
  A1: "Two tests calling `fixture()` at the same instant receive different directories, so `schema()` cannot see a table created by the other caller."
  A2: "The uniqueness source is a per-process atomic counter, not the wall clock, so the property does not depend on the host's clock granularity."
  A3: "The failure is reproduced on the unmodified tree before the change and not after it, with tallies recorded."
  A4: "`cargo test -p memory-event-store-sqlite` and `cargo test --workspace --all-targets --no-fail-fast` pass in full."
  A5: "A negative control (counter line removed) restores the failure, and the line is restored afterwards."
  A6: "No dependency is added and no assertion about forget/restore behaviour changes."

