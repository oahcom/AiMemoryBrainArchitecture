scope:
  objective: >-
    Put `GOV-DOC-002 metadata checks` back on the merge-queue candidate, restore
    the fail-closed merge_group base/head resolution that #1453 removed with it,
    serialize the workflow by target branch, and make the loss detectable.
  changes:
    - path: ".github/workflows/document-management.yml"
      detail: >-
        Restore `merge_group: types: [checks_requested]`; resolve the
        uniqueness base from `merge_group.base_sha` and the head from
        `merge_group.head_sha`; key the concurrency group off the target branch
        for pull_request, merge_group and push, with `cancel-in-progress: false`
        and `queue: max`.
    - path: ".github/workflows/gates.yml"
      detail: >-
        Correct the required-context count comment from six to seven; the file
        produces seven of the sixteen declared contexts.
    - path: ".github/workflows/repository-hygiene.yml"
      detail: >-
        Run the new wiring gate and its self-check beside the existing
        declared-check-contexts steps.
    - path: "scripts/check_required_contexts_merge_group.py"
      detail: >-
        New read-only gate: declared context -> producing workflow must subscribe
        to merge_group with checks_requested; document-management.yml concurrency
        must serialize by target branch; a workflow's required-context count
        comment must match the declared contexts it produces.
    - path: "scripts/test_check_required_contexts_merge_group.py"
      detail: "Regression cases for each of the three conditions, positive and negative."
    - path: "14-ai-development/work-items/AID-2026-294/"
      detail: "Record the prompt snapshot and session evidence."
    - path: "14-ai-development/work-items/INDEX.md"
      detail: "Register AID-2026-294."
