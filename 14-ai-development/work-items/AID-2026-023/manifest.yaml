scope:
  - >-
    Define one cross-requirement invariant and protocol preventing forgotten
    information from becoming available again through persistence, recovery,
    replay, derived-state, or synchronization paths.
  - >-
    Define canonical Forget semantics and semantic deletion scope relevant to
    REQ-07.
  - >-
    Define invalidation or suppression requirements for derived memory,
    projections, caches, and reconstructed representations.
  - >-
    Define durable deletion evidence and its relationship to backup and restore.
  - >-
    Define restore-time reconciliation and suppression requirements for
    backup restoration and point-in-time recovery.
  - >-
    Define crash consistency, interrupted recovery, event replay, and
    projection rebuild behavior.
  - >-
    Define ordering, idempotency, concurrency, failure handling, retention,
    expiry, and auditable evidence for the shared Forget safety protocol.
  - >-
    Preserve separate REQ-07 and REQ-09 acceptance tracks.
  - >-
    Specify reproducible tests and fault-injection scenarios, migration
    boundaries, rollback constraints, residual risks, and dependencies.

out_of_scope:
  - Production implementation, runtime code changes, schema changes, or deployment.
  - Modification of main, merge of PRs, or repository writes by this design session.
  - Production acceptance, requirement closure, or claims of operational safety.
  - Appointment of Sponsor, accountable Owner, acceptance authority, or governance roles.
  - Unrelated MQ-01 Fact/Claim work.
  - Independent migration, outbox, corruption, PITR, ACK, or other findings except
    where a dependency must be recorded to explain a boundary or safety assumption.
  - Treating reference-model PASS as production proof.
  - Treating unavailable CI or unrun tests as successful evidence.

