  accountable_owner: NOT_ASSIGNED
  acceptance_authority: NOT_ASSIGNED
  implementing_owner: coordinator session (13-20-04)
  role_note: >
    NOT_ASSIGNED is a true governance state and MUST NOT be substituted by
    session identity or role simulation.

