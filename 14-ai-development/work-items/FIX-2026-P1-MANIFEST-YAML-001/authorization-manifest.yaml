# scope for the manifest-YAML parseability remediation produced by the
# translation/manifest full scan. No path outside allowed_write_paths may be
# modified under this work item.
schema_version: "1.0"
work_item: FIX-2026-P1-MANIFEST-YAML-001
repository: oahcom/AiMemoryBrainArchitecture
branch: fix/manifest-yaml-parseability

