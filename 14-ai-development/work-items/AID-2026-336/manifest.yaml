scope:
  summary: >-
    Implement the AID-2026-331 reference semantics in the manifest blob-pin
    checker while preserving the existing blob_sha256 verification contract
    from the rebased origin/main baseline. Count only the defined AID-336
    in-scope pin families as ordinary pins; keep documented prompt metadata
    and explicitly out-of-scope families outside that pin count. Verify
    authored-index declarations against reachable history at the exact
    declared path, require an explicit historical/current mode for every
    related-evidence entry, verify current references against the candidate
    tree, and retain blob_sha256 SHA-256 verification, unbound diagnostics,
    and unbound summary accounting. Update the negative fixture assertion,
    tests, baseline, workflow ratchet filter, and the AID-2026-100 mode
    migration without rewriting its digest.
  in_scope:
    - "Rebase the checker implementation onto the origin/main baseline without dropping the AID-2026-296 blob_sha256 scan."
    - "Verify authored_indexes[] Git-blob declarations against reachable history at the exact declared path."
    - "Require related_evidence[].reference_mode to be explicitly historical or current."
    - "Classify missing or invalid related-evidence reference_mode as a policy violation with classification=policy and exit status 1."
    - "Verify historical related-evidence references against reachable history at the exact declared path."
    - "Verify current related-evidence references against the candidate commit tree."
    - "Preserve distinct HISTORICAL_REFERENCE_NOT_FOUND, CURRENT_REFERENCE_MISMATCH, and REFERENCE_MODE_MISSING_OR_INVALID diagnostics."
    - "Preserve structural INCOMPLETE findings and exit status 2 for genuinely incomplete or unreadable inputs."
    - "Count non-empty AID-336 in-scope declarations as pins and preserve explicit exclusion accounting for documented out-of-scope declarations."
    - "Retain blob_sha256 and qualified *_blob_sha256 discovery, JSON-pointer locations, path binding, SHA-256 verification, UNBOUND_BLOB_SHA256 findings, and unbound summary accounting."
    - "Count non-empty blob_sha256 declarations as in-scope pins."
    - "Update the fixed negative fixture assertion to the implemented pin-count and diagnostic contract."
    - "Extend checker tests to cover the reference semantics and blob_sha256 behavior."
    - "Update the repository-hygiene ratchet filter to include all three new semantic diagnostic prefixes."
    - "Add reference_mode: historical to AID-2026-100 related_evidence[0] without changing its declared digest."
    - "Record measured local verification results and the remaining merge and acceptance boundaries."
  files_out_of_scope:
    - "scripts/governance/session_evidence/validate.py"
    - ".github/workflows/session-evidence.yml"
    - "14-ai-development/prompt-and-evidence-template.md"
    - "Any rewrite of existing authored-index or related-evidence digest values"
    - "Any rewrite of prompt snapshot digest or byte-count metadata"
  change_boundary: >-
    Implementation scope is limited to the manifest blob-pin checker,
    associated tests and negative-fixture assertion, its ratchet baseline
    and repository-hygiene workflow filter, the required AID-2026-100
    reference_mode migration, and the AID-2026-336 work-item record.
    Existing blob_sha256 checking is retained and integrated with the
    AID-336 semantic checker. This record does not claim a GitHub CI run,
    merge, independent review, or Owner acceptance.

