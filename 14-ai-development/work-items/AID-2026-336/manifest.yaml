title: "Implement Manifest Blob Pin Reference Verification"
class: ENG
risk: R2
risk_rationale: >-
  This work changes the manifest blob-pin checker, its tests, the negative
  fixture assertion, and the repository-hygiene ratchet input. It changes
  which manifest declarations are treated as in-scope pins and adds
  blob_sha256 verification. The work was exercised against a rebased
  repository state and fixed negative fixture. Merge and Owner acceptance
  remain pending.
