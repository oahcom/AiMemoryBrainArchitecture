work_item_id: AID-2026-085
title: Make an unwired gate fail instead of merging green
class: GATE/TEST
risk: R2
risk_rationale: >-
  One existing required gate gains a second rule, one baseline file, and one added step inside
  an existing job. No new required status context is created, so no branch-protection payload
  moves. The risk addressed is false assurance: a gate-shaped script could be added with no
  workflow invoking it and every gate stayed green, because check_test_reachability.py only
  asked that question about test_*.py. The one step this work item adds
  (scripts/check_source_revision_pointers.py) exits 0 on main, measured from this worktree, so
  it cannot redden the board. The two gates that cannot be wired today are baselined rather
  than deleted, and the baseline fails when it goes stale.
status: DISPATCHED

sponsor: USER-PRINCIPAL-DELEGATED
accountable_owner: USER-PRINCIPAL-DELEGATED
acceptance_authority: NOT_ASSIGNED

