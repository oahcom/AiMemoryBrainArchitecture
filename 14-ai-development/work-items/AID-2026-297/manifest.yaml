acceptance_criteria:
  - id: AC1
    description: "The migration policy defines explicit identity and field-authority rules."
    measurement: "Review the policy document against the migration requirements."
    expected_result: >-
      Identity declarations, field states, candidate rules, prompt pin
      verification, raw evidence handling and stage boundaries are
      explicitly specified.
  - id: AC2
    description: "The inventory rules define complete source-to-inventory coverage."
    measurement: "Review the inventory rules and validator state matrix."
    expected_result: >-
      Allowed states, required registry conditions, duplicate handling,
      incomplete conditions and strict-inventory behavior are explicit.
  - id: AC3
    description: "The migration dry run is read-only and completes against the specified source tree."
    measurement: >-
      Run tools/migrate_work_item_registry.py with source tree efbdebfa,
      the supplied inventory, JSON report output and --dry-run.
    expected_result: >-
      Exit code 0; 140 items and 1680 field cells are reported; no files
      are written to 00-governance/registry/.
  - id: AC4
    description: "The repository test and document checks pass as recorded."
    measurement: "Run the commands listed in implementation.tests."
    expected_result: >-
      pytest reports 144 passed and 34 subtests passed; bilingual document
      and document-management checks report PASS.
  - id: AC5
    description: "The work item is represented by a manifest and evidence records."
    measurement: >-
      Validate the work-item manifest, required session-evidence structure,
      documentation paths and INDEX registration against the PR head tree.
    expected_result: >-
      The manifest and evidence files exist in the PR head tree, session
      evidence uses a single implementing_ai_session value and an Issue
      reference, and every documentation path resolves in that tree.

