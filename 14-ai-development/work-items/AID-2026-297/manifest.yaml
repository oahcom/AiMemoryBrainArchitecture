scope:
  summary: >-
    Repair and establish the work-item registry migration policy,
    adjudication schema and inventory rules, then execute a read-only
    dry run against the specified legacy source tree. Register the work
    item and its evidence in the work-item manifest population.
  in_scope:
    - "Define authoritative work-item identity extraction and conflict handling."
    - "Define explicit registry field states and field-specific authority rules."
    - "Define registered prompt digest verification and exclude executed-prompt digests from registered prompt pins."
    - "Define YAML truncation handling and preservation of raw Git blob evidence."
    - "Define migration inventory states, coverage invariants and validator behavior."
    - "Define the dry-run output contract and migration stage boundaries."
    - "Provide the registry migration policy in English and Chinese."
    - "Provide the migration inventory rules in English and Chinese."
    - "Provide the work-item adjudication schema."
    - "Provide the read-only migration tool and inventory input."
    - "Execute the specified dry run and repository validation commands."
    - "Register AID-2026-297 in the work-item INDEX."
  files_out_of_scope:
    - "Rewriting or normalizing any pre-existing work-item manifest."
    - "Writing migrated registry records during the dry run."
    - "Changing the source-tree legacy manifests."
    - "Generating or modifying INDEX from the migration script."
    - "Merging PR #1513."
    - "Claiming independent review or Owner acceptance."
  change_boundary: >-
    This work establishes migration policy, schema and inventory rules,
    and implements a read-only dry-run path. The dry run is limited to
    source tree efbdebfa and the supplied inventory. It does not write
    00-governance/registry/, modify legacy manifests, perform the registry
    migration, or merge a pull request.

