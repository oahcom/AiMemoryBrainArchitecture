acceptance_criteria:
  - {id: HIR-01, criterion: "Full idempotency namespace tuple is explicit and collision-isolated."}
  - {id: HIR-02, criterion: "Producer creates one stable key per logical operation across retries."}
  - {id: HIR-03, criterion: "Agent, Session and Attempt scoping are explicitly distinguished."}
  - {id: HIR-04, criterion: "Namespace tuple encoding is unambiguous and versioned."}
  - {id: HIR-05, criterion: "Deduplication window and tombstone retention are specified without inventing a TTL."}
  - {id: HIR-06, criterion: "Storage atomicity is delegated to exact AID-2026-098 contract."}
  - {id: HIR-07, criterion: "H admission and Storage domain-effect linearization points are distinct."}
  - {id: HIR-08, criterion: "Concurrent duplicate reservation has one winner and durable receipt."}
  - {id: HIR-09, criterion: "Receipt minimum identity, digest, issuer and evidence fields are listed."}
  - {id: HIR-10, criterion: "Receipt identity is immutable and transitions append-only."}
  - {id: HIR-11, criterion: "Unknown/Pending are fail-closed and not inferred as success/failure."}
  - {id: HIR-12, criterion: "Pending duplicate cannot trigger a second logical side effect."}
  - {id: HIR-13, criterion: "Failed requires durable authoritative terminal failure."}
  - {id: HIR-14, criterion: "Same key/same digest and same key/different digest are distinct."}
  - {id: HIR-15, criterion: "Retry reuses logical key but creates a new Attempt ID."}
  - {id: HIR-16, criterion: "Crash recovery reconciles Storage receipt without repeating effects."}
  - {id: HIR-17, criterion: "H Attempt joins C/G DeliveryAttempt without claiming Applied."}
  - {id: HIR-18, criterion: "Replay disclosure rechecks I authorization and D Fence independently."}
