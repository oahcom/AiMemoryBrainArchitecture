implementation:
  status: IN_PROGRESS
  summary: >-
    The checker now resolves claims per candidate-only commit against that
    commit's first-parent tree, so the original claim survives an Update-branch
    merge that moves the merge-base. The unit suite keeps all pre-existing
    cases and adds five mutations that fail on the merge-base algorithm and
    pass on the first-parent one. Scope was reduced after #1436 merged the
    merge_group workflow wiring, which this PR no longer carries.
  files_changed:
    - "scripts/ci/check_work_item_uniqueness.py"
    - "scripts/ci/test_work_item_uniqueness.py"
    - "14-ai-development/work-items/AID-2026-311/manifest.yaml"
    - "14-ai-development/work-items/AID-2026-311/evidence.md"
    - "14-ai-development/work-items/AID-2026-311/prompt-v1.md"
    - "14-ai-development/work-items/AID-2026-311/session-evidence.md"
    - "14-ai-development/work-items/INDEX.md"
  tests:
    - "Positive: a new unoccupied directory must PASS."
    - "Negative: a candidate claim already occupied on the supplied base must VIOLATION."
    - "Additive: adding a file beneath an established directory must PASS."
    - "Update branch: A lands first, B merges the advanced base, B must VIOLATION even though merge-base moved to A's commit."
    - "Merge-group reconstruction: the synthetic queue candidate for B must VIOLATION."
    - "Unoccupied Update branch: a claim on a free ID stays PASS."
    - "Duplicate claims: two candidate-only commits creating the same ID must VIOLATION."
    - "Determinism: repeated runs on the same base and candidate emit identical output."
    - "Missing base must return INCOMPLETE."
