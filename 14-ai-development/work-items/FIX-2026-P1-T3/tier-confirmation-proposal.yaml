  ephemeral_record: ["meeting", "minutes", "review record", "acceptance record", "会议", "纪要", "验收记录", "评审记录"]
  document_header: regex (?im)^\s*[-*]?\s*\**\s*(\u6587\u6863\s*ID|Document ID|\u72b6\u6001|Status|\u7248\u672c|Version)\s*[:\uff1a]
rule_order: index/readme -> prompts/ -> ephemeral>=2 -> (arch>=3 and norm>=3) -> (header and norm>=1) -> norm>=2 -> default; first match wins
