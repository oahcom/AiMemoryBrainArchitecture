findings:
  - id: F1
    severity: informational
    statement: >-
      AID-2026-186[0] declares a digest and byte count for the LF rendering of
      prompt-v1-original.source.txt, whereas the committed artifact is CRLF.
      executed_prompt_provenance is NOT_VERIFIED. The committed CRLF bytes
      remain the artifact, but the historical executed input cannot be
      established from the available evidence. No repin is made.
  - id: F2
    severity: informational
    statement: >-
      AID-2026-241[0] has the same line-ending distinction for
      prompt-v1-original.source.txt, with a 147-byte difference. The
      committed CRLF artifact is preserved. NOT_VERIFIED provenance does
      not establish that the LF rendering was or was not the executed input.
      No repin is made.
  - id: F3
    severity: material
    statement: >-
      AID-2026-261[0] references a prompt-v1.md that is not committed and
      declares an all-zero digest and zero bytes. No committed byte sequence
      exists to which the declaration can be repinned. This entry remains
      unchanged pending a separately authorized provenance and snapshot
      decision.
  - id: F4
    severity: informational
    statement: >-
      The attribution corrections previously associated with AID-2026-090
      are already present in main through commit 27bfa597. AID-2026-072 and
      AID-2026-076 identify AID-2026-101, and AID-2026-047 identifies
      AID-2026-116. They are not changed again.
  - id: F5
    severity: informational
    statement: >-
      The historical 33 INDEX digest cells are not present as stale values
      on the selected baseline. The measured current INDEX has no occurrences
      of the stale AID-2026-101 digests. No historical INDEX cells are
      fabricated or rewritten.
  - id: F6
    severity: material
    statement: >-
      The top-level prompt_sha256 and prompt_bytes shape is distinct from
      session_evidence.executed_prompt_sha256 and executed_prompt_bytes.
      The measured top-level shape has 64 matches and zero mismatches.
      This work item repairs only the latter shape and does not introduce
      a checker for either shape.

