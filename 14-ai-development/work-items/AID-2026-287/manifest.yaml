scope:
  objective: >-
    Produce a capacity alignment decision record diagnosing why record
    production consumes capacity that should support product implementation,
    and establishing four proposed rulings A1-A4 covering risk-tiered record
    obligations, a single normative source, executable proof that every gate
    can fail, and an executable Phase 3 exit checklist. The record interprets
    existing normative requirements and does not modify any upstream normative
    text.
  files_to_create:
    - 14-ai-development/AI-DEV-CAPACITY-ALIGNMENT-RULING-001.md
    - 14-ai-development/AI-DEV-CAPACITY-ALIGNMENT-RULING-001.en.md
