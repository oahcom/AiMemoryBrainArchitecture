    - 14-ai-development/work-items/AID-2026-287/session-evidence.md
  files_to_modify:
    - 14-ai-development/work-items/INDEX.md
  files_out_of_scope:
    - .github/workflows/
    - scripts/
    - crates/
    - ROADMAP.md
    - README.md
  constraints:
    - "Do not write task lists, TODOs, assignments, milestones, or schedules in the decision record."
    - "Do not claim adoption, approval, merge, review, acceptance, or successful CI execution."
    - "Use only the supplied measured numbers; do not invent or independently recalculate figures."
    - "Do not delete, rewrite, or modify existing normative documents."
    - "Keep the ruling proposed and distinguish decisions from implementation actions."
    - "Preserve the distinction between historical records and behavior occurring after adoption."

acceptance_criteria:
  - id: AC1
    criterion: >-
      The diagnosis is traceable to all six groups of supplied measured facts:
      commit distribution, issue references, normative corpus membership,
      gate negative cases and target base, end-to-end execution chain, and
      product phase and exit criterion.
    measurement: >-
      Cross-check every causal diagnosis against the corresponding numbered
      evidence subsection in Section 1. No unsupported measurements or
      additional numerical claims are present.
  - id: AC2
    criterion: >-
      All four rulings A1-A4 contain Decision, Rationale, Alternatives
      considered and rejected, Consequences, and Falsifier.
    measurement: >-
      Inspect each ruling and verify that all five elements are present,
      applicable scope is explicit, and at least two rejected alternatives
      are explained.
  - id: AC3
    criterion: >-
      Every ruling has an observable and measurable falsification condition
      with an explicit threshold or triggering observation, and an identified
      adjudicator role.
    measurement: >-
      Inspect the individual Falsifier sections and the consolidated
      falsification table. Verify that each condition can be tested against
      actual behavior, execution results, or normative authority relationships.
  - id: AC4
    criterion: >-
      The decision record contains no task-list language and does not claim
      adoption, approval, merge, review, acceptance, or CI success.
    measurement: >-
      Inspect all sections for TODOs, assignments, milestones, schedules,
      unsupported implementation commitments, and assertions of completed
      governance approval.
  - id: AC5
    criterion: >-
      The Chinese and English decision records are semantically equivalent,
      preserve the same section order, A1-A4 decisions, measurements,
      falsification conditions, exclusions, and NOT_VERIFIED markings.
      Independent bilingual review is NOT RECORDED.
    measurement: >-
      Compare both complete files section by section, including frontmatter,
      decision elements, numerical values, falsification table, and
      provenance declarations. Do not equate semantic equivalence with
      independent bilingual review.

