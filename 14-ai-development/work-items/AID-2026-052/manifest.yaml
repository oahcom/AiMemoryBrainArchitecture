findings:
  - id: AID-2026-052-F1
    severity: P1
    feedback_destination: "Delivery PR conversation. The register describes four reference groups but they are not one problem. parent_provenance_refs already has a generated validate() (ref_ctor!), so field 4 is a one-line call. source_refs, source_version_refs and actor_ref.actor_id are bare OpaqueId with no validator at all, so those three need inline emptiness checks, exactly as EvidenceExtension already does for collector.actor_id. An implementer who treats all four as the same shape will either add a validate() to OpaqueId - which changes the type for every user in the crate - or miss that field 4 is already covered."
  - id: AID-2026-052-F2
    severity: P1
    feedback_destination: "Delivery PR conversation. The cheapest way to make an empty reference impossible is a custom Deserialize on OpaqueId that rejects it. That would close this register and break the serialization contract for every type in the crate, including the fixtures that dm2_11 and the other phase-2 tests deserialize. The prompt forbids it explicitly, because 'reject at the boundary' and 'reject at the point of use' are different decisions and the register did not make the first one."
  - id: AID-2026-052-F3
    severity: P2
    feedback_destination: "Delivery PR conversation. GOV-NC-2026-11-22-PROVENANCE-REFERENCE-REVALIDATION-027 says it is independent of GOV-NC-2026-11-22-EVIDENCE-CONTRACT-026 §6.5 and does not imply equivalence between the two source_ref fields. That independence is real and this dispatch respects it, but it means a reader will find two open registers both about source references with no cross-reference explaining why fixing one does not fix the other. This AID adds no such cross-reference, because doing so would be a write to 026's scope."
  - id: AID-2026-052-F4
    severity: P2
    feedback_destination: "Delivery PR conversation. The closing condition asks for the serde-bypass test to pass, which this work delivers, and for the group-by-group revalidation, which it also delivers. It does not ask for independent evidence. But an implementation that writes its own acceptance tests and declares them sufficient is the pattern the repository's rulings prohibit elsewhere, so the register stays OPEN after merge on the same reasoning recorded in AID-2026-051-F3."
