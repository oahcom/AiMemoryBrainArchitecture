deliverables:
  - "Provenance::validate() revalidates every element of source_refs, source_version_refs and parent_provenance_refs, plus actor_ref.actor_id, in the same idiom EvidenceExtension::validate() already uses two hundred lines away."
  - "No change to OpaqueId's derived Deserialize, and no change to any Provenance field type or order. A strict Deserialize would fix the symptom by rewriting the serialization contract for every type in the crate."
  - "Four rejection tests, one per reference group, each constructing its illegal value through serde_json rather than a constructor: a struct literal cannot reach an empty OpaqueId without a helper that may itself validate, and then the test is testing the helper."
  - "Each illegal value is rejected by both Provenance::validate() and ProvenanceGraph::add, because the graph is the entry point that matters and it delegates."
  - "One graph-integrity test: a refused add leaves the graph unchanged, proven by re-inserting the same identity successfully and comparing ancestors()."
  - "dm2_11's eight mutations unchanged and still passing; existing valid fixtures unedited."
  - "cargo test -p memory-domain only. The workspace suite belongs to CI; a local multi-gigabyte target directory is not a contribution."

