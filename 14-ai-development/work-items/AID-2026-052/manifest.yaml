work_item_id: AID-2026-052
title: Revalidate the four Provenance reference fields so a deserialized record cannot bypass the constructor

class: DOMAIN/CODE/TEST
risk: R1
risk_rationale: "Adds validation to one method and tests beside it. No field type changes, no serialization contract change, no new dependency, no architecture decision. The one semantic widening - records that used to validate and now do not - can only reject values that no constructor could produce, which is the point."

security_scope: "Domain validation only. No authorization, no deletion/Forget path, no storage, no wire format. This change makes Provenance reject more inputs and accepts nothing it currently rejects."

