risk_rationale: "The implementation enforces content integrity across ContextEntryVersion validation, ChangeSet edit and commit paths, and brain-cli content hash generation. It prevents inconsistent declared hashes from passing validation without changing ContextVersion authority, reasoning-boundary evidence authority, or the snapshot hash algorithm."
