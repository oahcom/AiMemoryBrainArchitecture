scope:
  objective: "Validate ContextEntryVersion content_hash against the exact UTF-8 bytes of rendered_content during validation, and reject mismatches before any ChangeSet operation takes effect."
  changes:
    - "Introduce content_hash_for(rendered_content: &str) -> String as the single source of truth for generating sha256:-prefixed content hashes."
    - "Recalculate and compare content_hash in ContextEntryVersion::validate()."
    - "Recalculate and compare content_hash in validate_edit_entry() for the ContextEntry path."
    - "Introduce ContextError::ContentHashMismatch with entry_id, declared, and actual values."
    - "Update inline test fixtures to use actual content_hash_for() results."
    - "Add six integration tests covering deterministic hashing, exact UTF-8 bytes, Unicode normalization differences, incorrect hashes, stale hashes, and snapshot hash changes."
    - "Document the existing snapshot_hash() coverage of validated entry content hashes without changing its algorithm."
  untouched:
    - "Encryption algorithm selection and encryption policy."
    - "ContextVersion authority in domain G."
    - "Reasoning-boundary evidence authority in domains C/H."
    - "FNV-1a 64 snapshot_hash() algorithm."
    - "Snapshot hash semantics and calculation."
    - "Documentation bilingual mirror structure."

