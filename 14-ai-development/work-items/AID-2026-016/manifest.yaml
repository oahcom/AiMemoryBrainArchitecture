scope:
  objective: "Verify that every declared ContextEntryVersion content_hash matches the SHA-256 digest of the exact rendered UTF-8 content, enforce the same integrity contract across edit and commit paths, and ensure producers emit the canonical content hash representation."
  changes:
    - "crates/memory-context/src/lib.rs: add public content_hash_for(rendered_content: &str) -> String returning sha256:<hex> as the single source of truth."
    - "crates/memory-context/src/lib.rs: replace the production inline SHA-256 content hash generation with content_hash_for()."
    - "crates/memory-context/src/lib.rs: add ContextError::ContentHashMismatch { entry_id, declared, actual }."
    - "crates/memory-context/src/lib.rs: recalculate and compare content_hash in ContextEntryVersion::validate()."
    - "crates/memory-context/src/lib.rs: recalculate and compare content_hash in validate_edit_entry()."
    - "crates/memory-context/src/lib.rs: document the validated-entry content hash precondition of snapshot_hash() without changing FNV-1a 64."
    - "crates/memory-context/src/lib.rs: replace placeholder inline test hashes with actual content_hash_for() results."
    - "crates/memory-context/tests/content_hash_integrity.rs: add the initial six integration tests for deterministic SHA-256 generation, exact UTF-8 bytes, Unicode normalization distinctions, incorrect hashes, stale hashes, and snapshot hash changes."
    - "crates/memory-context/tests/content_hash_integrity.rs: add two regression tests covering edit-entry hash rejection and empty content hash rejection."
    - "crates/memory-context/tests/content_hash_integrity.rs: add three assertion extensions covering the commit and edit-entry hash paths."
    - "crates/brain-cli/src/main.rs: replace local bare-hex content_hash generation with memory_context::content_hash_for(&rendered_content), preserving the canonical sha256: prefix."
    - "crates/brain-cli/src/main.rs: retain local sha256_hex for non-content_hash purposes and document that distinction."
  untouched:
    - "Encryption algorithm selection and encryption policy."
    - "G ContextVersion authority."
    - "C/H reasoning-boundary evidence authority."
    - "FNV-1a 64 snapshot_hash() algorithm."
    - "Snapshot hash semantics."
    - "DDL and database schema."
    - "Bilingual documentation mirrors."

