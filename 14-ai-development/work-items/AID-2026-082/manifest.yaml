acceptance_criteria:
  - id: C1
    criterion: >-
      The Owner namespace checker scans the registered canonical root, docs/en and docs/zh-CN
      Component Map and Responsibility Matrix paths, plus the declared architecture diagrams.
    measurement: Exact path inventory and per-path scan report at the implementation PR Head.
  - id: C2
    criterion: >-
      The checker distinguishes explicit Owner A-I references, SYS-* subsystem identifiers,
      capability labels and P/S participation markers; ambiguous unqualified bare-letter
      accountability references fail.
    measurement: Positive and negative fixtures, including qualified references and realistic false-positive prose.
  - id: C3
    criterion: >-
      The governance traceability checker independently requires policy/authorization authority,
      canonical-state authority, physical executor and minimum completion evidence for every
      registered governance operation.
    measurement: Exact row-by-row report for root and EN/ZH-CN System Boundaries.
  - id: C4
    criterion: >-
      The checker rejects missing/collapsed authority roles, inferred physical completion,
      and unilateral Global Forget Completion claims.
    measurement: Negative fixtures for each missing role, same-role collapse, and false completion claim.
  - id: C5
    criterion: Both checkers detect missing or semantically divergent EN/ZH-CN counterparts.
    measurement: Mirror-deletion and mirror-drift fixtures fail; aligned fixtures pass.
  - id: C6
    criterion: >-
      A separate workflow runs the two checks with distinct named results and remains advisory;
      it does not change required branch-protection contexts.
    measurement: Workflow run evidence and repository protection readback; no ruleset mutation.
  - id: C7
    criterion: Existing validator behavior and Runtime/product behavior are unchanged.
    measurement: Changed-path audit plus unchanged output comparison for existing governance validators.
  - id: C8
    criterion: Tests cover positive, negative, boundary and regression cases reproducibly.
    measurement: Test commands and raw results recorded against the exact implementation PR Head.
  - id: C9
    criterion: An independent exact-Head review records each criterion and the Draft PR is not merged before acceptance.
    measurement: Review record names exact Head; no approval or acceptance is inferred from CI.

findings:
  - id: F1
    severity: HIGH
    statement: >-
      #1196's crosswalk documentation is now explicit, but its required anti-confusion lint/check
      does not exist in PR #1221. Manual prose alone cannot prevent future ambiguous references.
    evidence: Issue #1196 acceptance criterion 8 and delegated split comment 7183823530.
  - id: F2
    severity: HIGH
    statement: >-
      #1208's D/I authority boundary and operation register are documented, but there is no
      automated check ensuring each operation independently names policy authority,
      canonical-state authority and physical executor.
    evidence: Issue #1208 acceptance criterion 6 and delegated split comment 7183824141.

