scope:
  objective: >-
    Make GOV-DOC-002 able to classify the 42 mirror files in four directories that carried no front-matter,
    without touching a single body line, and keep DM-12 green while doing it.
  changes:
    - path: "01-system-architecture/{component-interactions,data-flows,system-quality-attributes}.md"
      detail: "Three trios: canonical root, docs/en mirror, docs/zh-CN mirror. Front-matter inserted at the top of each."
    - path: "02-domain-model/{core-entities,domain-model-overview,epistemic-and-temporal-semantics,lifecycle-model,phase-1-memory-store,phase-1-sqlite-adapter-contract,phase-1-storage-trait-contract,relationships-and-provenance,scope-and-permission-model}.md"
      detail: "Nine trios, same shape."
    - path: "06-memory-context/{README,phase-3.6-applied-forget-reconciliation-contract,phase-3.6.2...,phase-3.6.3...,phase-3.6.4...,phase-3.6.5...,phase-3.8.18...,phase-3.8.22...,phase-3.8.22....zh-CN}.md"
      detail: "Nine trios, same shape. README is role index; the four phase-3.6.x acceptance records and the phase-3.8.18 review are role review-report."
    - path: "16 mirrors that pin their canonical blob"
      detail: "One line per file: the Source revision / 源版本 40-hex value is re-pinned to the new canonical blob, because inserting front-matter into the canonical moves it (DEF-corpus-08)."
  untouched:
    - "every body line of every file, other than the sixteen pins"
    - "every orphan mirror (9 rel, 18 files)"
    - "every directory outside the four assigned ones"
    - "scripts/, .github/, .governance/, 00-governance/architecture-document-metadata.schema.yaml"
    - "branch protection and the sixteen declared required contexts"
  scope_deviation:
    id: DEVIATION-1
    dispatched_constraint: "the unit brief says not to change the canonical side"
    why_impossible: >-
      DM-12 requires bilingual_counterpart.source to be an already classified governed document, and requires
      the counterpart file itself to carry metadata. A classified mirror whose canonical and sibling are
      unclassified produces two DM-12 errors; the probe in evidence section 3 shows three. Of the 170 mirrors
      already classified at the base commit, 170 name a classified source: there is no green state in which a
      mirror is classified and its source is not.
    what_was_done_instead: >-
      The canonical root of each trio received the same front-matter block. canonical_status stays
      Non-Canonical everywhere, no canonical_scope_id is registered and no approval is recorded, so no
      authority is claimed; the normative_status value is transcribed from the document's own Status line and
      the basis is recorded per file.
    disclosure: "evidence section 3, both language copies"
