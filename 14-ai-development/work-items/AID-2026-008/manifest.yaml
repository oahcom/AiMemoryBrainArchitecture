scope:
  - >-
    Maintain a read-only evidence inventory for REQ-02, identifying
    repository paths, exact commits, blob SHAs, CI evidence and limitations.
  - >-
    Prepare a fact-only candidate capability matrix. Record candidate
    names, documented capabilities, current implementation facts,
    evidence references and unresolved questions.
  - >-
    Inventory existing evaluation criteria and identify unanswered
    requirement questions without creating new formal standards,
    scoring weights or decision thresholds.
  - >-
    Preserve the distinction between design evidence, static review,
    test evidence, integration evidence and production acceptance.
  - >-
    Preserve B-I, Storage and other domain Owner authority boundaries.
  - >-
    Record all unresolved decisions and route them to the responsible
    Owner or existing Issue.

non_goals:
  - No candidate scoring, ranking, comparison verdict or recommendation.
  - No database, retrieval engine, policy engine or agent framework selection.
  - No architecture selection or Owner semantic ruling.
  - No implementation-plan approval or production-readiness claim.
  - No replacement of B-I or Storage authority.
  - No new PR, Issue or branch creation.
  - No merge or repository file write by this ChatGPT session.
  - No Desktop Commander use.
  - No local WSL or local workstation project-file editing.

deliverables:
  - >-
    Evidence inventory with exact repository and CI evidence references.
  - >-
    Fact-only candidate capability matrix without scores, ranking or
    recommendations.
  - >-
    Inventory of existing evaluation criteria and unresolved requirement
    questions, without introducing new formal decision thresholds.
  - >-
    Work Item registration records: manifest, INDEX row and Issue #263
    association record.
  - >-
    Owner decision and independent-review handoff material, when
    separately authorized.

acceptance:
  - >-
    This manifest is valid YAML and contains Work Item identity, title,
    owning Issue, Owner role, status, source provenance and acceptance
    criteria.
  - >-
    The manifest exists at the exact required remote 43 path and is
    independently read back.
  - >-
    INDEX.md contains the matching AID-2026-008 row.
  - >-
    Issue #263 contains the Work Item association record.
  - >-
    L0 returns SHA-256, byte count, line count, file list, git status
    and read-back evidence for the registration artifacts.
  - >-
    Evidence inventory claims are traceable to exact repository refs,
    commits, blobs or CI runs.
  - >-
    Candidate matrix contains factual capability and evidence fields
    only; no scoring, ranking or recommendation is introduced.
  - >-
    Evaluation criteria material distinguishes existing standards
    from unresolved questions and does not create new formal thresholds.
  - >-
    Final technology selection requires the authorized Accountable
    Owner and relevant domain Owner decisions.
  - >-
    R3 independent security/domain review and reproducible evidence
    are required before applicable Work Item acceptance.
  - >-
    Work Item registration does not imply architecture acceptance,
    implementation approval or production readiness.

