acceptance_criteria:
  - id: AC1
    description: >-
      The canonical work-item registry schema and source rules are present
      and the source-rules document has valid document metadata.
    measurement: >-
      Run the schema fixture runner and document-management metadata checker
      against the exact PR head.
    expected_result: >-
      Schema fixtures pass and the canonical source-rules document has no
      DM-01 or DM-02 errors.
  - id: AC2
    description: >-
      The source-rules document has complete English and Simplified Chinese
      counterparts.
    measurement: >-
      Run GOV-DOC-001 and the bilingual documentation ratchet against the
      exact PR head.
    expected_result: >-
      Both counterpart paths exist, are linked through document metadata,
      and the bilingual gap count does not regress.
  - id: AC3
    description: >-
      Repository hygiene admits only JSON and YAML schema assets within the
      governance schema subtree through the new anchored rule.
    measurement: >-
      Run scripts/test_check_repository_hygiene.py and the repository
      new-file admission check against the exact PR base and head.
    expected_result: >-
      The new schema assets are admitted, unrelated suffixes remain denied,
      and all repository-hygiene tests pass.
  - id: AC4
    description: >-
      The work item is traceable through a manifest, prompt snapshot,
      session-evidence record and INDEX row.
    measurement: >-
      Run the session-evidence and work-item index membership checks against
      the exact PR head; independently recompute the prompt snapshot digest
      and byte count from the committed Git blob.
    expected_result: >-
      The manifest and evidence paths resolve, the prompt digest and byte
      count match the committed blob, and the INDEX contains exactly one
      AID-2026-293 row.

