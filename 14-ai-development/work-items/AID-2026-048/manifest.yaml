deliverables:
  - "DeliveryLifecycle is a five-state machine whose terminal states reject every outgoing transition."
  - "consume_ack distinguishes accepted, duplicate, late (superseded), stale-attempt and unknown-delivery ACKs, recording each rather than dropping it."
  - "Recording the attempt that reaches max_attempts moves the delivery to Abandoned, so the terminal state is reachable through the normal path rather than only by test construction."
  - "Row 97 of the English and Chinese coverage tables moves from NOT IMPLEMENTED to PARTIAL with the residual gaps named."

