findings:
  - id: AID-2026-048-F1
    severity: P2
    feedback_destination: "Delivery PR conversation. The first delivered revision made Abandoned unreachable: can_retry required attempt_count < max_attempts while record_attempt only abandoned on attempt_count > max_attempts, so no caller could ever enter the branch. Caught by the retry-exhaustion test before merge; fixed by treating max_attempts as the maximum number of attempts, first counted."
  - id: AID-2026-048-F2
    severity: P3
    feedback_destination: "Delivery PR conversation. AckOutcome carries both Late with superseded_by and StaleAttempt. The specification says only 'late ACK'; the two are genuinely different (the delivery object changed versus the attempt of the same delivery is obsolete), and StaleAttempt was not requested. Recorded as a design judgement rather than a silent addition."
