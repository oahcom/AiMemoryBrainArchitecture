work_item_id: AID-2026-204
title: Decode Git output as UTF-8 in every gate that reads it, so an unreadable pin is INCOMPLETE instead of "the file did not exist"
class: GATE/TEST
risk: R1
risk_rationale: >-
  Encoding and error classification only. No gate condition, threshold, baseline
  entry or document rule changes: on a UTF-8 locale (CI) every verdict is what it
  already was, and on a GBK console the nine false DM-10 "did not exist" verdicts
  disappear. A read that cannot be decoded now stops the run as INCOMPLETE (2)
  instead of becoming a content finding (1) or a crash.
