  files_out_of_scope: "Every other path. In particular the branch protection payload and the required-context list, which stage three would need and this work item is not authorized to touch; and the assessment records themselves, which stage two remediates and which stage one only reports on. The directory list above is the planned range and not a grant over the whole of each directory: the implementing session names its actual files in the pull request, and adding a required context is outside every one of them."

acceptance:
  C1: "A named CI check for REQ-level assessment signature compliance is present and runs on the authorized pull-request scope. PASS requires the check to execute on the exact tested commit; a missing or skipped execution fails."
  C2: "The check reads the top-level sponsor, accountable_owner and implementing_ai_session fields from each in-scope manifest. A nested-only implementing_ai_session does not satisfy the top-level field requirement."
  C3: "The check evaluates principal identity rather than raw string inequality. Identical sponsor and accountable_owner principals are accepted, while identical accountable_owner and implementing_ai_session principals are reported as violations."
  C4: "The check detects missing assessor, assessed_version and evidence_baseline fields in in-scope assessment records, and reports each missing field separately."
  C5: "The check validates that assessed_version is a full 40-character commit SHA and reports invalid or incomplete values."
  C6: "The check produces deterministic, actionable observation findings identifying the affected record, violated requirement and observed value; repeated execution over unchanged inputs produces the same findings."
  C7: "The observation-mode check does not fail the pull request solely because of the reported compliance findings, and does not become a required blocking context."
  C8: "Historical assessments are distinguishable from assessments governed by the corrected clause's applicability boundary; the observer does not retroactively invalidate previously accepted assessments."
  C9: "Automated tests cover compliant records, missing fields, nested-only fields, same-principal sponsor/accountable_owner, same-principal accountable_owner/implementing_ai_session, misleading string differences, malformed commit SHAs and historical applicability boundaries."
  C10: "No validator, workflow, protection rule or required context is changed to block merging based on these findings. Any such behavior requires separate authorization."

