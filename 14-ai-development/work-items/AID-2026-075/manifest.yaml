  gate_behaviour_change: "NOT_GRANTED - no blocking enforcement, required context or branch protection modification."
  schema_change: "NOT_GRANTED - no serialized type, database column or manifest schema migration is authorized."
  platform_state_change: "NOT_GRANTED - no required context, workflow protection or repository protection payload change is authorized."
  architecture_spec_change: "NOT_GRANTED - no additional normative specification change is authorized by this work item."

