# ---------------------------------------------------------------------------
# This is the fifth and last item AC2 of Issue #262 was held open on. The other
# four -- role, isolation, signature and accountability -- are normative text in
# section 5 of PR-GOVERNANCE-001.md and are merged. What is missing is the
# attachment point: no executable reads `assessor`, `assessed_version` or
# `evidence_baseline` anywhere in this repository, so a requirement with no
# reader is a requirement nobody can be found in breach of.
#
# The staging is the whole point of this work item. Stage one observes only: it
# reports, it does not block. Stage two remediates the records that the observer
# finds. Stage three would make the result blocking, and it needs its own
# authorization -- this work item does not carry it, and the manifest says so in
# `gate_behaviour_change` rather than leaving it to be inferred from a workflow
# file that happens not to fail.
#
# The order is not negotiable and it is not caution for its own sake. Turning the
# check on as a required context first would put the repository in the shape
# `rust-workspace-test` was in: a required context that fails on the commit that
# introduces it, with nothing but a revert available. Observing first produces
# the list of records that must be remediated before the check can be blocking,
# and that list is the input to stage two.
# ---------------------------------------------------------------------------

