    Replace the unavailable merge-queue mechanism with strict required-status
    checks as the merge-prevention mechanism, and independently detect
    two-parent duplicate work-item claims after a merge. Preserve the
    deliberate tree-only design of the existing uniqueness checker.
  changes:
    - path: "scripts/ci/check_work_item_merge_race.py"
      detail: >-
        Inspect two-parent merge commits in a push range. Compare both
        parent trees with their merge-base tree. Report IDs introduced
        independently in both parents, including both parent SHAs and
        commit subjects. Return 2 when required Git evidence is incomplete.
    - path: "scripts/ci/test_work_item_uniqueness.py"
      detail: >-
        Retain all ten existing tests and add a workflow-wiring regression
        and a real temporary-Git two-parent duplicate-claim regression.
        The latter asserts both claimant identities appear in the finding.
    - path: ".github/workflows/document-management.yml"
      detail: >-
        Add the post-merge detector to the existing GOV-DOC-002 required
        context on main push events. Document that strict protection is
        an external owner prerequisite and cannot be inspected using the
        workflow token.
