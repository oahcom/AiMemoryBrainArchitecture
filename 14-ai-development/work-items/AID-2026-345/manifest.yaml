  shared_allocator: "refs/heads/work-item-claims"
  allocation_rule: >-
    The number is taken by a non-force update of refs/heads/work-item-claims.
    If two writers build a claim on the same ledger commit, only one push can
    succeed; the other is rejected as non-fast-forward and must re-read the
    ledger. A scan is still required first: the claim proves uniqueness at the
    moment of the push, not that the number was never used.
  recheck_rule: >-
    Re-scan the work-items tree and the open pull request listing immediately
    before the claim push, and re-run the gate against the latest target base
    before the pull request is marked ready.
  claim_evidence: >-
    Claimed at 467e928a637ba22b58370a2061717e36de72d364 on
    refs/heads/work-item-claims for pull request #1537, after re-scanning the
    work-items tree (165 directories, max AID-2026-344), every origin ref and
    the open pull request listing.
scope:
  objective: >-
    Give work-item identity a single authoritative write point whose competing
    writers cannot both succeed, and make the uniqueness gate fail closed when
    it cannot read that point.
  changes:
    - path: "scripts/ci/check_work_item_uniqueness.py"
      detail: >-
        Add --registry-ref so the ledger is read from the authoritative ref
        rather than the target tree; add EXPIRED to the known states; narrow the
        own-claim exemption to a matching CLAIMED record; require a blocking
        claim for a newly introduced id; report WORK_ITEM_ID_UNREGISTERED and
        WORK_ITEM_ID_RELEASED as distinct verdicts; treat duplicate current
        claims as a violation. The tree rule and every existing test contract
        are unchanged when the flag is absent.
    - path: "scripts/ci/claim_work_item.py"
      detail: >-
        The writer. Reads the authoritative ref, refuses an id that is CLAIMED
        or MERGED by another pull request, writes one file, and pushes without
        force. A rejected push is reported as LOST_THE_RACE and is never
        retried automatically.
    - path: "scripts/ci/migrate_work_item_claims.py"
      detail: >-
        Deterministic ledger construction: the main tree decides which ids
        exist, Git history decides when, the GitHub API decides which pull
        request, and the legacy aid-ledger is auxiliary. Unverifiable ids are
        reported, never guessed.
    - path: "scripts/ci/test_work_item_claims.py"
      detail: >-
        Thirteen tests: unregistered and released verdicts, own and foreign
        claims, MERGED never exempted, missing or unreadable ref, duplicate
        current claims, unsupported schema, missing required fields, a
        candidate-supplied ledger, the same-id race and the refusal path.
    - path: ".github/workflows/document-management.yml"
      detail: >-
        Fetch the ledger ref; pass the pull request identity at all three call
        sites; resolve the merge-group pull request by head_ref and fail closed
        when it is not exactly one; keep the push run on the tree rule because
        the event carries no pull request identity.
    - path: "14-ai-development/work-items/AID-2026-345/"
      detail: "Record the contract, evidence, prompt snapshot and session evidence."
    - path: "14-ai-development/work-items/INDEX.md"
      detail: "Register AID-2026-345."
  untouched:
    - "all existing work-item records"
    - "GitHub merge queue and branch protection settings"
    - "every pull request other than this carrier"
    - "Issue #1532 body after creation"
