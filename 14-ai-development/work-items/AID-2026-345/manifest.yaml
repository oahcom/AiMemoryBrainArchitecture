implementation:
  status: IN_PROGRESS
  summary: >-
    The gate reads the claim ledger from refs/heads/work-item-claims, requires a
    blocking claim for a newly introduced id, and reports an unregistered id
    differently from a released one. The writer's only atomic step is the
    non-force ref update: of two competing claims exactly one lands, and the
    loser's record is then rejected by the gate.
  files_changed:
