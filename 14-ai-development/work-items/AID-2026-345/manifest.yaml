work_item_id: AID-2026-345
title: "Atomic work-item ID claim ledger"
class: GATE/TEST
risk: R2
risk_rationale: >-
  Adds one authoritative claim ref and makes the work-item uniqueness gate read
  it. Two consequences need to be understood before merge: a pull request that
  introduces a new work item must claim the id first, and a claim is never
  released by time alone. No branch protection, merge-queue setting, other
  pull request or existing work-item record is modified.
