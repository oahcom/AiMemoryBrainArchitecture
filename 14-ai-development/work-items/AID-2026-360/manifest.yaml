scope:
  objective: >-
    Decide the three candidate relations on one merge-group candidate tree and
    validate every member pull request body against that tree, so a multi-member
    queue cannot pass by validating only its tail.
  issue: "#1517"
  decisions:
    - "Ancestry is decided through the GitHub Compare API because the verdict job checks out the base with a shallow history."
    - "INCOMPLETE (exit 2) and VIOLATION (exit 1) are separate verdicts; an incomplete member prevents a PRESENT total."
    - "Member verdict lines never carry the AI-SESSION-EVIDENCE prefix; only the total verdict line does."
