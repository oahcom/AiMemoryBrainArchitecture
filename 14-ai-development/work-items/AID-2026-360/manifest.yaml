work_item_id: AID-2026-360
title: "Validate the whole merge-group candidate and every candidate PR"
class: GATE/TEST
risk: R1
risk_rationale: >-
  Adds a read-only candidate resolver and a merge-group branch to the existing
  verdict script. It does not change branch protection, the merge queue
  configuration, any required context, or the single-pull-request path, and it
  writes nothing outside the workflow step summary.
