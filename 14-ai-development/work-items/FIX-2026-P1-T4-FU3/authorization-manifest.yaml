                       the flatten case failed on its guard: "design_doc path did not occur
                         as declared"
                       the Level 3 case failed on its guard: "the example no longer declares
                         review_note as a path, so this case cannot be constructed; the defect
                         it guards against has returned to the template itself"

    run 2 (5 cases):   FAILED (failures=3)
                       test_example_evidence_paths_are_root_relative_bundle_paths
                       test_example_keeps_evidence_paths_root_relative
                       test_level3_review_note_must_still_be_a_path
                       the verbatim case still PASSED, now by design and documented

    restore:    template restored; `git diff` on the template is empty; full suite 72/72 OK.

A regression test that has never been observed to fail is a decoration. The two runs above
are the evidence that these fail, and the reason the count went from 2 to 3 is a defect the
first run found in the test itself.

