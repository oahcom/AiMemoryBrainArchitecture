## 2. Why this needs its own authorization

Four prior manifests in this series state: "scripts/** — not touched; no code, no test,
no checker change." That exclusion was correct for documentation corrections and is not
read here as a prohibition. This change set touches `scripts/**` only to ADD a test file;
the checker and the template are not modified.

