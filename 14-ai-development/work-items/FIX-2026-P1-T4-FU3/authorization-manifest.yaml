## 4. What was wrong

FIX-2026-P1-T4-FU1 (merge `cd9c5cd0`) fixed two documentation defects:

  1. the template example wrote evidence paths bundle-relative, while `verify_path()`
     resolves every declared value against the repository root of `subject_head`;
  2. `evidence.review_note` was documented as free text, while `LEVEL3_FIELDS` feeds it
     through the same path verifier.

Neither could be caught by the 67 shipped tests, because those construct declarations by
hand and never read the documentation. So both defects were invisible to a green suite,
were found only by a human-style audit, and could return the same way.

The structural point: the repository has a checker that nothing calls automatically, and
a documented shape that nothing checks. Two artifacts that are supposed to agree, with no
executable statement that they do agree, is not a gate — it is a coincidence that is
currently holding.

## 5. What this adds

One test module, three cases, each asserting VERDICT and the specific REASON code:

| Case | Assertion | Guards |
|---|---|---|
| `test_documented_example_passes_verbatim` | example read out of the shipped template, materialised in a real Git repo, returns `VERDICT PASS` and no REASON | the documented shape stays executable |
| `test_example_keeps_evidence_paths_root_relative` | flattening one evidence path to a bundle-relative name returns `BLOCKED` + `CE_EVIDENCE_NOT_IN_SUBJECT` | FU1 defect 1 cannot return |
| `test_level3_review_note_must_still_be_a_path` | at Level 3, `review_note` as free text returns `BLOCKED` + `CE_EVIDENCE_NOT_IN_SUBJECT` | FU1 defect 2 cannot return |

Design notes:

- The example is **read from the template**, not copied into the test. A copy would drift.
- The declaration is parsed with the **shipped parser** (imported from the checker), not a
  reimplementation, so a change in the accepted syntax surfaces here.
- The fixture sets `origin` to the repository the example declares. Without it the checker
  returns `CE_REPO_IDENTITY_UNVERIFIED` and every case would fail for a reason unrelated to
  what it tests — discovered while building this test, and the first version of it did fail
  exactly that way.

## 6. Verification

    new module:      3 tests, OK
    full suite:      70 tests, OK  (67 shipped + 3 added, run with
                     python -m unittest discover -s scripts/governance/evidence -p "test_*.py")
    negative control: the template was reverted in the working tree to its pre-FU1 shape
                     (bundle-relative paths + free-text review_note) and the suite was run:
                     FAILED (2 failures) — the positive case reported the example as BLOCKED
                     and the Level 3 case reported that the defect had returned to the
                     template itself. The template was then restored and `git diff` on it
                     was empty.

A regression test that has never been observed to fail is a decoration. The negative
control above is the evidence that this one fails.

## 7. Review

    level: R1 (documentation plus test-only; no checker or template change)
    independent review: separate session, same `oahcom` identity.
    platform-axis independence: NOT MET, not claimed.

## 8. INDEX registration deferred on purpose

The INDEX row for this work item is NOT added here. A row added by the PR that merges it
would be stale by construction: it would have to assert a carrier state that is false
within seconds of the merge, which is exactly the defect FIX-2026-P1-INDEX-REFRESH-001
closed two commits ago. Registration happens in a follow-up pass that can state the merge
SHA as a binding fact instead of guessing at it.

Precedent in this repository: #289 declared its own INDEX registration as "a separate
authorization item" rather than folding it in.

## 9. Limits

- No workflow wiring. The checker still runs only when someone runs it. This test narrows
  the gap by making the *documentation* mismatch detectable in the suite that people do
  run; it does not make the checker run on pull requests.
- CI cannot execute (account billing interruption), so the 70/70 above is a local run.
- No policy status change; `AI-DOC-EVIDENCE-TIERING` remains `PROPOSED`.
