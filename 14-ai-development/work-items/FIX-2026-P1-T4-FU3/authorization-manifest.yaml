                     python -m unittest discover -s scripts/governance/evidence -p "test_*.py")

Negative control, run twice — the first run is what exposed the verbatim case's limit:

    injection:  the template was reverted in the working tree to its pre-FU1 shape
                (evidence paths flattened to bare filenames, review_note set to free text).
