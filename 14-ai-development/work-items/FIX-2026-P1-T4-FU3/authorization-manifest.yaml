## 8. INDEX registration: deferred, with an owner and a condition

The INDEX row for this work item is NOT added here. A row added by the PR that merges it
would have to assert a carrier state that is false within seconds of the merge — the defect
FIX-2026-P1-INDEX-REFRESH-001 closed two commits ago. Precedent: #289 declared its own INDEX
registration as "a separate authorization item".

A deferral without terms is just a missing row, so the terms are stated:

    responsible:   coordinator session (13-20-04), self-issued decision, labelled as such
    trigger:       this PR merges or closes
    condition:     the row states the merge SHA and merge time as BINDING FACTS read back
                   after the merge, plus the review chain comment ids; it must not assert a
                   pending state at the moment of writing
    scope:         its own authorization, one path (14-ai-development/work-items/INDEX.md)
    not a licence: the deferral expires with that registration; it does not permit this work
                   item to stay unregistered

If the trigger fires and no registration follows, the omission is a registry defect and must
be recorded as one rather than explained.

## 9. Limits

- No workflow wiring. The checker still runs only when someone runs it. This test narrows
  the gap by making the *documentation* mismatch detectable in the suite that people do
  run; it does not make the checker run on pull requests.
- CI cannot execute (account billing interruption), so the 70/70 above is a local run.
- No policy status change; `AI-DOC-EVIDENCE-TIERING` remains `PROPOSED`.

## 10. Review history

    R1: NEEDS-REVISION - 1xP1, 2xP2, 1xP3 (separate session, same oahcom identity).

    P1 (applied): the Level 3 case asserted only that the expected REASON appeared, without
    proving it was the cause. BLOCKED at Level 3 could have come from any other Level 3
    condition, so the case could have been asserting a coincidence. Fixed by adding the
    Level 3 control (5a) and by asserting the EXACT reason set rather than membership, in
    both the Level 3 case and the flatten case. R1 was right, and right for the reason that
    matters: a case that cannot fail for its stated cause is not evidence about that cause.

    P2 (applied): the negative control's actual output is now recorded in section 6, including
    the run that failed, and the full 72-test run after restore is stated. R1 also asked for
    the INDEX registration to name responsibility and completion conditions; section 8 now
    states responsible party, trigger, condition, scope and expiry.

    P3 (applied): the module docstring states that a legitimate change to the template will
    fail these cases until the fixture and expectation follow, that this is the intended cost
    because the example is a contract, and that relaxing an assertion to get green again is
    the one response that is not allowed.

    Not from R1, found while applying its P1: the verbatim case is insensitive to the path
    base, because the fixture materialises whatever the declaration names. Recorded in 5a and
    closed by a case whose expectation is stated independently of the template. The negative
    control now fails 3 of 5 instead of 2 of 5, and the surviving pass is documented rather
    than unexplained.
