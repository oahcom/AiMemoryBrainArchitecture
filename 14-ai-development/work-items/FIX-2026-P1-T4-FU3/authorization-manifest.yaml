## 4. What was wrong

FIX-2026-P1-T4-FU1 (merge `cd9c5cd0`) fixed two documentation defects:

  1. the template example wrote evidence paths bundle-relative, while `verify_path()`
     resolves every declared value against the repository root of `subject_head`;
  2. `evidence.review_note` was documented as free text, while `LEVEL3_FIELDS` feeds it
     through the same path verifier.

Neither could be caught by the 67 shipped tests, because those construct declarations by
hand and never read the documentation. So both defects were invisible to a green suite,
were found only by a human-style audit, and could return the same way.

The structural point: the repository has a checker that nothing calls automatically, and
a documented shape that nothing checks. Two artifacts that are supposed to agree, with no
executable statement that they do agree, is not a gate — it is a coincidence that is
currently holding.

## 5. What this adds

One test module, five cases. Each asserts VERDICT and the **exact set** of REASON codes, not
membership: a case is only causal when a control passes and the treatment changes one field,
so a second reason would mean the case is accusing the wrong thing.

| Case | Assertion | Guards |
|---|---|---|
| `test_documented_example_passes_verbatim` | example read out of the shipped template, materialised in a real Git repo, returns `VERDICT PASS` and no REASON | the documented shape stays executable |
| `test_example_evidence_paths_are_root_relative_bundle_paths` | every declared evidence path starts at `14-ai-development/work-items/` | the path base is visible in the example instead of being satisfied by a lucky layout |
| `test_example_keeps_evidence_paths_root_relative` | flattening one evidence path returns `BLOCKED` with exactly `{CE_EVIDENCE_NOT_IN_SUBJECT}` | FU1 defect 1 cannot return |
| `test_level3_control_passes` | a Level 3 declaration shaped so Level 3 is legal returns `VERDICT PASS` | confounders are eliminated before the next case is read as causal |
| `test_level3_review_note_must_still_be_a_path` | same declaration, only `review_note` changed to free text, returns `BLOCKED` with exactly `{CE_EVIDENCE_NOT_IN_SUBJECT}` | FU1 defect 2 cannot return |

Design notes:

- The example is **read from the template**, not copied into the test. A copy would drift.
- The declaration is parsed with the **shipped parser** (imported from the checker), not a
  reimplementation, so a change in the accepted syntax surfaces here.
- The fixture sets `origin` to the repository the example declares. Without it the checker
  returns `CE_REPO_IDENTITY_UNVERIFIED` and every case would fail for a reason unrelated to
  what it tests — discovered while building this test, and the first version did fail that way.
- The Level 3 control exists because the example as printed is `FEATURE` at `R2`, and
  `FEATURE` cannot be Level 3 (`CE_LEVEL_CLASS_CONFLICT`) while `R2` to Level 3 is a
  downgrade needing its own justification. `DOC_EDITORIAL` at `R1` reaches Level 3 with no
  extra fields, which is what makes the pair a controlled comparison rather than two
  independent failures.

## 5a. A limit of the verbatim case, measured rather than assumed

The verbatim case is **self-consistent, not correct**. The fixture materialises whatever the
declaration names, so an example writing `"design.md"` also passes there — it simply gets a
`design.md` at the repository root. This was found by running the negative control after the
first revision: the template reverted to its pre-FU1 shape still produced a green verbatim
case, and only the two guard assertions failed. That is exactly the failure mode R1 later
named for a different case, found here by accident and fixed on purpose.

Consequence: the path-base defect needs an expectation stated **independently of the
template**, which is what `test_example_evidence_paths_are_root_relative_bundle_paths` does.
With that case in place, the negative control fails 3 of 5 rather than 2 of 5, and the
verbatim case keeps passing — which is now a documented property, not an oversight.

