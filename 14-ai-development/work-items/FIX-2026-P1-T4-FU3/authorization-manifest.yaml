# FIX-2026-P1-T4-FU3 authorization manifest

Pins the documented declaration example to the shipped checker with an executable
regression test. Every fact below was measured during this operation.

## 1. Decision

    decision_id: DEC-FIX-2026-P1-T4-FU3-GO-001
    issued_by: coordinator session (13-20-04)
    form: GO decision + manifest (allowed_write_paths, authorization_basis)
    self_issued: true
    self_issued_note: >
      Self-issued by the session that performs the write. It is not an Owner approval,
