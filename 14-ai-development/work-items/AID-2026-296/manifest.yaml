  allocation_rule: >-
    Enumerated every directory under 14-ai-development/work-items on
    origin/main a0500d519 and grepped the whole tree for "AID-2026-296": no
    directory and no occurrence, in INDEX.md or anywhere else. The ID is
    therefore unoccupied at allocation time.
  recheck_rule: >-
    Recheck the directory and the all-state PR listing immediately before
    opening or updating the PR; if the ID has been claimed in the meantime,
    take the first free identifier above 296 and record the reassignment.
scope:
  objective: >-
    Stop treating a blob_sha256 declaration with no bindable path as an
    out-of-scope field. Emit one UNBOUND_BLOB_SHA256 finding per such
    declaration, classify it as a violation, and return a non-zero violation
    exit code, per PR #1417 comment 7212343821.
  changes:
    - path: "scripts/ci/check_manifest_blob_pins.py"
      detail: >-
        Walk every mapping for a blob_sha256 / *_blob_sha256 key. Bind a path
        from the same mapping (base_path, base_file, a bare base value that
        reads as a path, then path/file). Bound digests are verified as SHA-256
        over committed bytes and report MISMATCH or PATH_MISSING; an unbound
        digest reports UNBOUND_BLOB_SHA256 with the manifest path, JSON pointer,
        field name and digest value, and forces exit 1. The summary line gains
        unbound=N.
    - path: "scripts/ci/test_check_manifest_blob_pins.py"
      detail: >-
        Keep every existing test and add the four required cases: bound and
        matching, bound and mismatched (MISMATCH), bound with an absent target
        (PATH_MISSING), and a digest with no path (UNBOUND_BLOB_SHA256, exit 1).
    - path: "scripts/ci/assert_manifest_blob_pin_negative.py"
      detail: >-
        The immutable negative sample now also yields four unbound findings, so
        its pinned summary moves to pins=172 and gains unbound=4, and the
        assertion additionally requires exactly four UNBOUND_BLOB_SHA256 lines.
        The check stays exact-equality; nothing is loosened.
    - path: "scripts/ci/test_assert_manifest_blob_pin_negative.py"
      detail: >-
        Fixture summary follows the new shape and the valid fixture emits four
        UNBOUND_BLOB_SHA256 lines, so the seven negative-assertion tests keep
        exercising the exact-equality path.
    - path: ".github/workflows/repository-hygiene.yml"
      detail: >-
        Add /^UNBOUND_BLOB_SHA256 /p to the sed filter of the existing ratchet
        step, so the new finding class reaches the ratchet instead of bypassing
        it. No step is added, renamed or re-required.
    - path: "14-ai-development/work-items/AID-2026-296/"
      detail: "Record manifest, evidence, prompt snapshot and session evidence."
    - path: "14-ai-development/work-items/INDEX.md"
      detail: "Register AID-2026-296."
    - path: "14-ai-development/work-items/AID-2026-001/manifest.yaml"
      detail: >-
        Remediate the four findings this gate reports, decided field by field by
        the adjudicating session (conv 6b0a40f6). The two LF digests are bound to
        their committed blobs by adding model_path and tests_path inside
        measurement_basis, so the checker verifies them as blob pins. The two CRLF
        digests are reclassified as rendered working-copy representation digests
        under an independent schema and renamed model_working_copy_sha256_crlf /
        tests_working_copy_sha256_crlf, so they no longer claim to be blob pins.
        The block carries the declaration inline. No other field in that manifest
        is touched and no ratchet baseline entry is added.
  untouched:
    - "scripts/ci/baselines/manifest-blob-pins.txt"
    - "all other .github/workflows files"
    - "GitHub branch protection, rulesets and required contexts"
