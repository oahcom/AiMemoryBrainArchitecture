implementation:
  status: IMPLEMENTED
  summary: >-
    The checker now emits one UNBOUND_BLOB_SHA256 finding per blob_sha256
    declaration that has no bindable path and exits 1, instead of skipping the
    field. On main a0500d519 this adds four findings, all in
    AID-2026-001.measurement_basis, and the ratchet reports 15 baseline items
    against 19 current, so the existing hard gate turns red on a real,
    previously excluded violation. The baseline was not touched. After merging
    main b333ad1c the immutable negative sample 9a2063ae also yields four
    unbound findings, so its exact-equality expectation moved to pins=172 with
    unbound=4 and now requires exactly four UNBOUND_BLOB_SHA256 lines.
    The four findings in AID-2026-001 are then remediated rather than baselined:
    the adjudicating session (conv 6b0a40f6) ruled field by field that the two LF
    digests are committed-blob pins and must be bound by model_path / tests_path,
    and that the two CRLF digests are SHA-256 over a deterministic CRLF rendering
    of those same committed blobs, not blob pins, so they move to an independent
    representation-digest schema under the names
    model_working_copy_sha256_crlf / tests_working_copy_sha256_crlf. After that
    change the checker reports unbound=0 and the ratchet reports the unchanged
    four-item baseline against four current items.
  files_changed:
    - "scripts/ci/check_manifest_blob_pins.py"
    - "scripts/ci/test_check_manifest_blob_pins.py"
    - "scripts/ci/assert_manifest_blob_pin_negative.py"
    - "scripts/ci/test_assert_manifest_blob_pin_negative.py"
    - ".github/workflows/repository-hygiene.yml"
    - "14-ai-development/work-items/AID-2026-001/manifest.yaml"
    - "14-ai-development/work-items/AID-2026-296/manifest.yaml"
    - "14-ai-development/work-items/AID-2026-296/evidence.md"
    - "14-ai-development/work-items/AID-2026-296/prompt-v1.md"
    - "14-ai-development/work-items/AID-2026-296/session-evidence.md"
    - "14-ai-development/work-items/INDEX.md"
  tests:
    - "Bound blob_sha256 with a matching digest: PASS, exit 0."
    - "Bound blob_sha256 with a wrong digest: MISMATCH, exit 1."
    - "Bound blob_sha256 whose target is absent: PATH_MISSING, exit 1."
    - "Digest with no path: UNBOUND_BLOB_SHA256, exit 1."
    - "All 13 pre-existing blob-pin tests still pass (17 total)."
    - "Immutable negative sample 9a2063ae: NEGATIVE_ASSERTION_PASS with exactly 4 UNBOUND_BLOB_SHA256 lines; its 7 tests pass."
