work_item_id: AID-2026-296
title: "Treat unbound blob_sha256 declarations as violations in the manifest blob-pin gate"
class: GATE/CI/TEST
risk: R1
risk_rationale: >-
  Strengthens only the existing manifest blob-pin checker, its unit suite and the
  sed filter of the ratchet step that already runs inside the existing
  "Repository hygiene (hard gate)" job. No new job, no new required context, no
  branch-protection change and no dependency is added. The four records the new
  rule flags are pre-existing on main; they are reported, not baselined away.
