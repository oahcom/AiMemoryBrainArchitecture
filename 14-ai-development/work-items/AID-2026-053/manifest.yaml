findings:
  - id: AID-2026-053-F1
    severity: P1
    feedback_destination: "Delivery PR conversation. Register 026 §7 item 4 asks the implementer to 'verify the BMCP protocol mapping'. There is no mapping. crates/bmcp-protocol has its own EvidenceKind with four delivery-class values inside pub mod evidence; that crate has no dependency on memory-domain, nothing outside it references the type, and no From/Into or conversion of any kind exists between the two. A session that reads the register and then looks for a mapping will either report a false negative or, worse, build the mapping the register assumed existed. Hard constraint #1 forbids touching the crate and the prompt tells the implementer the correct output is a written statement that the item measures nothing."
  - id: AID-2026-053-F2
    severity: P1
    feedback_destination: "Delivery PR conversation. The serde rename to snake_case is a wire-format change, and nothing in register 026 authorises a wire-format change - it authorises the enum values. It is safe here only because the corpus of persisted Evidence is empty, which is a measurement about this tree at this commit rather than a property of the design. If a store appears later, the rename becomes a migration and this AID is not the instrument for it. That is recorded here rather than assumed away, because the next reader of the enum will not see the measurement."
  - id: AID-2026-053-F3
    severity: P2
    feedback_destination: "Delivery PR conversation. Removing Unavailable is a strictly lossy move: any consumer that treated it as 'deferred for some reason I do not model' now has to pick a reason. The ruling in OWNER-DECISION-EVIDENCE-CONTRACT-001 §4 chose removal because splitting it would have meant inventing the distinction between expired and external_unavailable inside a variant whose only reason string distinguishes neither. The cost is real and is recorded here rather than presented as a pure win."
  - id: AID-2026-053-F4
    severity: P2
    feedback_destination: "Delivery PR conversation. WP-B does not close register 026, and an implementer who completes every acceptance criterion in this prompt should not expect the register row to change. §6 of the prompt says so explicitly. The register's closing condition 10 requires formal implementation authorization, and a dispatch is not an authorization; condition 12 requires WP-A, which is blocked on Instant, Locator and ContentRef having no definition in the tree at all."

notes:
  - "The four non-contract EvidenceKind values are removed, not remapped. Message is not mapped to source_span on name similarity: register 026 §5.4 forbids it, and the two mean different things even though both are about utterances."
  - "Existing fixtures that construct EvidenceKind::Document or EvidenceAvailability::Available are valid under both the old and the new spelling of the variant identifier; only the serialized form changes, so those fixtures are edited only where they assert a string literal."

