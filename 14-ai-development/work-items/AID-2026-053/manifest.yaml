work_item_id: AID-2026-053
title: Make the two Evidence enums match §8, and delete the four values nothing constructs

class: DOMAIN/CODE/TEST
risk: R2
risk_rationale: "Deletes four enum variants and renames the serde representation of both enums, which is a wire-format change. It is R2 rather than R3 only because the blast radius was measured to be one construction site and zero persisted bytes: no storage crate names EvidenceExtension, there are no tracked .db or .sqlite files, and there are no *.sql migrations. The risk is not in the change; it is in the measurement being wrong. Acceptance criterion 9 and hard constraint #0 exist so that a wrong measurement surfaces as a scope violation rather than as silent field drift."

security_scope: "None. No authorization path, no Forget path, no storage engine, no transport. The change is exhaustive-match and serde-rename over two enums in memory-domain, plus the one match arm in memory-compiler that consumes them."

