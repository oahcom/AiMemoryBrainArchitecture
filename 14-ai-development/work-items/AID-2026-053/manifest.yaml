deliverables:
  - "EvidenceKind reduced to exactly the seven contract values of §8 - source_span, user_statement, document, observation, tool_result, attestation, derived_excerpt - with Message, Record, Dataset and Other(String) deleted rather than remapped."
  - "EvidenceAvailability reduced to exactly the five contract values - available, restricted, expired, forgotten, external_unavailable - with Unavailable deleted, not renamed to either of the two states it was standing in for."
  - "#[serde(rename_all = \"snake_case\")] on both enums, so the serialized form is the contract's own spelling rather than the variant identifier."
  - "attachment_decision covers all five availability values with reasons that stay distinct: Expired says the source aged out, ExternalUnavailable says it was never reachable."
  - "The one construction site of Unavailable - the test unavailable_evidence_defers_attachment_with_its_reason at memory-compiler/tests/evidence.rs:236 - rewritten to name the state it actually means, with the choice and its justification in the commit message."
  - "A negative test per removed value: deserializing \"Unavailable\", \"Message\", \"Record\", \"Dataset\" and an Other payload fails, and the test asserts the failure rather than asserting the absence of a panic."
  - "Round-trip test over all 7 and all 5 values, asserting the exact contract string in both directions."
  - "cargo test -p memory-domain and cargo test -p memory-compiler only, with counts reported. The workspace suite belongs to CI; a local multi-gigabyte target directory is not a contribution."
  - "No field of Evidence or EvidenceExtension touched, and nothing under crates/bmcp-protocol/ touched."

