# Two stages, deliberately split by an Owner close ruling on pull request
# #1018. Stage A is this branch: the trigger change, no claim about
# enforcement. Stage B is a separate change that can only be written after the
# protection payload has been changed, because it has to state the measured
# count with a date.
#
# The split is not cosmetic. A required context that is never scheduled is
# permanently absent, not pending, so requiring rust-workspace-test before the
# trigger change lands would deadlock every pull request that does not touch
# crates/**.
# ---------------------------------------------------------------------------

