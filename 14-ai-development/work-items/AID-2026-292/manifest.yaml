implementation:
  status: IN_PROGRESS
  summary: >-
    T129 has been implemented in
    scripts/test_check_document_management.py and measured on the
    implementation branch fix/2026-11-27-aid-292-in-suite-skip-selfcheck,
    based on origin/main at 561e9f24. Normal run, forced symlink-unavailable
    run, unregistered-skip negative control and the erasure mutation were all
    executed. The implementation has not yet been merged. All measurements
    are tied to the exact tested file SHA-256 and must be repeated
    after any rebase or source modification.

  files_changed:
    - scripts/test_check_document_management.py

  tests:
    - >-
      python scripts/test_check_document_management.py, normal platform:
      377/377 passed, 1 skipped (T68c), exit 0.
    - >-
      Same suite with Path.symlink_to forced to raise OSError(1314) for the
      whole of main(): exit 0, 365/365 passed, 13 skipped, 13 registered of
      13 allowed, UNEXPECTED_SKIPS empty, no skipped name in RESULTS_BY_NAME,
      T129 True.
    - >-
      Negative control: pop T49 from ALLOWED_SKIPS under the same forced
      failure: exit 1, 364/365, FAIL line names T49, T129 False.
    - >-
      Erasure mutation: make run_scan_boundary() return immediately after the
      T49 skip: exit 1, 363 results, 10 skips, and T129 is the single failing
      case. Source restored byte-identically afterwards.
    - >-
      Verify the test-runner diff and runner tuple: T129 is the only case
      added, with no other test cases or unrelated runner changes.

