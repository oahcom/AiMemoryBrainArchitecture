implementation:
  status: IMPLEMENTED
  summary: >-
    The seven remaining unprotected symlink creation sites (T49, T50, T51,
    T51b, T58, T59, T60) and T128 now record a registered skip instead of
    aborting the run or reporting a hard failure, and T129 asserts from
    inside the suite that all twelve symlink-dependent cases skip without
    erasing the independent cases. Operator execution rejected the first
    delivery for two defects: a local variable named skip shadowed the
    module-level function inside run_scan_boundary(), so the four new calls
    there raised UnboundLocalError, and the T129 independent-case list named
    T61 with a string no case records. Both are fixed in this commit.
