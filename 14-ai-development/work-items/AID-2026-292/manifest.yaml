    Add the in-suite regression case T129 that proves symlink-unavailable
    skips do not erase independent test cases executed by the same runner
    functions. The eight symlink-dependent sites themselves were landed
    by AID-2026-324 and are explicitly outside this work item's scope.

  constraints:
    - >-
      Do not modify AID-2026-324's _create_symlink_or_skip helper or
      any of its eight registered call sites.
    - >-
      Do not modify CI jobs, branch protection, or the 16 required contexts.
    - Do not add dependencies.
    - Do not weaken skip() or ALLOWED_SKIPS.
    - Do not wire the standalone verification script into CI.
    - Do not change production code or unrelated test behavior.
    - Keep the change limited to the T129 regression case and its runner registration.
    - Preserve existing result, skip, and unexpected-skip accounting semantics.

  untouched:
