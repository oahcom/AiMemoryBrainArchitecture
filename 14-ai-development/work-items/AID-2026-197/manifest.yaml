scope:
  objective: >-
    Close the two gate defects recorded as DEF-gates-08 and DEF-gates-07 in the
    `gates` defect lane, without widening any pass condition and without
    touching a baseline file.
  changes:
    - path: "scripts/check_source_revision_pointers.py"
      detail: >-
        A revision value that is not a 40-character blob (`main`, `HEAD`, a tag
        name, a prose sentence) is counted as NON_BLOB_REFERENCE and now also
        enters BAD, which is what the module docstring already promised. The
        n-th live revision record in a document is compared with the n-th live
        `Source:` line instead of every record being compared with `links[0]`.
        A record with no source line of its own is UNRESOLVED, not silently
        checked against the previous record's file. `scan(root)` and an
        optional `--root` were added so the behaviour can be exercised against
        a fixture repository.
    - path: "scripts/ci/gate_ratchet.py"
      detail: >-
        `--format paths` no longer truncates at ` -> `: the detail the wrapped
        gate printed is part of the item. A line that starts with a verdict
        word but still names a repository object (`OK 00-governance/a.md has no
        counterpart`) is an item, not a summary; a line that only reports a
        verdict or a count is still not an item. A bare-path baseline entry,
        which is the shape gates.yml documents for `--format paths`, now covers
        exactly one item beginning with `"<path> -> "`, so two different
        failures on one path need two entries and the second is a regression.
    - path: "scripts/ci/test_gate_ratchet.py"
      detail: >-
        Seven tests added: two failures on one path stay two items, a detail
        change is a regression rather than a match, both details baselined
        pass, an item wearing a verdict prefix is not dropped, the same item
        baselined is matched, verdict and count lines are still not items, and
        a name that merely starts with a verdict word is still an item.
    - path: "scripts/test_check_source_revision_pointers.py"
      detail: >-
        New self-check: five fixture-repository tests covering per-pointer
        pairing, the wrong pointer being blamed on its own source, a movable
        reference failing the scan, a pointer with no source line of its own
        being UNRESOLVED, and both language trees being scanned.
    - path: ".github/workflows/repository-hygiene.yml"
      detail: >-
        The new self-check is added to the existing "Run unreachable
        self-checks from the repository root" list, because no workflow runs
        `unittest discover -s scripts` and a test file that nothing runs fails
        scripts/ci/check_test_reachability.py.
  untouched:
    - "scripts/ci/baselines/bilingual-docs.txt and scripts/bilingual-baseline.txt (no entry added, removed or regenerated)"
    - "scripts/ci/baselines/gate-wiring.txt (check_source_revision_pointers.py stays baselined as unwired)"
    - "every other pass/fail condition of both scripts; no new exemption"
    - "branch protection, the sixteen declared required contexts, every job name and count"
    - "unrelated checkers, registries, mirrors and work items"
