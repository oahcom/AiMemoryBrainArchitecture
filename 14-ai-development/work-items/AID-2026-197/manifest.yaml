work_item_id: AID-2026-197
title: >-
  Make the two "looks like it checks, does not check" gates report what they
  claim: a movable Source revision pointer fails, each pointer is compared to
  its own source line, and the ratchet keeps what follows the arrow and the
  items that wear a verdict prefix
class: GATE/TEST
risk: R2
risk_rationale: >-
  Two checker semantics change and both changes can turn a previously silent
  pass into a failure. check_source_revision_pointers.py is not wired into any
  workflow (it is baselined in scripts/ci/baselines/gate-wiring.txt because it
  already exits 1 on main), so its new failures are visible only to whoever
  runs it by hand. gate_ratchet.py does run as the required `bilingual` context,
  and the item identity it compares becomes stricter: the part after ` -> ` is
  kept, and a baseline entry that is a bare path now covers exactly one item
  instead of every item on that path. Verified on this tree: the shipped
  baseline still matches exactly (baseline=77 current=77 regressions=0 fixed=0,
  exit 0), so no required context changes colour today.
