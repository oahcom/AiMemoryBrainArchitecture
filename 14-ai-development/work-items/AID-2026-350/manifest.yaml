    and the same adjudication concluded that none of them can be repaired
    without changing product semantics: each requires an Owner decision. That
    conclusion currently lives only in an out-of-tree review conversation. This
    change records it in-tree as an Informative decision request so the three
    defects have a reviewable, citable blocking reason and a named decision
    question instead of an unstated dependency.
  in_scope:
