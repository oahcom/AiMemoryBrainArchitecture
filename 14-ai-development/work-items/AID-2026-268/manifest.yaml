title: Verify manifest blob pins against committed Git object bytes
class: GATE/CI/TEST
risk: R2
risk_rationale: >-
  Adds a standard-library Git-object verifier and isolated unit tests, then
  invokes them inside the existing required Repository hygiene job. It does
  not alter branch protection, create a workflow/job, or change unrelated
  manifests. The checker fails closed when a declared source commit cannot
  be read and verifies Git blob IDs, prompt SHA-256 values, and prompt byte
  counts against committed bytes.
