acceptance:
  required:
    - Every enumerated Git blob pin is recomputed from committed bytes.
    - Missing paths and mismatched digests fail with declared and actual values where available.
    - Explicit cross-commit pins resolve only at their declared source commit.
    - An unavailable, invalid, or unresolvable source commit is classified as
      INCOMPLETE UNRESOLVED(SOURCE_MISSING) and exits 1; exit 2 is reserved for
      scan or execution failures.
    - Existing commit/tree/tag objects referenced where a blob pin is expected
      are classified as NON_BLOB, without incrementing the blob-pin count.
    - A nonexistent 40-hex object ID does not independently produce
      GIT_OBJECT_MISSING; locator verification continues and classifies the
      declared path/digest as MISMATCH or PATH_MISSING where applicable.
    - MISMATCH/PATH_MISSING and UNRESOLVED are checked by separate exact ratchets.
    - Stage one retains the fixed A-F field enumeration; generic shape discovery
      is deferred to stage two under Issue #1350.
    - Prompt SHA-256 and byte-count pins are both verified.
    - The existing Repository hygiene required context remains the carrier.
    - Positive, mismatch, missing-path, cross-commit and prompt tests pass.
  status: PENDING_CI
