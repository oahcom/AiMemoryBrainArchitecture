work_item_id: AID-2026-101
title: Refresh three stale registry cells and one false prompt digest, and record the prior value of each
class: DOC/GOVERNANCE
risk: R1
risk_rationale: >-
  Documentation only. Four cells in INDEX.md and three manifest fields are edited; no code, no
  checker, no workflow and no policy status changes. The risk it addresses is that a stale
  registry cell is indistinguishable from a false one, so the risk of the change is a wrong
  cell, and the mitigation is that every prior value is itemised below rather than surviving
  only in the diff.
status: DISPATCHED

