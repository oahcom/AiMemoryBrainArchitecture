identifier_history: >-
  This correction was prepared four times under identifiers that main assigned to other work items
  while it was in review: AID-2026-080 (taken by PR #1215), AID-2026-081 (taken by the GOV-DOC-001
  ratchet work item), AID-2026-090 (taken by the ContextVersion immutability work item, PR #1255)
  and AID-2026-101 is the fourth and current number. Every collision was discovered by rebasing,
  not by a gate, because a work-item directory is a path and two branches adding the same path
  merge as a conflict only if the merge driver is asked -- the INDEX half merges cleanly under
  `merge=union`, so the directory is where it surfaces. Recorded here because all four numbers
  appear in this branch's earlier history and a reader who finds one of them should know it was
  renaming, not a second correction. Nothing is claimed about the three work items that took the
  earlier numbers.

findings:
  - id: F1
    severity: HIGH
    statement: >-
      AID-2026-047's prompt_sha256 pins a prompt that no longer exists at the path it names.
      The digest is the one the file had before the work item was renumbered from 044 to 047.
    evidence: >-
      prompt-v1.md at HEAD hashes to 6d2c4080...0871 at 2185 bytes; the manifest declares
      1f547ad7...b236 at the same 2185 bytes. Substituting AID-2026-044 for AID-2026-047 in
      the committed file reproduces 1f547ad7...b236 exactly, so the pinned text differs from
      the committed text by the identifier alone. A digest audit of all 45 manifests that
      declare one finds this as the only mismatch; AID-2026-001 looked like a second until
      the lookup was made version-aware, because it pins prompt-v2.md while prompt-v1.md is
      the historical file.
  - id: F2
    severity: HIGH
    statement: >-
      AID-2026-076's implementation block still describes an open carrier although its own
      pull request merged, and INDEX repeated that description.
    evidence: >-
      GET /pulls/1155 returns state=closed, merged=true, merged_at=2026-11-25T14:59:20Z,
      merge_commit_sha=2733283bff2bcc744c595ec06b602aadb52c772a, head=07a8d1ee. The merge
      commit is an ancestor of origin/main. The manifest said IMPLEMENTED_IN_BRANCH,
      pull_request ASSIGNED_AT_OPEN, merge_commit_sha NOT_MERGED.
  - id: F3
    severity: MEDIUM
    statement: >-
      AID-2026-072's record collapses two different facts into one open state. The pull
      request it was dispatched under closed without merging, and a later pull request merged
      the same change under a corrected identifier.
    evidence: >-
      GET /pulls/1057 returns state=closed, merged=false, closed_at=2026-11-25T10:05:37Z.
      GET /pulls/1082 returns merged=true, merged_at=2026-11-25T09:41:32Z,
      merge_commit_sha=afb0c6ceac5f4d7346c4126d2a48bc8b17ffab2e; commit 53500171
      ("fix(903): renumber the work item to AID-2026-072 and correct its prompt digest") is
      in that merge and is an ancestor of origin/main. The change itself is present in main:
      tests/forget_fence.rs carries the per-process atomic counter the work item specified.
  - id: F4
    severity: MEDIUM
    statement: >-
      Nothing in CI reads a manifest's prompt_sha256 against the file it pins, and nothing
      compares an INDEX Status cell to the carrier PR it names. Both defect classes are
      therefore silent, and both were found by measurement rather than by a red build.
    evidence: >-
      `grep -rn prompt_sha256 scripts/` matches only
      scripts/governance/session_evidence/validate.py, and that file reads
      session_evidence[].executed_prompt_sha256, not the manifest's top-level prompt_sha256.
      scripts/ci/check_repository_hygiene.py checks manifest-internal consistency (R20-01,
      R20-02) and never resolves a PR number. This is recorded as a tracked gap, not repaired
      here.
  - id: F5
    severity: LOW
    statement: >-
      The selection of these three rows was made by a scan, not by reading the table, and the
      scan is stated so it can be re-run. Two earlier drafts of it were wrong and were
      discarded.
    evidence: >-
      A draft that matched the word PENDING anywhere in a row flagged "Acceptance: PENDING",
      which is a true statement about a live item, not a stale one; it was replaced by a match
      anchored at the start of the Status cell, which leaves two rows. A draft that compared
      merge SHAs as whole strings reported 14 correct rows as missing their SHA, because INDEX
      writes short SHAs; the prefix comparison is the correct test. Neither discarded draft
      produced a claim in this manifest.

corrections:
  - target: 14-ai-development/work-items/AID-2026-047/manifest.yaml
    field: prompt_sha256
    prior_value: 1f547ad7e81f951ca8778536dc9eec860080d18b33c1cfc809ceed4db063b236
    new_value: 6d2c40800c1f40ba05653d23beea9b2f89db7467519bf7eebb1d48fef5770871
    basis: >-
      The new value is the SHA-256 of the committed prompt-v1.md bytes, computed in this pass.
      The prompt is not rewritten to fit a digest; the digest is corrected to describe the
      prompt. prompt_bytes is unchanged at 2185, which is consistent with the two texts
      differing only in the identifier and is why the mismatch was not visible as a size
      difference.
    prior_value_preserved_by: >-
      A prompt_digest_correction field in the same manifest, matching the precedent already set
      by AID-2026-072.
  - target: 14-ai-development/work-items/AID-2026-076/manifest.yaml
    field: implementation.status / implementation.pull_request / implementation.merge_commit_sha
    prior_value: "IMPLEMENTED_IN_BRANCH / ASSIGNED_AT_OPEN / NOT_MERGED"
    new_value: "MERGED / 1155 / 2733283bff2bcc744c595ec06b602aadb52c772a"
    basis: >-
      GET /pulls/1155 and `git merge-base --is-ancestor 2733283bff2b origin/main` (exit 0).
    note: >-
      R20-01 requires a positive integer in pull_request when either lifecycle field is
      PR_OPEN; 1155 is an unquoted integer and the lifecycle field is no longer PR_OPEN, so both
      halves of that rule are satisfied. R20-02 forbids NOT_MERGED beside MERGED; the two are
      no longer paired.
  - target: 14-ai-development/work-items/AID-2026-072/manifest.yaml
    field: status / implementation.status / implementation.pull_request / implementation.merge_commit_sha
    prior_value: "PR_OPEN / PR_OPEN / 1057 / NOT_MERGED"
    new_value: "MERGED / MERGED / 1082 / afb0c6ceac5f4d7346c4126d2a48bc8b17ffab2e"
    basis: >-
      GET /pulls/1082 merged=true at 2026-11-25T09:41:32Z, merge commit afb0c6ce, ancestor of
      origin/main; the renumbering commit 53500171 is inside that merge. The superseded pull
      request 1057 is recorded in a carrier_history field rather than deleted, because it
      closed unmerged and that fact is not interchangeable with the merge.
    note: >-
      The rule requires the refresh to say which outcome occurred. Writing 1057 as merged would
      be false; deleting it would lose that the work was once dispatched under it. Both are
      recorded.
  - target: 14-ai-development/work-items/INDEX.md
    field: "row AID-2026-076, Status / Impl / Review / Accept cells"
    prior_value: >-
      Status "PR_OPEN - an existence row, not a registration: it repeats only what the manifest
      states."; Impl "PR OPEN - `on: pull_request:` gains types: [opened, synchronize,
      reopened, edited] ..."; Review "NOT_ASSIGNED"; Accept "PENDING - no acceptance decision
      is claimed. Measured by the coordinating session: ..."
    new_value: >-
      Status "MERGED 2026-11-25T14:59:20Z as 2733283bff2b via PR #1155"; Impl and Accept keep
      their measured content with the carrier stated as merged; Review unchanged.
    basis: GET /pulls/1155.
  - target: 14-ai-development/work-items/INDEX.md
    field: "row AID-2026-072, Status / Impl cells"
    prior_value: >-
      Status "PR_OPEN - an existence row, not a registration ..."; Impl "PR OPEN - #1057 on
      fix/903-fixture-collides-across-parallel-tests. ..."
    new_value: >-
      Status "MERGED 2026-11-25T09:41:32Z as afb0c6ceac5f via PR #1082; the earlier carrier
      #1057 closed unmerged"; Impl keeps the change description with both carriers named.
    basis: GET /pulls/1082 and GET /pulls/1057.
  - target: 14-ai-development/work-items/INDEX.md
    field: "row AID-2026-047, Prompt cell"
    prior_value: "SHA-256 `1f547ad7e81f951ca8778536dc9eec860080d18b33c1cfc809ceed4db063b236`"
    new_value: "SHA-256 `6d2c40800c1f40ba05653d23beea9b2f89db7467519bf7eebb1d48fef5770871`"
    basis: >-
      The digest of the committed bytes. The row's Status cell already said MERGED and is not
      touched.

acceptance_criteria:
  - id: AC1
    criterion: Every manifest's prompt_sha256 equals the digest of the file it pins.
    measurement: >-
      A version-aware audit over all manifests exits with one mismatch before the change and
      zero after it. The audit resolves prompt_file first, then prompt-v<version>.md, then
      prompt-v1.md, so it cannot reproduce the false positive that a hard-coded v1 produced on
      AID-2026-001.
  - id: AC2
    criterion: No INDEX Status cell opens with an open/pending token while every PR it names is closed.
    measurement: >-
      The anchored scan returns two rows before the change and zero after it. The scan is
      anchored at the start of the Status cell so that "Acceptance: PENDING" is not counted.
  - id: AC3
    criterion: Every corrected cell names which outcome occurred, and no closed-unmerged carrier is described as merged.
    measurement: >-
      AID-2026-072's row and manifest both say #1057 closed unmerged and #1082 merged. Read the
      two cells; this one is not machine-checked and is not claimed to be.
  - id: AC4
    criterion: The repository's own gates still pass.
    measurement: >-
      scripts/check_traceability.py --index-only exits 0 with 0 errors;
      scripts/ci/check_repository_hygiene.py exits 0 with violations=0 and the membership
      counter equal on both sides.

implementation:
  status: NOT_STARTED
  branch: PENDING
  pull_request: PENDING
  merge_commit_sha: NOT_MERGED
  note: >-
    Registration and the correction itself. The pull request number cannot be written into the
    commit that opens it, so implementation.status stays NOT_STARTED and merge_commit_sha stays
    NOT_MERGED until the carrier merges; both are filled at merge, by the merge, not before it.
    Writing MERGED here before a merge exists would be the same defect this work item corrects
    in AID-2026-076, committed while correcting it.

