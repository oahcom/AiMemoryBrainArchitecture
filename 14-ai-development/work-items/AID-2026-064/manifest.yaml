  - Diff each registered blob against its current blob and decide, per pair, whether the translation covers the paragraphs the source gained
  - Write the honest value of AID-2026-004's bilingual_status from the three-way enum, keeping the six original SHAs as the record of where alignment last held

non_goals:
  - Retranslating the AI-EXEC-001 Appendix B bullet that the F-006 revision did not reach. That is a separate change under AI-EXEC-001 and is named in the PR body instead.
