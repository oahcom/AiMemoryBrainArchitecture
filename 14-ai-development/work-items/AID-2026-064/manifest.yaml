risk_rationale: >-
  Manifest accuracy only. No runtime code, no security boundary, no translation content,
  no gate behaviour. The risk this work item addresses is the opposite of damage: a
  field that asserts present alignment keeps being read after it has stopped being true.
  R1 because the change is a record correction whose worst failure is a wrong record,
  not a wrong behaviour.
