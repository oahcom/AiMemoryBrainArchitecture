  - Adding an automated drift check. Issue #955 scopes this out explicitly; the PR body may say one is needed and stops there.

findings:
  - id: F1
    severity: material
    statement: >-
      AI-EXEC-001 is not merely stale, it is asymmetric. Commit 4c38ae25 (PR #273, the
      F-006 fix) revised the Chinese Appendix B bullet to the seven-sections framing and
      did not revise the English bullet, which still reads "prompts are unified to 15
      items". The English document therefore states the pre-F-006 framing in Appendix B
      and the post-F-006 framing in its summary. Information is recoverable from the
      document, so this is a missing paragraph revision rather than lost content; it is
      recorded as DIVERGED because the field asserts alignment of the documents as they
      stand.
    measured_at: "350be84b"
  - id: F2
    severity: informational
    statement: >-
      AID-2026-004's manifest carries a top-level implementing_ai_session. The Session
      Evidence validator treats a top-level field whose name is one of its seven manifest
      field names as a second source of truth and rejects the manifest once a canonical
      session_evidence block is added. Converting AID-2026-004 to canonical entries would
      therefore require either dropping that historical field or fabricating prompt
      digest evidence for a 2026-11-18 session that has none. Neither is done; the
      re-verification is registered as its own work item instead and AID-2026-004 keeps
      its original implementing session untouched.
    measured_at: "350be84b"

