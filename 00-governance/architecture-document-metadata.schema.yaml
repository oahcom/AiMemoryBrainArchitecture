# Architecture document metadata schema (GOV-DOC-002)
# 架构文档元数据 Schema
#
# This file is the machine-readable contract. The gate must accept exactly what
# this file declares; T19 in scripts/test_check_document_management.py parses it
# with the gate's own parser and compares fields and enum values both ways.
# 本文件是机器可读契约。门禁必须只接受本文件声明的形状；自检 T19 用门禁自身
# 的解析器解析本文件，并双向比对字段与枚举值。
#
# To fill in a document, copy 00-governance/templates/document-metadata-template.md.
# 填写文档时复制 00-governance/templates/document-metadata-template.md。
#
# Per-field keys: kind / required / enum / items / fields. Every one of them is
# read by the gate; a key the gate does not read is refused at load time.
# 每字段可用键：kind / required / enum / items / fields。它们全部被门禁读取；
# 门禁不读取的键会在加载阶段被拒绝。
# `kind` is the value type; it is not called `type` because `approval_scope.type` is a field name.
# `fields` nests one level, so the shape here is the shape of the metadata block.
# `kind` 表示值类型；不叫 `type` 是因为 `approval_scope.type` 本身是字段名。
# `fields` 表示下一层，因此本文件的结构即元数据块的结构。
#
# `when` is declarative only: it names the rule that makes the field required,
# and the gate does NOT execute it. DM-03 (a separate rule in the policy) does.
# Keeping it here as prose was the same mistake as `required: true` used to be
# -- a constraint the machine never reads. It is kept because it says which
# rule owns the requirement, and T19 rejects a `when` whose named rule does not
# exist in the policy.
# `when` 仅为声明：它指明哪条规则使该字段成为必填，门禁**不执行**它；
# 执行者是条例中的 DM-03。把它写成散文，与当初的 `required: true` 是同一类错误
# ——机器从不读取的约束。保留它的理由是指出需求归属，且 T19 会拒绝指向不存在规则的
# `when`。
#

schema_version: "2"

fields:

  domain:
    kind: string
    required: true
    enum:
      - agent-integration
      - ai-development
      - architecture
      - consistency-recovery
      - domain-model
      - memory-brain
      - memory-compiler
      - memory-context
      - memory-runtime
      - protocol
      - security-governance
      - storage-index
      - testing-acceptance

  role:
    kind: string
    required: true
    enum:
      - decision-record
      - design-specification
      - guide
      - index
      - normative-standard
      - reference
      - research
      - review-report
      - work-record

  lifecycle:
    kind: mapping
    required: true
    fields:
      approval:
        kind: mapping
        required: true
        fields:
          decision_status:
            kind: string
            required: true
            enum:
              - Approved
              - Draft
              - Rejected
              - Revoked
              - Under-Review
              - Withdrawn
          approver:
            kind: nullable-string
          decision_date:
            kind: nullable-string
          approved_version:
            kind: nullable-mapping
            fields:
              scheme:
                kind: string
                enum:
                  - content-hash
                  - git
              value:
                kind: nullable-string
          approval_scope:
            kind: mapping
            # Not unconditionally required: DM-03 requires it when the decision
            # is Approved. Declaring `required: true` here contradicted every
            # Draft document, including the policy itself.
            #
            # This used to carry `when: DM-03 decision_status == Approved`. The
            # key was removed, not because the sentence is wrong but because it
            # was published in a machine-readable contract while no machine read
            # it: T19 could only confirm that "DM-03" was a real rule id, so
            # `when: DM-03 decision_status == Draft` -- the exact opposite claim
            # -- passed. A condition a checker cannot evaluate is prose, and
            # prose belongs in a comment. DM-03 is the executable form of this
            # sentence; it is the only thing that enforces it.
            # 此处原有一行 `when: DM-03 decision_status == Approved`。该键已被删除
            # ——不是因为这句话错了，而是因为它被发布在机器可读契约里，却没有机器
            # 读取它：T19 只能检查 "DM-03" 是否为真实规则编号，因此把条件改成
            # `decision_status == Draft`（正好相反的主张）仍会通过。检查器无法求值
            # 的条件就是散文，散文应写在注释里。这句话的可执行形式是 DM-03。
            fields:
              type:
                kind: string
                enum:
                  - Full-document
                  - Selected-assets
                  - Selected-sections
              included_sections:
                kind: sequence
                items: string
              included_assets:
                kind: sequence
                items: string
          approval_applicability:
            kind: string
            enum:
              - Applicable-To-Current-Version
              - Not-Applicable-To-Current-Version
          evidence_reference:
            kind: sequence
            items: string
          revocation:
            kind: nullable-mapping
            fields:
              revocation_decision_id:
                kind: string
              revoked_date:
                kind: nullable-string
              revoker:
                kind: nullable-string
              revocation_reason:
                kind: nullable-string
              revocation_evidence:
                kind: sequence
                items: string
              superseding_document:
                kind: nullable-string
      evidence_verification:
        kind: mapping
        required: true
        fields:
          verification_status:
            kind: string
            required: true
            enum:
              - Invalidated
              - Unverified
              - Verified
          last_verified_date:
            kind: nullable-string
          last_verification_note:
            kind: nullable-string
      usage_status:
        kind: string
        required: true
        enum:
          - Active
          - Archived
          - Deprecated
          - Superseded
      modification_status:
        kind: string
        required: true
        enum:
          - Active-Modified
          - Modified
          - Pending-Reapproval
          - Unchanged
      supersession:
        kind: mapping
        fields:
          supersedes:
            kind: sequence
            items: string
          supersession_reason:
            kind: nullable-string
          effective_date:
            kind: nullable-string
      archival:
        kind: mapping
        fields:
          archived_date:
            kind: nullable-string
          archival_reason:
            kind: nullable-string
          archival_reference:
            kind: nullable-string

  authority:
    kind: mapping
    required: true
    fields:
      canonical_status:
        kind: string
        required: true
        enum:
          - Candidate
          - Canonical
          - Non-Canonical
      canonical_scope:
        kind: nullable-string
      canonical_scope_id:
        kind: nullable-string
      canonical_scope_keywords:
        kind: sequence
        items: string
      canonical_conflict_status:
        kind: string
        required: true
        enum:
          - None
          - Resolved
          - Under-Review
      canonical_conflict_resolution:
        kind: nullable-mapping
        fields:
          resolution_decision_id:
            kind: string
          resolved_date:
            kind: string
          selected_document:
            kind: string
          resolution_evidence:
            kind: sequence
            items: string
      normative_status:
        kind: string
        required: true
        enum:
          - Informative
          - Normative

  bilingual_counterpart:
    kind: mapping
    fields:
      source:
        kind: nullable-string
      en:
        kind: nullable-string
      zh-CN:
        kind: nullable-string

# Derived fields: a hand-written value is a claim the gate cannot verify (DM-08).
# 派生字段：手写即无法验证的声明（DM-08）。
forbidden:
  - lifecycle.supersession.superseded_by
