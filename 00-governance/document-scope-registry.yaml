# Document scope registry (GOV-DOC-002 section 2)
# 文档治理范围登记表（GOV-DOC-002 第 2 节）
#
# Every top-level directory of the repository MUST appear here, either as a
# governed root or as an explicit exclusion with a reason. The gate fails when
# a directory is missing: adding a new top-level directory is therefore a
# governance decision, not a silent expansion of the ungoverned surface.
# 仓库的每个顶层目录都必须出现在本表中：要么是受治理根目录，要么带理由明确排除。
# 目录缺失时门禁失败——因此新增顶层目录是一次治理决定，而不是治理空白面的静默扩大。
#
# This file is the independent basis the gate cannot derive from itself. The
# accounting identity (classified + unclassified = governed) proves no file was
# dropped *within* the scan set; it says nothing about whether the scan set is
# right. This registry is what makes an omission visible.
# 本文件是门禁无法自行推导的独立依据。会计恒等式只能证明扫描集内部没有文件被丢弃，
# 不能证明扫描集本身正确；遗漏只能靠本表暴露。
#
# Three states, and only the first is an exemption (policy section 2):
#   governed          : scanned, must carry metadata
#   backlog           : scanned, counted, may lack metadata; the count is a claim
#                       the gate checks against the disk
#   excluded          : not scanned; must be `not-documentation` and say why
#
# `not-yet-migrated` used to be a fourth, as an exclusion kind. That was wrong
# and the gate now rejects it: backlog is the opposite of an exemption, and
# letting it be declared as one made "we have not classified these" identical to
# "these are not architecture". A directory whose documents are architecture
# goes in `backlog:` with a count, never in `excluded:` with a reason.
# 三种状态，只有第一种是豁免（条例第 2 节）：
#   governed ：被扫描，必须带元数据
#   backlog  ：被扫描、被计数，可缺元数据；计数是门禁会与磁盘核对的声明
#   excluded ：不被扫描；必须是 `not-documentation` 并给出理由
#
# `not-yet-migrated` 曾是第四种（作为排除类型），这是错的，门禁现已拒绝它：
# 积压是豁免的反面，把它声明为排除，会使"我们还没分类这些"与"这些不是架构"
# 完全等同。文档属于架构的目录应进入 `backlog:` 并给出计数，绝不进入
# `excluded:` 给一个理由。

registry_version: "2"

# Governed roots are also declared in scripts/check_bilingual_docs.py
# (NORMATIVE_ROOTS). The gate fails if the two disagree, so the declared scope
# and the enforced scope cannot drift.
# 受治理根目录同时声明于 scripts/check_bilingual_docs.py（NORMATIVE_ROOTS）。
# 两者不一致时门禁失败，因此"声明范围"与"执行范围"不可能漂移。
governed:
  - 00-governance
  - 01-system-architecture
  - 02-domain-model
  - 04-memory-compiler
  - 06-memory-context
  - 07-agent-integration
  - 08-bmcp-protocol
  - 13-engineering-decisions
  - 14-ai-development

# Directories whose Markdown is not architecture documentation. Each needs a
# reason: "not documentation" and "not yet migrated" are different states, and
# the second one is a gap that must be named, not quietly excluded.
# 非架构文档的目录。每个都必须给理由："不是文档"与"尚未迁移"是两种不同状态，
# 后者是必须点名的缺口，不能悄悄排除。
# Individual files governed although their directory is not. Kept as one path
# per entry so the exception is exactly as large as its reason.
# 单文件受治理：其所在目录不受治理，但该文件本身受治理。逐条登记单一路径，
# 使例外的范围与其理由一样小。
governed_files:
  - docs/governance/documentation-gaps.md

# Backlog: architecture documents that ARE scanned and ARE counted, and simply
# have not been classified yet. This is not a third kind of exclusion -- it is
# the opposite of one. DM-14 requires a document count per entry, so the number
# is a claim the gate can check against the file system, and a gate run reports
# it as unclassified rather than hiding it behind a reason.
# 积压：**会被扫描、会被计数**、只是尚未分类的架构文档。这不是第三种排除，而是
# 排除的反面。DM-14 要求每项声明文档数，使该数字成为门禁可与文件系统核对的声明，
# 并且门禁运行会把它报为未分类，而不是用一句理由把它藏起来。
backlog:
  03-memory-brain:
    documents: 5
    reason: "Memory Brain architecture documents remain in the migration backlog until their root and mirror classification is accepted; this entry is scanned and counted, not excluded."
    reason_zh: "Memory Brain 架构文档仍处于迁移积压中，待根文档与镜像分类获得确认；本项仍会扫描和计数，不构成排除。"
  05-memory-runtime:
    documents: 6
    reason: "Memory Runtime architecture documents remain in the migration backlog until their root and mirror classification is accepted; this entry is scanned and counted, not excluded."
    reason_zh: "Memory Runtime 架构文档仍处于迁移积压中，待根文档与镜像分类获得确认；本项仍会扫描和计数，不构成排除。"
  09-security-governance:
    documents: 1
    reason: "Security governance architecture material is registered as backlog pending a domain scope decision; the newly authored README is an Informative index, not an authority promotion."
    reason_zh: "安全治理架构资料登记为待处理积压，等待领域范围裁定；新编写的 README 仅为 Informative 索引，不代表权威级别提升。"
  docs:
    documents: 27
    # This is backlog, not an exemption. The Markdown files under docs/ (outside
    # the bilingual mirrors) are architecture documents: MINIMUM-RUNNABLE-
    # ARCHITECTURE, CANONICAL-TRANSACTION, SOURCE-OF-TRUTH, CONFLICT-REGISTER,
    # the CONTEXT-APPLIED and FORGET-AUTHORIZATION contracts, the convergence
    # and product-first research programmes. Most say `DRAFT / NON-NORMATIVE`
    # in their own header, and that is exactly why they belong here: `Draft` is
    # a value of `lifecycle.approval.decision_status`, not a reason to be
    # excluded from classification. Excluding them made "we have not classified
    # these" indistinguishable from "these are not architecture", which is the
    # one thing this registry must never allow.
    #
    # Three exceptions inside docs/:
    #   docs/en, docs/zh-CN        governed mirrors, appended to NORMATIVE_ROOTS
    #   docs/governance/documentation-gaps.md   governed individually below
    # Everything else under docs/ is backlog with a known count, which is a
    # number that can go down. `kind: not-yet-migrated` requires exactly that.
    #
    # The number appears once, in `documents:` above. Not in this comment, not
    # in the reasons: the gate rejects a reason that restates a count, because
    # two copies of a fact are two things that can disagree.
    # 这是积压，不是豁免。docs/ 下（双语镜像之外）的 Markdown 是架构文档：
    # 最小可运行架构、规范事务、事实源清单、冲突登记、上下文应用与遗忘授权契约、
    # 收敛与产品优先研究。它们大多在自身头部写着 `DRAFT / NON-NORMATIVE`，而这正是
    # 它们该在此处的原因：`Draft` 是 `lifecycle.approval.decision_status` 的取值，
    # 不是免于分类的理由。把它们排除，会使"我们还没分类这些"与"这些不是架构"变得
    # 无法区分，而后者是本登记表绝不能允许的事。
    #
    # 数量只出现一次，即上面的 `documents:`。不在本注释里，也不在理由里：
    # 门禁会拒绝复述数量的理由，因为事实的两份副本就是两个可能互相矛盾的东西。
    reason: "Backlog of architecture documents under docs/ outside the mirrors and the individually governed gap record. They remain subject to GOV-DOC-002 scanning and classification; this entry is not an exemption. Some entries may already carry metadata; they remain in the backlog until the directory is fully migrated. The prose deliberately does not restate the count: `documents:` is the only place a count may appear."
    reason_zh: "docs/ 下镜像与单独受治理的缺口记录之外的架构文档积压。它们仍受 GOV-DOC-002 扫描和分类要求约束；列入此处不构成豁免。其中部分条目可能已经带有元数据；在整个目录完成迁移前，它们仍保留在积压中。此处刻意不复述数量：`documents:` 是唯一允许出现数量的位置。"

excluded:

  ".github":
    kind: not-documentation
    reason: "CI configuration and issue/PR templates. They describe how the repository is checked, not what the architecture is; a workflow file makes no architectural claim."
    reason_zh: "CI 配置与 issue/PR 模板。它们描述仓库如何被检查，而不是架构本身是什么；工作流文件不作出架构主张。"

  ".governance":
    kind: not-documentation
    reason: "Machine-readable policy inheritance record (GOV-DOC-001-inheritance.json). It is evidence that a policy version was inherited at a commit, not a document that states an architecture."
    reason_zh: "机器可读的策略继承记录（GOV-DOC-001-inheritance.json）。它是某策略版本在某提交被继承的证据，不是陈述架构的文档。"

  reviews:
    kind: not-documentation
    reason: "Review transcripts of external tools. They record what a reviewer said, not what the architecture is; treating them as governed documents would let a review comment acquire normative standing."
    reason_zh: "外部工具的审查记录。它记录的是审查方说了什么，不是架构本身是什么；若视为受治理文档，会使审查意见获得规范效力。"

  benchmarks:
    kind: not-documentation
    reason: "Benchmark harness notes and result logs; measurements, not decisions."
    reason_zh: "基准测试框架说明与结果日志；属于测量数据，不是决策。"

  crates:
    kind: not-documentation
    reason: "Rust source, including inline doc comments. Code is not a Markdown document."
    reason_zh: "Rust 源码，含内联文档注释。代码不是 Markdown 文档。"

  experiments:
    kind: not-documentation
    reason: "Throwaway experiments; explicitly non-normative by construction."
    reason_zh: "一次性实验；按其定义即非规范性。"

  prompts:
    kind: not-documentation
    reason: "Prompt text consumed by tools at runtime. Changing it changes behaviour, not architecture; version control is the right record for it."
    reason_zh: "运行时被工具消费的提示词文本。修改它改变的是行为而非架构；版本控制才是它应当的记录方式。"

  recovery:
    kind: not-documentation
    reason: "Operational recovery runbooks; procedures, not architecture decisions."
    reason_zh: "运维恢复手册；属于操作流程，不是架构决策。"

  scripts:
    kind: not-documentation
    reason: "Gate and tooling source. The governance rules themselves are in 00-governance."
    reason_zh: "门禁与工具源码。治理规则本身位于 00-governance。"

  tests:
    kind: not-documentation
    reason: "Test code and fixtures; fixtures deliberately contain invalid documents."
    reason_zh: "测试代码与夹具；夹具中有意包含非法文档。"

  tools:
    kind: not-documentation
    reason: "Developer tooling source, same as scripts."
    reason_zh: "开发者工具源码，同 scripts。"
