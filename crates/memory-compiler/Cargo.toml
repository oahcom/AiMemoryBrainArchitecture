[package]
name = "memory-compiler"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[dependencies]
memory-domain = { path = "../memory-domain" }
rusqlite = { version = "0.43.0", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]
