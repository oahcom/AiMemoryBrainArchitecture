name: AID-2026-001 Manifest Validation

on:
  pull_request:
    paths:
      - "14-ai-development/work-items/AID-2026-001/manifest.yaml"
      - ".github/workflows/aid-2026-001-manifest-validation.yml"
  push:
    branches: [main]
    paths:
      - "14-ai-development/work-items/AID-2026-001/manifest.yaml"
      - ".github/workflows/aid-2026-001-manifest-validation.yml"

permissions:
  contents: read

jobs:
  manifest-yaml:
    name: Strict Manifest YAML parse and required-field checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Reject duplicate keys and validate Manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from yaml.constructor import ConstructorError

          class UniqueKeyLoader(yaml.SafeLoader):
              pass

          def construct_unique_mapping(loader, node, deep=False):
              loader.flatten_mapping(node)
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  try:
                      hash(key)
                  except TypeError as exc:
                      raise ConstructorError(
                          "while constructing a mapping", node.start_mark,
                          "found an unhashable mapping key", key_node.start_mark,
                      ) from exc
                  if key in mapping:
                      raise ConstructorError(
                          "while constructing a mapping", node.start_mark,
                          f"duplicate key {key!r}", key_node.start_mark,
                      )
                  mapping[key] = loader.construct_object(value_node, deep=deep)
              return mapping

          UniqueKeyLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
              construct_unique_mapping,
          )

          def strict_load(source):
              return yaml.load(source, Loader=UniqueKeyLoader)

          # Regression guards: duplicate keys must fail at top level and when nested.
          for label, fixture in (
              ("top-level", "work_item_id: AID-2026-001\nwork_item_id: OTHER\n"),
              ("nested", "review:\n  status: PASS\n  status: FAIL\n"),
          ):
              try:
                  strict_load(fixture)
              except ConstructorError:
                  pass
              else:
                  raise AssertionError(f"duplicate {label} YAML key was accepted")

          path = Path("14-ai-development/work-items/AID-2026-001/manifest.yaml")
          data = strict_load(path.read_text(encoding="utf-8"))
          assert isinstance(data, dict), "Manifest root must be a YAML mapping"
          required = (
              "work_item_id", "title", "class", "risk", "status",
              "repository", "base_branch", "r3_test_matrix",
              "r3_security_specialist_prompt",
              "r3_forget_specialist_prompt",
              "integration_reviewer_prompt",
          )
          missing = [key for key in required if key not in data]
          assert not missing, f"Missing required top-level keys: {missing}"
          assert data["work_item_id"] == "AID-2026-001"
          assert data["class"] == "ARCH"
          assert data["risk"] == "R3"
          for key in (
              "r3_test_matrix",
              "r3_security_specialist_prompt",
              "r3_forget_specialist_prompt",
              "integration_reviewer_prompt",
          ):
              target = Path(data[key])
              assert target.is_file(), f"Manifest path does not exist: {key}={target}"
          print("AID-2026-001 Manifest: strict YAML parse, duplicate-key regressions and required-field/path checks PASS")
          print("This is a repository-local structural check, not a formal JSON Schema validation.")
          PY
