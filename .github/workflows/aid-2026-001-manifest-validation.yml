name: AID-2026-001 Manifest Validation

on:
  pull_request:
    paths:
      - "14-ai-development/work-items/AID-2026-001/manifest.yaml"
      - "scripts/validate_aid_2026_001_manifest.py"
      - "scripts/tests/test_aid_2026_001_manifest_validation.py"
      - ".github/workflows/aid-2026-001-manifest-validation.yml"
  push:
    branches: [main]
    paths:
      - "14-ai-development/work-items/AID-2026-001/manifest.yaml"
      - "scripts/validate_aid_2026_001_manifest.py"
      - "scripts/tests/test_aid_2026_001_manifest_validation.py"
      - ".github/workflows/aid-2026-001-manifest-validation.yml"

permissions:
  contents: read

jobs:
  manifest-yaml:
    name: Unique-key YAML parse, required-field and path checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Run duplicate-key negative tests and full Manifest validation
        run: |
          python -m unittest scripts.tests.test_aid_2026_001_manifest_validation -v
          python scripts/validate_aid_2026_001_manifest.py
