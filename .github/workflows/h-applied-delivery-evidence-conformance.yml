name: H Applied Delivery Evidence Conformance
# revision: Applied Delivery Evidence message family 1.0.0; separate from Unified 1.2.15 Gateway C Provider Outcome

on:
  push:
    branches:
      - session-h-bmcp-protocol
    paths:
      - "08-bmcp-protocol/schemas/bmcp.applied-delivery-evidence-1.0.0.schema.json"
      - "08-bmcp-protocol/validators/applied_delivery_evidence_validator.py"
      - "08-bmcp-protocol/tests/conformance/applied_delivery_evidence/**"
      - "08-bmcp-protocol/schemas/bmcp.recovery-join-1.0.2.schema.json"
      - "08-bmcp-protocol/validators/recovery_join_validator.py"
      - "08-bmcp-protocol/tests/conformance/recovery_cutoff/**"
      - ".github/workflows/h-applied-delivery-evidence-conformance.yml"
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "08-bmcp-protocol/schemas/bmcp.applied-delivery-evidence-1.0.0.schema.json"
      - "08-bmcp-protocol/validators/applied_delivery_evidence_validator.py"
      - "08-bmcp-protocol/tests/conformance/applied_delivery_evidence/**"
      - "08-bmcp-protocol/schemas/bmcp.recovery-join-1.0.2.schema.json"
      - "08-bmcp-protocol/validators/recovery_join_validator.py"
      - "08-bmcp-protocol/tests/conformance/recovery_cutoff/**"
      - ".github/workflows/h-applied-delivery-evidence-conformance.yml"

permissions:
  contents: read

jobs:
  applied-delivery-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 08-bmcp-protocol/tests/conformance/provider_outcome/requirements.txt
      - name: Install pinned test dependencies
        run: python -m pip install -r 08-bmcp-protocol/tests/conformance/provider_outcome/requirements.txt
      - name: Run Applied Delivery Evidence schema and semantic conformance tests
        run: python -m unittest discover -s 08-bmcp-protocol/tests/conformance/applied_delivery_evidence -p 'test_*.py' -v
      - name: Run RecoveryJoin schema and semantic conformance tests
        run: python -m unittest discover -s 08-bmcp-protocol/tests/conformance/recovery_cutoff -p 'test_recovery_join*.py' -v
