name: Runner disk reclaim (manual)

# ---------------------------------------------------------------------------
# WHAT THIS IS: a manual janitor for the one self-hosted runner, `zesu-x64`.
#
# WHY IT IS MANUAL (`workflow_dispatch` ONLY, no push, no PR):
# This is not a gate and it must never behave like one. The signal that matters
# is "free space on this runner is shrinking" -- `gates.yml` measures it on
# every run and refuses to build below 3 GiB precisely so that signal stays
# loud. If this workflow also ran the reclaim automatically on push, every red
# floor check would silently heal itself between runs and the leak would be
# invisible right up until the disk hit zero and every workflow on the
# repository failed at once. A self-healing probe is not a probe.
#
# So: a human reads the red `Check free disk before building` step, decides to
# intervene, and dispatches this. The red stays red until someone acts, which
# is the entire point. Do not add a `push:` trigger to this file, and do not
# call it from another workflow on failure -- both convert a decision into an
# automatic, and hide the trend.
#
# WHY `cancel-in-progress: false`:
# A reclaim is a sequence of measure / delete / measure. Cancelling it halfway
# leaves the disk partially reclaimed and the report wrong, and the next
# observer cannot tell which deletions landed. An interrupted reclaim is not
# equivalent to a completed reclaim; preserve an in-progress operation.
#
# WHAT IT DELETES, AND WHAT IT WILL NOT:
# Only things that are re-creatable from the network without a decision:
#   * `~/.cargo/registry/cache`   -- cargo download cache, re-fetched on demand
#                                    (`gates.yml` never builds `--offline`, so
#                                    removing it costs time, not correctness).
#   * stale `target/` dirs        -- build output, and only those untouched for
#                                    over an hour (see the `-mmin +60` note).
# It will NOT touch:
#   * `~/.rustup`                 -- reinstalling a toolchain is a download and
#                                    a version decision; not a janitor's call.
#   * any non-`target` path under `_work` -- that is somebody's checkout.
#   * the live workspace's `target/` -- deleting the artifacts of a job that is
#                                    running right now manufactures a random
#                                    failure, which is worse than a full disk
#                                    because it looks like a code bug.
#
# WHY THIS FILE DOES NOT LOWER ANY THRESHOLD:
# `gates.yml` says it in its own words, and it is right:
#   "Reclaim space and re-run; do not lower GATES_MIN_FREE_GB to get a green."
#   "WATCH THE TREND, NOT THE VALUE."
# Auto-cleaning inside the clippy job would be the same move under a different
# name -- it makes the floor check always pass, which disables it. The floor
# stays exactly where it is; this tool only buys the next run some room.
#
# IF THIS RUNS AND STILL DOES NOT RECOVER ENOUGH SPACE, that is a finding, not
# a failure of this workflow. The real answers (a second runner, a bigger disk,
# or finding the leak) are Owner decisions. This workflow warns and exits 0.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-disk-reclaim
  cancel-in-progress: false

jobs:
  reclaim:
    # Platform labels, matching the registration of `zesu-x64`
    # (`self-hosted, Linux, X64`) and every other self-hosted job here.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      # Measure first, and measure only. Nothing in this step mutates the host;
      # it exists so the reclaim can be judged against what it actually freed
      # rather than against a number someone remembered from last week.
      - name: Before — read-only disk inventory
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Filesystem (whole root) ==="
          df -h /
          echo "=== Filesystem (HOME, where the runner and toolchains live) ==="
          df -Pk "$HOME"

          avail_kb=$(df -Pk "$HOME" | awk 'NR==2 {print $4}')
          echo "before_avail_kb=${avail_kb}"
          # Recorded for the final report. A single job's RUNNER_TEMP survives
          # from step to step; /tmp does not survive the WSL session, so do not
          # move this to /tmp.
          printf '%s\n' "${avail_kb}" >"${RUNNER_TEMP}/disk-reclaim-start-kb"

          echo "=== Top-level consumers (absent paths are skipped, never fatal) ==="
          for dir in "$HOME/.cargo" "$HOME/.rustup" "$HOME/actions-runner/_work"; do
            if [ -d "$dir" ]; then
              du -sh "$dir" 2>/dev/null || echo "du failed, continuing: $dir"
            else
              echo "absent, skipped: $dir"
            fi
          done

          work_root="$HOME/actions-runner/_work"
          if [ -d "$work_root" ]; then
            echo "=== Per-workspace sizes under ${work_root} (first 20) ==="
            # `|| true`: head closes the pipe early, which under `pipefail` would
            # otherwise fail a diagnostic step for no useful reason.
            du -sh "$work_root"/*/ 2>/dev/null | head -n 20 || true
          fi

          echo "Inventory complete. This step wrote nothing outside RUNNER_TEMP."

      # Conservative reclaim. Order matters: the cheap, always-safe download
      # cache first, then the expensive build output. Each deletion is bracketed
      # by a free-space reading so its contribution is attributable.
      - name: Reclaim — cargo cache, then stale target directories
        shell: bash
        run: |
          set -euo pipefail

          avail_kb() { df -Pk "$HOME" | awk 'NR==2 {print $4}'; }

          report() {
            # $1 label, $2 before_kb, $3 after_kb
            echo "--- ${1}: avail_kb ${2} -> ${3} (delta $(( $3 - $2 )) KiB)"
            df -h "$HOME"
          }

          start_kb=$(avail_kb)
          echo "reclaim_start_avail_kb=${start_kb}"

          # (a) cargo download cache. Re-fetched on demand; `gates.yml` does not
          # use `--offline`, so a cold cache costs a download, never a correct
          # build. This is the one deletion with no failure mode.
          cache="$HOME/.cargo/registry/cache"
          before=$(avail_kb)
          if [ -d "$cache" ]; then
            echo "removing cargo download cache: ${cache} ($(du -sh "$cache" 2>/dev/null | awk '{print $1}'))"
            rm -rf "$cache"
          else
            echo "cargo download cache absent, nothing to remove: ${cache}"
          fi
          after=$(avail_kb)
          report "cargo-registry-cache" "${before}" "${after}"

          # (b) `target/` dirs under the runner work tree. A cancelled job does
          # not clean up after itself, which is where the missing space went.
          #
          # `-mmin +60` IS THE SAFETY VALVE AND MUST NOT BE WIDENED. One runner
          # holds one job at a time, but `_work` keeps the workspaces of runs
          # that were cancelled, and a future parallel setup (second runner, or
          # a bigger runner with two job slots) would let a build run while this
          # janitor walks the tree. Deleting a live build's `target/` produces a
          # random compile failure that is far harder to diagnose than a full
          # disk. An hour of idleness is a wide margin over a ~10 minute job.
          work_root="$HOME/actions-runner/_work"
          before=$(avail_kb)
          removed=0
          if [ -d "$work_root" ]; then
            while IFS= read -r target_dir; do
              [ -n "${target_dir}" ] || continue
              # Shape check: only <work_root>/<owner>/<repo>/target is ever a
              # build output. Anything else keeps its files.
              case "${target_dir}" in
                "${work_root}"/*/*/target) ;;
                *)
                  echo "skipping unexpected path: ${target_dir}"
                  continue
                  ;;
              esac
              # Never delete the artifacts of the job that dispatched this run.
              if [ "${target_dir}" = "${GITHUB_WORKSPACE:-/nonexistent}/target" ]; then
                echo "skipping live workspace target: ${target_dir}"
                continue
              fi
              echo "removing stale target (untouched >60 min): ${target_dir} ($(du -sh "${target_dir}" 2>/dev/null | awk '{print $1}'))"
              rm -rf "${target_dir}"
              removed=$((removed + 1))
            done < <(find "${work_root}" -maxdepth 3 -type d -name target -mmin +60 2>/dev/null)
            echo "stale_target_dirs_removed=${removed}"
          else
            echo "runner work directory absent, nothing to remove: ${work_root}"
          fi
          after=$(avail_kb)
          report "stale-targets" "${before}" "${after}"

          # Deliberately NOT done here, so nobody "completes" it later:
          #   rm -rf "$HOME/.rustup"          -> toolchain reinstall + version choice
          #   rm -rf "$HOME/.cargo"           -> drops the registry index and bins too
          #   rm -rf "$work_root"/*           -> non-target content is a checkout
          #   any `cargo clean` on a live workspace -> see the `-mmin +60` note

      # Say plainly what happened and how much room was bought. No `exit 1`:
      # the reclaim itself succeeded once the deletions landed. Whether the
      # remaining space is enough is a separate decision, and failing this job
      # over it would make the tool look broken instead of the runner.
      - name: After — final free space and verdict
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Filesystem after reclaim ==="
          df -h /
          avail_kb=$(df -Pk "$HOME" | awk 'NR==2 {print $4}')
          echo "after_avail_kb=${avail_kb}"

          start_kb=""
          if [ -r "${RUNNER_TEMP}/disk-reclaim-start-kb" ]; then
            start_kb=$(cat "${RUNNER_TEMP}/disk-reclaim-start-kb")
          fi
          if [ -n "${start_kb}" ]; then
            delta_kb=$(( avail_kb - start_kb ))
            echo "reclaimed_kb=${delta_kb}"
            awk -v kb="${delta_kb}" 'BEGIN { printf "reclaimed=%.2f GiB\n", kb / 1024 / 1024 }'
          else
            echo "reclaimed_kb=unknown (the before-measurement was not recorded)"
          fi

          # Same floor `gates.yml` refuses to build below. Read only; this file
          # never overrides it and never changes it.
          min_gb=3
          avail_gb=$(( avail_kb / 1024 / 1024 ))
          echo "final_free_disk_gb=${avail_gb} gates_floor_gb=${min_gb}"

          if [ "${avail_gb}" -lt "${min_gb}" ]; then
            echo "::warning::reclaim finished, but only ${avail_gb}G is free — still below the ${min_gb}G floor that gates.yml refuses to build under. Reclaiming a cache is not a fix for a shrinking disk: either add a second runner / enlarge this disk, or find what is leaking. Do not lower GATES_MIN_FREE_GB to get a green."
          else
            echo "Free space is back above the ${min_gb}G floor. Re-run the failed gate; then watch whether the number comes back down on runs that build nothing, because that drift is the actual defect."
          fi
