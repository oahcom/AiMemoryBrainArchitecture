name: Session Evidence Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

on:
  pull_request:
    # The validator reads the PR body live, so an `edited` event must schedule a
    # run or a green verdict outlives the text it judged. The default set
    # (opened, synchronize, reopened) omits `edited`; list all four explicitly
    # so the behaviour is stated rather than inherited.
    types: [opened, synchronize, reopened, edited]
  # All three jobs in this workflow are required contexts. The queue only
  # reports checks produced by `merge_group`; a context that only listens to
  # `pull_request` never appears there and blocks every merge. There is no
  # `edited` activity in a merge group: its checks are requested once.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read
  issues: read

env:
  AI_SESSION_EVIDENCE_EFFECTIVE_AT_UTC: "2026-12-01T00:00:00Z"

jobs:
  self-test-trusted-base:
    name: Session Evidence self-test (base)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@v4
        with:
          # merge_group: the queue base. pull_request: the PR base. The base is
          # the trusted tree in both cases; a candidate head must never be it.
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Self-test the trusted base validator
        run: |
          if [ -d tests/session_evidence ]; then
            python3 -m unittest discover -s tests/session_evidence -p "test_*.py"
          else
            echo "AI-SESSION-EVIDENCE: NOT_APPLICABLE (base tree has no tests/session_evidence)"
          fi

      # The merge-group candidate resolver is a new module: a trusted base that
      # predates it cannot run it, and a missing module must never read as a
      # green self-test. The guard is explicit (a file test), not an inferred
      # exit code.
      - name: Guard merge-group candidate module in trusted base
        if: github.event_name == 'merge_group'
        run: |
          set -eu
          if [ ! -f scripts/governance/merge_group/candidate.py ]; then
            echo "AI-SESSION-EVIDENCE: INCOMPLETE"
            echo "::error::trusted base lacks scripts/governance/merge_group/candidate.py"
            exit 2
          fi

      - name: Self-test merge-group resolver in trusted base
        if: github.event_name == 'merge_group'
        run: |
          set -eu
          python3 -m unittest discover -s tests/merge_group -p "test_*.py" -v

  self-test-pr-head:
    name: Session Evidence self-test (head)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Self-test the PR head validator
        run: |
          if [ -d tests/session_evidence ]; then
            python3 -m unittest discover -s tests/session_evidence -p "test_*.py"
          else
            echo "AI-SESSION-EVIDENCE: NOT_APPLICABLE (PR head tree has no tests/session_evidence)"
          fi

      # The head tree must carry the resolver's own tests. A missing directory
      # is a defect in the change under test, not a reason to skip.
      - name: Self-test merge-group resolver in PR head
        run: |
          set -eu
          if [ -d tests/merge_group ]; then
            python3 -m unittest discover -s tests/merge_group -p "test_*.py" -v
          else
            echo "::error::PR head lacks tests/merge_group"
            exit 1
          fi

  validate:
    name: Session Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@v4
        with:
          # merge_group: the queue base (see self-test-trusted-base).
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Validate session evidence
        id: validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set +e
          # A merge_group payload carries no pull_request object and its queue
          # ref names only the last entry, never the PR set. The shared
          # resolver reads the whole queue, fixes the tail prefix and writes
          # one member record per PR; the validator then judges each body
          # against the single candidate tree.
          if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            if [ ! -f scripts/governance/merge_group/candidate.py ]; then
              echo "AI-SESSION-EVIDENCE: INCOMPLETE"
              echo "AI-SESSION-EVIDENCE: INCOMPLETE" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::trusted base lacks merge-group candidate resolver"
              result=2
            else
              python3 scripts/governance/merge_group/candidate.py \
                --output "$RUNNER_TEMP/merge-group-members.json"
              result=$?

              case "$result" in
                0)
                  export MERGE_GROUP_MEMBERS_JSON="$RUNNER_TEMP/merge-group-members.json"
                  python3 -m scripts.governance.session_evidence.validate
                  result=$?
                  ;;
                1)
                  echo "AI-SESSION-EVIDENCE: VIOLATION" >> "$GITHUB_STEP_SUMMARY"
                  ;;
                2)
                  echo "AI-SESSION-EVIDENCE: INCOMPLETE" >> "$GITHUB_STEP_SUMMARY"
                  ;;
                *)
                  echo "AI-SESSION-EVIDENCE: INCOMPLETE" >> "$GITHUB_STEP_SUMMARY"
                  echo "::error::unexpected merge-group candidate resolver exit code: $result"
                  result=2
                  ;;
              esac
            fi
          else
            python3 -m scripts.governance.session_evidence.validate
            result=$?
          fi

          if [ "$result" -eq 0 ]; then
            echo "validation_result=success" >> "$GITHUB_OUTPUT"
          else
            echo "validation_result=failure" >> "$GITHUB_OUTPUT"
          fi
          exit "$result"

      # Bind the verdict to the text it judged (#1074). The validator reads
      # `pr.body` live at run time, so a body edited after a run leaves the
      # recorded verdict describing text that no longer exists -- and
      # `Session Evidence` is a required context, so that stale green tick is
      # what authorises the merge. This writes a digest of the exact body
      # string the validator saw next to the verdict, so a later edit is
      # detectable instead of invisible. It runs on `always()` because a
      # MISSING verdict must be bound to its text too -- arguably more than a
      # PRESENT one.
      #
      # Fail-closed: if the body cannot be fetched the step exits non-zero and
      # the job fails; it never writes a digest it could not compute. A `null`
      # body (an empty description) is a legitimate input that must still be
      # judged, not an error: it digests as the empty string, i.e.
      # e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855.
      #
      # Recompute the digest of a merged body with this one-liner. It hashes the
      # JSON `body` field as returned by the API, UTF-8 encoded, with `null`
      # normalised to "" -- the same normalisation as `_load_context` in
      # scripts/governance/session_evidence/validate.py. Parsing the JSON in
      # python3 avoids the round-trip traps: `jq -r .body` appends a newline,
      # `jq -j .body` does not, and shell substitution strips trailing newlines
      # either way, so any jq-based version can digest different bytes.
      #
      #   curl -sS -f -H "Authorization: Bearer $TOKEN" \
      #     "https://api.github.com/repos/OWNER/REPO/pulls/N" \
      #   | python3 -c 'import hashlib,json,sys; print(hashlib.sha256((json.load(sys.stdin).get("body") or "").encode("utf-8")).hexdigest())'
      - name: Bind the verdict to the body it judged
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            PR_NUMBER=$(printf '%s' "$GITHUB_REF" | sed -n 's#.*/pr-\([0-9]\+\)-.*#\1#p')
          fi
          if ! digest=$(
            curl -sS -f \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            | python3 -c 'import hashlib,json,sys; print(hashlib.sha256((json.load(sys.stdin).get("body") or "").encode("utf-8")).hexdigest())'
          ); then
            echo "::error::could not compute the PR body digest; the verdict cannot be bound to the text it judged" >&2
            exit 1
          fi
          if ! printf '%s' "$digest" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::PR body digest is not 64 lowercase hex characters: $digest" >&2
            exit 1
          fi
          echo "AI-SESSION-EVIDENCE-BODY-SHA256: $digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure job summary contains a verdict
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          if ! grep -q '^AI-SESSION-EVIDENCE: ' "$GITHUB_STEP_SUMMARY" 2>/dev/null; then
            if [ "$VALIDATION_OUTCOME" = "success" ]; then
              echo "AI-SESSION-EVIDENCE: PRESENT" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "AI-SESSION-EVIDENCE: MISSING" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
