name: Session identity ratchet

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: session-identity-ratchet-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  session-identity-ratchet:
    name: Session identity ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the existing YAML parser dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Run session identity checker tests
        run: |
          python -m unittest discover \
            -s scripts/ci \
            -p 'test_check_session_identity.py' \
            -v

      - name: Run session identity ratchet
        run: |
          python scripts/ci/check_session_identity.py \
            --baseline scripts/ci/baselines/session-identity.txt
