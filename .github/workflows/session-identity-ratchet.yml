name: Session identity ratchet

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: session-identity-ratchet-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  session-identity-preflight:
    name: Session identity preflight
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout candidate with complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned YAML parser
        run: |
          python -m pip install \
            --disable-pip-version-check \
            PyYAML==6.0.2

      - name: Resolve trusted base commit
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            BASE_SHA="$MERGE_GROUP_BASE_SHA"
          else
            echo "::error::Unsupported event for session identity preflight"
            exit 2
          fi

          if ! printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "::error::Base SHA is missing or invalid: $BASE_SHA"
            exit 2
          fi

          git cat-file -e "${BASE_SHA}^{commit}"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Run session identity preflight
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: |
          python scripts/ci/check_session_identity.py \
            --preflight \
            --base-ref "$BASE_SHA"

  session-identity-ratchet:
    name: Session identity ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the existing YAML parser dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Run session identity checker tests
        run: |
          python -m unittest discover \
            -s scripts/ci \
            -p 'test_check_session_identity.py' \
            -v

      - name: Run session identity ratchet
        run: |
          python scripts/ci/check_session_identity.py \
            --baseline scripts/ci/baselines/session-identity.txt
