name: Bilingual documentation gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  bilingual-docs:
    name: GOV-DOC-001 structural checks
    # Use the online self-hosted runner to avoid the GitHub-hosted runner billing block.
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check paired documentation and PR manifest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_bilingual_docs.py
