name: Bilingual documentation gate

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  # Merge queue: the queue only reports checks produced by `merge_group`, so a
  # required context that only listens to `pull_request` blocks every merge.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  bilingual-docs:
    name: GOV-DOC-001 structural checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-check changed-path fail-closed behavior
        run: python3 scripts/test_check_bilingual_docs.py

      # Builds fixture repositories under a temporary ROOT, so it must run
      # before the real gate below and does not read this checkout's index.
      - name: Self-check the pairing and root-departure rules
        run: python3 -m unittest scripts.governance.evidence.test_gate_normative_roots

      - name: Run required Owner namespace and governance traceability gates
        run: |
          python3 scripts/check_owner_namespace_references.py --check
          python3 scripts/check_governance_operation_traceability.py --check
          (cd tests && python3 -m unittest -v test_check_owner_namespace_references.py)
          (cd tests && python3 -m unittest -v test_check_governance_operation_traceability.py)

      - name: Check paired documentation and PR manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # merge_group carries no pull_request object; base/head come from the
          # merge group, and the base must never fall back to the PR base.
          BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -eu
          # The queue ref names only the last entry of the candidate; the
          # shared resolver reads the whole queue, fixes the tail prefix and
          # runs this gate once per member body, with PR_NUMBER/PR_BODY bound
          # to that member.
          if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            if [ ! -f scripts/governance/merge_group/candidate.py ]; then
              echo "::error::QUEUE_MEMBERSHIP_INCOMPLETE: trusted checkout lacks candidate.py"
              exit 2
            fi
            python3 scripts/governance/merge_group/candidate.py \
              --output "$RUNNER_TEMP/merge-group-members.json" \
              --exec "python3 scripts/check_bilingual_docs.py"
          else
            python3 scripts/check_bilingual_docs.py
          fi
