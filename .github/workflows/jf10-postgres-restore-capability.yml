name: JF-10 PostgreSQL 18.7 Backup Restore Capability

on:
  push:
    branches:
      - session-storage-consistency-forget-atomicity-2026-11-16
    paths:
      - "reviews/storage-consistency/postgres_probe/**"
      - ".github/workflows/jf10-postgres-restore-capability.yml"
  pull_request:
    paths:
      - "reviews/storage-consistency/postgres_probe/**"
      - ".github/workflows/jf10-postgres-restore-capability.yml"

permissions:
  contents: read

jobs:
  postgres-backup-restore:
    name: PostgreSQL 18.7 physical backup/restore and stale-control gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Storage branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psycopg
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Start pinned PostgreSQL 18.7 source primary
        env:
          PG_IMAGE: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        run: |
          docker network create jf10-restore-net
          docker volume create jf10-source-data
          docker run -d --name jf10-primary --network jf10-restore-net \
            -e POSTGRES_PASSWORD=jf10-restore-ci-only \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            -v jf10-source-data:/var/lib/postgresql \
            "$PG_IMAGE" \
            -c max_prepared_transactions=16 \
            -c wal_level=replica \
            -c max_wal_senders=10 \
            -c fsync=on \
            -c synchronous_commit=on \
            -c full_page_writes=on
          for i in $(seq 1 90); do
            if docker exec jf10-primary pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres; then
              break
            fi
            sleep 1
          done
          docker exec jf10-primary bash -lc 'echo "host replication postgres 0.0.0.0/0 trust" >> "$PGDATA/pg_hba.conf"'
          docker exec jf10-primary psql -U postgres -d postgres -c "SELECT pg_reload_conf()"
          docker exec jf10-primary psql -U postgres -d postgres -c "SELECT version();"
      - name: Run physical backup/restore and control-reconciliation probe
        env:
          PG_IMAGE: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        run: python reviews/storage-consistency/postgres_probe/jf10_postgres_backup_restore_probe.py
      - name: Capture source and restored diagnostics
        if: always()
        run: |
          docker exec jf10-primary psql -U postgres -c "SELECT version(); SELECT * FROM pg_prepared_xacts;" || true
          docker exec jf10-restore psql -U postgres -c "SELECT version(); SELECT * FROM pg_prepared_xacts;" || true
          docker logs jf10-primary || true
          docker logs jf10-restore || true
