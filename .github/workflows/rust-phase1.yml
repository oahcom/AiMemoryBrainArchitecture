name: Rust Phase 1 Workspace Tests

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "06-memory-context/reference-model/**"
      - ".github/workflows/rust-phase1.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "crates/**"
      - ".github/workflows/rust-phase1.yml"

jobs:
  rust-workspace-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets
