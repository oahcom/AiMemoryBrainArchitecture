name: Rust Phase 1 Workspace Tests

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/check_fmt.py"
      - ".github/workflows/rust-phase1.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "crates/**"
      - ".github/workflows/rust-phase1.yml"

jobs:
  rust-workspace-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python3 scripts/check_fmt.py --expect "$(git rev-parse HEAD)"
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
