name: BMCP JF-10 and Storage Prepared Participant Schema Validation

on:
  push:
    branches:
      - session-h-bmcp-protocol
    paths:
      - "08-bmcp-protocol/schemas/**"
      - "08-bmcp-protocol/runtime_reference/**"
      - "tests/schema/**"
      - ".github/workflows/jf10-bridge-schema.yml"
  pull_request:
    paths:
      - "08-bmcp-protocol/schemas/**"
      - "08-bmcp-protocol/runtime_reference/**"
      - "tests/schema/**"
      - ".github/workflows/jf10-bridge-schema.yml"

permissions:
  contents: read

jobs:
  validate-schema:
    name: Validate BMCP JF-10 and Storage proof schema candidates
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned schema validator
        run: python -m pip install jsonschema==4.23.0
      - name: Compile schema tests
        run: python -m py_compile 08-bmcp-protocol/runtime_reference/strict_json_parser.py tests/schema/test_jf10_bridge_schema.py tests/schema/test_jf10_bridge_schema_1_1_1.py tests/schema/test_strict_json_parser.py tests/schema/test_storage_prepared_participant_proof_schema.py
      - name: Validate schema and message fixtures
        run: python -m unittest discover -s tests/schema -v
