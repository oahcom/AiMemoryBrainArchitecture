name: Ubuntu Worker - Read-only Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-worker-diagnostics
  cancel-in-progress: true

jobs:
  diagnostics:
    # Platform labels, matching what the runner is actually registered with
    # (AI-RUN-002-RUNBOOK 4.2). The distinctive `ai-worker` label needs a
    # re-registration and is deferred until a second runner exists.
    #
    # The runner itself now refuses untrusted triggers before any step runs
    # (job-started hook, AI-RUN-002-RUNBOOK 4.1), so this workflow stays
    # workflow_dispatch-only as defence in depth, not as the only control.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Read-only host diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Runner identity ==="
          printf "runner identity: registered (name withheld)\n"
          printf "host identity: withheld\n"
          printf 'kernel='; uname -sr
          printf 'architecture='; uname -m
          echo "=== Operating system ==="
          if [ -r /etc/os-release ]; then
            . /etc/os-release
            printf 'os=%s version=%s\n' "${ID:-unknown}" "${VERSION_ID:-unknown}"
          fi
          echo "=== Resource summary ==="
          printf 'cpu_count='; nproc
          free -h
          df -h /
          # Three crates build bundled SQLite through cc::Build, so a compiler is
          # a precondition for `cargo test --workspace --all-targets`. Presence is
          # reported separately from capability: `command -v gcc` succeeds on a
          # host whose gcc is a lone binary with no cc1 behind it, and the build
          # then fails inside libsqlite3-sys instead of at the toolchain check.
          echo "=== Build toolchain ==="
          # Discover rustup's bin directory without sourcing ~/.cargo/env:
          # sourcing would mutate PATH and contaminate subsequent probes.
          declare -a cargo_candidate_dirs=()

          add_cargo_candidate_dir() {
            local dir="$1"
            local existing
            [[ -n "$dir" ]] || return 0
            for existing in "${cargo_candidate_dirs[@]}"; do
              [[ "$existing" == "$dir" ]] && return 0
            done
            cargo_candidate_dirs+=("$dir")
          }

          # CARGO_HOME is authoritative when set; otherwise use Cargo's
          # default. Check this even when ~/.cargo/env does not exist.
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          add_cargo_candidate_dir "$cargo_home/bin"

          # Parse only PATH-prepending assignments containing $PATH.
          # Do not execute this shell script.
          if [ -f "$HOME/.cargo/env" ]; then
            while IFS= read -r line; do
              case "$line" in
                *PATH=*) ;;
                *) continue ;;
              esac
              case "$line" in
                *'$PATH'*) ;;
                *) continue ;;
              esac

              # Extract the directory prefix before the existing PATH.
              rhs="${line#*PATH=}"
              rhs="${rhs%%'$PATH'*}"
              rhs="${rhs%:}"
              rhs="${rhs#\"}"
              rhs="${rhs%\"}"
              rhs="${rhs#\'}"
              rhs="${rhs%\'}"

              IFS=: read -r -a parsed_dirs <<< "$rhs"
              for dir in "${parsed_dirs[@]}"; do
                # Expand only the variable forms used by rustup's
                # generated PATH assignment. Never eval shell input.
                case "$dir" in
                  '$HOME'/*)
                    dir="$HOME/${dir#'$HOME'/}"
                    ;;
                  '${HOME}'/*)
                    dir="$HOME/${dir#'${HOME}'/}"
                    ;;
                  '$CARGO_HOME'/*)
                    dir="$cargo_home/${dir#'$CARGO_HOME'/}"
                    ;;
                  '${CARGO_HOME}'/*)
                    dir="$cargo_home/${dir#'${CARGO_HOME}'/}"
                    ;;
                  /*)
                    ;;
                  *)
                    continue
                    ;;
                esac
                add_cargo_candidate_dir "$dir"
              done
            done < "$HOME/.cargo/env"
          fi

          for t in cc gcc clang cargo rustc pkg-config make; do
            if command -v "$t" >/dev/null 2>&1; then
              printf '%-12s PRESENT %s\n' "$t" "$("$t" --version 2>&1 | head -1)"
            else
              off_path=""
              for dir in "${cargo_candidate_dirs[@]}"; do
                if [ -x "$dir/$t" ] && [ ! -d "$dir/$t" ]; then
                  off_path="$dir/$t"
                  break
                fi
              done

              if [ -n "$off_path" ]; then
                version=$("$off_path" --version 2>&1 | head -1 || true)
                printf '%-12s PRESENT_OFF_PATH %s\n' "$t" "$version"
              else
                printf '%-12s ABSENT\n' "$t"
              fi
            fi
          done
          # Compile and link one translation unit. Diagnostics must not fail the
          # job on this, so the status is recorded rather than asserted.
          probe_dir="$(mktemp -d)"
          printf 'int main(void){return 0;}\n' >"${probe_dir}/probe.c"
          c_status=no-compiler-on-path
          for c in cc gcc clang; do
            command -v "$c" >/dev/null 2>&1 || continue
            if "$c" "${probe_dir}/probe.c" -o "${probe_dir}/probe" >"${probe_dir}/err" 2>&1; then
              c_status="ok ($c)"
            else
              c_status="BROKEN ($c is on PATH but cannot compile)"
            fi
            break
          done
          case "$c_status" in
            ok\ *)
              printf 'c_compile_link=%s\n' "$c_status"
              ;;
            *)
              printf 'c_compile_link=%s\n' "$c_status"
              head -3 "${probe_dir}/err" 2>/dev/null || true
              ;;
          esac
          rm -rf "$probe_dir"
          echo "=== Time synchronization ==="
          timedatectl show -p NTPSynchronized --value 2>/dev/null || true
          echo "=== Tailscale service state (no peer inventory) ==="
          systemctl is-enabled tailscaled 2>/dev/null || true
          systemctl is-active tailscaled 2>/dev/null || true
          echo "=== Egress chain state (units only, no config) ==="
          echo "Host-specific egress service state withheld."
          systemctl is-active [HOST EGRESS SERVICE] 2>/dev/null || true
          echo "=== Admission control state ==="
          hooks="$HOME/actions-runner/hooks"
          if [ -r "${hooks}/guard.log" ]; then
            printf 'guard_log_lines='; wc -l <"${hooks}/guard.log"
            tail -n 1 "${hooks}/guard.log"
          else
            echo "guard.log absent — L1 admission control is not installed"
          fi
          if [ -f "${hooks}/observe.flag" ]; then
            echo "WARNING: observe.flag present — admission control is log-only"
          fi
          echo "=== Runner account ==="
          id
          echo "Diagnostics complete. No environment variables, secrets, peer list, or user files were read."
