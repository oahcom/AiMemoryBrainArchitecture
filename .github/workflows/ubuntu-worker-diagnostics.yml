name: Ubuntu Worker - Read-only Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-worker-diagnostics
  cancel-in-progress: true

jobs:
  diagnostics:
    # Platform labels, matching what the runner is actually registered with
    # (AI-RUN-002-RUNBOOK 4.2). The distinctive `ai-worker` label needs a
    # re-registration and is deferred until a second runner exists.
    #
    # The runner itself now refuses untrusted triggers before any step runs
    # (job-started hook, AI-RUN-002-RUNBOOK 4.1), so this workflow stays
    # workflow_dispatch-only as defence in depth, not as the only control.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Read-only host diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Runner identity ==="
          printf "runner identity: registered (name withheld)\n"
          printf "host identity: withheld\n"
          printf 'kernel='; uname -sr
          printf 'architecture='; uname -m
          echo "=== Operating system ==="
          if [ -r /etc/os-release ]; then
            . /etc/os-release
            printf 'os=%s version=%s\n' "${ID:-unknown}" "${VERSION_ID:-unknown}"
          fi
          echo "=== Resource summary ==="
          printf 'cpu_count='; nproc
          free -h
          df -h /
          echo "=== Time synchronization ==="
          timedatectl show -p NTPSynchronized --value 2>/dev/null || true
          echo "=== Tailscale service state (no peer inventory) ==="
          systemctl is-enabled tailscaled 2>/dev/null || true
          systemctl is-active tailscaled 2>/dev/null || true
          echo "=== Egress chain state (units only, no config) ==="
          echo "Host-specific egress service state withheld."
          systemctl is-active [HOST EGRESS SERVICE] 2>/dev/null || true
          echo "=== Admission control state ==="
          hooks="$HOME/actions-runner/hooks"
          if [ -r "${hooks}/guard.log" ]; then
            printf 'guard_log_lines='; wc -l <"${hooks}/guard.log"
            tail -n 1 "${hooks}/guard.log"
          else
            echo "guard.log absent — L1 admission control is not installed"
          fi
          if [ -f "${hooks}/observe.flag" ]; then
            echo "WARNING: observe.flag present — admission control is log-only"
          fi
          echo "=== Runner account ==="
          id
          echo "Diagnostics complete. No environment variables, secrets, peer list, or user files were read."
          echo "=== Rust toolchain probe (read-only, no install) ==="
          if command -v cargo >/dev/null 2>&1; then
            printf 'cargo_present=yes\n'
            cargo --version || true
            rustc --version || true
          else
            printf 'cargo_present=no\n'
          fi
          if command -v curl >/dev/null 2>&1; then
            printf 'curl_present=yes\n'
            curl --version | head -1 || true
          else
            printf 'curl_present=no\n'
          fi
          printf 'rustup_home_exists='; [ -d "$HOME/.rustup" ] && echo yes || echo no
          printf 'cargo_home_exists='; [ -d "$HOME/.cargo" ] && echo yes || echo no
          printf 'cargo_env_exists='; [ -f "$HOME/.cargo/env" ] && echo yes || echo no
          echo "=== can we reach static.rust-lang.org? ==="
          curl -sS -o /dev/null -w 'http_code=%{http_code}\n' --max-time 20 https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init || echo "curl_failed=$?"
