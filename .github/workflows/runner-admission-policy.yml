name: Runner Admission Policy

# L2 repository-layer admission audit for self-hosted runners.
# Documented in DOC-OPS-001 section 4 and AI-RUN-002-RUNBOOK section 4.1.
#
# This check is preventive. The binding control is the job-started hook on the
# runner host (L1); this workflow only makes violations visible before merge.
# Runs on a GitHub-hosted runner on purpose: a check that governs self-hosted
# admission must not depend on the self-hosted runner it governs.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/audit_runner_admission.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/audit_runner_admission.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit self-hosted admission rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Audit workflows
        run: python3 scripts/ci/audit_runner_admission.py
