name: Runner admission policy

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enforce GitHub-hosted runner policy
        run: python3 scripts/ci/audit_runner_admission.py
      - name: Test runner policy auditor
        run: python3 scripts/ci/test_audit_runner_admission.py
