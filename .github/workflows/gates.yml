name: Existing gates

# GAP-10 Tier 2 item 2 (T2.2): wire the gates this repository already owns into
# CI, so a gate cannot reach main red without anybody noticing.
#
# ---------------------------------------------------------------------------
# RUNNER: `[self-hosted, linux, x64]`, deliberately.
#
# `GET /repos/oahcom/AiMemoryBrainArchitecture/actions/runners` returns
# `total_count: 1` -- one runner, `zesu-x64`, labels `self-hosted, Linux, X64`.
# GitHub-hosted minutes are blocked by a billing failure on this account, so a
# job written `runs-on: ubuntu-latest` is allocated no runner at all and dies
# with an empty `steps` array (observed on main, 2026-11-22T04:29:56Z, on the
# `GOV-DOC-002 metadata checks` and `audit` jobs). Writing `ubuntu-latest` here
# would make every job below dead on arrival. So every job targets the one
# runner that exists.
#
# ---------------------------------------------------------------------------
# TRIGGERS: `push` to main and `workflow_dispatch`. Not `pull_request`.
#
# Two independent controls force this, both already in force in this repo:
#   L1 (runner job-started hook, AI-RUN-002-RUNBOOK 4.1) denies every job whose
#      GITHUB_REF is not exactly `refs/heads/main`, or whose event is not
#      push / workflow_dispatch / schedule.
#   L2 (`scripts/ci/audit_runner_admission.py`, enforced by
#      `runner-admission-policy.yml`) rejects `pull_request` on any self-hosted
#      job, a `push` without a `branches:` filter, and `push.branches` naming
#      anything but `main`.
#
# CONSEQUENCE, STATED PLAINLY: this workflow cannot gate a pull request. It is a
# post-merge detector on main, plus `workflow_dispatch` for on-demand runs. A red
# gate on main becomes visible within minutes instead of never, which is the
# GAP-10 defect. It is not a pre-merge gate and this file does not pretend to be
# one. Pre-merge gating needs one of: GitHub-hosted minutes restored, a second
# runner, or a relaxed L1/L2 policy -- each an Owner decision, not an edit here.
#
# ---------------------------------------------------------------------------
# TWO KINDS OF JOB, and the difference is deliberate:
#
#   * HARD GATES fail on any deviation. The gate is green today and must stay
#     green: `protocol-index`, `conformance`, `schema-nonempty`, `clippy`.
#
#   * RATCHETS fail only when the failure set gets WORSE than the recorded
#     baseline: `bilingual`. This gate is already red on main (GAP-08). Making it
#     a hard gate today would paint every run red and teach everyone to ignore
#     the check, which is exactly how it reached main red in the first place. A
#     ratchet converts "permanently red and ignored" into "cannot get worse, and
#     gets better when someone fixes an item".
#
# A GATE MOVES FROM RATCHET TO HARD GATE THE DAY IT GOES GREEN, and it must, or
# the ratchet becomes a permanent exemption. `schema-nonempty` was a ratchet in
# an earlier revision of this file because GAP-09 was open at 5506 unregistered
# constraints. GAP-09 was closed on main (`6897e53c`, "audit the 30 unregistered
# schemas, closing GAP-09 gate"), the audit now exits 0 with all 5599 constraints
# registered, and so the ratchet is gone: the job runs the audit directly and any
# single unregistered constraint fails the run. Its baseline file was deleted in
# the same change, because a baseline with nothing left in it is the exemption
# this whole paragraph exists to forbid.
#
# A RATCHET IS NOT A GREEN EXEMPTION. `scripts/ci/gate_ratchet.py` fails on two
# conditions:
#   1. a failure appears that is not in the baseline  -> regression, blocks.
#   2. a baseline item no longer fails                -> baseline is stale.
# Condition 2 is what keeps the ratchet honest: you cannot leave the baseline
# inflated after fixing something. Fixing an item requires lowering the baseline
# file in the same change.
#
# Baselines live in `scripts/ci/baselines/`. Each file is the exact set of
# currently-failing items, one per line; `#` starts a comment. After the
# `schema-nonempty` ratchet was retired there is exactly one baseline left,
# `bilingual-docs.txt`. A baseline directory with a file per green gate would be
# a directory of exemptions.
#
# ---------------------------------------------------------------------------
# ONE RUNNER MEANS SERIALISATION. This repository has one self-hosted runner;
# GitHub may schedule eligible jobs concurrently, but only one can execute at
# a time and the rest wait for runner capacity. No workflow-level concurrency
# group is needed for that serialization. Every job carries timeout-minutes:
# a wedged job on the sole runner otherwise blocks every other workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-index:
    name: BMCP protocol index (hard gate)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Green on main at the time of writing: missing=0 extra=0
      # duplicate_types=0 invalid_rows=0. Any deviation is a real defect, so
      # this is a hard gate and not a ratchet.
      - name: Check protocol index against schema message types
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 08-bmcp-protocol/scripts/check_protocol_index.py

  conformance:
    name: BMCP conformance suite (hard gate)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Self-hosted is not a clean container and `sudo` is not assumed. The
      # pinned dependencies go into a throwaway venv under $RUNNER_TEMP, which
      # the runner wipes between jobs, so nothing is installed into the host
      # interpreter and no state leaks into the next job.
      #
      # DEGRADATION: if the venv cannot be built or the install cannot reach an
      # index, fall back to the system interpreter *only if* it already
      # satisfies the three imports. Otherwise fail. The fallback is a warning,
      # never a skip -- the suite still runs either way.
      - name: Prepare pinned Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP:-/tmp}/gates-venv"
          req=08-bmcp-protocol/tests/conformance/provider_outcome/requirements.txt
          if python3 -m venv --clear "$venv" \
             && "$venv/bin/python" -m pip install --quiet --disable-pip-version-check -r "$req"; then
            echo "$venv/bin" >> "$GITHUB_PATH"
            echo "using venv at $venv"
          else
            echo "::warning::pinned dependency install failed; falling back to the system interpreter"
            python3 -c "import importlib.util as u, sys; m = [x for x in ('jsonschema', 'rfc8785', 'cryptography') if u.find_spec(x) is None]; sys.exit('system interpreter is missing: ' + ', '.join(m)) if m else print('system interpreter already satisfies the pinned imports')"
          fi

      # The cross-language vectors shell out to `node` and import the pinned
      # `canonicalize` package. Without it three tests error out with
      # ERR_MODULE_NOT_FOUND -- a missing dependency, not a red gate. The
      # install is skipped when the module already resolves, so a warm
      # `node_modules` left on the runner is not thrown away for nothing.
      - name: Install conformance Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v node >/dev/null || { echo "::error::node is not installed on this runner"; exit 1; }
          command -v npm  >/dev/null || { echo "::error::npm is not installed on this runner"; exit 1; }
          cd 08-bmcp-protocol/tests/conformance
          if node -e "require.resolve('canonicalize')" >/dev/null 2>&1; then
            echo "canonicalize already resolvable; skipping npm ci"
          else
            npm ci --no-audit --no-fund
          fi

      # With both dependency sets installed this suite is fully green on main
      # (585 tests, 27 skipped, 0 failures). Verified before wiring it as a hard
      # gate; if it were not green it would have been a ratchet instead.
      - name: Run the full conformance suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s 08-bmcp-protocol/tests/conformance

  schema-nonempty:
    name: Schema non-empty audit (hard gate)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # HARD GATE, not a ratchet. GAP-09 is closed: `6897e53c` registered all
      # 5599 constraints across the 32 schemas, and this audit now exits 0 on
      # main. A green gate must be hard -- keeping the ratchet would let the
      # baseline file sit there as a standing exemption, which is precisely the
      # failure mode GAP-10 records. The baseline file was deleted in the same
      # change as this step.
      #
      # Any single unregistered or stale constraint fails the run. The audit
      # prints one offending constraint per line on stdout and exits 1.
      - name: Run the schema non-empty audit
        shell: bash
        run: |
          set -euo pipefail
          python3 08-bmcp-protocol/schemas/test_nonempty_audit.py

  bilingual:
    name: Bilingual docs coverage (ratchet)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # GOV-DOC-001 full scan: 81 normative paths lack an en/zh-CN counterpart.
      # Red on main, so ratchet rather than gate.
      - name: Ratchet the GOV-DOC-001 full scan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/gate_ratchet.py \
            --baseline scripts/ci/baselines/bilingual-docs.txt \
            --format paths \
            --command "python3 scripts/check_bilingual_docs_full.py"

  # CLIPPY ONLY, AND WHY. `rust-self-hosted.yml` on main already runs
  # `cargo test --workspace --all-targets --no-fail-fast` and
  # `python3 scripts/check_fmt.py --expect "$(git rev-parse HEAD)"`. Running
  # either of them here too is actively harmful:
  #
  #   * `cargo test --workspace` without `--all-targets` does not run doctests,
  #     and `--all-targets` does. Measured on the same tree: `--all-targets` ->
  #     passed=546, plain `--workspace` -> passed=551. The 5-test gap is
  #     doctests. GAP-10 section 7.1 records this exact trap at 371 vs 385. Two
  #     workflows reporting different test counts for the same commit make
  #     neither number trustworthy, and the one that is wrong is the one that
  #     looks green.
  #   * Two workflows compiling this 45-crate workspace on the repository's only
  #     runner doubles the disk churn on a host whose free space has been
  #     shrinking between runs that build nothing (6.8G -> 5.6G, ~1.2 GB with no
  #     build in between). Doubling the writes to save nothing is a bad trade.
  #
  # So this job keeps only the gate that main does NOT run anywhere that
  # executes: `cargo clippy --workspace --all-targets -- -D warnings`.
  # `rust-phase1.yml` has clippy, but it is `runs-on: ubuntu-latest`, which on
  # this account is allocated no runner at all, so it has never executed. Clippy
  # is genuinely uncovered and is the independent value of this job.
  #
  # Consequence: rustfmt and the test suite are NOT gated here. They are gated
  # by `rust-self-hosted.yml` on main. If that workflow is ever deleted, this
  # job must grow them back -- with `--all-targets`.
  clippy:
    name: Rust clippy (hard gate)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    # Job-level, not per-step: clippy lints both the dev profile and the test
    # profile under `--all-targets`, so both debug levels matter.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4

      # DISK PREFLIGHT. Measured on this runner (run 44992270090, 2026-11-22):
      # 39G total, 32G used, **5.6G free**, 3.6G RAM, 4 CPUs.
      #
      # What a build of this workspace actually costs, measured by the runner
      # operator on a comparable host: `cargo test --workspace --all-targets`
      # produces a 1009 MB `target/` over 45 crates, and `~/.cargo/registry` is
      # 319 MB for 290 crates. Clippy-only is the same compilation with a
      # different driver and no test binaries linked, so ~1.0-1.3 GB including
      # the registry.
      #
      # The floor is 3 GiB. It was 4 GiB when this job also ran `cargo test` and
      # shared one CARGO_TARGET_DIR with clippy (an estimated 1.7-2.0 GB); with
      # the test step gone the floor drops with it. Lowering a floor to make a
      # run go green is forbidden; lowering it because the job genuinely got
      # smaller is just keeping the number honest.
      #
      # `GATES_MIN_FREE_GB` is a floor, not a target. Raise it, never lower it
      # to make a run go green.
      #
      # WATCH THE TREND, NOT THE VALUE. Two diagnostic runs that compile nothing
      # reported ~6.8G free and then ~5.6G free: about 1.2 GB accumulated with
      # no build in between. On a single runner that drift, not the absolute
      # number, is what eventually takes every workflow down at once.
      - name: Check free disk before building
        shell: bash
        run: |
          set -euo pipefail
          min_gb="${GATES_MIN_FREE_GB:-3}"
          warn_gb="${GATES_WARN_FREE_GB:-6}"
          avail_kb=$(df -Pk . | awk 'NR==2 {print $4}')
          avail_gb=$(( avail_kb / 1024 / 1024 ))
          echo "free_disk_kb=$avail_kb free_disk_gb=$avail_gb refuse_below_gb=$min_gb warn_below_gb=$warn_gb"
          df -h .
          if [ "$avail_gb" -lt "$min_gb" ]; then
            echo "::error::only ${avail_gb}G free (${avail_kb} KiB), below the ${min_gb}G floor. A clippy build costs ~1.0-1.3G and this is the repository's only runner. Reclaim space and re-run; do not lower GATES_MIN_FREE_GB to get a green."
            exit 1
          fi
          if [ "$avail_gb" -lt "$warn_gb" ]; then
            echo "::warning::only ${avail_gb}G free; free space on this runner has been shrinking between runs that build nothing. Investigate the leak, do not just re-run."
          fi

      # TOOLCHAIN. This job used to require cargo/rustc/cargo-clippy on the
      # host and hard-fail otherwise; run 45013278749 measured all three
      # MISSING on zesu-x64, so every push failed for a reason unrelated to the
      # code. `rust-self-hosted.yml` installs Rust in-workflow on the same
      # runner and succeeds (run 45013113393), so this job now does the same.
      # The install is skipped when cargo is already on PATH, so provisioning
      # the host properly later silently takes over instead of reinstalling.
      #
      # `--component clippy` is load-bearing: `--profile minimal` omits it, and
      # without it the install "succeeds" while the clippy step dies on
      # `cargo-clippy: command not found`.
      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          # rustup writes PATH to a profile a non-login shell does not read,
          # so a rustup-installed cargo is invisible to `command -v` until it
          # is sourced. Source FIRST, then probe -- probing before sourcing
          # made every run reinstall rustup on a host that already had it,
          # which is the host mutation this job was originally written to avoid.
          # Guarded: a distro-packaged cargo has no ~/.cargo/env, and an
          # unconditional source would abort the step under `set -e`.
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable --component clippy
            # The installer writes ~/.cargo/env, which this shell has not read.
            if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          fi
          cargo --version
          rustc --version
          cargo clippy --version

      # A report, not a gate. `cargo=/home/runner/.cargo/bin/cargo` in the log
      # is the evidence the step above took effect. `cc` stays in the list
      # because clippy needs a linker and a missing `cc` is a real signal -- it
      # just must not be fatal when rustup can provide the rest.
      - name: Report the toolchain source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          for c in cargo rustc cargo-clippy cc; do
            printf '%s=%s\n' "$c" "$(command -v "$c" || echo MISSING)"
          done

      # CACHE AND MEMORY POLICY.
      #
      # `target/` stays at its default location inside `$GITHUB_WORKSPACE` and is
      # NOT redirected to `/tmp` or `$HOME`. `actions/checkout` runs
      # `git clean -ffdx` by default, so a `target/` inside the workspace is
      # self-limiting -- wiped and rebuilt each run -- while one outside it would
      # be a permanent leak on a host with 5.6G free. Correcting an earlier
      # comment in this file: `target/` is NOT preserved between runs, and this
      # job does not depend on it being preserved.
      #
      # `CARGO_PROFILE_DEV_DEBUG=0` / `CARGO_PROFILE_TEST_DEBUG=0` drop
      # debuginfo, which is the bulk of the 1009 MB measured above. Cheapest
      # single reduction available, and it lowers link-time memory too.
      #
      # `CARGO_BUILD_JOBS=2`: the host has 4 CPUs but only 3.6G RAM. The default
      # `-j 4` over 45 crates plus a C compile is a plausible OOM, and an OOM
      # mid-build is a worse failure than a slower one.
      #
      # `--offline` is NOT used. A cold runner has an empty registry cache, and
      # `--offline` would turn a missing crate into a confusing failure.
      #
      # `-D warnings` is what makes this a gate rather than advice. A warning
      # that nobody acts on is how clippy ends up not being run at all.
      - name: cargo clippy --workspace --all-targets -- -D warnings
        shell: bash
        run: |
          set -euo pipefail
          # Each step is a fresh shell, so the Toolchain step PATH does not
          # carry over. Same guarded source as above: a distro-packaged cargo
          # has no ~/.cargo/env and an unguarded source aborts under `set -e`.
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          cargo clippy --workspace --all-targets -- -D warnings
