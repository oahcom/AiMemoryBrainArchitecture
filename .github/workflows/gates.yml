name: Existing gates

# GAP-10 Tier 2 item 2 (T2.2): wire the gates this repository already owns into
# CI, so a gate cannot reach main red without anybody noticing.
#
# ---------------------------------------------------------------------------
# RUNNER: `[self-hosted, linux, x64]`, deliberately.
#
# `GET /repos/oahcom/AiMemoryBrainArchitecture/actions/runners` returns
# `total_count: 1` -- one runner, `zesu-x64`, labels `self-hosted, Linux, X64`.
# GitHub-hosted minutes are blocked by a billing failure on this account, so a
# job written `runs-on: ubuntu-latest` is allocated no runner at all and dies
# with an empty `steps` array (observed on main, 2026-11-22T04:29:56Z, on the
# `GOV-DOC-002 metadata checks` and `audit` jobs). Writing `ubuntu-latest` here
# would make every job below dead on arrival. So every job targets the one
# runner that exists.
#
# ---------------------------------------------------------------------------
# TRIGGERS: `push` to main and `workflow_dispatch`. Not `pull_request`.
#
# Two independent controls force this, both already in force in this repo:
#   L1 (runner job-started hook, AI-RUN-002-RUNBOOK 4.1) denies every job whose
#      GITHUB_REF is not exactly `refs/heads/main`, or whose event is not
#      push / workflow_dispatch / schedule.
#   L2 (`scripts/ci/audit_runner_admission.py`, enforced by
#      `runner-admission-policy.yml`) rejects `pull_request` on any self-hosted
#      job, a `push` without a `branches:` filter, and `push.branches` naming
#      anything but `main`.
#
# CONSEQUENCE, STATED PLAINLY: this workflow cannot gate a pull request. It is a
# post-merge detector on main, plus `workflow_dispatch` for on-demand runs. A red
# gate on main becomes visible within minutes instead of never, which is the
# GAP-10 defect. It is not a pre-merge gate and this file does not pretend to be
# one. Pre-merge gating needs one of: GitHub-hosted minutes restored, a second
# runner, or a relaxed L1/L2 policy -- each an Owner decision, not an edit here.
#
# ---------------------------------------------------------------------------
# TWO KINDS OF JOB, and the difference is deliberate:
#
#   * HARD GATES fail on any deviation. The gate is green today and must stay
#     green: `protocol-index`, `conformance`, `rust`.
#
#   * RATCHETS fail only when the failure set gets WORSE than the recorded
#     baseline: `schema-nonempty`, `bilingual`. These gates are already red on
#     main (GAP-08, GAP-09). Making them hard gates today would paint every run
#     red and teach everyone to ignore the check, which is exactly how they
#     reached main red in the first place. A ratchet converts "permanently red
#     and ignored" into "cannot get worse, and gets better when someone fixes an
#     item".
#
# A RATCHET IS NOT A GREEN EXEMPTION. `scripts/ci/gate_ratchet.py` fails on two
# conditions:
#   1. a failure appears that is not in the baseline  -> regression, blocks.
#   2. a baseline item no longer fails                -> baseline is stale.
# Condition 2 is what keeps the ratchet honest: you cannot leave the baseline
# inflated after fixing something. Fixing an item requires lowering the baseline
# file in the same change.
#
# Baselines live in `scripts/ci/baselines/`. Each file is the exact set of
# currently-failing items, one per line; `#` starts a comment.
#
# ---------------------------------------------------------------------------
# ONE RUNNER MEANS SERIALISATION. The single `concurrency` group below is not
# about cancelling superseded runs; it exists so two runs cannot interleave on a
# runner that can only hold one job. Jobs inside a run queue on the runner by
# themselves. Every job also carries a `timeout-minutes`, because a wedged job on
# a one-runner repository blocks every other workflow in the repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Fixed group name: runs queue behind each other instead of overlapping on the
  # single runner. GitHub keeps one pending run per group and cancels older
  # pending ones, so a burst of pushes collapses to "the current run plus the
  # newest one".
  group: existing-gates-self-hosted
  cancel-in-progress: false

jobs:
  protocol-index:
    name: BMCP protocol index (hard gate)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Green on main at the time of writing: missing=0 extra=0
      # duplicate_types=0 invalid_rows=0. Any deviation is a real defect, so
      # this is a hard gate and not a ratchet.
      - name: Check protocol index against schema message types
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 08-bmcp-protocol/scripts/check_protocol_index.py

  conformance:
    name: BMCP conformance suite (hard gate)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Self-hosted is not a clean container and `sudo` is not assumed. The
      # pinned dependencies go into a throwaway venv under $RUNNER_TEMP, which
      # the runner wipes between jobs, so nothing is installed into the host
      # interpreter and no state leaks into the next job.
      #
      # DEGRADATION: if the venv cannot be built or the install cannot reach an
      # index, fall back to the system interpreter *only if* it already
      # satisfies the three imports. Otherwise fail. The fallback is a warning,
      # never a skip -- the suite still runs either way.
      - name: Prepare pinned Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP:-/tmp}/gates-venv"
          req=08-bmcp-protocol/tests/conformance/provider_outcome/requirements.txt
          if python3 -m venv --clear "$venv" \
             && "$venv/bin/python" -m pip install --quiet --disable-pip-version-check -r "$req"; then
            echo "$venv/bin" >> "$GITHUB_PATH"
            echo "using venv at $venv"
          else
            echo "::warning::pinned dependency install failed; falling back to the system interpreter"
            python3 -c "import importlib.util as u, sys; m = [x for x in ('jsonschema', 'rfc8785', 'cryptography') if u.find_spec(x) is None]; sys.exit('system interpreter is missing: ' + ', '.join(m)) if m else print('system interpreter already satisfies the pinned imports')"
          fi

      # The cross-language vectors shell out to `node` and import the pinned
      # `canonicalize` package. Without it three tests error out with
      # ERR_MODULE_NOT_FOUND -- a missing dependency, not a red gate. The
      # install is skipped when the module already resolves, so a warm
      # `node_modules` left on the runner is not thrown away for nothing.
      - name: Install conformance Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v node >/dev/null || { echo "::error::node is not installed on this runner"; exit 1; }
          command -v npm  >/dev/null || { echo "::error::npm is not installed on this runner"; exit 1; }
          cd 08-bmcp-protocol/tests/conformance
          if node -e "require.resolve('canonicalize')" >/dev/null 2>&1; then
            echo "canonicalize already resolvable; skipping npm ci"
          else
            npm ci --no-audit --no-fund
          fi

      # With both dependency sets installed this suite is fully green on main
      # (585 tests, 27 skipped, 0 failures). Verified before wiring it as a hard
      # gate; if it were not green it would have been a ratchet instead.
      - name: Run the full conformance suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s 08-bmcp-protocol/tests/conformance

  schema-nonempty:
    name: Schema non-empty audit (ratchet)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # GAP-09: 5506 constraints exist in the schemas that the bilingual audit
      # inventory does not register. Red on main, so ratchet rather than gate.
      - name: Ratchet the schema non-empty audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/gate_ratchet.py \
            --baseline scripts/ci/baselines/schema-nonempty.txt \
            --format schema \
            --command "python3 08-bmcp-protocol/schemas/test_nonempty_audit.py"

  bilingual:
    name: Bilingual docs coverage (ratchet)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # GOV-DOC-001 full scan: 81 normative paths lack an en/zh-CN counterpart.
      # Red on main, so ratchet rather than gate.
      - name: Ratchet the GOV-DOC-001 full scan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/gate_ratchet.py \
            --baseline scripts/ci/baselines/bilingual-docs.txt \
            --format paths \
            --command "python3 scripts/check_bilingual_docs_full.py"

  rust:
    name: Rust fmt + clippy + test (hard gate)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    # Job-level, not per-step: clippy and test must build the SAME profile or
    # they each pay the full build cost and each hold their own artifacts.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4

      # DISK PREFLIGHT. Measured on this runner (run 44992270090, 2026-11-22):
      # 39G total, 32G used, **5.6G free**, 3.6G RAM, 4 CPUs.
      #
      # What a build of this workspace actually costs, measured by the runner
      # operator on a comparable host: `cargo test --workspace --all-targets`
      # produces a 1009 MB `target/` over 45 crates, and `~/.cargo/registry` is
      # 319 MB for 290 crates. `clippy --workspace --all-targets` plus
      # `test --workspace` share one CARGO_TARGET_DIR and are ESTIMATED (not
      # measured) at 1.7-2.0 GB, because clippy-driver emits its own artifact
      # per dependency alongside rustc's. So a job costs roughly 2.0-2.5 GB
      # including the registry, which fits in 5.6G with room to spare.
      #
      # The floor is therefore 4 GiB, not a comfortable-looking round number.
      # An earlier draft of this file refused below 6G, which would have failed
      # a job that would in fact have succeeded -- a gate that is red for a
      # reason that is not true is exactly the kind of noise this repository
      # already has too much of.
      #
      # `GATES_MIN_FREE_GB` is a floor, not a target. Raise it, never lower it
      # to make a run go green.
      #
      # WATCH THE TREND, NOT THE VALUE. Two diagnostic runs that compile nothing
      # reported ~6.8G free and then ~5.6G free: about 1.2 GB accumulated with
      # no build in between. On a single runner that drift, not the absolute
      # number, is what eventually takes every workflow down at once.
      - name: Check free disk before building
        shell: bash
        run: |
          set -euo pipefail
          min_gb="${GATES_MIN_FREE_GB:-4}"
          warn_gb="${GATES_WARN_FREE_GB:-8}"
          avail_kb=$(df -Pk . | awk 'NR==2 {print $4}')
          avail_gb=$(( avail_kb / 1024 / 1024 ))
          echo "free_disk_kb=$avail_kb free_disk_gb=$avail_gb refuse_below_gb=$min_gb warn_below_gb=$warn_gb"
          df -h .
          if [ "$avail_gb" -lt "$min_gb" ]; then
            echo "::error::only ${avail_gb}G free (${avail_kb} KiB), below the ${min_gb}G floor. A workspace build costs ~2.0-2.5G and this is the repository's only runner. Reclaim space and re-run; do not lower GATES_MIN_FREE_GB to get a green."
            exit 1
          fi
          if [ "$avail_gb" -lt "$warn_gb" ]; then
            echo "::warning::only ${avail_gb}G free; free space on this runner has been shrinking between runs that build nothing. Investigate the leak, do not just re-run."
          fi

      # NO TOOLCHAIN INSTALL STEP. This runner is a shared, operator-managed
      # host; a workflow that runs `rustup` would mutate the toolchain every
      # other job on this machine sees. `actions/checkout` cleans
      # `$GITHUB_WORKSPACE` but not `$HOME`, so `~/.cargo` and `~/.rustup` would
      # persist and every later job's result would depend on which job ran
      # first -- irreproducible and very hard to diagnose. A half-finished
      # rustup install would also leave a broken `~/.rustup` that breaks every
      # subsequent Rust job silently. Failing here is diagnosable; mutating the
      # host is not.
      #
      # `cc` is checked too: `libsqlite3-sys` compiles C, and discovering a
      # missing compiler 40 crates into a build wastes the whole job.
      - name: Require the host Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          for c in cargo rustc cargo-clippy rustfmt cc; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "$c=$(command -v "$c")"
            else
              echo "$c=MISSING"
              missing="$missing $c"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::zesu-x64 lacks:$missing -- install on the host out of band (see AI-RUN-002-RUNBOOK), do not install it in this workflow"
            exit 1
          fi
          cargo --version
          rustc --version
          cargo fmt --version
          cargo clippy --version

      # CACHE AND MEMORY POLICY.
      #
      # `target/` stays at its default location inside `$GITHUB_WORKSPACE` and is
      # NOT redirected to `/tmp` or `$HOME`. `actions/checkout` runs
      # `git clean -ffdx` by default, so a `target/` inside the workspace is
      # self-limiting -- wiped and rebuilt each run -- while one outside it would
      # be a permanent leak on a host with 5.6G free. Correcting an earlier
      # comment in this file: `target/` is NOT preserved between runs, and this
      # job does not depend on it being preserved.
      #
      # `CARGO_PROFILE_DEV_DEBUG=0` / `CARGO_PROFILE_TEST_DEBUG=0` drop
      # debuginfo, which is the bulk of the 1009 MB measured above. Cheapest
      # single reduction available, and it lowers link-time memory too.
      #
      # `CARGO_BUILD_JOBS=2`: the host has 4 CPUs but only 3.6G RAM. The default
      # `-j 4` over 45 crates plus a C compile plus linking test binaries is a
      # plausible OOM, and an OOM mid-build is a worse failure than a slower one.
      #
      # `--offline` is NOT used. A cold runner has an empty registry cache, and
      # `--offline` would turn a missing crate into a confusing failure.
      - name: cargo fmt --all --check
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check

      # rustfmt has no pin file in this repository, so a rustfmt release that
      # changes formatting can turn this job red without any code change. That
      # is a known sharp edge; it is still a hard gate because formatting drift
      # on main is what GAP-10 records as a recurring regression.
      - name: cargo clippy --workspace --all-targets -- -D warnings
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets -- -D warnings

      # `libsqlite3-sys` builds C, so this needs a working `cc`/`cc1` on the
      # host. If it fails with "cannot execute 'cc1'", that is a broken host
      # toolchain, not a code defect -- the message is reported as-is.
      - name: cargo test --workspace
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP:-/tmp}/rust-test.log"
          cargo test --workspace 2>&1 | tee "$log"
          grep -E '^test result:' "$log" | \
            awk '{p+=$4; f+=$6; i+=$8} END {printf "passed=%d failed=%d ignored=%d\n", p, f, i}'
