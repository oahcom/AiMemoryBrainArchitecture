name: Existing gates

# GAP-10 Tier 2 item 2 (T2.2): wire the gates this repository already owns into
# CI, so a gate cannot reach main red without anybody noticing.
#
# ---------------------------------------------------------------------------
# RUNNER: `ubuntu-latest`, on measurement, not on preference.
#
# This file used to target `[self-hosted, linux, x64]` (runner `zesu-x64`)
# because GitHub-hosted minutes were blocked by a billing failure on this
# account, and a `runs-on: ubuntu-latest` job was allocated no runner at all.
# That is no longer the state of the world, and the two paths have swapped
# roles:
#
#   * `self-hosted` is now the broken path FOR THIS WORKFLOW, and it has never
#     worked once. `GET /actions/workflows/426721518/runs` returns 31 runs, 0
#     successes: every one failed or was cancelled, and not one of them was a
#     real gate failure. The error is identical on all of them, and it comes
#     from the runner host's egress proxy, not from the code and not from disk:
#         fatal: unable to access 'https://github.com/oahcom/...':
#         GnuTLS, handshake failed: The TLS connection was non-properly terminated.
#     It dies inside `actions/checkout`, whose 3 retries span ~31s -- shorter
#     than the flap. PR #708 / GAP-30 measured the same egress at
#     `ECONNREFUSED ... after 0 ms`. A gate that cannot fetch the repository
#     cannot report on the repository, so those 31 runs carried no information
#     about the gates at all.
#
#   * `ubuntu-latest` is now the reliable path, measured. `rust-phase1.yml` is
#     hosted and succeeded on 5 consecutive runs (26d2c9bc, 9b35878d, 99c3130b,
#     1d300d7c, 38c3c975); run 45038988160 ran 6 steps green on `GitHub Actions
#     1000005220`, including `cargo clippy --workspace --all-targets -- -D
#     warnings` and `cargo test --workspace --all-targets`.
#     `document-management.yml` is hosted and green (run 45039213359), as are
#     `bilingual-docs.yml` and `runner-admission-policy.yml`.
#
# So every job below runs on `ubuntu-latest`. The gates themselves are
# unchanged: same commands, same baselines, same hard-gate/ratchet split. Only
# the substrate moved.
#
# ---------------------------------------------------------------------------
# TRIGGERS: `push` to main and `workflow_dispatch`. Not `pull_request`.
#
# Deliberately unchanged by the runner migration. This trigger used to be forced
# by two controls that only bite self-hosted jobs:
#   L1 (runner job-started hook, AI-RUN-002-RUNBOOK 4.1) denies every job whose
#      GITHUB_REF is not exactly `refs/heads/main`, or whose event is not
#      push / workflow_dispatch / schedule.
#   L2 (`scripts/ci/audit_runner_admission.py`, enforced by
#      `runner-admission-policy.yml`) rejects `pull_request` on any self-hosted
#      job, a `push` without a `branches:` filter, and `push.branches` naming
#      anything but `main`.
#
# Both apply only to self-hosted jobs, and no job in this file is self-hosted
# any more: the admission audit's self-hosted count drops by the 5 jobs here, so
# this file is out of L1/L2's reach. The trigger is still left exactly as it
# was, because moving the substrate is not a licence to widen scope. Making this
# a pre-merge gate by adding `pull_request` is a separate Owner decision, not a
# side effect of a `runs-on` edit. Until that decision, this remains a
# post-merge detector on main plus `workflow_dispatch` -- which is precisely the
# GAP-10 defect it was written to close: a red gate on main becomes visible
# within minutes instead of never. It is not a pre-merge gate and this file does
# not pretend to be one.
#
# ---------------------------------------------------------------------------
# TWO KINDS OF JOB, and the difference is deliberate:
#
#   * HARD GATES fail on any deviation. The gate is green today and must stay
#     green: `protocol-index`, `conformance`, `schema-nonempty`, `clippy`.
#
#   * RATCHETS fail only when the failure set gets WORSE than the recorded
#     baseline: `bilingual`. This gate is already red on main (GAP-08). Making it
#     a hard gate today would paint every run red and teach everyone to ignore
#     the check, which is exactly how it reached main red in the first place. A
#     ratchet converts "permanently red and ignored" into "cannot get worse, and
#     gets better when someone fixes an item".
#
# A GATE MOVES FROM RATCHET TO HARD GATE THE DAY IT GOES GREEN, and it must, or
# the ratchet becomes a permanent exemption. `schema-nonempty` was a ratchet in
# an earlier revision of this file because GAP-09 was open at 5506 unregistered
# constraints. GAP-09 was closed on main (`6897e53c`, "audit the 30 unregistered
# schemas, closing GAP-09 gate"), the audit now exits 0 with all 5599 constraints
# registered, and so the ratchet is gone: the job runs the audit directly and any
# single unregistered constraint fails the run. Its baseline file was deleted in
# the same change, because a baseline with nothing left in it is the exemption
# this whole paragraph exists to forbid.
#
# A RATCHET IS NOT A GREEN EXEMPTION. `scripts/ci/gate_ratchet.py` fails on two
# conditions:
#   1. a failure appears that is not in the baseline  -> regression, blocks.
#   2. a baseline item no longer fails                -> baseline is stale.
# Condition 2 is what keeps the ratchet honest: you cannot leave the baseline
# inflated after fixing something. Fixing an item requires lowering the baseline
# file in the same change.
#
# Baselines live in `scripts/ci/baselines/`. Each file is the exact set of
# currently-failing items, one per line; `#` starts a comment. After the
# `schema-nonempty` ratchet was retired there is exactly one baseline left,
# `bilingual-docs.txt`. A baseline directory with a file per green gate would be
# a directory of exemptions.
#
# ---------------------------------------------------------------------------
# NO `concurrency` BLOCK, AND WHY. There was one: group
# `existing-gates-self-hosted`, `cancel-in-progress: false`. Its only purpose
# was to stop two runs from interleaving on a host that can hold one job. A
# hosted runner is allocated per job and runs jobs in parallel, so that reason is
# gone and the block went with it. On a runner that can run these five jobs
# concurrently, serialising whole runs would only add latency.
#
# Removing it cannot reproduce #712. #712 put this workflow and
# `rust-self-hosted.yml` in ONE group and got both runs cancelled within a minute
# (45038090599 and 45038164281, cancelled at creation with zero jobs): a group
# holds one running plus one pending run, the second arrival replaces the
# pending one, and `cancel-in-progress: false` does not protect a run that has
# not started. Every workflow in this repository now owns a distinct group
# (`rust-self-hosted`, `runner-disk-reclaim`, `ubuntu-worker-diagnostics`,
# `ai-owner-worker-...`), and nothing else referenced
# `existing-gates-self-hosted` -- so deleting the block removes the last
# reference to a shared queue slot rather than creating one.
#
# Every job keeps an explicit `timeout-minutes`. A hosted job's default timeout
# is 6 hours; a hung job that sits there burning minutes and reporting nothing is
# worse than a fast red.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-index:
    name: BMCP protocol index (hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Green on main at the time of writing: missing=0 extra=0
      # duplicate_types=0 invalid_rows=0. Any deviation is a real defect, so
      # this is a hard gate and not a ratchet.
      - name: Check protocol index against schema message types
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 08-bmcp-protocol/scripts/check_protocol_index.py

  conformance:
    name: BMCP conformance suite (hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # A throwaway venv under $RUNNER_TEMP, not the system interpreter. The
      # reason is no longer "the host is dirty and `sudo` is not assumed" -- a
      # hosted runner is a fresh VM. It is that `requirements.txt` IS the pinned
      # set this suite is validated against, and an ambient image Python would
      # silently exercise some other version of `jsonschema`, `rfc8785` and
      # `cryptography`. `$RUNNER_TEMP` is discarded with the VM, so nothing leaks
      # into the next job either way.
      #
      # DEGRADATION: if the venv cannot be built or the install cannot reach an
      # index, fall back to the system interpreter *only if* it already
      # satisfies the three imports. Otherwise fail. The fallback is a warning,
      # never a skip -- the suite still runs either way.
      - name: Prepare pinned Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP:-/tmp}/gates-venv"
          req=08-bmcp-protocol/tests/conformance/provider_outcome/requirements.txt
          if python3 -m venv --clear "$venv" \
             && "$venv/bin/python" -m pip install --quiet --disable-pip-version-check -r "$req"; then
            echo "$venv/bin" >> "$GITHUB_PATH"
            echo "using venv at $venv"
          else
            echo "::warning::pinned dependency install failed; falling back to the system interpreter"
            python3 -c "import importlib.util as u, sys; m = [x for x in ('jsonschema', 'rfc8785', 'cryptography') if u.find_spec(x) is None]; sys.exit('system interpreter is missing: ' + ', '.join(m)) if m else print('system interpreter already satisfies the pinned imports')"
          fi

      # The cross-language vectors shell out to `node` and import the pinned
      # `canonicalize` package. Without it three tests error out with
      # ERR_MODULE_NOT_FOUND -- a missing dependency, not a red gate. The
      # skip-when-already-resolvable guard is kept because it costs one `node -e`
      # and it is what lets the same step work on a host with a warm
      # `node_modules`; on a hosted runner it is effectively always false, since
      # the checkout starts with no `node_modules` at all.
      - name: Install conformance Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v node >/dev/null || { echo "::error::node is not installed on this runner"; exit 1; }
          command -v npm  >/dev/null || { echo "::error::npm is not installed on this runner"; exit 1; }
          cd 08-bmcp-protocol/tests/conformance
          if node -e "require.resolve('canonicalize')" >/dev/null 2>&1; then
            echo "canonicalize already resolvable; skipping npm ci"
          else
            npm ci --no-audit --no-fund
          fi

      # With both dependency sets installed this suite is fully green on main
      # (585 tests, 27 skipped, 0 failures). Verified before wiring it as a hard
      # gate; if it were not green it would have been a ratchet instead.
      - name: Run the full conformance suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s 08-bmcp-protocol/tests/conformance

  schema-nonempty:
    name: Schema non-empty audit (hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # HARD GATE, not a ratchet. GAP-09 is closed: `6897e53c` registered all
      # 5599 constraints across the 32 schemas, and this audit now exits 0 on
      # main. A green gate must be hard -- keeping the ratchet would let the
      # baseline file sit there as a standing exemption, which is precisely the
      # failure mode GAP-10 records. The baseline file was deleted in the same
      # change as this step.
      #
      # Any single unregistered or stale constraint fails the run. The audit
      # prints one offending constraint per line on stdout and exits 1.
      - name: Run the schema non-empty audit
        shell: bash
        run: |
          set -euo pipefail
          python3 08-bmcp-protocol/schemas/test_nonempty_audit.py

  bilingual:
    name: Bilingual docs coverage (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # GOV-DOC-001 full scan: 81 normative paths lack an en/zh-CN counterpart.
      # Red on main, so ratchet rather than gate.
      - name: Ratchet the GOV-DOC-001 full scan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/gate_ratchet.py \
            --baseline scripts/ci/baselines/bilingual-docs.txt \
            --format paths \
            --command "python3 scripts/check_bilingual_docs_full.py"

  # CLIPPY ONLY, AND WHY.
  #
  # The overlap with the other Rust workflows, stated plainly so nobody has to
  # rediscover it: `rust-phase1.yml` (hosted, 5 consecutive green runs) runs
  # `cargo clippy --workspace --all-targets -- -D warnings` AND
  # `cargo test --workspace --all-targets`, but only on `pull_request`, and on
  # `push` to main only when its `paths:` filter matches (`Cargo.toml`,
  # `Cargo.lock`, `crates/**`, `scripts/check_fmt.py`, itself).
  # `rust-self-hosted.yml` runs `cargo test --workspace --all-targets
  # --no-fail-fast` and `python3 scripts/check_fmt.py --expect "$(git rev-parse
  # HEAD)"` on `[self-hosted, linux, x64]`.
  #
  # So clippy here is NOT "uncovered everywhere else" -- correcting this file's
  # earlier claim that `rust-phase1.yml` "has never executed": it has, repeatedly
  # and green, including its clippy step. What IS uncovered is clippy on a push
  # to main that matches none of `rust-phase1.yml`'s `paths:` filters, because
  # THIS workflow has no path filter and runs on every push to main. That
  # conditional coverage is the independent value of this job, and the reason it
  # is kept rather than merged or deleted in this change. De-duplicating the two
  # is a separate decision: dropping this job without widening
  # `rust-phase1.yml`'s trigger would lose clippy on every non-Rust push to main.
  #
  # `cargo test` and `rustfmt` are deliberately NOT run here.
  # `rust-self-hosted.yml` runs both on main, and a second test run here would be
  # actively harmful: `cargo test --workspace` without `--all-targets` does not
  # run doctests, and `--all-targets` does. Measured on the same tree:
  # `--all-targets` -> passed=546, plain `--workspace` -> passed=551. The 5-test
  # gap is doctests. GAP-10 section 7.1 records this exact trap at 371 vs 385.
  # Two workflows reporting different test counts for the same commit make
  # neither number trustworthy, and the one that is wrong is the one that looks
  # green.
  #
  # Consequence: rustfmt and the test suite are NOT gated here. They are gated
  # by `rust-self-hosted.yml` on main. If that workflow is ever deleted, this
  # job must grow them back -- with `--all-targets`.
  clippy:
    name: Rust clippy (hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level, not per-step: clippy lints both the dev profile and the test
    # profile under `--all-targets`, so both debug levels matter.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4

      # DISK PREFLIGHT. Kept; its rationale corrected.
      #
      # The measurement this check was written against was of the self-hosted
      # host (run 44992270090, 2026-11-22: 39G total, 32G used, 5.6G free, 3.6G
      # RAM, 4 CPUs). That host is no longer the runner, so what follows is a
      # statement about the BUILD, not about the machine.
      #
      # What a build of this workspace actually costs, measured by the runner
      # operator: `cargo test --workspace --all-targets` produces a 1009 MB
      # `target/` over 45 crates, and `~/.cargo/registry` is 319 MB for 290
      # crates. Clippy-only is the same compilation with a different driver and
      # no test binaries linked, so ~1.0-1.3 GB including the registry.
      #
      # A standard hosted `ubuntu-latest` runner has a 14 GB SSD, so 1.0-1.3 GB
      # is not tight. It is still worth a floor: a build that suddenly wants
      # several GB is a real defect, and failing here names it, while the
      # alternative is an opaque "No space left on device" several steps later
      # pointing at whatever happened to write last.
      #
      # The floor is 3 GiB. It was 4 GiB when this job also ran `cargo test` and
      # shared one CARGO_TARGET_DIR with clippy (an estimated 1.7-2.0 GB); with
      # the test step gone the floor drops with it. Lowering a floor to make a
      # run go green is forbidden; lowering it because the job genuinely got
      # smaller is just keeping the number honest.
      #
      # `GATES_MIN_FREE_GB` is a floor, not a target. Raise it, never lower it
      # to make a run go green.
      #
      # A hosted runner starts from a clean image every run, so this check can no
      # longer catch slow drift -- there is nothing left to drift. What it catches
      # now is a build whose footprint has outgrown what the job is budgeted for.
      - name: Check free disk before building
        shell: bash
        run: |
          set -euo pipefail
          min_gb="${GATES_MIN_FREE_GB:-3}"
          warn_gb="${GATES_WARN_FREE_GB:-6}"
          avail_kb=$(df -Pk . | awk 'NR==2 {print $4}')
          avail_gb=$(( avail_kb / 1024 / 1024 ))
          echo "free_disk_kb=$avail_kb free_disk_gb=$avail_gb refuse_below_gb=$min_gb warn_below_gb=$warn_gb"
          df -h .
          if [ "$avail_gb" -lt "$min_gb" ]; then
            echo "::error::only ${avail_gb}G free (${avail_kb} KiB), below the ${min_gb}G floor. A clippy build of this workspace costs ~1.0-1.3G and the hosted image provides a 14G disk, so something before this step is consuming it. Investigate the footprint; do not lower GATES_MIN_FREE_GB to get a green."
            exit 1
          fi
          if [ "$avail_gb" -lt "$warn_gb" ]; then
            echo "::warning::only ${avail_gb}G free, below the ${warn_gb}G comfort threshold on a freshly imaged runner; the build footprint is larger than expected. Check what grew, do not just re-run."
          fi

      # TOOLCHAIN. A hosted `ubuntu-latest` image ships stable Rust with the
      # clippy component, so on that runner this step is a no-op: `command -v
      # cargo` succeeds and nothing is installed. It is kept because it is what
      # makes the same job work on a self-hosted host too -- run 45013278749
      # measured cargo, rustc and cargo-clippy all MISSING on zesu-x64, so every
      # push failed for a reason unrelated to the code.
      #
      # The install is skipped when cargo is already on PATH, so provisioning a
      # host properly later silently takes over instead of reinstalling.
      #
      # `--component clippy` is load-bearing for the install branch:
      # `--profile minimal` omits it, and without it the install "succeeds" while
      # the clippy step dies on `cargo-clippy: command not found`.
      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          # rustup writes PATH to a profile a non-login shell does not read,
          # so a rustup-installed cargo is invisible to `command -v` until it
          # is sourced. Source FIRST, then probe -- probing before sourcing
          # made every run reinstall rustup on a host that already had it,
          # which is the host mutation this job was originally written to avoid.
          # Guarded: a distro-packaged cargo has no ~/.cargo/env, and an
          # unconditional source would abort the step under `set -e`.
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable --component clippy
            # The installer writes ~/.cargo/env, which this shell has not read.
            if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          fi
          cargo --version
          rustc --version
          cargo clippy --version

      # A report, not a gate. The log line naming each resolved binary is the
      # evidence the step above took effect; on the hosted image all four should
      # already resolve before any install runs. `cc` stays in the list because
      # clippy needs a linker and a missing `cc` is a real signal -- it just must
      # not be fatal when rustup can provide the rest.
      - name: Report the toolchain source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          for c in cargo rustc cargo-clippy cc; do
            printf '%s=%s\n' "$c" "$(command -v "$c" || echo MISSING)"
          done

      # CACHE AND MEMORY POLICY.
      #
      # `target/` stays at its default location inside `$GITHUB_WORKSPACE` and is
      # NOT redirected to `/tmp` or `$HOME`. `actions/checkout` runs
      # `git clean -ffdx` by default, so a `target/` inside the workspace is
      # self-limiting -- wiped and rebuilt each run. Correcting an earlier
      # comment in this file: `target/` is NOT preserved between runs, and this
      # job does not depend on it being preserved. On a hosted runner that is
      # doubly true, because the VM itself is discarded, so the only thing the
      # location decides is which disk budget the 1.0-1.3 GB is charged against.
      #
      # `CARGO_PROFILE_DEV_DEBUG=0` / `CARGO_PROFILE_TEST_DEBUG=0` drop
      # debuginfo, which is the bulk of the 1009 MB measured above. Cheapest
      # single reduction available, and it lowers link-time memory too.
      #
      # `CARGO_BUILD_JOBS=2` was chosen for a 4-CPU / 3.6G-RAM host where the
      # default `-j 4` over 45 crates plus a C compile was a plausible OOM, and
      # an OOM mid-build is a worse failure than a slower one. That host is no
      # longer the runner; a standard hosted runner provides 4 vCPU and at least
      # 8 GB RAM, so the cap is conservative rather than necessary now. Left
      # alone on purpose: it is a cap, it cannot change correctness, and this
      # change is a substrate migration, not a performance tune.
      #
      # `--offline` is NOT used. A cold runner has an empty registry cache, and
      # `--offline` would turn a missing crate into a confusing failure.
      #
      # `-D warnings` is what makes this a gate rather than advice. A warning
      # that nobody acts on is how clippy ends up not being run at all.
      - name: cargo clippy --workspace --all-targets -- -D warnings
        shell: bash
        run: |
          set -euo pipefail
          # Each step is a fresh shell, so the Toolchain step PATH does not
          # carry over. Same guarded source as above: a distro-packaged cargo
          # has no ~/.cargo/env and an unguarded source aborts under `set -e`.
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          cargo clippy --workspace --all-targets -- -D warnings
