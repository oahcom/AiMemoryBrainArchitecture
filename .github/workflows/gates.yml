name: Existing gates

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

# All jobs execute on GitHub-hosted `ubuntu-latest` runners. This workflow is
# both a pull-request gate and a post-merge detector; it must never depend on
# the development server or a self-hosted Actions runner.
#
# ---------------------------------------------------------------------------
# TWO KINDS OF JOB, and the difference is deliberate:
#
#   * HARD GATES fail on any deviation. The gate is green today and must stay
#     green: `protocol-index`, `conformance`, `schema-nonempty`, `clippy`, `fmt`,
#     `doctest`.
#
#   * RATCHETS fail only when the failure set gets WORSE than the recorded
#     baseline: `bilingual`. This gate is already red on main (GAP-08). Making it
#     a hard gate today would paint every run red and teach everyone to ignore
#     the check, which is exactly how it reached main red in the first place. A
#     ratchet converts "permanently red and ignored" into "cannot get worse, and
#     gets better when someone fixes an item".
#
# A GATE MOVES FROM RATCHET TO HARD GATE THE DAY IT GOES GREEN, and it must, or
# the ratchet becomes a permanent exemption. `schema-nonempty` was a ratchet in
# an earlier revision of this file because GAP-09 was open at 5506 unregistered
# constraints. GAP-09 was closed on main (`6897e53c`, "audit the 30 unregistered
# schemas, closing GAP-09 gate"), the audit now exits 0 with all 5599 constraints
# registered, and so the ratchet is gone: the job runs the audit directly and any
# single unregistered constraint fails the run. Its baseline file was deleted in
# the same change, because a baseline with nothing left in it is the exemption
# this whole paragraph exists to forbid.
#
# A RATCHET IS NOT A GREEN EXEMPTION. `scripts/ci/gate_ratchet.py` fails on two
# conditions:
#   1. a failure appears that is not in the baseline  -> regression, blocks.
#   2. a baseline item no longer fails                -> baseline is stale.
# Condition 2 is what keeps the ratchet honest: you cannot leave the baseline
# inflated after fixing something. Fixing an item requires lowering the baseline
# file in the same change.
#
# Baselines live in `scripts/ci/baselines/`. Each file is the exact set of
# currently-failing items, one per line; `#` starts a comment. After the
# `schema-nonempty` ratchet was retired there is exactly one baseline left,
# `bilingual-docs.txt`. A baseline directory with a file per green gate would be
# a directory of exemptions.
#
# ---------------------------------------------------------------------------
# GitHub-hosted jobs run in isolated ephemeral environments. Every job has an
# explicit timeout; Rust compilation remains bounded with CARGO_BUILD_JOBS=2.

on:
  pull_request:
    branches: [main]
  # Seven required contexts live in this file. The queue only reports checks
  # produced by `merge_group`, so every job here must also run for it.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  protocol-index:
    name: BMCP protocol index (hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Green on main at the time of writing: missing=0 extra=0
      # duplicate_types=0 invalid_rows=0. Any deviation is a real defect, so
      # this is a hard gate and not a ratchet.
      - name: Check protocol index against schema message types
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 08-bmcp-protocol/scripts/check_protocol_index.py

  conformance:
    name: BMCP conformance suite (hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The GitHub-hosted runner is ephemeral. Install the pinned dependencies
      # into a job-local venv so the suite does not depend on image-global state.
      - name: Prepare pinned Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP:-/tmp}/gates-venv"
          req=08-bmcp-protocol/tests/conformance/provider_outcome/requirements.txt
          if python3 -m venv --clear "$venv" \
             && "$venv/bin/python" -m pip install --quiet --disable-pip-version-check -r "$req"; then
            echo "$venv/bin" >> "$GITHUB_PATH"
            echo "using venv at $venv"
          else
            echo "::warning::pinned dependency install failed; falling back to the system interpreter"
            python3 -c "import importlib.util as u, sys; m = [x for x in ('jsonschema', 'rfc8785', 'cryptography') if u.find_spec(x) is None]; sys.exit('system interpreter is missing: ' + ', '.join(m)) if m else print('system interpreter already satisfies the pinned imports')"
          fi

      # Pin the Node major version and install the lockfile-defined package set
      # in this clean job environment; do not depend on a warm node_modules tree.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install conformance Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v node >/dev/null || { echo "::error::node is not installed on this runner"; exit 1; }
          command -v npm  >/dev/null || { echo "::error::npm is not installed on this runner"; exit 1; }
          cd 08-bmcp-protocol/tests/conformance
          if node -e "require.resolve('canonicalize')" >/dev/null 2>&1; then
            echo "canonicalize already resolvable; skipping npm ci"
          else
            npm ci --no-audit --no-fund
          fi

      # With both dependency sets installed this suite is fully green on main
      # (585 tests, 27 skipped, 0 failures). Verified before wiring it as a hard
      # gate; if it were not green it would have been a ratchet instead.
      - name: Run the full conformance suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s 08-bmcp-protocol/tests/conformance

  schema-nonempty:
    name: Schema non-empty audit (hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # merge_group: github.sha is the queue candidate head; pull_request:
          # the PR head. Never the base.
          ref: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}

      # HARD GATE, not a ratchet. GAP-09 is closed: `6897e53c` registered all
      # 5599 constraints across the 32 schemas, and this audit now exits 0 on
      # main. A green gate must be hard -- keeping the ratchet would let the
      # baseline file sit there as a standing exemption, which is precisely the
      # failure mode GAP-10 records. The baseline file was deleted in the same
      # change as this step.
      #
      # Any single unregistered or stale constraint fails the run. The audit
      # prints one offending constraint per line on stdout and exits 1.
      - name: Run the schema non-empty audit
        shell: bash
        run: |
          set -euo pipefail
          python3 08-bmcp-protocol/schemas/test_nonempty_audit.py
      - name: Enforce REQ-01 assessment signature attachment (required gate)
        run: python3 scripts/ci/check_req_assessment_signatures.py
      - name: Test REQ-01 assessment signature checker
        run: python3 -m unittest scripts.ci.test_check_req_assessment_signatures
      - name: Mutation check — deleting a signature field must fail the gate
        shell: bash
        run: |
          set -uo pipefail
          set +e
          root="$(mktemp -d)"
          mkdir -p "$root/reviews/architecture" "$root/reviews/complexity"
          cp reviews/architecture/SYS-RISK-001.*.md "$root/reviews/architecture/"
          cp reviews/complexity/architecture-complexity-assessment.*.md "$root/reviews/complexity/"
          python3 scripts/ci/check_req_assessment_signatures.py --root "$root"
          baseline_exit=$?
          echo "baseline_exit=$baseline_exit"
          if [ "$baseline_exit" -ne 0 ]; then exit 1; fi
          for f in reviews/architecture/SYS-RISK-001.en.md reviews/architecture/SYS-RISK-001.zh-CN.md \
                   reviews/complexity/architecture-complexity-assessment.en.md \
                   reviews/complexity/architecture-complexity-assessment.zh-CN.md; do
            for field in assessor assessed_version evidence_baseline; do
              rm -rf "$root"
              mkdir -p "$root/reviews/architecture" "$root/reviews/complexity"
              cp reviews/architecture/SYS-RISK-001.*.md "$root/reviews/architecture/"
              cp reviews/complexity/architecture-complexity-assessment.*.md "$root/reviews/complexity/"
              grep -v "^- $field:" "$root/$f" > "$root/$f.tmp" && mv "$root/$f.tmp" "$root/$f"
              python3 scripts/ci/check_req_assessment_signatures.py --root "$root" >/dev/null 2>&1
              code=$?
              echo "mutation file=$f field=$field exit=$code"
              if [ "$code" -eq 0 ]; then echo "MUTATION SURVIVED: $f / $field"; exit 1; fi
            done
          done
          echo "MUTATION OK: 12 of 12 deletions rejected"

  bilingual:
    name: Bilingual docs coverage (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # A wrapped gate that crashes with an empty baseline used to be reported
      # as PASS. This runs the wrapper's own tests, including that shape.
      - name: Self-check the ratchet wrapper
        run: python3 scripts/ci/test_gate_ratchet.py
      # GOV-DOC-001 full scan: 76 normative paths lack an en/zh-CN counterpart.
      # 76 is the entry count of scripts/ci/baselines/bilingual-docs.txt, the
      # baseline handed to the ratchet below; scripts/ci/test_gate_ratchet.py
      # asserts the comment and that file agree, so change both together.
      # Red on main, so ratchet rather than gate.
      - name: Ratchet the GOV-DOC-001 full scan
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASELINE_REF" || {
            echo "INCOMPLETE: event has no authoritative base commit"
            exit 2
          }
          git fetch --no-tags origin "$BASELINE_REF"
          python3 scripts/ci/gate_ratchet.py \
            --baseline-id bilingual-docs \
            --baseline scripts/ci/baselines/bilingual-docs.txt \
            --baseline-ref "$BASELINE_REF" \
            --format paths \
            --command "python3 scripts/check_bilingual_docs_full.py"

  # The Rust Phase 1 workflow owns the full workspace test and format checks.
  # This job supplies the independent Clippy hard gate; keep the command aligned
  # with the same workspace and target set used by Rust Phase 1.
  clippy:
    name: Rust clippy (hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Job-level, not per-step: clippy lints both the dev profile and the test
    # profile under `--all-targets`, so both debug levels matter.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Record resolved Rust toolchain version
        id: rust-toolchain-version
        shell: bash
        run: echo "version=$(rustc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gates-clippy
          key: ${{ hashFiles('Cargo.lock') }}-${{ steps.rust-toolchain-version.outputs.version }}

      - name: Report the toolchain source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          for c in cargo rustc cargo-clippy cc; do
            printf '%s=%s\n' "$c" "$(command -v "$c" || echo MISSING)"
          done

      # GitHub-hosted runners are ephemeral, so build output and registry data
      # do not persist on the development server. Disable debug info and cap
      # parallelism to keep compilation resource use predictable.
      - name: cargo clippy --workspace --all-targets -- -D warnings
        shell: bash
        run: |
          set -euo pipefail
          # Each step is a fresh shell, so the Toolchain step PATH does not
          # carry over. Same guarded source as above: a distro-packaged cargo
          # has no ~/.cargo/env and an unguarded source aborts under `set -e`.
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          cargo clippy --workspace --all-targets -- -D warnings

  # `--all-targets` covers --lib/--bins/--tests/--benches/--examples and
  # explicitly excludes doctests; only `--doc` runs them. `rust-phase1.yml`
  # already passes `--doc`, but it is path-filtered and is not a required
  # context, so a doctest regression can merge green (issue #704). This job has
  # no path filter, so the `compile_fail` blocks in `memory-domain` are checked
  # on every pull request.
  doctest:
    name: Rust doctests (hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Record resolved Rust toolchain version
        id: rust-toolchain-version
        shell: bash
        run: echo "version=$(rustc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gates-doctest
          key: ${{ hashFiles('Cargo.lock') }}-${{ steps.rust-toolchain-version.outputs.version }}

      - name: cargo test --workspace --doc
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          cargo test --workspace --doc --no-fail-fast

  # `rust-phase1.yml` already runs this check, but it has a `paths:` filter and
  # is not a required status context, so a formatting regression could merge
  # green (issue #645). A required check cannot itself be path-filtered: on a
  # PR that touches no Rust file it would stay "Expected" forever and block the
  # merge. This job therefore runs on every pull request and is cheap enough to
  # do so -- the workspace is small and only formatting is checked.
  fmt:
    name: Rust format (hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # No rust-cache here on purpose: this job only runs `cargo fmt --all
      # -- --check` and never compiles, so a dependency/build cache can never
      # hit and only costs a cache round-trip on every pull request.

      # `check_fmt.py` never rewrites files and refuses a dirty work tree, so a
      # pass here means the committed tree is formatted, not that a checkout
      # was cleaned up afterwards.
      - name: Verify repository formatting at this commit
        shell: bash
        run: python3 scripts/check_fmt.py --expect "$GITHUB_SHA"

  work-item-manifest-schema:
    name: Work Item manifest schema (read-only baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the repository's pinned YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Install the repository's pinned pytest runner
        run: python -m pip install pytest==8.3.5
      - name: Test sequence-of-mapping support in GOV-DOC parser
        run: python3 scripts/test_check_document_management_sequence_mapping.py
      - name: Test AC4 fixtures and AID-2026-251 compliance
        run: python3 scripts/test_check_work_item_manifest_schema.py
      - name: Test legacy ledger builder
        run: python -m pytest -q scripts/test_build_legacy_ledger.py
      - name: Test the stage-1 manifest autofiller
        run: python -m pytest -q scripts/test_autofill_work_item_manifests.py
      - name: Test the stage-2 proposal applier
        run: python -m pytest -q scripts/test_apply_manifest_proposals.py
      - name: Enforce manifest schema and legacy ratchet
        run: python scripts/ci/check_work_item_manifest_schema.py --tree HEAD --baseline "14-ai-development/reports/work-item-manifest-ac4-baseline.json"
      - name: Report all four historical cohort migration batches
        run: python scripts/ci/check_work_item_manifest_schema.py --tree HEAD --baseline "14-ai-development/reports/work-item-manifest-ac4-baseline.json" --batch-report

  # AID-2026-293: the canonical work-item registry is the sole authority for
  # normalized work-item field values. This job is its mandatory validator. It
  # reads registry blobs from the candidate Git tree rather than the filesystem,
  # so a sparse checkout, an untracked leftover, or a stale working copy cannot
  # change the answer. An empty registry is a legal PASS during the migration --
  # the per-check NOT_APPLICABLE event records which check had nothing to read,
  # and a record that is present but malformed still fails.
  work-item-registry:
    name: Work Item registry validator (hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # A prompt pin is verified against the commit each record declares, so
          # the history has to be present, not only the tip.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the pinned parsers
        run: python -m pip install --quiet --disable-pip-version-check PyYAML==6.0.2 "jsonschema>=4.23,<5"
      - name: Self-check the registry validator
        run: python -m unittest scripts.ci.test_check_work_item_registry -v
      - name: Validate the registry in the candidate tree
        run: python scripts/ci/check_work_item_registry.py --tree HEAD

  prompt-commit-trace:
    name: Prompt-to-commit trace (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Resolve comparison base (current main for PR; pre-push main for push)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" && "$EVENT_BEFORE" =~ ^[0-9a-f]{40}$ ]]; then
            BASE_SHA="$EVENT_BEFORE"
          else
            git fetch --no-tags origin main
            BASE_SHA="$(git rev-parse FETCH_HEAD)"
          fi
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "GITHUB_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
      - name: Run prompt-to-commit trace regression tests
        run: python -m unittest scripts.ci.test_check_prompt_commit_trace -v
      - name: Generate auditable main and PR snapshots
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          python scripts/ci/check_prompt_commit_trace.py \
            --commit "$BASE_SHA" \
            --base "$BASE_SHA" \
            --emit-baseline "$RUNNER_TEMP/main-baseline.json" \
            > "$RUNNER_TEMP/main-baseline.stdout.json"

          python scripts/ci/check_prompt_commit_trace.py \
            --commit "$HEAD_SHA" \
            --base "$BASE_SHA" \
            --emit-baseline "$RUNNER_TEMP/pr-snapshot.json" \
            > "$RUNNER_TEMP/pr-snapshot.stdout.json"

          # The exact base snapshot is the comparison baseline for both
          # audits. New-item admission is decided by the checker itself,
          # using the manifest and immutable prompt blob at the audited head.
          python scripts/ci/check_prompt_commit_trace.py \
            --commit "$BASE_SHA" \
            --base "$BASE_SHA" \
            --baseline "$RUNNER_TEMP/main-baseline.json" \
            --base-snapshot "$RUNNER_TEMP/main-baseline.json" \
            --json \
            > "$RUNNER_TEMP/main-summary.json"

          python scripts/ci/check_prompt_commit_trace.py \
            --commit "$HEAD_SHA" \
            --base "$BASE_SHA" \
            --baseline "$RUNNER_TEMP/main-baseline.json" \
            --base-snapshot "$RUNNER_TEMP/main-baseline.json" \
            --json \
            > "$RUNNER_TEMP/pr-summary.json"

          python - "$RUNNER_TEMP/main-summary.json" "$RUNNER_TEMP/pr-summary.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, sys

          for label, path in (
              ("Main baseline", sys.argv[1]),
              ("PR head", sys.argv[2]),
          ):
              data = json.load(open(path, encoding="utf-8"))

              print(f"## {label}: prompt-to-commit trace")
              print(
                  f"Commit: "
                  f"{os.environ['BASE_SHA'] if label == 'Main baseline' else os.environ['HEAD_SHA']}"
              )
              print(f"Manifest count: {data['manifest_count']}")

              print("### Five primary states")
              for name, count in data["primary_status"].items():
                  print(f"- {name}: {count}")

              print("### 3×4 prompt × commit matrix")
              for prompt, commits in data["matrix"].items():
                  for commit, count in commits.items():
                      print(f"- {prompt} × {commit}: {count}")

              if label == "PR head":
                  row = next(
                      (
                          x for x in data["manifests"]
                          if x["work_item_id"] == "AID-2026-047"
                      ),
                      None,
                  )
                  print("AID-2026-047: " + json.dumps(row, sort_keys=True))

                  print("### Initial-registration evidence")
                  for row in data["manifests"]:
                      if row.get("initial_registration_eligible"):
                          print(
                              f"- {row['work_item_id']}: "
                              "verified immutable prompt blob; "
                              "initial NO_TRACE admission"
                          )

                  print("### Ratchet violations")
                  for violation in data["ratchet_violations"]:
                      print(f"- {violation}")

              print()

          print(f"BASE_SHA: {os.environ.get('BASE_SHA', 'see workflow env')}")
          PY

      - name: Reproduce the historical #1453 false-new-manifest failure
        shell: bash
        run: |
          set -euo pipefail
          REGRESSION_HEAD=bdb4b0d4
          REGRESSION_BASE=460f437e
          git cat-file -e "$REGRESSION_HEAD^{commit}"
          git cat-file -e "$REGRESSION_BASE^{commit}"
          git show "$REGRESSION_BASE:14-ai-development/work-items/AID-2026-291/baseline.json" > "$RUNNER_TEMP/historical-committed-baseline.json"
          python scripts/ci/check_prompt_commit_trace.py \
            --commit "$REGRESSION_BASE" --base "$REGRESSION_BASE" \
            --emit-baseline "$RUNNER_TEMP/historical-base-snapshot.json" \
            > "$RUNNER_TEMP/historical-base-snapshot.stdout.json"
          set +e
          python scripts/ci/check_prompt_commit_trace.py \
            --commit "$REGRESSION_HEAD" --base "$REGRESSION_BASE" \
            --baseline "$RUNNER_TEMP/historical-committed-baseline.json" \
            --base-snapshot "$RUNNER_TEMP/historical-base-snapshot.json" \
            > "$RUNNER_TEMP/historical-ratchet.stdout.txt" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/historical-ratchet.stdout.txt"
          if grep -Fq "RATCHET NEW_NON_TRACEABLE AID-2026-265" "$RUNNER_TEMP/historical-ratchet.stdout.txt"; then
            echo "::error::AID-2026-265 was incorrectly classified as new"
            exit 1
          fi
          if grep -Fq "RATCHET NEW_NON_TRACEABLE AID-2026-291" "$RUNNER_TEMP/historical-ratchet.stdout.txt"; then
            echo "::error::base-existing AID-2026-291 NO_TRACE was incorrectly classified as new"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::historical ratchet invocation exited $rc"
            exit "$rc"
          fi
          echo "RATCHET ASSERT NEW_NON_TRACEABLE AID-2026-265=ABSENT"
          echo "RATCHET ASSERT NEW_NON_TRACEABLE AID-2026-291=ABSENT (base-present NO_TRACE retained)"
          echo "HISTORICAL_RATCHET_REGRESSION: PASS"
      - name: Upload immutable snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prompt-commit-trace-snapshots
          path: |
            ${{ runner.temp }}/main-baseline.json
            ${{ runner.temp }}/pr-snapshot.json
            ${{ runner.temp }}/main-summary.json
            ${{ runner.temp }}/pr-summary.json
          if-no-files-found: error
      - name: Enforce committed baseline ratchet
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -s 14-ai-development/work-items/AID-2026-291/baseline.json || {
            echo "::error::Committed prompt-commit-trace baseline is missing; review and commit the main-baseline artifact before merge."
            exit 1
          }
          python scripts/ci/check_prompt_commit_trace.py --commit "$HEAD_SHA" --base "$BASE_SHA" --baseline 14-ai-development/work-items/AID-2026-291/baseline.json --base-snapshot "$RUNNER_TEMP/main-baseline.json"
