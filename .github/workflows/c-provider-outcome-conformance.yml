name: C Provider Outcome Conformance

on:
  push:
    branches:
      - session-c-agent-integration-2026-11-16
    paths:
      - "07-agent-integration/schemas/c-submit-outcome-1.0.0.schema.json"
      - "07-agent-integration/tests/conformance/provider_outcome/**"
      - ".github/workflows/c-provider-outcome-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c-provider-outcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 07-agent-integration/tests/conformance/provider_outcome/requirements.txt
      - name: Install pinned test dependencies
        run: python -m pip install -r 07-agent-integration/tests/conformance/provider_outcome/requirements.txt
      - name: Run CSubmitOutcome schema and semantic vectors
        run: python -m unittest discover -s 07-agent-integration/tests/conformance/provider_outcome -p 'test_*.py' -v
