name: Owner worker MVP tests
on:
  pull_request:
    paths:
      - "automation/owner_worker.py"
      - "automation/tests/**"
      - ".github/workflows/owner-worker-tests.yml"
  push:
    branches: [main]
    paths:
      - "automation/owner_worker.py"
      - "automation/tests/**"
      - ".github/workflows/owner-worker-tests.yml"
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run boundary tests
        run: python -m unittest discover -s automation/tests -v
