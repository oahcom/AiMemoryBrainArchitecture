name: Architecture governance traceability (advisory)

on:
  pull_request:
    paths:
      - "01-system-architecture/**"
      - "docs/en/01-system-architecture/**"
      - "docs/zh-CN/01-system-architecture/**"
      - "scripts/check_owner_namespace_references.py"
      - "scripts/check_governance_operation_traceability.py"
      - "tests/test_check_owner_namespace_references.py"
      - "tests/test_check_governance_operation_traceability.py"
      - ".github/workflows/architecture-governance-traceability.yml"
  push:
    branches: [main]
    paths:
      - "01-system-architecture/**"
      - "docs/en/01-system-architecture/**"
      - "docs/zh-CN/01-system-architecture/**"
      - "scripts/check_owner_namespace_references.py"
      - "scripts/check_governance_operation_traceability.py"
      - "tests/test_check_owner_namespace_references.py"
      - "tests/test_check_governance_operation_traceability.py"

permissions:
  contents: read

jobs:
  owner-namespace:
    name: Owner namespace anti-confusion (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Owner namespace checker
        run: python scripts/check_owner_namespace_references.py --check
      - name: Run Owner namespace unit tests
        if: always()
        working-directory: tests
        run: python -m unittest -v test_check_owner_namespace_references.py

  governance-operation-traceability:
    name: Governance operation traceability (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run governance operation traceability checker
        run: python scripts/check_governance_operation_traceability.py --check
      - name: Run governance operation traceability unit tests
        if: always()
        working-directory: tests
        run: python -m unittest -v test_check_governance_operation_traceability.py
