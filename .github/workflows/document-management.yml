name: Architecture document management gate

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  document-management:
    name: GOV-DOC-002 metadata checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: DM-10 compares the current body against the body at
          # approval.approved_version, which may be any ancestor commit.
          fetch-depth: 0

      - name: Self-check the gate
        run: python3 scripts/test_check_document_management.py

      - name: Self-test work-item uniqueness gate
        run: |
          python3 scripts/ci/test_work_item_uniqueness.py
          python3 scripts/ci/test_work_item_registry.py

      - name: Validate the work-item claim registry
        run: python3 scripts/ci/check_work_item_registry.py

      # AID-2026-279: the same checker runs for all three event kinds, against
      # the tree pair that event actually means:
      #   pull_request -> refreshed origin/main / head.sha
      #   merge_group  -> refreshed origin/main / merge_group.head_sha
      #                   (merge-time re-evaluation: the queue head is replayed
      #                    on the new base)
      #   push         -> event.before / event.after
      # Occupancy is read from the target tree itself, never from a merge base.
      # A pull_request base can be hours stale, and a stale target IS the failure
      # mode: two branches each see a base without the id and each pass. So the
      # target branch is fetched here, immediately before the decision, and the
      # SHA that fetch produced is the only --base the checker ever sees. A failed
      # fetch or an unusable SHA is INCOMPLETE (2); pull_request.base.sha is never
      # used as a fallback. (Semantics absorbed from #1422 / AID-2026-262.)
      # No paths filter and no continue-on-error: the check is a required context.
      - name: Refresh the target branch immediately before the uniqueness decision
        id: uniqueness-target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -uo pipefail
          case "$EVENT_NAME" in
            pull_request) HEAD_SHA="$PR_HEAD" ;;
            merge_group) HEAD_SHA="$MG_HEAD" ;;
            push) HEAD_SHA="$PUSH_AFTER" ;;
            *) echo "::error::work-item uniqueness does not support event $EVENT_NAME"; exit 2 ;;
          esac
          if [ "$EVENT_NAME" = "push" ]; then
            BASE_SHA="$PUSH_BEFORE"
          else
            if ! git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main; then
              echo "::error::cannot refresh origin/main; the uniqueness verdict is INCOMPLETE"
              exit 2
            fi
            if ! BASE_SHA="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"; then
              echo "::error::cannot resolve the refreshed origin/main; the uniqueness verdict is INCOMPLETE"
              exit 2
            fi
          fi
          if ! [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::work-item uniqueness has no usable target base for $EVENT_NAME"
            exit 2
          fi
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::work-item uniqueness has no usable candidate head for $EVENT_NAME"
            exit 2
          fi
          {
            echo "base_sha=$BASE_SHA"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Uniqueness target (refreshed): $BASE_SHA"
          echo "Uniqueness candidate: $HEAD_SHA"

      - name: Enforce work-item uniqueness against the refreshed target base
        env:
          LATEST_TARGET_SHA: ${{ steps.uniqueness-target.outputs.base_sha }}
          EXACT_CANDIDATE_SHA: ${{ steps.uniqueness-target.outputs.head_sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/check_work_item_uniqueness.py \
            --base "$LATEST_TARGET_SHA" \
            --head "$EXACT_CANDIDATE_SHA"

      # Every governed file added or modified here must carry metadata. The
      # backlog stays unclassified; it may not grow. Both event kinds are
      # covered: a pull request diffs against its base commit, a direct push
      # diffs against github.event.before (GAP-02).
      - name: Validate document metadata (changed files must be classified)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          REF=""
          if [ -n "$PR_BASE" ] && [ "$PR_BASE" != "0000000000000000000000000000000000000000" ]; then
            REF="$PR_BASE"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            REF="$PUSH_BEFORE"
          fi
          if [ -n "$REF" ]; then
            python3 scripts/check_document_management.py --require-changed "$REF" || {
              status=$?
              # Exit 3 is only an empty increment (no paths to verify). A REF
              # selection error is exit 1 and must remain a failed check.
              [ "$status" -eq 3 ] && { echo "::notice::incremental verification not applicable: no changed paths to inspect"; exit 0; }
              exit "$status"
            }
          else
            # No base to diff against (first push of a branch). Whole-tree scan.
            # It now exits 2 (INCOMPLETE) while backlog remains, so this step
            # fails loudly instead of printing PASS over an unclassified tree.
            # It still cannot prove the NEW files are classified: GAP-02.
            python3 scripts/check_document_management.py || {
              status=$?
              # 2 = INCOMPLETE (backlog, no rule violation); 1 = violations.
              [ "$status" -eq 2 ] && echo "::error::No base commit to diff against and the tree still has an adoption backlog (GAP-02). Run this job from a pull request, or classify the backlog."
              exit "$status"
            }
          fi
