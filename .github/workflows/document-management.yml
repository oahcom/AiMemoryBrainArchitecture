name: Architecture document management gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  document-management:
    name: GOV-DOC-002 metadata checks
    runs-on: ubuntu-latest

    # One shared group for every run of this required job. At most one
    # document-management job executes at a time across different PRs.
    # Pending runs may be superseded by GitHub; a superseded run has no
    # successful required result and must not be treated as authorization.
    concurrency:
      group: document-management-gov-doc-002-serialized
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-check the gate
        run: python3 scripts/test_check_document_management.py

      - name: Self-test work-item uniqueness gate
        run: python3 scripts/ci/test_work_item_uniqueness.py

      # This refresh is deliberately immediately before the decision step.
      # For PRs, the fetched origin/main SHA, not event.base.sha, is authoritative.
      - name: Refresh target branch immediately before uniqueness decision
        id: uniqueness-target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            BASE_SHA="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
            HEAD_SHA="$PR_HEAD"
          elif [ -n "${PUSH_BEFORE:-}" ] && \
               [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$PUSH_BEFORE"
            HEAD_SHA="$CANDIDATE_SHA"
          else
            echo "::error::No usable target base is available for uniqueness verification."
            exit 2
          fi

          if ! [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Resolved target base is not a full 40-hex SHA."
            exit 2
          fi
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Candidate head is not a full 40-hex SHA."
            exit 2
          fi

          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Uniqueness target: $BASE_SHA"
          echo "Uniqueness candidate: $HEAD_SHA"

      - name: Enforce work-item uniqueness against refreshed target
        env:
          LATEST_TARGET_SHA: ${{ steps.uniqueness-target.outputs.base_sha }}
          EXACT_CANDIDATE_SHA: ${{ steps.uniqueness-target.outputs.head_sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/check_work_item_uniqueness.py \
            --base "$LATEST_TARGET_SHA" \
            --head "$EXACT_CANDIDATE_SHA"

      # Every governed file added or modified here must carry metadata.
      # The backlog stays unclassified; it may not grow. Both event kinds
      # are covered: PRs diff against their event base; direct pushes use
      # github.event.before.
      - name: Validate document metadata (changed files must be classified)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          REF=""
          if [ -n "$PR_BASE" ] && [ "$PR_BASE" != "0000000000000000000000000000000000000000" ]; then
            REF="$PR_BASE"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            REF="$PUSH_BEFORE"
          fi
          if [ -n "$REF" ]; then
            python3 scripts/check_document_management.py --require-changed "$REF" || {
              status=$?
              [ "$status" -eq 3 ] && {
                echo "::notice::incremental verification not applicable: no changed paths to inspect"
                exit 0
              }
              exit "$status"
            }
          else
            python3 scripts/check_document_management.py || {
              status=$?
              [ "$status" -eq 2 ] && echo "::error::No base commit to diff against and the tree still has an adoption backlog (GAP-02). Run this job from a pull request, or classify the backlog."
              exit "$status"
            }
          fi
