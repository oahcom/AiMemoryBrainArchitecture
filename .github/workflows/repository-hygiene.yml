name: Repository hygiene

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # `Repository hygiene (hard gate)` is required; the queue only reports checks
  # produced by `merge_group`.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene (hard gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-check the gate
        run: python3 scripts/test_check_repository_hygiene.py

      # One invocation, not two. This job used to run the script here with no
      # --base/--head and again below with them. The first run silently skipped
      # new-file admission and printed the same line a full run prints, so the
      # step name claimed a check it had not performed; deleting the second
      # step would have left the gate green with admission gone (#1212). The
      # script now refuses an unqualified run (exit 2, SKIPPED), and the range
      # is supplied here, where the head-tree checks and new-file admission
      # then run together in this one step.
      - name: Check committed repository hygiene and new-file admission
        env:
          # merge_group: the range is the queue candidate against the queue
          # base; pull_request: the PR head against its base; push: event.before.
          BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/check_repository_hygiene.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"

      # Every committed manifest, not the one AID-2026-001 names. The other
      # strict-parse job hard-codes a single path in both its `paths:` filter
      # and its body, so the rest were parsed by nothing. This step carries no
      # `paths:` filter of its own: the job around it runs on every pull
      # request, which is the point (AID-2026-078 AC4). The gate's self-check
      # runs first, for the same reason the other gates in this file do.
      - name: Check every work-item manifest parses
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import yaml" || python3 -m pip install --quiet --disable-pip-version-check PyYAML==6.0.2
          (cd scripts/ci && python3 -m unittest test_check_manifest_parse)
          python3 scripts/ci/check_manifest_parse.py

      - name: Measure manifest blob-pin baseline and negative sample
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before || '' }}
          GITHUB_EVENT_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(python3 scripts/ci/resolve_manifest_blob_pin_base.py)"
          echo "Resolved merge-candidate base: $BASE_SHA"

          set +e
          python3 scripts/ci/check_manifest_blob_pins.py --commit "$BASE_SHA"
          base_status=$?
          python3 scripts/ci/assert_manifest_blob_pin_negative.py \
            --commit 9a2063ae1fa5d905b3817cd4eddba065a06daa73
          negative_status=$?
          python3 scripts/ci/check_manifest_blob_pins.py --commit "$GITHUB_SHA"
          candidate_status=$?
          set -e

          if [ "$base_status" -gt 1 ] || \
             [ "$negative_status" -gt 1 ] || \
             [ "$candidate_status" -gt 1 ]; then
            echo "INCOMPLETE: at least one requested scan could not be completed"
            exit 2
          fi

          if [ "$negative_status" -ne 0 ]; then
            echo "VIOLATION: immutable negative sample was not rejected with expected evidence"
            exit 1
          fi

      - name: Ratchet manifest blob pins
        run: |
          python3 scripts/ci/gate_ratchet.py \
            --baseline scripts/ci/baselines/manifest-blob-pins.txt \
            --format schema \
            --command "python3 scripts/ci/check_manifest_blob_pins.py --commit HEAD | sed -n '/^MISMATCH /p; /^PATH_MISSING /p; /^INCOMPLETE /p'"

      - name: Self-check manifest blob pin verification
        run: python3 scripts/ci/test_check_manifest_blob_pins.py

      - name: Self-check manifest blob-pin base resolution and negative assertion
        run: |
          set -euo pipefail
          python3 -m unittest \
            scripts/ci/test_resolve_manifest_blob_pin_base.py \
            scripts/ci/test_assert_manifest_blob_pin_negative.py

      - name: Self-check the line-ending gate
        run: python3 scripts/test_check_line_endings.py

      # Reads the committed HEAD tree, not the working tree, so a CRLF blob
      # cannot be laundered by a checkout. Exemptions live only in
      # .gitattributes as `-text`; the gate asks Git rather than keeping a list.
      - name: Check committed line endings
        run: python3 scripts/ci/check_line_endings.py

      # The hand-written list below is an instance of test coverage; this pair
      # is the rule, so a new test_*.py cannot land without a workflow running
      # it. The gate's own self-check runs first: a gate nobody executes is the
      # defect it exists to catch.
      - name: Self-check the test-reachability gate
        run: python3 scripts/ci/test_check_test_reachability.py

      - name: Check that every test file is reachable from a workflow
        run: python3 scripts/ci/check_test_reachability.py

      # Each listed file is unreachable by unittest discover; discovery here would silently run
      # nothing. The explicit list is the defect tracked by #834.
      - name: Run unreachable self-checks from the repository root
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            08-bmcp-protocol/tests/test_protocol_index_consistency.py \
            13-engineering-decisions/technology-research/TECH-REALITY-001-A/owner-remediation/reference-model/test_i_authorization_security.py \
            reviews/architecture-breakthrough/memory-ir-compiler/prototype/test_shadow_corpus.py \
            reviews/req06-evaluation-pilot/test_evaluate.py \
            scripts/governance/bilingual/test_bilingual_scripts.py \
            scripts/governance/evidence/test_evidence_tiering.py \
            scripts/governance/evidence/test_template_example_executable.py \
            scripts/test_check_source_revision_pointers.py \
            scripts/test_precheck_delivery.py \
            tests/test_check_bilingual_docs_full.py \
            tests/test_policy_inheritance.py; do
            echo "Running $f"
            python3 -m unittest "$f"
          done

      - name: Run unreachable self-checks that require their own directory
        shell: bash
        run: |
          set -euo pipefail
          (
            cd experiments/req08-local-agent-exchange-proof
            python3 -m unittest test_exchange_demo
          )
          (
            cd experiments/req08-portable-exchange-fixture
            python3 -m unittest test_portable_exchange
          )

      # Run from this directory because test_status_migration imports sibling modules by bare name.
      # Probe for PyYAML first because the bare CI interpreter does not otherwise guarantee that dependency.
      - name: Self-check the status-migration gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import yaml" || python3 -m pip install --quiet --disable-pip-version-check pyyaml
          cd scripts/governance/status_migration
          python3 -m unittest test_status_migration

      # Run from this directory because test_check_traceability imports its checker by bare name.
      - name: Self-check the traceability gate
        shell: bash
        run: |
          set -euo pipefail
          cd scripts
          python3 -m unittest test_check_traceability

      # The four T-04 assertions (one row per AID, work_item_id equals its
      # directory, every row resolves to a manifest, every manifest is
      # indexed) read only the tree. They were unreachable because
      # `run_check` called `parse_registry` first inside the same try, so the
      # missing `00-governance/requirements-registry.yaml` took the whole run
      # with it (#1071). This step runs that half alone.
      #
      # It is not `|| true` and it is not a new workflow: it is a step in the
      # job that is already a required context. `merge=union` on
      # `14-ai-development/work-items/INDEX.md` is only safe because this
      # runs — union turns a visible conflict into a silent duplicate row,
      # and this is what refuses the duplicate (#1064, #1069).
      - name: Check INDEX rows against the work-item tree
        run: python3 scripts/check_traceability.py --index-only

      # PR-GOVERNANCE-001 §7 declares the required check contexts on `main`.
      # Two artifacts can contradict that declaration: this tree (a renamed job
      # leaves the document claiming a context nothing produces) and the branch
      # protection payload (a context added to protection without a document
      # change, or removed from protection while the document still lists it).
      # This holds the declaration to both. The payload is read through
      # `GET /branches/main`, which needs Contents (read) -- the permission this
      # job already has. The `/protection` endpoint needs Administration (read),
      # which the token vocabulary cannot express, and is not used.
      # Exit 2 (INCOMPLETE) is a failure here too: an unreadable condition, or an
      # unreadable platform, must never read as green.
      - name: Check declared check contexts are produced and protected
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_declared_check_contexts.py

      # Run from this directory because test_check_declared_check_contexts
      # imports its checker by bare name.
      - name: Self-check the declared-check-contexts gate
        shell: bash
        run: |
          set -euo pipefail
          cd scripts
          python3 -m unittest -v test_check_declared_check_contexts

      # A declared context produced by a workflow that never subscribes to
      # `merge_group` is absent from every queue candidate, and the declared-
      # contexts gate cannot see it: it compares names, not event wiring.
      # #1453 dropped the `merge_group` block from document-management.yml and
      # `GOV-DOC-002 metadata checks` left the queue silently. This holds the
      # declaration to the wiring, and document-management.yml to target-branch
      # serialization (`queue: max`, `merge_group.base_ref`).
      - name: Check required contexts are wired to merge_group
        run: python3 scripts/check_required_contexts_merge_group.py

      - name: Self-check the merge_group wiring gate
        shell: bash
        run: |
          set -euo pipefail
          cd scripts
          python3 -m unittest -v test_check_required_contexts_merge_group

      - name: Probe declared-check-contexts exit contracts
        run: python3 scripts/probe_declared_check_contexts.py

      - name: Mutation-test declared-check-contexts invariants
        run: python3 scripts/run_declared_check_contexts_mutation_tests.py

      # PR #1014 split session-evidence.yml into three jobs to fix a defect that
      # survived 18 consecutive failing runs. Nothing stops it being collapsed
      # back, and the collapse is silent: the gate keeps reporting PASS while it
      # has stopped being independent. This holds the workflow to that shape.
      # It lives here, not in tests/session_evidence/, because that directory is
      # checked out from the base revision by design and so could never see a
      # change to the workflow under test. Exit 2 (INCOMPLETE) is a failure here
      # too: an unreadable condition must never read as green.
      - name: Check the session-evidence workflow keeps its three-job shape
        run: python3 scripts/check_session_evidence_workflow_shape.py

      # Run from this directory because the self-check imports its checker by
      # bare name.
      - name: Self-check the session-evidence workflow shape gate
        shell: bash
        run: |
          set -euo pipefail
          cd scripts
          python3 -m unittest test_check_session_evidence_workflow_shape
