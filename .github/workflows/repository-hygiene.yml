name: Repository hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene (hard gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-check the gate
        run: python3 scripts/test_check_repository_hygiene.py

      - name: Check committed repository hygiene
        run: python3 scripts/ci/check_repository_hygiene.py
