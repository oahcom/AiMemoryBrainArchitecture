name: Rust Workspace Tests (self-hosted)

# Why this exists: every gate workflow in this repository is pinned to
# `ubuntu-latest`, and hosted minutes are blocked on this account by a billing
# failure. `rust-phase1.yml` therefore has never executed a single test in this
# repository's history -- every check run it produced carries exactly one
# annotation, "the job was not started because recent account payments have failed".
#
# The self-hosted runner already works. `zesu-x64` completed the read-only
# diagnostics job at 04:41:52Z on 2026-11-22. Self-hosted minutes are not billed,
# so this is the only path by which a Rust test result can reach a check run.
#
# Triggers are restricted on purpose, and the restriction is binding, not stylistic:
#   - `14-ai-development/ubuntu-self-hosted-runner-bootstrap.en.md` §4.1 L1: the
#     runner's job-started hook denies any job whose GITHUB_REF is not exactly
#     `refs/heads/main`. A `pull_request` job is denied with `ref_not_default_branch`
#     before any step runs -- observed on this PR as run 44988094101.
#   - §4.1 L2: `scripts/ci/audit_runner_admission.py` rejects `pull_request` on any
#     self-hosted job. It caught this workflow's first draft and was right to.
# So this runs on `main` only. It cannot gate a PR, and it is not claimed to. What it
# does is produce the first real test result this repository has ever had.

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/check_fmt.py"
      - "scripts/test_check_fmt.py"
      - ".github/workflows/rust-self-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Own group, NOT gates.yml's. #712 tried the shared group #700 item 1 asked
  # for, and it does not serialise - it deletes. GitHub keeps one running and
  # one pending run per group, so with both workflows in one group a push that
  # triggers both leaves only one survivor: run 45038164281 (this workflow) was
  # cancelled at creation with zero jobs, and 45038090599 (gates) the same way.
  # cancel-in-progress: false does not help; it only protects a run that has
  # started, and a pending run is replaced regardless.
  #
  # A dropped Rust run is worse than two concurrent builds. The disk churn has
  # to be solved on the host (#700 item 2) or by chaining the workflows, not by
  # sharing a queue slot.
  group: rust-self-hosted
  cancel-in-progress: true

jobs:
  rust-workspace-test:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Self-test format checker against dirty worktrees
        run: python3 scripts/test_check_fmt.py

      # The runner image has no Rust. Before this step existed, the job ran
      # steps 1-3 and then died at `cargo: command not found` (exit 127) --
      # see run 45001611071 / job rust-workspace-test, steps 4-6:
      # Toolchain=failure, cargo test=skipped, cargo fmt=skipped.
      # Installing here is the only way a Rust result can reach a check run
      # while hosted minutes are billing-blocked.
      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          # rustup writes PATH to a profile a non-login shell does not read.
          # Guarded: a distro-packaged cargo has no ~/.cargo/env.
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          cargo --version
          rustc --version
          # libsqlite3-sys builds bundled SQLite (three crates request "bundled"),
          # so this job needs a C compiler. Detect and name it here; do not install
          # one — a system package installed from a workflow step widens what a
          # compromised dependency can reach (AI-RUN-002-RUNBOOK §4.1). Provisioning
          # is the runbook's job, detection is this step's.
          #
          # Presence is checked first, then capability, because the two disagree:
          # a `cc` with no cc1 behind it passes `command -v` and fails inside
          # libsqlite3-sys with a message that does not name the host as the cause.
          if ! command -v cc >/dev/null 2>&1; then
            echo "::error::no C compiler on PATH; libsqlite3-sys builds bundled SQLite and requires one"
            exit 1
          fi
          if ! printf 'int main(void){return 0;}\n' | cc -x c - -o /tmp/cc-probe 2>/tmp/cc-probe.err; then
            echo "::error::cc is on PATH but cannot compile or link; libsqlite3-sys builds bundled SQLite and requires a working one"
            head -3 /tmp/cc-probe.err || true
            exit 1
          fi
          rm -f /tmp/cc-probe /tmp/cc-probe.err

      # `--all-targets` is what rust-phase1.yml uses. Kept identical on purpose:
      # a self-hosted run that tested a different target set would not be evidence
      # about the same thing. The --all-targets / --lib difference already produced
      # one wrong test count here (438/0/9 vs 385/0/10, GAP-10 §7.1).
      - name: cargo test --workspace --all-targets
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          cargo test --workspace --all-targets --no-fail-fast 2>&1 | tee /tmp/rust-test.log
          status=${PIPESTATUS[0]}

          echo "--- summary ---"
          grep '^test result:' /tmp/rust-test.log \
            | sed -E 's/.*: (ok|FAILED)\. ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored.*/\2 \3 \4/' \
            | awk '{p+=$1; f+=$2; i+=$3} END{printf "passed=%d failed=%d ignored=%d\n", p, f, i}'

          exit "$status"

      # `cargo fmt --all --check` was in no workflow: rust-phase1.yml and this file
      # both only run tests, so an unformatted commit could merge green. The script
      # pins the SHA it measured, so a passing log names the exact tree it passed on.
      - name: cargo fmt --all --check
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          python3 scripts/check_fmt.py --expect "$(git rev-parse HEAD)"
