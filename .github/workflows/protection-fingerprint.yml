name: Protection fingerprint

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protection-fingerprint:
    name: Protection fingerprint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run offline tests
        working-directory: scripts/ci
        run: python3 -m unittest -v test_check_protection_fingerprint

      - name: Explain credential provisioning status
        shell: bash
        run: |
          echo "HTTP 403 on /protection means GITHUB_TOKEN lacks Administration read; it is a credential provisioning state, not configuration drift. This workflow is not a required check and blocks no pull request." >> "$GITHUB_STEP_SUMMARY"

      - name: Check live protection fingerprint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/check_protection_fingerprint.py \
            --repo "${GITHUB_REPOSITORY}" \
            --branch main
