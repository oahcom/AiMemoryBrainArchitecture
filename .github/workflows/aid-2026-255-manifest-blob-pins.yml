name: AID-2026-255 Manifest Blob Pin Integrity Ratchet

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  manifest-blob-pin-integrity-ratchet:
    name: AID-2026-255 Manifest Blob Pin Integrity Ratchet
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Verify candidate checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$GITHUB_SHA" ]]; then
            echo "::error::Checkout SHA does not match github.sha"
            echo "expected=$GITHUB_SHA actual=$actual"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install existing YAML dependency
        run: python -m pip install PyYAML

      - name: Check manifest blob pins through exact-set ratchet
        run: |
          python scripts/ci/gate_ratchet.py \
            --baseline scripts/ci/baselines/manifest-blob-pins.txt \
            --format paths \
            --command "python scripts/ci/check_manifest_blob_pins.py"

      - name: Test manifest blob-pin checker
        run: python scripts/ci/test_check_manifest_blob_pins.py

      - name: Test existing gate ratchet
        run: python scripts/ci/test_gate_ratchet.py
