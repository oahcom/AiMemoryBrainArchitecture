name: H Provider Outcome Conformance
# revision: rerun against synchronized CSubmitOutcome 1.0.0 schema and vectors

on:
  push:
    branches:
      - session-h-bmcp-protocol
    paths:
      - "08-bmcp-protocol/validators/provider_outcome_validator.py"
      - "08-bmcp-protocol/tests/conformance/provider_outcome/**"
      - ".github/workflows/h-provider-outcome-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-outcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 08-bmcp-protocol/tests/conformance/provider_outcome/requirements.txt
      - name: Install pinned test dependencies
        run: python -m pip install -r 08-bmcp-protocol/tests/conformance/provider_outcome/requirements.txt
      - name: Run H Provider Outcome unit and fixture conformance tests
        run: python -m unittest discover -s 08-bmcp-protocol/tests/conformance/provider_outcome -p 'test_*.py' -v
