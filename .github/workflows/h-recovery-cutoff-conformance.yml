name: H Recovery Cutoff Conformance

on:
  push:
    branches:
      - session-h-bmcp-protocol
  pull_request:
    branches:
      - session-h-bmcp-protocol
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-and-wire-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js 22 for independent wire differential tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run HRC, Join Proof, wire and schema candidate tests
        run: |
          python -m unittest discover \
            -s 08-bmcp-protocol/tests/conformance/recovery_cutoff \
            -p "test_*.py" -v
