name: G Applied Persistence Reference Model

on:
  push:
    branches:
      - session-g-memory-context
    paths:
      - "06-memory-context/reference_model/**"
      - ".github/workflows/g-applied-persistence-reference-model.yml"

permissions:
  contents: read

jobs:
  g-applied-reference-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bounded SQLite reference-model tests
        run: python -m unittest discover -s 06-memory-context/reference_model -p 'test_*.py' -v
