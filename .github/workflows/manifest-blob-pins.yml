name: Manifest blob-pin integrity

on:
  push:
    paths:
      - "14-ai-development/work-items/**/manifest.yaml"
      - "scripts/check_blob_pins.py"
      - "scripts/test_check_blob_pins.py"
      - "scripts/ci/baselines/blob-pins.txt"
      - ".github/workflows/manifest-blob-pins.yml"
  pull_request:
    paths:
      - "14-ai-development/work-items/**/manifest.yaml"
      - "scripts/check_blob_pins.py"
      - "scripts/test_check_blob_pins.py"
      - "scripts/ci/baselines/blob-pins.txt"
      - ".github/workflows/manifest-blob-pins.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blob-pins:
    name: Check manifest blob pins
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install checker dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Run checker tests
        run: python -m unittest discover -s scripts -p "test_check_blob_pins.py" -v

      - name: Check manifest blob pins against ratchet
        run: >-
          python scripts/check_blob_pins.py
          --repo .
          --baseline scripts/ci/baselines/blob-pins.txt
