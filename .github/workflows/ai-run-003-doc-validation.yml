name: AI-RUN-003 documentation contract checks

on:
  pull_request:
    branches:
      - main
      - infra/ai-run-003-runtime-plan
      - infra/ai-run-003-adr-run-002
      - infra/ai-run-003-adr-run-003
      - infra/ai-run-003-adr-run-004-005
    paths:
      - "14-ai-development/**"
      - "reviews/ai-run-003/**"
      - "scripts/validate_ai_run_docs.py"
      - ".github/workflows/ai-run-003-doc-validation.yml"

permissions:
  contents: read

concurrency:
  group: ai-run-003-doc-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-doc-contracts:
    name: AI-RUN-003 bilingual docs and local links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate changed architecture documents
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/validate_ai_run_docs.py
