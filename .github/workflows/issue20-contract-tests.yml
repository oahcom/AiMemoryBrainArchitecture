name: Issue 20 contract model tests

on:
  push:
    branches:
      - session-p-project-governance-baseline
    paths:
      - "00-governance/role-simulations/**"
      - ".github/workflows/issue20-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-model-and-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Issue 20 reference model and schema structure tests
        run: python -m unittest discover -s 00-governance/role-simulations/tests -p "test_*.py" -v
